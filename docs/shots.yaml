# Git (docs/zh-TW/deploy/git.mdx); Keel makes Deploy from Git available.
- id: git-form
  path: /projects/edge
  wait: '[data-testid="add"]'
  steps:
    - click: '[data-testid="add"]'
    - click: '[data-testid="add-git"]'
    - fill: '[data-slot="dialog-content"] input'
      value: https://github.com/acme/web
    - fill: ':nth-match([data-slot="dialog-content"] input, 4)'
      value: web
  clip: '[data-slot="dialog-content"]'
  env:
    ZEABUR_DEMO_KEEL: '1'
# Compose (docs/zh-TW/deploy/compose.mdx).
- id: compose-services
  path: /projects/edge
  wait: '[data-testid="add"]'
  steps:
    - click: '[data-testid="add"]'
    - click: '[data-testid="add-compose"]'
    - fill: '[data-slot="dialog-content"] textarea'
      value: |
        services:
          web:
            image: ghcr.io/acme/web:1.4
            ports: ["3000:3000"]
            environment:
              DATABASE_URL: postgres://app:secret@db:5432/app
            depends_on: [db]
          db:
            image: postgres:17
            environment:
              POSTGRES_USER: app
              POSTGRES_PASSWORD: secret
              POSTGRES_DB: app
            volumes: [pgdata:/var/lib/postgresql/data]
        volumes:
          pgdata: {}
    - click: '[data-slot="dialog-footer"] button:last-child'
    - wait: '[data-slot="dialog-content"] [data-slot="section-label"]'
  clip: '[data-slot="dialog-content"] div:has(> [data-slot="section-label"])'
