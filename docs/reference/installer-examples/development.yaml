# Until Zeabur, Zeabur Identity and the catalog publish releases, an install names its sources.
access:
  mode: local
  identity: login.192.0.2.20.sslip.io
  zeabur: zeabur.192.0.2.20.sslip.io

sources:
  catalog: /root/catalog/index.json
  # `docker save` archives; K3s or RKE2 imports them when it starts.
  imageArchives: [/root/images/zeabur.tar, /root/images/zeabur-identity.tar]
  identityImage: docker.io/library/zeabur-identity:dev
  identityctl: /root/bin/zeabur-identityctl
  zeaburImage: docker.io/library/zeabur:dev
  # Only needed with VictoriaLogs or VictoriaMetrics; unset, the chart's own image is used.
  proxyImage: docker.io/library/zeabur-proxy:dev
  zeaburChart: /root/zeabur/deploy/chart/zeabur
