<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 336" width="440" height="336" role="img"><title>访客的请求从浏览器经过域名和 HTTPS 证书，送到服务</title><style>
.bg{fill:#FAFAFB;stroke:#E8E7EB;stroke-width:1}
.grp{fill:rgba(255,255,255,.55);stroke:#E8E7EB;stroke-width:1}
.card{fill:#FFFFFF;stroke:#D0CED4;stroke-width:1}
.card.accent{stroke:#6300FF;stroke-width:1.5}
.tag{fill:#FFFFFF;stroke:#D0CED4;stroke-width:1}
.hit{fill:rgba(99,0,255,.07)}
.line{fill:none;stroke:#D0CED4;stroke-width:1.5}
.head{fill:#D0CED4}
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif}
.t{font-size:14px;font-weight:600;fill:#18171B}
.n{font-size:13px;fill:#5C5962}
.h{font-size:12.5px;fill:#5C5962}
.tagt{font-size:12px;fill:#5C5962}
