.card,.tag{fill:#1F1E22;stroke:#4C4851}
.card.accent{stroke:#A469FF}
.hit{fill:rgba(164,105,255,.14)}
.line{stroke:#4C4851}
.head{fill:#4C4851}
.t{fill:#F0EFF2}
.n,.h,.tagt{fill:#B0ADB6}
.hitt{fill:#A469FF}
}
