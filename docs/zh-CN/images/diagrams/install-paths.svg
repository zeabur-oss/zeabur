<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 362" width="440" height="362" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif'>
<style>
.bg{fill:#FAFAFB;stroke:#E8E7EB}.grp{fill:rgba(255,255,255,.55);stroke:#E8E7EB}.card{fill:#FFFFFF;stroke:#D0CED4}.accent{fill:#FFFFFF;stroke:#6300FF;stroke-width:1.5}
.t{fill:#18171B;font-size:14px;font-weight:600}.n{fill:#5C5962;font-size:13px}.h{fill:#5C5962;font-size:12.5px}
.tag{fill:none;stroke:#D0CED4}.tagt{fill:#5C5962;font-size:12px}.hit{fill:rgba(99,0,255,.07);stroke:none}.hitt{fill:#6300FF;font-size:12px}
.line{stroke:#D0CED4;stroke-width:1.5;fill:none}.head{fill:#D0CED4}
@media (prefers-color-scheme: dark){
.bg{fill:#1D1C20;stroke:#34313A}.grp{fill:rgba(31,30,34,.55);stroke:#34313A}.card{fill:#1F1E22;stroke:#4C4851}.accent{fill:#1F1E22;stroke:#A469FF}
.t{fill:#F0EFF2}.n,.h,.tagt{fill:#B0ADB6}.tag{stroke:#4C4851}.hit{fill:rgba(164,105,255,.14)}.hitt{fill:#A469FF}
.line{stroke:#4C4851}.head{fill:#4C4851}}
</style>
<rect class="bg" x="0.5" y="0.5" width="439" height="361" rx="6"/>
<rect class="grp" x="16.5" y="16.5" width="407" height="241" rx="6"/>
<text class="h" x="28" y="36">安装 Zeabur 的三种方式</text>
<rect class="card" x="26.5" y="48.5" width="387" height="60" rx="6"/>
<text class="t" x="40" y="73">交给 Claude 或 Codex</text>
<text class="n" x="40" y="93">粘贴一段提示词，它帮你装好</text>
<rect class="tag" x="352.0" y="59.5" width="50.0" height="20" rx="4"/>
<text class="tagt" x="359.0" y="73.5">开发中</text>
<rect class="card" x="26.5" y="118.5" width="387" height="60" rx="6"/>
<text class="t" x="40" y="143">用 Zeatend 的安装界面</text>
<text class="n" x="40" y="163">在服务器上自己一步步操作</text>
<rect class="tag" x="352.0" y="129.5" width="50.0" height="20" rx="4"/>
<text class="tagt" x="359.0" y="143.5">开发中</text>
<rect class="card" x="26.5" y="188.5" width="387" height="60" rx="6"/>
<text class="t" x="40" y="213">手动安装</text>
<text class="n" x="40" y="233">用 Helm，每个对象都看得到</text>
<rect class="hit" x="340.0" y="199.5" width="62.0" height="20" rx="4"/>
<text class="hitt" x="347.0" y="213.5">现在可用</text>
<path class="line" d="M220 259 V276"/>
<path class="head" d="M215 276 L225 276 L220 283 Z"/>
<rect class="accent" x="16.75" y="286.75" width="406.5" height="60" rx="6"/>
<text class="t" x="30" y="311">你的服务器上的 Zeabur</text>
