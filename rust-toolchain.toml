# The single source of truth for the Rust toolchain.
# rustup reads this file directly; the Nix flake reads it through fenix `fromToolchainFile`.
# Bump deliberately: update `sha256` in flake.nix in the same change, and re-check every nightly flag listed in
# nightly-only setting (CONTRIBUTING.md, "Toolchain").
[toolchain]
channel = "nightly-2026-10-12"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
