# cargo-deny policy. Rationale: CONTRIBUTING.md, "Dependencies".

[graph]
# Check the dependency graph that ships in the container image.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[advisories]
version = 2
yanked = "deny"
# The main workspace and desktop/ share this file, so an ignore can apply to one graph only.
unused-ignored-advisory = "allow"
# Every ignore needs an id and the reason it is acceptable.
ignore = [
  # desktop/ on Linux: glib-macros and gtk3-macros, through Tauri's GTK 3 stack, run it at build
  # time only. It is unmaintained, with no known vulnerability; Tauri 2 has no GTK 4 port.
  { id = "RUSTSEC-2024-0370", reason = "build-time proc macro of Tauri's GTK 3 stack (desktop/ on Linux)" },
  # desktop/ on Windows and Linux: tauri-plugin-single-instance uses zbus 5 on Linux. These are
  # unmaintained notices for zbus's helper crates, with no known vulnerability; the fix is in the
  # zbus announcement (z-galaxy/zbus#2043) and has to come through zbus and the plugin.
  { id = "RUSTSEC-2026-0370", reason = "zvariant under zbus 5, through tauri-plugin-single-instance (desktop/)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names under zbus 5, through tauri-plugin-single-instance (desktop/)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive under zbus 5, through tauri-plugin-single-instance (desktop/)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# OSI-approved licences only (SPDX `isOsiApproved`).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path and are never published.
allow-wildcard-paths = true
deny = [
  { crate = "ring", reason = "aws-lc-rs is the only crypto backend for rustls" },
  { crate = "aws-lc-fips-sys", reason = "FIPS is not needed; it declares the non-OSI OpenSSL licence" },
  { crate = "openssl", reason = "no system OpenSSL; rustls only" },
  { crate = "openssl-sys", reason = "no system OpenSSL; rustls only" },
  { crate = "native-tls", reason = "rustls only" },
  { crate = "webpki-roots", reason = "CDLA-Permissive-2.0 is not OSI-approved; the image ships a CA bundle" },
  { crate = "webpki-root-certs", reason = "CDLA-Permissive-2.0 is not OSI-approved" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
