# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Releases").
[package]
versioned_files = [
  "Cargo.toml",
  { path = "Cargo.lock", dependency = "xtask" },
  { path = "Cargo.lock", dependency = "zeabur" },
  { path = "Cargo.lock", dependency = "zeabur-api" },
  { path = "Cargo.lock", dependency = "zeabur-auth" },
  { path = "Cargo.lock", dependency = "zeabur-catalog" },
  { path = "Cargo.lock", dependency = "zeabur-core" },
  { path = "Cargo.lock", dependency = "zeabur-embed" },
  { path = "Cargo.lock", dependency = "zeabur-gaps" },
  { path = "Cargo.lock", dependency = "zeabur-graph" },
  { path = "Cargo.lock", dependency = "zeabur-http" },
  { path = "Cargo.lock", dependency = "zeabur-installer" },
  { path = "Cargo.lock", dependency = "zeabur-installer-host" },
  { path = "Cargo.lock", dependency = "zeabur-installer-plan" },
  { path = "Cargo.lock", dependency = "zeabur-kube" },
  { path = "Cargo.lock", dependency = "zeabur-local" },
  { path = "Cargo.lock", dependency = "zeabur-model" },
  { path = "Cargo.lock", dependency = "zeabur-modules" },
  { path = "Cargo.lock", dependency = "zeabur-plan" },
  { path = "Cargo.lock", dependency = "zeabur-proxy" },
  { path = "Cargo.lock", dependency = "zeabur-telemetry" },
  { path = "Cargo.lock", dependency = "zeabur-test-support" },
  { path = "Cargo.lock", dependency = "zeabur-ui" },
  { path = "Cargo.lock", dependency = "zeaburctl" },
  "desktop/Cargo.toml",
  { path = "desktop/Cargo.lock", dependency = "zeabur-api" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-catalog" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-core" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-desktop" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-embed" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-gaps" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-graph" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-http" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-installer-plan" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-kube" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-local" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-model" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-modules" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-plan" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-telemetry" },
  { path = "desktop/Cargo.lock", dependency = "zeabur-ui" },
  { path = "deploy/chart/zeabur/Chart.yaml", regex = '(?m)^version: (?<version>\S+)$' },
  "web/package.json",
  "crates/zeabur-installer/web/package.json",
  # Generated by `cargo xtask openapi` from CARGO_PKG_VERSION; knope sets the same line.
  { path = "crates/zeabur-api/openapi.yaml", regex = '(?m)^  version: "(?<version>[^"]+)"$' },
  { path = "web/src/api/zeabur.ts", regex = '(?m)^ \* OpenAPI spec version: (?<version>\S+)$' },
]
changelog = "CHANGELOG.md"
# The update check looks for ### Security in the release notes (docs/reference/telemetry.mdx).
extra_changelog_sections = [{ name = "Security", types = ["security"] }]

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
