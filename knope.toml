# Change files in .changeset/ and release pull requests (CONTRIBUTING.md, "Releases").
[package]
versioned_files = [
  "Cargo.toml",
]
changelog = "CHANGELOG.md"
# The update check looks for ### Security in the release notes (docs/reference/telemetry.mdx).
extra_changelog_sections = [{ name = "Security", types = ["security"] }]

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "bun scripts/release.ts bump v$version"
variables = { "$version" = "Version" }

# The docs screenshots show the version, so the release pull request takes them again.
[[workflows.steps]]
type = "Command"
command = "scripts/docs-shots.sh docs"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
