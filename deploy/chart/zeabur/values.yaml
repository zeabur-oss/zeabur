# Zeabur's in-cluster server. docs/install/existing-cluster.mdx walks through an installation; values.schema.json
# checks these values.

image:
  # Published for linux/amd64 and linux/arm64 by the release workflow, signed (docs/reference/releases.mdx).
  repository: ghcr.io/zeabur-oss/zeabur
  # Defaults to the chart's version. Ignored when digest is set.
  tag: ""
  # The image by content: sha256:<64 hex digits>. A released chart sets it to the image index
  # published with it, so the chart installs exactly the image that was signed.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

global:
  # The domain the addresses are under: Zeabur is zeabur.<domain> and Zeabur Identity
  # identity.<domain>; point both (or *.<domain>) at the cluster's ingress. Empty: <ip>.sslip.io,
  # where <ip> is the first node's ExternalIP, else its InternalIP, which needs no DNS.
  domain: ""

# Zeabur Identity, installed with Zeabur into the namespace zeabur-identity (its chart's values go
# under `identity`, such as identity.admin.user). The chart registers Zeabur as a client there.
# Off: bring your own issuer with issuer.url and issuer.clientSecret.existingSecret.
identity:
  enabled: true

# The address people open, with no path: https://zeabur.example.com. Sign-in comes back to
# <publicUrl>/auth/callback; Ingress and HTTPRoute take their host name from it.
# Empty: https://zeabur.<global.domain>.
publicUrl: ""

# What the interface calls this cluster, so people with several can tell them apart, such as
# shop-prod. An administrator can rename it in Settings. Empty: publicUrl's host.
clusterName: ""

issuer:
  # Zeabur Identity's public URL (its issuer), exactly as Zeabur Identity's discovery document states it.
  # Empty: the Zeabur Identity this chart installs.
  url: ""
  # The client's ID at the issuer.
  clientId: zeabur
  clientSecret:
    # The Secret holding the client secret. The chart never takes the secret as a value, so it
    # stays out of Helm's release records. Empty, with identity.enabled: the chart makes the Secret
    # <release>-client with a random secret, kept on upgrades.
    existingSecret: ""
    key: client-secret
    # With identity.enabled and existingSecret: the secret's SHA-256 as `sha256:<64 hex digits>`,
    # which the chart registers in Zeabur Identity. For Argo CD and `helm template`, which can't
    # read a random secret back.
    hash: ""
  # A ConfigMap with extra CA certificates (PEM) to trust for the issuer only; set extraTrustedCA
  # for a CA every connection trusts. Empty: extraTrustedCA and the image's Mozilla CA bundle.
  caBundle:
    configMap: ""
    key: ca.crt
  # Where people manage their passkeys and linked accounts; the Account page links there. Empty:
  # the `manage` URL the issuer publishes at /.well-known/passkey-endpoints, else no link.
  accountUrl: ""

# New public URLs. suffixes: the domains a new service's URL is suggested under, as
# <service>-<project>.<suffix>, such as apps.example.com, the first by default; point a wildcard
# DNS record (*.apps.example.com) at the cluster's ingress. An administrator can change them on
# the cluster page. Empty: the <ip>.sslip.io domain when global.domain is empty, else people type
# the whole host.
# clusterIssuer: the cert-manager ClusterIssuer that signs a new URL's certificate; Zeabur adds its
# annotation and a tls block to the Ingress, shown in the plan. Empty: new URLs are HTTP only.
domains:
  suffixes: []
  clusterIssuer: letsencrypt

# Services deployed from Git. registry: where Zeabur Builder pushes and nodes pull, the same as the
# Builder's default registry; a new service runs <registry>/<project>/<service>. The default is the
# catalog's Zot. Empty: "Deploy from Git" is turned off. For this registry, Zeabur also trusts the
# CA that Zeabur Builder puts in a Build's upload Secret, read as the person.
builds:
  registry: zot.zot.svc:5000

# Extra CA certificates (PEM) Zeabur trusts, on top of the image's Mozilla CA bundle, for every
# HTTPS connection it makes: signing in with the issuer, reading images from registries, reading
# backups from object stores, and GitHub. Use it when one of them, or a proxy that inspects TLS, presents a certificate a
# private CA signed. Name a ConfigMap or a Secret in this namespace, not both; Zeabur reads it when
# it starts. issuer.caBundle is trusted on top. Empty: the Mozilla CA bundle only.
extraTrustedCA:
  configMap: ""
  secret: ""
  key: ca.crt

# A proxy for Zeabur's own outbound HTTP and HTTPS (reading images from registries, backups from
# object stores, GitHub), for a network that only lets a proxy out. It does not touch `proxy.*`,
# which is Zeabur Proxy for logs and metrics, and it is not used for the Kubernetes API, the issuer
# or the other Zeabur components. Zeabur tunnels HTTPS through an `http://` proxy with CONNECT and
# never sends a local address to it. `noProxy` is added to the built-in bypass list, which holds
# localhost, `.svc`, `.cluster.local` and `clusterNetwork`. Off: no proxy, nothing changes.
outboundProxy:
  enabled: false
  httpProxy: ""
  httpsProxy: ""
  noProxy: []
  # The pod and Service ranges of the cluster (k3s and RKE2 defaults), reached directly.
  clusterNetwork: [10.42.0.0/16, 10.43.0.0/16]

# Members who are not admins: the ClusterRoles zeabur-member (node names and status, every
# project's name), zeabur-project-developer and zeabur-project-viewer (files/member-roles.yaml).
# Zeabur binds them per member when an admin invites or edits one. With them, the
# ValidatingAdmissionPolicy zeabur-project-namespace (Kubernetes 1.30+) keeps a Developer's patch
# of their project's Namespace to its details. Off: neither, and Members offers only admin or no
# rights.
memberRoles:
  enabled: true

# The ValidatingAdmissionPolicy zeabur-system-hosts (Kubernetes 1.30+): a domain of an Ingress in
# a system namespace, this one or one in `namespaces`, is that namespace's only, and each Ingress or
# HTTPRoute in another namespace names its domains, so a project cannot take over Zeabur's address.
# A namespace labelled zeabur.com/platform=true is a system namespace too, and is not checked.
systemHosts:
  enabled: true
  namespaces: [zeabur-identity]

# The key that signs plan tokens. Empty `existingSecret`: the chart creates a Secret with a random
# key on install and keeps it on upgrades. A new key only invalidates plans not yet applied.
planKey:
  existingSecret: ""
  key: plan-key

# The metrics store usage history, node disk and volume use are read from, until someone
# chooses another in Settings (kept in the ConfigMap zeabur-settings of this namespace, by
# whoever may change it): a Service port serving the Prometheus HTTP API, namespace/name:port.
# Empty: where Zeabur Catalog installs VictoriaMetrics
# (observability/vmsingle-vm-victoria-metrics-k8s-stack:8428).
metricsStore:
  service: ""
  # Let everyone signed in read the setting (a Role with `get` on that one ConfigMap, bound to
  # system:authenticated), so every page uses the store chosen in Settings. Off: whoever cannot
  # read the ConfigMap gets the default store, and the page says why.
  everyoneReads: true

# Terminals in containers without a shell, and the tools pod with kubectl and helm. Zeabur adds a
# debug container as the person who asks. It creates tools pods with its own service account, in
# the terminal namespace only, after kube-apiserver says the person may run commands in the
# project's pods.
terminal:
  # The debug container added to a pod for a terminal; it needs `sh`. Empty: busybox 1.37.0,
  # pinned by digest.
  debugImage: ""
  # The tools pod's image; it needs `sh`, `sleep`, `kubectl` and `helm`, for amd64 and arm64.
  # Empty: alpine/k8s 1.36.5 (kubectl 1.36.5, helm 4.3.0), pinned by digest.
  toolsImage: ""
  # The namespace all tools pods go in, for projects and for the whole cluster. The chart creates
  # it and lets Zeabur's service account create, run commands in and delete pods there, and
  # nothing else. Each pod holds its person's token, so give no one else rights in it.
  namespace: zeabur-terminals
  # A tools pod stops after this many minutes in any case.
  toolsDeadlineMinutes: 30
  # A tools pod is deleted this many seconds after its last terminal closes.
  toolsGraceSeconds: 60
  toolsResources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Zeabur Proxy (crates/zeabur-proxy): lets members read their project's log history from the shared
# VictoriaLogs Zeabur Catalog installs. Every query goes as the person, who must be allowed `get`
# on `logs.proxy.zeabur.com` in the project's namespace (the ClusterRole zeabur-proxy-logs-reader,
# aggregated into the project roles and into view, edit and admin), and reads that namespace only.
# Off: the Logs tab shows what the kubelet still has.
proxy:
  enabled: false
  image:
    # Published next to Zeabur's image, from the same commit.
    repository: ghcr.io/zeabur-oss/proxy
    # Defaults to the chart's version. Ignored when digest is set.
    tag: ""
    # A released chart sets it to the image index published with it, as image.digest.
    digest: ""
    pullPolicy: IfNotPresent
  logs:
    # Off when the cluster has no VictoriaLogs: the proxy then serves usage history only.
    enabled: true
    # VictoriaLogs' HTTP API, http://host:port.
    url: http://vlsingle-victoria-logs.observability.svc:9428
    # The pods behind that URL, for the proxy's NetworkPolicy; Zeabur Catalog's VLSingle by default.
    namespace: observability
    podLabels:
      app.kubernetes.io/name: vlsingle
      app.kubernetes.io/instance: victoria-logs
    port: 9428
    # The most lines one query returns.
    maxLimit: 1000
  # Usage history for project members: the proxy reads the metrics store Zeabur reads by default
  # (metricsStore.service, or Zeabur Catalog's VictoriaMetrics) for one namespace at a time. Its
  # Service port must be a number, the same as its pods' port. A store chosen later in Settings
  # is read directly, so only people who may reach that store see its history.
  metrics:
    enabled: true
    # The store's pods, for the proxy's NetworkPolicy; Zeabur Catalog's VMSingle by default.
    podLabels:
      app.kubernetes.io/name: vmsingle
      app.kubernetes.io/instance: vm-victoria-metrics-k8s-stack
  # Zeabur reaches the proxy over TLS. Empty `existingSecret`: the chart makes a CA and a
  # certificate for the proxy's Service (ten years), keeps them on upgrades, and gives Zeabur the
  # CA; to replace them, delete the Secret, upgrade and restart both Deployments. Otherwise a
  # Secret with tls.crt, tls.key and ca.crt, such as a cert-manager Certificate's for
  # <release>-proxy.<namespace>.svc: the proxy picks up a renewed certificate by itself, and
  # Zeabur reads the CA when it starts.
  tls:
    existingSecret: ""
  # kube-apiserver's addresses for the proxy's egress (CIDRs). Empty: the endpoints of the
  # Service default/kubernetes when installing, else TCP 443 and 6443 to anywhere.
  apiServer: []
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# An independently permissioned CloudNativePG updater, powered by unmodified Keel packages.
# Install CloudNativePG first. Enabling this does not opt any database into updates.
databaseUpdater:
  enabled: false
  image:
    repository: ghcr.io/zeabur-oss/database-updater
    # A release pins the multi-platform digest; source builds may select a local tag.
    digest: ""
    tag: ""
    pullPolicy: IfNotPresent
  scanInterval: 15s
  # Development registries only; TLS verification is never disabled.
  httpRegistries: []
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 256Mi}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Empty: the cluster's default IngressClass (Traefik on K3s).
  className: ""
  # The cert-manager ClusterIssuer that signs the certificate in tls.secretName. Empty: no
  # annotation; bring the TLS Secret yourself.
  clusterIssuer: letsencrypt
  annotations: {}
  tls:
    # The TLS Secret for the public URL's host name. Empty: the Ingress has no `tls` section, and
    # TLS ends in front of it.
    secretName: zeabur-tls

# A Gateway API route (gateway.networking.k8s.io/v1) instead of, or next to, the Ingress.
httpRoute:
  enabled: false
  annotations: {}
  # The Gateway listeners to attach to, for example [{name: public, namespace: gateway}].
  parentRefs: []

# The budget is 30 MiB of anonymous memory when idle (scripts/e2e.sh checks it); it idles near 6Mi
# with 35 pods in the cluster. The limit leaves room for open terminals and large projects.
resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 128Mi

# The experience program (docs/reference/telemetry.mdx). On by default; false or DO_NOT_TRACK=1
# turns it off. installationId: a random UUID. Empty: the chart makes one and keeps it in the
# ConfigMap <fullname>-installation-id. Set it when a tool renders the chart with `helm template`.
telemetry:
  enabled: true
  installationId: ""

# The update check (docs/reference/telemetry.mdx): at most once an hour, Zeabur asks GitHub whether
# a newer Zeabur is out, and the interface says how to upgrade. DO_NOT_TRACK=1 turns it off too.
updateCheck:
  enabled: true

# Where Zeabur reads Zeabur Catalog: the components it installs and newer templates. An https://
# address, such as a mirror of a release's api-v1.tar.gz.
catalog:
  url: https://oss-catalog.zeabur.com/v1/

# Components installed once, right after `helm install`, as Cluster → Components installs them:
# a Job runs `zeabur components install <id>` for each, as cluster-admin until it finishes. It runs
# after `helm install` returns, so its failure does not fail the release, and retries for about 45
# minutes.
# cert-manager signs the certificates for Zeabur and Zeabur Identity (ingress.clusterIssuer).
# Empty: install them from Cluster → Components later. Upgrades never install them.
components:
  install: [cert-manager]

# Template updates (docs/reference/telemetry.mdx): every 6 hours at most, Zeabur fetches Zeabur
# Catalog's newest templates from catalog.url and offers them in place of the ones it was built
# with. It trusts the address it fetches from. DO_NOT_TRACK does not turn it off.
templateFetch:
  enabled: true

# The pod's and the container's security context for Zeabur, Zeabur Proxy and the install-time Job
# (the Job's container keeps its own, which does not set runAsNonRoot). Map values merge with these
# defaults: set a key to null to drop it.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  # Secret volume files belong to root with mode 0440; the kubelet gives them this group.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

serviceAccount:
  # Annotations on Zeabur's ServiceAccount, such as the cloud identity a managed cluster's
  # workload identity maps it to.
  annotations: {}

# The PriorityClass of the pods of Zeabur, Zeabur Proxy and the install-time Job. Empty: the
# cluster's default.
priorityClassName: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
