apiVersion: v2
name: zeabur
description: >-
  Zeabur's in-cluster server: the web interface and API, signing people in through Zeabur Identity and
  acting with their own credentials.
type: application
version: 0.3.0-beta.4
home: https://github.com/zeabur-oss/zeabur
icon: https://oss.zeabur.com/favicon.svg
sources:
  - https://github.com/zeabur-oss/zeabur
dependencies:
  # Zeabur Identity: sign-in, installed into the namespace zeabur-identity.
  - name: identity
    version: 0.3.3
    repository: oci://ghcr.io/zeabur-oss/charts
    condition: identity.enabled
