{{- if .Release.IsInstall }}
{{- with .Values.components.install }}
{{- $name := printf "%s-components" (include "zeabur.fullname" $) | trunc 63 | trimSuffix "-" }}
{{- /* Not a Helm hook: Helm waits for hooks, and a failed install here would fail the release.
       cluster-admin, because installing a component is an admin's step (Cluster → Components
       checks for every right). The Job deletes the binding when it succeeds, and the next
       upgrade deletes all three. Argo CD runs them as a hook. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "zeabur.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "zeabur.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "zeabur.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  {{- /* Each retry waits twice as long, up to 6 minutes: about 45 minutes in all. */}}
  backoffLimit: 12
  template:
    metadata:
      {{- /* Not the server's selector labels: the Service would send requests to this pod. */}}
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "zeabur.extraCaVolume" $ }}
      volumes:
        {{- . | trim | nindent 8 }}
      {{- end }}
      {{- /* One at a time, in order: each but the last as an init container. */}}
      {{- $last := sub (len .) 1 }}
      {{- range $i, $id := . }}
      {{- if eq $i 0 }}
      {{ if eq $i $last }}containers{{ else }}initContainers{{ end }}:
      {{- else if eq $i $last }}
      containers:
      {{- end }}
        - name: {{ printf "install-%d" $i }}
          image: {{ include "zeabur.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - components
            - install
            - {{ $id | quote }}
            - --timeout=4m
            {{- if eq $i $last }}
            - --revoke={{ $name }}
            {{- end }}
          env:
            - name: ZEABUR_CATALOG_URL
              value: {{ $.Values.catalog.url | quote }}
            {{- with include "zeabur.outboundEnv" $ }}{{ . | trim | nindent 12 }}{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- with include "zeabur.extraCaMount" $ }}
          volumeMounts:
            {{- . | trim | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      {{- end }}
{{- end }}
{{- end }}
