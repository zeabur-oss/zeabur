{{- if .Values.memberRoles.enabled }}
# A Developer may write ServiceAccounts and RoleBindings in their project for API tokens
# (files/member-roles.yaml, zeabur-project-api-tokens), and RBAC cannot narrow that to some
# objects. An API token is a ServiceAccount named `zeabur-api-token-<name>`, so its requests come
# from the user `system:serviceaccount:<namespace>:zeabur-api-token-<name>`. These policies:
#
# - keep a person's writes in project namespaces to API tokens: a ServiceAccount with the prefix
#   and the `zeabur.com/api-token` label that names its maker, of which only the recorded expiry
#   changes; a RoleBinding with the label and the ServiceAccount's name that gives
#   zeabur-project-developer or zeabur-project-viewer to that one ServiceAccount;
# - refuse an API token, in any namespace, every write to ServiceAccounts and RoleBindings and
#   every TokenRequest, so a token cannot outlive its expiry by making or renewing tokens. A token
#   for every namespace holds these rights everywhere, so holding them is no way past this;
# - refuse a pod that runs as an API token's ServiceAccount: kubelet renews a pod's token for as
#   long as the pod runs. Controllers make pods, so this holds for everyone.
#
# A person who may make the same write in every namespace (admins, Helm) is not held to the first
# rule; other ServiceAccounts (controllers) are not held to it either, as only an admin binds them.
# https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zeabur-api-token-accounts
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [serviceaccounts]
  matchConditions:
    - name: token-or-person
      expression: >-
        request.userInfo.username.matches('^system:serviceaccount:[^:]+:zeabur-api-token-') ||
        !('system:serviceaccounts' in request.userInfo.groups)
  variables:
    - name: token
      expression: "request.userInfo.username.matches('^system:serviceaccount:[^:]+:zeabur-api-token-')"
    - name: held
      expression: >-
        has(namespaceObject.metadata.labels) && 'zeabur.com/project' in namespaceObject.metadata.labels &&
        !authorizer.group('').resource('serviceaccounts')
        .check(request.operation == 'DELETE' ? 'delete' : request.operation == 'UPDATE' ? 'update' : 'create').allowed()
    - name: account
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: labels
      expression: "has(variables.account.metadata.labels) ? variables.account.metadata.labels : {}"
    - name: notes
      expression: >-
        has(variables.account.metadata.annotations) ? variables.account.metadata.annotations : {}
  validations:
    - expression: "!variables.token"
      reason: Forbidden
      message: An API token can't make, change or delete ServiceAccounts.
    - expression: >-
        !variables.held || (variables.account.metadata.name.startsWith('zeabur-api-token-') &&
        variables.labels[?'zeabur.com/api-token'].orValue('') == 'true')
      reason: Forbidden
      message: Only an admin can write a ServiceAccount that isn't an API token.
    - expression: >-
        !variables.held || request.operation != 'CREATE' ||
        variables.notes[?'zeabur.com/api-token-created-by'].orValue('') == request.userInfo.username
      reason: Forbidden
      message: A new API token must name you as the person who made it.
    - expression: >-
        !variables.held || request.operation != 'UPDATE' || (
        (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) == variables.labels &&
        (has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}).all(k,
          k == 'zeabur.com/api-token-expires-at' || (k in variables.notes &&
          variables.notes[k] == oldObject.metadata.annotations[k])) &&
        variables.notes.all(k, k == 'zeabur.com/api-token-expires-at' ||
          (has(oldObject.metadata.annotations) && k in oldObject.metadata.annotations)) &&
        (has(object.secrets) ? object.secrets : []) == (has(oldObject.secrets) ? oldObject.secrets : []) &&
        (has(object.imagePullSecrets) ? object.imagePullSecrets : []) ==
        (has(oldObject.imagePullSecrets) ? oldObject.imagePullSecrets : []) &&
        has(object.automountServiceAccountToken) == has(oldObject.automountServiceAccountToken) &&
        (!has(object.automountServiceAccountToken) ||
        object.automountServiceAccountToken == oldObject.automountServiceAccountToken))
      reason: Forbidden
      message: Only an API token's expiry can change.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zeabur-api-token-accounts
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  policyName: zeabur-api-token-accounts
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zeabur-api-token-bindings
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [rolebindings]
  matchConditions:
    - name: token-or-person
      expression: >-
        request.userInfo.username.matches('^system:serviceaccount:[^:]+:zeabur-api-token-') ||
        !('system:serviceaccounts' in request.userInfo.groups)
  variables:
    - name: token
      expression: "request.userInfo.username.matches('^system:serviceaccount:[^:]+:zeabur-api-token-')"
    - name: held
      expression: >-
        has(namespaceObject.metadata.labels) && 'zeabur.com/project' in namespaceObject.metadata.labels &&
        !authorizer.group('rbac.authorization.k8s.io').resource('rolebindings')
        .check(request.operation == 'DELETE' ? 'delete' : request.operation == 'UPDATE' ? 'update' : 'create').allowed()
    - name: binding
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: "!variables.token"
      reason: Forbidden
      message: An API token can't make, change or delete RoleBindings.
    - expression: >-
        !variables.held || (request.operation != 'UPDATE' &&
        (has(variables.binding.metadata.labels) ? variables.binding.metadata.labels : {})
        [?'zeabur.com/api-token'].orValue('') == 'true')
      reason: Forbidden
      message: Only an admin can write a RoleBinding that isn't an API token's.
    - expression: >-
        !variables.held || (
        variables.binding.roleRef.kind == 'ClusterRole' &&
        variables.binding.roleRef.name in ['zeabur-project-developer', 'zeabur-project-viewer'] &&
        has(variables.binding.subjects) && size(variables.binding.subjects) == 1 &&
        variables.binding.subjects[0].kind == 'ServiceAccount' &&
        variables.binding.subjects[0].namespace == request.namespace &&
        variables.binding.subjects[0].name.startsWith('zeabur-api-token-') &&
        variables.binding.metadata.name == variables.binding.subjects[0].name)
      reason: Forbidden
      message: >-
        An API token's RoleBinding gives one of the project's roles to one API token of the
        project, and has its name.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zeabur-api-token-bindings
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  policyName: zeabur-api-token-bindings
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zeabur-api-token-requests
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts/token]
  matchConditions:
    - name: token
      expression: "request.userInfo.username.matches('^system:serviceaccount:[^:]+:zeabur-api-token-')"
  validations:
    - expression: "false"
      reason: Forbidden
      message: An API token can't issue tokens.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zeabur-api-token-requests
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  policyName: zeabur-api-token-requests
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: zeabur-api-token-pods
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - {key: zeabur.com/project, operator: Exists}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  validations:
    - expression: >-
        !(has(object.spec.serviceAccountName) && object.spec.serviceAccountName.startsWith('zeabur-api-token-')) &&
        !(has(object.spec.serviceAccount) && object.spec.serviceAccount.startsWith('zeabur-api-token-'))
      reason: Forbidden
      message: A pod can't run as an API token's ServiceAccount.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: zeabur-api-token-pods
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
spec:
  policyName: zeabur-api-token-pods
  validationActions: [Deny]
{{- end }}
