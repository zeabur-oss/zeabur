# Where Zeabur is, for zeaburctl: the public URL and the Zeabur Identity issuer in a ConfigMap in
# kube-public, as kubeadm's cluster-info publishes the API server's address. zeaburctl sends a
# token to Zeabur only when this issuer issued it. Every signed-in person may read this one
# ConfigMap.
# https://kubernetes.io/docs/reference/setup-tools/kubeadm/implementation-details/#generate-the-cluster-info-configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeabur-info
  namespace: kube-public
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
data:
  url: {{ required "publicUrl is required" .Values.publicUrl | trimSuffix "/" | quote }}
  issuer: {{ required "issuer.url is required" .Values.issuer.url | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeabur-info-reader
  namespace: kube-public
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["zeabur-info"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeabur-info-reader
  namespace: kube-public
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeabur-info-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
