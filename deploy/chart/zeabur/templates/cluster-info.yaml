# Where Zeabur is, for zeaburctl: the public URL and the Zeabur Identity issuer in a ConfigMap in
# kube-public, as kubeadm's cluster-info publishes the API server's address. zeaburctl sends a
# token to Zeabur only when this issuer issued it. Every signed-in person may read this one
# ConfigMap. registry lets zeaburctl up in local mode push to the registry through a port-forward.
# https://kubernetes.io/docs/reference/setup-tools/kubeadm/implementation-details/#generate-the-cluster-info-configmap
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeabur-info
  namespace: kube-public
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
data:
  url: {{ include "zeabur.publicUrl" . | quote }}
  issuer: {{ include "zeabur.issuerUrl" . | quote }}
  {{- if .Values.databaseUpdater.enabled }}
  databaseUpdaterNamespace: {{ .Release.Namespace | quote }}
  databaseUpdaterDeployment: {{ include "zeabur.databaseUpdaterName" . | quote }}
  {{- end }}
  {{- with .Values.builds.registry }}
  registry: {{ . | quote }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeabur-info-reader
  namespace: kube-public
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["zeabur-info"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeabur-info-reader
  namespace: kube-public
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeabur-info-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:authenticated
