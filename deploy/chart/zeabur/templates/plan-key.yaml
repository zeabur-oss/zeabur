{{- if not .Values.planKey.existingSecret }}
{{- $name := include "zeabur.planKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing (index ($existing.data | default dict) .Values.planKey.key) }}
{{- $key = index $existing.data .Values.planKey.key }}
{{- else }}
{{- /* 32 random bytes, which is what Zeabur reads (`--plan-key-file`); `randBytes` returns them
       Base64-encoded, as `data` holds them. Helm's `lookup` sees nothing under `helm template`
       or a client-side dry run, so those print a fresh key each time; a real upgrade keeps it. */}}
{{- $key = randBytes 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.planKey.key }}: {{ $key }}
{{- end }}
