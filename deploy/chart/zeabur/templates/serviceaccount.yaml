# Zeabur's own identity. Every call to kube-apiserver carries the signed-in person's token, except
# for tools pods: only there, in the terminal namespace, Zeabur uses this account
# (templates/terminals.yaml). No token is automounted; the Deployment projects one at its own path
# (https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zeabur.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zeabur.labels" . | nindent 4 }}
automountServiceAccountToken: false
