# Every optional part switched on (scripts/check-chart.sh).
image:
  repository: registry.example.test/zeabur
  tag: v0.0.0-test
publicUrl: https://zeabur.example.test
issuer:
  url: https://identity.example.test:8443
  clientId: zeabur-test
  clientSecret:
    existingSecret: zeabur-oidc
    key: secret
  caBundle:
    configMap: zeabur-identity-ca
elevation:
  enabled: false
terminal:
  debugImage: registry.example.test/busybox:1.37.0
  toolsImage: registry.example.test/k8s:1.36.5
  toolsNamespace: zeabur-tools
  toolsDeadlineMinutes: 15
  toolsGraceSeconds: 30
  toolsResources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
planKey:
  existingSecret: zeabur-plan-key
ingress:
  enabled: true
  className: traefik
  tls:
    secretName: zeabur-tls
httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway
