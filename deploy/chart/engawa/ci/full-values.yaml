# Every optional part switched on (scripts/check-chart.sh).
image:
  repository: registry.example.test/engawa
  tag: v0.0.0-test
publicUrl: https://engawa.example.test
issuer:
  url: https://genkan.example.test:8443
  clientId: engawa-test
  clientSecret:
    existingSecret: engawa-oidc
    key: secret
  caBundle:
    configMap: genkan-ca
elevation:
  enabled: false
planKey:
  existingSecret: engawa-plan-key
ingress:
  enabled: true
  className: traefik
  tls:
    secretName: engawa-tls
httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateway
