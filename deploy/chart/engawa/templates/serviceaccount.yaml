# engawa's own identity, which no Role or ClusterRole is bound to: every call to kube-apiserver
# carries the signed-in person's token, so the pod has no token of its own mounted either
# (https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "engawa.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "engawa.labels" . | nindent 4 }}
automountServiceAccountToken: false
