apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: api-1
  namespace: demo
  labels:
    app: api
spec:
  containers:
    - name: api
      image: example/api:1.0
status:
  phase: Pending
  containerStatuses:
    - name: api
      image: example/api:1.0
      imageID: ""
      ready: false
      restartCount: 0
      state:
        waiting:
          reason: CreateContainerConfigError
          message: secret "db" not found
