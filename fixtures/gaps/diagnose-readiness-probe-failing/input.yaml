apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:2.0
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
        - name: proxy
          image: example/proxy:1.0
---
apiVersion: v1
kind: Pod
metadata:
  name: api-2
  namespace: demo
  labels:
    app: api
spec:
  containers:
    - name: api
      image: example/api:2.0
      readinessProbe:
        httpGet:
          path: /ready
          port: 8080
        periodSeconds: 5
    - name: proxy
      image: example/proxy:1.0
status:
  phase: Running
  containerStatuses:
    - name: api
      image: example/api:2.0
      imageID: ""
      ready: false
      restartCount: 0
      state:
        running:
          startedAt: "2026-10-15T11:40:00Z"
    - name: proxy
      image: example/proxy:1.0
      imageID: ""
      ready: true
