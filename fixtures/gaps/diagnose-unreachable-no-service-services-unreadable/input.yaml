apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:1.0
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: api-1
  namespace: demo
  labels:
    app: api
spec:
  containers:
    - name: api
      image: example/api:1.0
status:
  phase: Running
  containerStatuses:
    - name: api
      image: example/api:1.0
      imageID: ""
      ready: false
      restartCount: 7
      state:
        waiting:
          reason: CrashLoopBackOff
      lastState:
        terminated:
          reason: Error
          exitCode: 2
          finishedAt: "2026-10-15T11:59:00Z"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: demo
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - api.example.com
  rules:
    - backendRefs:
        - name: api
          port: 8080
