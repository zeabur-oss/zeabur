apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:1.0
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: api-1
  namespace: demo
  labels:
    app: api
spec:
  containers:
    - name: api
      image: example/api:1.0
status:
  phase: Running
  containerStatuses:
    - name: api
      image: example/api:1.0
      imageID: ""
      ready: true
      restartCount: 0
      state:
        running:
          startedAt: "2026-10-15T11:00:00Z"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: demo
spec:
  parentRefs:
    - name: public
      namespace: gateways
  rules:
    - backendRefs:
        - name: api
          port: 80
status:
  parents:
    - parentRef:
        name: public
        namespace: gateways
      controllerName: example.com/gateway
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          lastTransitionTime: "2026-10-15T11:40:00Z"
        - type: ResolvedRefs
          status: "False"
          reason: RefNotPermitted
          lastTransitionTime: "2026-10-15T11:40:00Z"
