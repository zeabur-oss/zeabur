apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: blog
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/blog:2.4.1
---
apiVersion: v1
kind: Pod
metadata:
  name: web-1
  namespace: blog
  labels:
    app: web
spec:
  containers:
    - name: web
      image: ghcr.io/example/blog:2.4.1
status:
  phase: Pending
  containerStatuses:
    - name: web
      image: ghcr.io/example/blog:2.4.1
      imageID: ""
      ready: false
      restartCount: 0
      state:
        waiting:
          reason: ImagePullBackOff
          message: 'Back-off pulling image "ghcr.io/example/blog:2.4.1": ErrImagePull: failed to pull and unpack image "ghcr.io/example/blog:2.4.1": failed to resolve reference "ghcr.io/example/blog:2.4.1": failed to authorize: failed to fetch anonymous token: unexpected status from GET request to https://ghcr.io/token?scope=repository%3Aexample%2Fblog%3Apull&service=ghcr.io: 403 Forbidden'
