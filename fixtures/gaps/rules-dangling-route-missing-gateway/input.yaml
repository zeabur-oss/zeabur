apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: typo
  namespace: shop
spec:
  parentRefs:
    - name: public
      namespace: infra
      sectionName: https
    - name: edge
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: infra-old
  rules:
    - backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: attached
  namespace: shop
spec:
  parentRefs:
    - name: internal
    - name: public
      namespace: infra
    - group: ""
      kind: Service
      name: web
  rules:
    - backendRefs:
        - name: web
          port: 80
status:
  parents:
    - parentRef:
        name: internal
      controllerName: example.test/gateway-controller
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
