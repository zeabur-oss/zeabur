# Source: prometheus-blackbox-exporter/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-prometheus-blackbox-exporter
  namespace: observability
  labels:
    helm.sh/chart: prometheus-blackbox-exporter-11.20.2
    app.kubernetes.io/name: prometheus-blackbox-exporter
    app.kubernetes.io/instance: blackbox-exporter
    app.kubernetes.io/version: "v0.29.1"
    app.kubernetes.io/managed-by: Helm
data:
  blackbox.yaml: |
    modules:
      http_2xx:
        http:
          follow_redirects: true
          ip_protocol_fallback: true
          preferred_ip_protocol: ip6
          valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        prober: http
        timeout: 5s
      tcp_connect:
        prober: tcp
        timeout: 5s

