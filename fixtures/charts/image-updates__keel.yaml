  sessionAffinity: None

---
# Source: keel/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
  namespace: keel
  labels:
    app: keel
    chart: keel-v1.2.3
    release: keel
    heritage: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keel
      release: keel
  template:
    metadata:
      labels:
        app: keel
        release: keel
    spec:
      serviceAccountName: keel
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keel
          # Note that we use appVersion to get images tag.
          image: "ghcr.io/keel-hq/keel:0.22.4"
          imagePullPolicy: IfNotPresent
          command: ["/bin/keel"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AUTH_MODE
              value: "legacy"
            # Enable polling
            - name: POLL
              value: "true"
            # Set default poll schedule
            - name: POLL_DEFAULTSCHEDULE
              value: "@every 5m"
            - name: NOTIFICATION_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: keel
          ports:
            - containerPort: 9300
          startupProbe:
            httpGet:
              path: /healthz
              port: 9300
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9300
            initialDelaySeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9300
            initialDelaySeconds: 5
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
