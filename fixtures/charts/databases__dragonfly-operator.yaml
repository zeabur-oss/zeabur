# Source: dragonfly-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-operator
  labels:
    helm.sh/chart: dragonfly-operator-v1.7.1
    app.kubernetes.io/name: dragonfly-operator
    app.kubernetes.io/instance: dragonfly-operator
    app.kubernetes.io/version: "v1.7.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/created-by: dragonfly-operator
    app.kubernetes.io/part-of: dragonfly-operator
    app.kubernetes.io/component: controller
    control-plane: controller-manager
  namespace: dragonfly-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly-operator
      app.kubernetes.io/instance: dragonfly-operator
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        helm.sh/chart: dragonfly-operator-v1.7.1
        app.kubernetes.io/name: dragonfly-operator
        app.kubernetes.io/instance: dragonfly-operator
        app.kubernetes.io/version: "v1.7.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/created-by: dragonfly-operator
        app.kubernetes.io/part-of: dragonfly-operator
        control-plane: controller-manager
    spec:
      serviceAccountName: dragonfly-operator-controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080/
            - --logtostderr=true
            - --v=0
          image: "quay.io/brancz/kube-rbac-proxy:v0.20.2@sha256:ad0fa9f0adc928b557663297bd22c610533960d77acdec289ce8a636f0ea2114"
          imagePullPolicy: IfNotPresent
          name: kube-rbac-proxy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 5m
              memory: 32Mi
        - name: manager
          args:
            - --leader-elect
            - --metrics-bind-address=127.0.0.1:8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /manager
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          image: "docker.dragonflydb.io/dragonflydb/operator:v1.7.1@sha256:bc0067369a456810d00715d7292da32b82f6df491fd51d6c57f2b2b3193ab490"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
