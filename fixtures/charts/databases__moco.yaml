# Source: moco/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moco-controller
  namespace: moco-system
  labels:
    app.kubernetes.io/component: moco-controller
    helm.sh/chart: moco-0.27.0
    app.kubernetes.io/name: moco
    app.kubernetes.io/version: "0.37.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: moco-controller
      app.kubernetes.io/name: moco
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: moco-controller
      labels:
        app.kubernetes.io/component: moco-controller
        app.kubernetes.io/name: moco
    spec:
      containers:
        - env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          image: "ghcr.io/cybozu-go/moco:0.37.0"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          name: moco-controller
          args:
            - --agent-image
            - "ghcr.io/cybozu-go/moco-agent:0.16.0"
            - --fluent-bit-image
            - "ghcr.io/cybozu-go/moco/fluent-bit:5.0.2.1"
            - --mysqld-exporter-image
            - "ghcr.io/cybozu-go/moco/mysqld_exporter:0.19.0.1"
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
            - mountPath: /grpc-cert
              name: grpc-cert
              readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: moco-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: moco-controller-cert
        - name: grpc-cert
          secret:
            defaultMode: 420
            secretName: moco-controller-grpc

