# Source: seaweedfs-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs-operator
  namespace: seaweedfs-operator
  labels:
    helm.sh/chart: seaweedfs-operator-0.1.43
    app.kubernetes.io/name: seaweedfs-operator
    app.kubernetes.io/instance: seaweedfs-operator
    app.kubernetes.io/version: "1.0.40"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs-operator
      app.kubernetes.io/instance: seaweedfs-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs-operator
        app.kubernetes.io/instance: seaweedfs-operator
    spec:
      
      serviceAccountName: seaweedfs-operator
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      
      containers:
      - name: seaweedfs-operator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        image: "chrislusf/seaweedfs-operator:1.0.40"
        imagePullPolicy: IfNotPresent
        command:
        - /manager
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        env:
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: seaweedfs-operator-webhook-server-cert
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key

