# Source: seaweedfs-operator/templates/webhook/certificate.yaml
# Serving Certificate — mounted by the operator pod for TLS on the webhook endpoint.
# cert-manager injects the CA bundle into the webhook configurations via the
# cert-manager.io/inject-ca-from annotation on those resources.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs-operator-webhook-cert
  namespace: seaweedfs-operator
  labels:
    helm.sh/chart: seaweedfs-operator-0.1.43
    app.kubernetes.io/name: seaweedfs-operator
    app.kubernetes.io/instance: seaweedfs-operator
    app.kubernetes.io/version: "1.0.40"
    app.kubernetes.io/managed-by: Helm
spec:
  dnsNames:
    - seaweedfs-operator-webhook
    - seaweedfs-operator-webhook.seaweedfs-operator.svc
    - seaweedfs-operator-webhook.seaweedfs-operator.svc.cluster.local
  secretName: seaweedfs-operator-webhook-server-cert
  issuerRef:
    name: seaweedfs-operator-webhook-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
