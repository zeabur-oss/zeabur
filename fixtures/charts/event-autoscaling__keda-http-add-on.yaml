# Source: keda-add-ons-http/templates/interceptor/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: interceptor
    app.kubernetes.io/name: http-add-on    
    app.kubernetes.io/part-of: keda-add-ons-http
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: keda-add-ons-http
    app.kubernetes.io/version: 0.16.0
    helm.sh/chart: keda-add-ons-http-0.16.0
  name: keda-add-ons-http-interceptor
  namespace: keda
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: interceptor
      app.kubernetes.io/name: http-add-on      
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: keda-add-ons-http
  template:
    metadata:
      labels:
        app.kubernetes.io/component: interceptor
        app.kubernetes.io/name: http-add-on        
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: keda-add-ons-http
        app.kubernetes.io/version: 0.16.0
        helm.sh/chart: keda-add-ons-http-0.16.0
      annotations:
    spec:
      imagePullSecrets:
        []
      serviceAccountName: keda-add-ons-http-interceptor
      securityContext:
        fsGroup: 1000
        supplementalGroups:
        - 1000
      containers:
      - args:
        - "--zap-log-level=info"
        - "--zap-encoder=console"
        - "--zap-time-encoding=rfc3339"
        image: "ghcr.io/kedacore/http-add-on-interceptor:0.16.0"
        imagePullPolicy: 'Always'
        name: "keda-add-ons-http-interceptor"
        env:
        - name: KEDA_HTTP_PROXY_PORT
          value: "8080"
        - name: KEDA_HTTP_ADMIN_PORT
          value: "9090"
        
        - name: KEDA_HTTP_MAX_IDLE_CONNS
          value: "1000"
        - name: KEDA_HTTP_MAX_IDLE_CONNS_PER_HOST
          value: "200"
        - name: KEDA_HTTP_DIRECT_POD_ROUTING
          value: "true"
        - name: KEDA_HTTP_COLD_START_MAX_PENDING_REQUESTS
          value: "0"
        - name: KEDA_HTTP_SHUTDOWN_DELAY
          value: "5s"
        - name: KEDA_HTTP_DRAIN_TIMEOUT
          value: "30s"
        - name: KEDA_HTTP_TLS_SKIP_VERIFY
          value: "false"
        ports:
        - containerPort: 9090
          name: admin
        - containerPort: 8080
          name: proxy
        livenessProbe:
          httpGet:
            path: /livez
            port: admin
        readinessProbe:
          httpGet:
            path: /readyz
            port: admin
        resources:
          limits:
            cpu: 0.5
            memory: 64Mi
          requests:
            cpu: 250m
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/os: linux

