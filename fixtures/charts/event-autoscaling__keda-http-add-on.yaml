    helm.sh/chart: keda-add-ons-http-0.16.0
  name: keda-add-ons-http-controller-manager
  namespace: keda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: operator
      app.kubernetes.io/name: http-add-on      
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/instance: keda-add-ons-http
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator
        app.kubernetes.io/name: http-add-on        
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/instance: keda-add-ons-http
        app.kubernetes.io/version: 0.16.0
        helm.sh/chart: keda-add-ons-http-0.16.0
      annotations:
    spec:
      imagePullSecrets:
        []
      serviceAccountName: keda-add-ons-http
      securityContext:
        fsGroup: 1000
        supplementalGroups:
        - 1000
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --metrics-secure=true
        - --metrics-auth=true
        - --leader-elect
        - --zap-log-level=info
        - --zap-time-encoding=rfc3339
        - --zap-encoder=console
        image: "ghcr.io/kedacore/http-add-on-operator:0.16.0"
        imagePullPolicy: 'Always'
        name: "keda-add-ons-http-operator"
        env:
        - name: KEDA_HTTP_OPERATOR_EXTERNAL_SCALER_SERVICE
          value: "keda-add-ons-http-external-scaler"
        - name: KEDA_HTTP_OPERATOR_EXTERNAL_SCALER_PORT
          value: "9090"
        - name: KEDA_HTTP_OPERATOR_NAMESPACE
          value: "keda"
        - name: KEDA_HTTP_OPERATOR_WATCH_NAMESPACE
          value: ""
        ports:
        - name: metrics
          containerPort: 8443
        - name: probes
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        resources:
          limits:
            cpu: 0.5
            memory: 64Mi
          requests:
            cpu: 250m
            memory: 20Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/os: linux

