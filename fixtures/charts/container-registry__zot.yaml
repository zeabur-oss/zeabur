# Source: zot/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zot
  namespace: zot
  labels:
    helm.sh/chart: zot-0.1.128
    app.kubernetes.io/name: zot
    app.kubernetes.io/instance: zot
    app.kubernetes.io/version: "v2.1.22"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
      app.kubernetes.io/instance: zot
  minReadySeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: zot-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  template:
    metadata:
      annotations:
        checksum/configFiles: ff6573b0bbd74ccdbf807c01aa0c12127681c322e1d10ada4b5dc73cb72c86af
      labels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/instance: zot
    spec:
      serviceAccountName: zot
      securityContext:
        null
      containers:
        - name: zot
          securityContext:
            null
          image: "ghcr.io/project-zot/zot:v2.1.22"
          imagePullPolicy: IfNotPresent
          env:
            null
          ports:
            - name: zot
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - mountPath: '/var/lib/registry'
              name: zot-pvc
            - mountPath: '/etc/zot'
              name: zot-config
            - mountPath: "/tls"
              name: "zot-tls"
          livenessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /livez
              port: 5000
              scheme: HTTPS
          readinessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /readyz
              port: 5000
              scheme: HTTPS
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /startupz
              port: 5000
              scheme: HTTPS
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 64Mi
      volumes:
        - name: zot-config
          projected:
            sources:
              - configMap:
                  name: zot-config
        - name: zot-tls
          secret:
            secretName: zot-tls
      dnsPolicy: ClusterFirst
