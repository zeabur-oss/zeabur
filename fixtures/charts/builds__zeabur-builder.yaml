apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zot
  namespace: zot
  labels:
    helm.sh/chart: zot-0.1.128
    app.kubernetes.io/name: zot
    app.kubernetes.io/instance: zot
    app.kubernetes.io/version: "v2.1.22"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zot
      app.kubernetes.io/instance: zot
  minReadySeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: zot-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  template:
    metadata:
      annotations:
        checksum/config: c0d2c34fda0f279b90e91b730cdbb9f0326212cd821bfcd1a0372a4f21bf2dac
      labels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/instance: zot
    spec:
      serviceAccountName: zot
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          image: "ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080"
          imagePullPolicy: IfNotPresent
          env:
            null
          ports:
            - name: zot
              containerPort: 5000
              protocol: TCP
          volumeMounts:
            - mountPath: '/var/lib/registry'
              name: zot-pvc
            - mountPath: '/etc/zot'
              name: zot-config
            - mountPath: "/tls"
              name: "zot-tls"
            - mountPath: /token
              name: token
              readOnly: true
          livenessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /livez
              port: 5000
              scheme: HTTPS
          readinessProbe:
            initialDelaySeconds: 5
            httpGet:
              path: /readyz
              port: 5000
              scheme: HTTPS
          startupProbe:
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            httpGet:
              path: /startupz
              port: 5000
              scheme: HTTPS
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 20m
              memory: 64Mi
      volumes:
        - name: zot-config
          projected:
            sources:
              - secret:
                  name: zot-config
        - name: zot-tls
          secret:
            secretName: zot-tls
        - name: token
          secret:
            items:
            - key: tls.crt
              path: tls.crt
            secretName: zot-token-signer
      dnsPolicy: ClusterFirst
