# Source: zeabur-builder/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeabur-builder
  labels:
    app.kubernetes.io/name: zeabur-builder
    app.kubernetes.io/instance: builder
spec:
  # Only the holder of the Lease `zeabur-builder` reconciles. Another replica waits for it.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: zeabur-builder
      app.kubernetes.io/instance: builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeabur-builder
        app.kubernetes.io/instance: builder
    spec:
      serviceAccountName: zeabur-builder
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: "ghcr.io/zeabur-oss/builder@sha256:f964d8b5ca515bc84466971ab02aff86f4b7d6ecdca59f753e85cffbb92e78ed"
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - --github-app-secret=github-app
            - --github-app-grants=github-app-installations
