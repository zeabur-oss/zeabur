            successThreshold: 1
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KEDA_HTTP_DEFAULT_TIMEOUT
              value: "3000"
            - name: KEDA_HTTP_MIN_TLS_VERSION
              value: TLS12
            - name: KEDA_HTTP_TLS_CIPHER_LIST
              value: ""
            - name: KEDA_SERVICE_MIN_TLS_VERSION
