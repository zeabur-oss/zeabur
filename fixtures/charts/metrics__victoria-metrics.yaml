apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-kube-state-metrics-customresourcestate-config
  namespace: observability
  labels:    
    helm.sh/chart: kube-state-metrics-8.6.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: kube-state-metrics
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: vm
    app.kubernetes.io/version: "2.20.0"
data:
  config.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
      - groupVersionKind:
          group: builder.zeabur.com
          kind: BuildRun
          version: v1alpha1
        labelsFromPath:
          build:
          - spec
          - buildRef
          buildrun:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
          phase:
          - status
          - phase
          reason:
          - status
          - reason
        metricNamePrefix: zeabur_builder_buildrun
        metrics:
        - each:
            gauge:
              path:
              - status
              - completionTime
            type: Gauge
          errorLogV: 5
          help: When the BuildRun finished; absent while it runs.
          name: completion_time
      - groupVersionKind:
          group: postgresql.cnpg.io
          kind: Cluster
          version: v1
        labelsFromPath:
          cluster:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
        metricNamePrefix: zeabur_cnpg_cluster
        metrics:
        - each:
            info:
              labelsFromPath:
                phase:
                - status
                - phase
            type: Info
          help: The CloudNativePG cluster's phase.
          name: phase
      - groupVersionKind:
          group: postgresql.cnpg.io
          kind: Backup
          version: v1
        labelsFromPath:
          backup:
          - metadata
          - name
          cluster:
          - spec
          - cluster
          - name
          namespace:
          - metadata
          - namespace
          phase:
          - status
          - phase
        metricNamePrefix: zeabur_cnpg_backup
        metrics:
        - each:
            gauge:
              path:
              - metadata
              - creationTimestamp
            type: Gauge
          help: When the Backup was created, by its phase.
          name: created
      - groupVersionKind:
          group: psmdb.percona.com
          kind: PerconaServerMongoDB
          version: v1
        labelsFromPath:
          cluster:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
        metricNamePrefix: zeabur_psmdb
        metrics:
        - each:
            info:
              labelsFromPath:
                state:
                - status
                - state
            type: Info
          help: The MongoDB cluster's state.
          name: state
      - groupVersionKind:
          group: psmdb.percona.com
          kind: PerconaServerMongoDBBackup
          version: v1
        labelsFromPath:
          backup:
          - metadata
          - name
          cluster:
          - spec
          - clusterName
          namespace:
          - metadata
          - namespace
          state:
          - status
          - state
        metricNamePrefix: zeabur_psmdb_backup
        metrics:
        - each:
            gauge:
              path:
              - metadata
              - creationTimestamp
            type: Gauge
          help: When the backup was created, by its state.
          name: created
      - groupVersionKind:
          group: k8up.io
          kind: Backup
          version: v1
        labelsFromPath:
          backup:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
        metricNamePrefix: zeabur_k8up_backup
        metrics:
        - each:
            gauge:
              labelsFromPath:
                reason:
                - reason
                type:
                - type
              path:
              - status
              - conditions
              valueFrom:
              - lastTransitionTime
            type: Gauge
          help: When each condition of the Backup last changed, by type and reason.
          name: condition_time
      - groupVersionKind:
          group: velero.io
          kind: Backup
          version: v1
        labelsFromPath:
          backup:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
          phase:
          - status
          - phase
        metricNamePrefix: zeabur_velero_backup
        metrics:
        - each:
            gauge:
              path:
              - metadata
              - creationTimestamp
            type: Gauge
          help: When the Velero backup was created, by its phase.
          name: created
      - groupVersionKind:
          group: cert-manager.io
          kind: Certificate
          version: v1
        labelsFromPath:
          certificate:
          - metadata
          - name
          namespace:
          - metadata
          - namespace
        metricNamePrefix: zeabur_certmanager_certificate
        metrics:
        - each:
            gauge:
              path:
              - status
              - notAfter
            type: Gauge
          errorLogV: 5
          help: When the issued certificate expires.
          name: not_after
        - each:
            gauge:
              labelsFromPath:
                type:
                - type
              path:
              - status
              - conditions
              valueFrom:
              - status
            type: Gauge
          help: The Certificate's conditions, 1 when true.
          name: condition

