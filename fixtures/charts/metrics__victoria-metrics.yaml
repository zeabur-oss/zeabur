    spec:
      automountServiceAccountToken: true
      hostNetwork: false
      serviceAccountName: vm-kube-state-metrics
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      dnsPolicy: ClusterFirst
      containers:
      - name: kube-state-metrics
        args:
        - --port=8080
        - --resources=pods,replicasets,deployments,statefulsets,daemonsets,jobs,cronjobs,nodes,persistentvolumeclaims,namespaces
        - --metric-labels-allowlist=pods=[app.kubernetes.io/name,app.kubernetes.io/component]
