spec:
  template:
    metadata:
      name: victoria-metrics-operator
      labels: 
        app.kubernetes.io/instance: victoria-metrics-operator
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-operator
        app.kubernetes.io/version: v0.75.0
        helm.sh/chart: victoria-metrics-operator-0.68.1
    spec:
      serviceAccountName: victoria-metrics-operator-cleanup-hook
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.36.0@sha256:63e5e76b746bb8b891a94968d380736c035e768dab0d56ddad1f50c750a4be39
          imagePullPolicy: IfNotPresent
          resources: 
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
