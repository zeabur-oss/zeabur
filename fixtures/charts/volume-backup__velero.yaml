# Source: velero/templates/backupstoragelocation.yaml
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: velero
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: 1.18.2
    helm.sh/chart: velero-12.2.1
spec:
  provider: aws
  accessMode: ReadWrite
  default: true
  objectStorage:
    bucket: "catalog-ci"
  config:
    customerKeyEncryptionSecret: "velero-backup-key/key"
    region: "us-east-1"
    s3ForcePathStyle: "true"
    s3Url: "http://minio.invalid:9000"
