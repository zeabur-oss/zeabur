description: "With restartAfter, the workloads that read the changed key into their environment are restarted by the same plan."
operation: mutation.plan
params:
  request:
    restartAfter: true
    changes:
      - op: data
        kind: ConfigMap
        name: settings
        changes:
          - {op: set, key: MODE, value: maintenance}
  now: "2026-10-15T08:00:00Z"
