description: "Without a route to the workload but with Gateways, a new hostname creates an HTTPRoute attached to the first Gateway, and says which of several it chose."
operation: mutation.plan
params:
  request:
    changes:
      - op: addDomain
        workload: {kind: Deployment, name: web}
        hostname: web.example.test
  gateways:
    - {namespace: gateway, name: public}
    - {namespace: gateway, name: internal}
