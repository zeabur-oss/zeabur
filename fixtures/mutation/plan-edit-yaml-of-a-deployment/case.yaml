description: "Editing one container of a Deployment touches that container only."
operation: mutation.plan
params: {"request": {"changes": [{"op": "edit", "resource": {"group": "apps", "version": "v1", "resource": "deployments"}, "name": "web", "yaml": "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\n  namespace: demo\n  annotations:\n    deployment.kubernetes.io/revision: \"3\"\nspec:\n  replicas: 2\n  selector:\n    matchLabels: {app: web}\n  template:\n    metadata:\n      labels: {app: web}\n    spec:\n      containers:\n        - name: app\n          image: example/web:3.1\n          ports:\n            - containerPort: 8080\n          env:\n            - name: GREETING\n              valueFrom:\n                configMapKeyRef: {name: web-config, key: greeting}\n          resources:\n            requests: {cpu: 100m, memory: 128Mi, nvidia.com/gpu: \"1\"}\n            limits: {memory: 256Mi, nvidia.com/gpu: \"1\"}\n          livenessProbe:\n            httpGet: {path: /live, port: 8080}\n          volumeMounts:\n            - name: cache\n              mountPath: /cache\n      volumes:\n        - name: cache\n          emptyDir: {}\n"}]}}
