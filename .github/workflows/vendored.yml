name: Vendored files

# Files copied from other repositories must match their pinned commits. The checks download the
# pinned sources from GitHub, so they run only when a vendored file, its pin or a check changes:
# a pin names fixed content, so unchanged files cannot start to differ, and a GitHub outage or rate
# limit cannot fail CI on unrelated changes. Run them locally with the same scripts.

on:
  push:
    branches: [main]
    paths:
      - crates/zeabur-catalog/bundle/**
      - scripts/check-catalog.sh
      - .github/workflows/vendored.yml
  pull_request:
    paths:
      - crates/zeabur-catalog/bundle/**
      - scripts/check-catalog.sh
      - .github/workflows/vendored.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - run: nix develop --command ./scripts/check-catalog.sh
