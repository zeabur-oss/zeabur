name: Overview cost

# What reading a project's overview costs in allocated bytes, at the baseline layout and at ten
# times its size. Started by hand; no pull request runs it and nothing compares the numbers with
# main. The request set, layout and allocation scope are written in
# crates/zeabur-kube/tests/overview_cost.rs.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  overview-cost:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      - uses: ./.github/actions/catalog-release
      - run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: overview-cost
      - name: Overview cost
        run: |
          {
            echo "### Overview cost"
            nix develop --command cargo test -p zeabur-kube --release --test overview_cost \
              -- --ignored --nocapture | grep '^|'
          } >> "$GITHUB_STEP_SUMMARY"
