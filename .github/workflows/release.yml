name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: the shared release builds, publishes and signs the
# image, chart and installers, then leaves a draft (docs/internal/releasing.md). Manual run: rehearse.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@a0e7fee556f7d2e9bebfea0de11b4391a427fea7 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: Zeabur
      docs: https://oss.zeabur.com/docs/zeabur/
      version: ${{ inputs.version }}
      # The experience program's PostHog key (docs/internal/releasing.md).
      telemetry-key: ${{ vars.POSTHOG_KEY }}
      # zeaburctl for macOS on Apple silicon; the server, its image and the installer are Linux only.
      platforms: >-
        [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
         {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"},
         {"os": "darwin", "arch": "arm64", "runner": "macos-26"}]
      # The installers pin the image and the chart that publish pushed; they run on Linux servers.
      finish: true
      finish-platforms: >-
        [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
         {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"}]
      # zeaburctl for macOS signed with the Developer ID and notarized (docs/internal/releasing.md).
      signing-environment: apple-signing
    secrets:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
