name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: build each product (zeabur-build, zeaburctl-build,
# desktop-build), smoke the server with zeaburctl, then push the images and the chart by digest, sign and
# attest them, create the draft release with every file, and verify the draft. A maintainer
# publishes the draft (docs/internal/releasing.md). Manual run: rehearse, which builds and smokes
# every platform and publishes nothing.
#
# Zeabur's own steps are scripts/release-*.sh; the rest calls zeabur-oss-release directly. Zeabur
# Desktop's packages and zeaburctl for Windows build outside Nix.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # Checks the version and the catalog pin once, and builds what every build job embeds and the
  # runners outside Nix need from the dev shell: the web pages, the catalog, and the versions of
  # the toolchain, the Tauri CLI and cargo-auditable.
  prepare:
    runs-on: instabox-small
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#desktop --command bash -eo pipefail {0}
    outputs:
      toolchain: ${{ steps.versions.outputs.toolchain }}
      tauri-cli: ${{ steps.versions.outputs.tauri-cli }}
      cargo-auditable: ${{ steps.versions.outputs.cargo-auditable }}
      catalog-commit: ${{ steps.versions.outputs.catalog-commit }}
      updater: ${{ steps.versions.outputs.updater }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - name: The version is SemVer, with a CHANGELOG.md section, on main
        run: |
          bun x zeabur-oss-release check-tag "$VERSION" --changelog CHANGELOG.md \
            ${{ github.event_name != 'push' && '--rehearsal' || '' }}
      # A tag's binaries embed the catalog bundle, which must be the one the catalog's release
      # signed. A rehearsal builds whatever the pin names.
      - name: The catalog pin resolves to the catalog's signed release
        if: github.event_name == 'push'
        run: scripts/release-pins.sh "$VERSION"
      - id: versions
        name: Build the pages, copy the catalog, and name the versions and the updater key
        run: scripts/ci/desktop-inputs.sh | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs
          path: |
            web/dist/
            desktop/web/dist/
            target/desktop-inputs/
          if-no-files-found: error
          retention-days: 1

  # The server and its images; Linux only. Each build is native.
  zeabur-build:
    name: zeabur-build (linux-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      - name: Build
        env:
          # The experience program's PostHog key, in tag builds only (docs/internal/releasing.md).
          ZEABUR_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.POSTHOG_KEY || '' }}
          ZEABUR_UI_DIST: ${{ github.workspace }}/web/dist
          ARCH: ${{ matrix.arch }}
        run: scripts/release-build-zeabur.sh "$VERSION" "$ARCH" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeabur-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # zeaburctl, one script for every platform. Linux and macOS build in the dev shell; Windows
  # builds outside it, like desktop-build, as the dev shell has no Windows toolchain.
  zeaburctl-build:
    name: zeaburctl-build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-26.04
            shell: nix develop --command bash -eo pipefail {0}
          - os: linux
            arch: arm64
            runner: ubuntu-26.04-arm
            shell: nix develop --command bash -eo pipefail {0}
          - os: darwin
            arch: arm64
            runner: macos-26
            shell: nix develop --command bash -eo pipefail {0}
            signing: apple-signing
          - os: windows
            arch: amd64
            runner: windows-2025
            shell: bash
            signing: windows-signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # azure/login
    # The environments' branch rules keep the credentials to main and tags; a rehearsal on any
    # other branch builds unsigned.
    environment: >-
      ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          matrix.signing || '' }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      ZEABUR_UI_DIST: ${{ github.workspace }}/web/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.os != 'windows'
        uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      - name: Install the toolchain and cargo-auditable
        if: matrix.os == 'windows'
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.toolchain }}
          CARGO_AUDITABLE: ${{ needs.prepare.outputs.cargo-auditable }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-auditable --version "=$CARGO_AUDITABLE" --locked
      - name: Build
        env:
          # The experience program's PostHog key, in tag builds only (docs/internal/releasing.md).
          ZEABUR_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.POSTHOG_KEY || '' }}
          # Outside the dev shell only; the dev shell sets its own.
          RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows' && needs.prepare.outputs.toolchain || '' }}
          ZEABUR_CATALOG_COMMIT: ${{ matrix.os == 'windows' && needs.prepare.outputs.catalog-commit || '' }}
          ZEABUR_CATALOG_RELEASE: >-
            ${{ matrix.os == 'windows' && format('{0}/target/desktop-inputs/catalog', github.workspace) || '' }}
        run: scripts/release-build-zeaburctl.sh compile "$VERSION" "$OS" "$ARCH" dist
      # Signing logs in right before packaging, so the short-lived token is still valid.
      - if: matrix.os == 'windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # A step of its own, so the build never sees the secrets. Without them it packs unsigned.
      - name: Package and sign
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows' && needs.prepare.outputs.toolchain || '' }}
          APPLE_CERTIFICATE_P12: ${{ matrix.os == 'darwin' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'darwin' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'darwin' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'darwin' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ matrix.os == 'darwin' && secrets.APPLE_API_ISSUER_ID || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.os == 'windows' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: scripts/release-build-zeaburctl.sh package "$VERSION" "$OS" "$ARCH" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeaburctl-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The archive, the chart and the image as built, on the development cluster with Zeabur Identity
  # at xtask/pins/zeabur-identity.
  smoke:
    name: smoke (linux-${{ matrix.arch }})
    needs: [zeabur-build, zeaburctl-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zeabur*-linux-${{ matrix.arch }}
          path: dist
          merge-multiple: true
      - name: Smoke
        env:
          ARCH: ${{ matrix.arch }}
          CI_ARTIFACTS: ${{ runner.temp }}/ci-artifacts
        run: |
          docker image load --input dist/image.tar
          scripts/release-smoke.sh "dist/zeaburctl-$VERSION-linux-$ARCH.tar.gz" \
            deploy/chart/zeabur "zeabur:release-$ARCH"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-smoke-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/ci-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Zeabur Desktop's packages build outside Nix, with each runner's own compiler, linker and system
  # libraries; the compile step fails if the binary links anything from /nix/store.
  desktop-build:
    name: desktop-build (${{ matrix.os }}-${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, arch: arm64, runner: macos-26, signing: apple-signing }
          - { os: windows, arch: amd64, runner: windows-2025, signing: windows-signing }
          # The oldest supported Ubuntu, so the packages run on its glibc and newer.
          - { os: linux, arch: amd64, runner: ubuntu-24.04, signing: "" }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, signing: "" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # azure/login
    # The environments' branch rules keep the credentials to main and tags.
    environment: >-
      ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          matrix.signing || '' }}
    # bash with pipefail on every runner, Windows too.
    defaults:
      run:
        shell: bash
    env:
      OS: ${{ matrix.os }}
      ARCH: ${{ matrix.arch }}
      RUSTUP_TOOLCHAIN: ${{ needs.prepare.outputs.toolchain }}
      ZEABUR_CATALOG_COMMIT: ${{ needs.prepare.outputs.catalog-commit }}
      ZEABUR_CATALOG_RELEASE: ${{ github.workspace }}/target/desktop-inputs/catalog
      ZEABUR_UI_DIST: ${{ github.workspace }}/web/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inputs
      - name: Install the toolchain and the system libraries
        env:
          TAURI_CLI: ${{ needs.prepare.outputs.tauri-cli }}
        run: |
          if [[ "$OS" == linux ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev \
              libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev file
          fi
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install tauri-cli --version "=$TAURI_CLI" --locked
      - name: Build
        env:
          # The experience program's PostHog key, in tag builds only (docs/internal/releasing.md).
          ZEABUR_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.POSTHOG_KEY || '' }}
        run: scripts/package-desktop.sh compile "$VERSION" "$OS" "$ARCH" dist
      # Signing logs in right before packaging, so the short-lived token is still valid.
      - if: matrix.os == 'windows' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Package and sign
        env:
          APPLE_CERTIFICATE_P12: ${{ matrix.os == 'darwin' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'darwin' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY_P8: ${{ matrix.os == 'darwin' && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'darwin' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER_ID: ${{ matrix.os == 'darwin' && secrets.APPLE_API_ISSUER_ID || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.os == 'windows' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: scripts/package-desktop.sh package "$VERSION" "$OS" "$ARCH" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Signs each file the updater installs and writes latest.json, once the app has an updater key
  # (desktop/tauri.conf.json), for main and tags. Only this job's environment holds the key.
  desktop-updater:
    if: >-
      needs.prepare.outputs.updater == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [prepare, desktop-build]
    runs-on: instabox-small
    timeout-minutes: 15
    environment: desktop-updater
    defaults:
      run:
        shell: nix develop .#desktop --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*-*
          path: packages
          merge-multiple: true
      - name: Sign the updates and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir updater
          bun install --frozen-lockfile
          bun x zeabur-oss-release notes CHANGELOG.md "$VERSION" >notes.md
          bun scripts/desktop-release.ts updater "$VERSION" packages notes.md updater/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-updater
          path: updater/latest.json
          if-no-files-found: error
          retention-days: 7

  # Nothing is pushed until every platform and every Zeabur Desktop package is built.
  publish:
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.zeabur-build.result == 'success' &&
          needs.zeaburctl-build.result == 'success' && needs.smoke.result == 'success' &&
          needs.desktop-build.result == 'success' && needs.desktop-updater.result != 'failure' }}
    needs: [zeabur-build, zeaburctl-build, smoke, desktop-build, desktop-updater]
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # images and the chart on ghcr.io
      id-token: write # keyless signatures
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zeabur*-*-*
          path: artifacts
      - id: publish
        name: Push the images and the chart by digest and sign them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          plain=${VERSION#v}
          release() { bun x zeabur-oss-release "$@"; }
          # image <name> <label in digests.txt> <chart value that pins it> <archive>: the index of
          # both architectures, signed, pinned by digest in the chart.
          image() {
            release push-image --out published --label "$2" --pin "chart/values.yaml:$3" \
              "ghcr.io/$owner/$1:$plain" \
              "linux/amd64=artifacts/zeabur-linux-amd64/$4" \
              "linux/arm64=artifacts/zeabur-linux-arm64/$4"
          }

          # Everything that can refuse does so before the first write; recovering from a failed run
          # is a maintainer's decision (docs/internal/releasing.md). A published release is final.
          release unpublished "$VERSION"
          assets=$(scripts/release-assets.sh "$VERSION")
          while read -r file artifact; do
            [[ "$artifact" != zeabur*-*-* || -f "artifacts/$artifact/$file" ]] ||
              { echo "::error::missing the build of $file"; exit 1; }
          done <<<"$assets"
          crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          release absent "ghcr.io/$owner/zeabur:$plain" "ghcr.io/$owner/proxy:$plain" \
            "ghcr.io/$owner/charts/zeabur:$plain"
          scripts/release-default-images.sh >"$RUNNER_TEMP/default-images.txt"

          cp -r deploy/chart/zeabur chart
          helm dependency build chart
          zeabur=$(image zeabur "" image image.tar | tail -n 1)
          proxy=$(image proxy proxy proxy.image proxy-image.tar | tail -n 1)
          cat "$RUNNER_TEMP/default-images.txt" >>published/digests.txt
          # The chart runs each image pinned to its index, and no other.
          [[ "$(scripts/chart-images.sh chart)" == "$(printf '%s\n' "$zeabur" "$proxy" | sort)" ]] ||
            { echo "::error::the chart does not run the images just pushed"; exit 1; }
          helm lint --strict chart --set global.domain=example.com
          helm package chart --destination published
          release push-chart --out published "oci://ghcr.io/$owner/charts" "published/zeabur-$plain.tgz"
          cat published/subjects.json published/digests.txt
          echo "subjects=$(jq -c . published/subjects.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest (${{ matrix.name }}@${{ matrix.digest }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.publish.outputs.subjects) }}
    runs-on: instabox-small
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.name }}
          subject-digest: ${{ matrix.digest }}

  release:
    if: >-
      ${{ !cancelled() && needs.publish.result == 'success' && needs.attest.result == 'success' &&
          needs.desktop-updater.result != 'failure' }}
    needs: [publish, attest, desktop-updater]
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Make the release assets
        run: |
          mkdir assets
          files=$(scripts/release-assets.sh "$VERSION")
          while read -r file artifact; do
            cp "artifacts/$artifact/$file" assets/
          done <<<"$files"
      - uses: zeabur-oss/.github/actions/release-draft@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          version: ${{ env.VERSION }}
          name: Zeabur
          docs: https://oss.zeabur.com/docs/zeabur/

  verify:
    name: verify (${{ matrix.os }}-${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-26.04 }
          - { os: linux, arch: arm64, runner: ubuntu-26.04-arm }
          - { os: darwin, arch: arm64, runner: macos-26 }
          - { os: windows, arch: amd64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      - if: matrix.os != 'windows'
        uses: zeabur-oss/.github/actions/release-verify@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          version: ${{ env.VERSION }}
      - name: Verify the draft's assets as a user gets them
        if: matrix.os != 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_SOURCE_REF: refs/tags/${{ env.VERSION }}
        run: scripts/release-verify.sh "$VERSION" downloaded
      # Windows has no dev shell: zeaburctl from the draft runs and its signature holds. The other
      # rows check every file's checksum and attestation.
      - if: matrix.os == 'windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zeaburctl from the draft and check its signature
        if: matrix.os == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded \
            --pattern "zeaburctl-$VERSION-windows-amd64.zip"
          scripts/release-verify-windows.sh "$VERSION" downloaded
