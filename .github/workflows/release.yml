name: Release

# A tag vX.Y.Z runs all of CI, builds and smokes every platform, publishes the image and the chart
# by digest, signs and attests them, builds the installers that pin them, then leaves a draft
# release that a maintainer checks and publishes (docs/internal/releasing.md); nothing here
# publishes it. Run by hand, it rehearses: CI, the builds and their smoke tests, nothing
# published. With verify_only it checks an existing draft again with this commit's scripts.
#
# The jobs are zeabur-oss/.github's shared release workflow; each stage is
# `scripts/release.sh <stage>` in this repository.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole of CI on this commit, the cluster jobs included.
  checks:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || inputs.verify_only) }}
    uses: zeabur-oss/.github/.github/workflows/release.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: zeabur
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
      # zeaburctl for macOS on Apple silicon; the server, its image and the installer are Linux only.
      platforms: >-
        [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
         {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"},
         {"os": "darwin", "arch": "arm64", "runner": "macos-26"}]
      # The installers pin the image and the chart that publish pushed.
      finish: true
