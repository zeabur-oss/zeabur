name: Release

# Tag vX.Y.Z on main: the shared release builds, publishes and signs the image, chart and
# installers, then leaves a draft (docs/internal/releasing.md). Manual run: rehearse.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify, as in Cargo.toml (v0.1.1); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: zeabur-oss/.github/.github/workflows/release.yml@d372cc7913ed9692161a23a65ac5f3aa73f30eab # main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      name: zeabur
      version: ${{ inputs.version }}
      verify-only: ${{ inputs.verify_only == true }}
      # zeaburctl for macOS on Apple silicon; the server, its image and the installer are Linux only.
      platforms: >-
        [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
         {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"},
         {"os": "darwin", "arch": "arm64", "runner": "macos-26"}]
      # The installers pin the image and the chart that publish pushed; they run on Linux servers.
      finish: true
      finish-platforms: >-
        [{"os": "linux", "arch": "amd64", "runner": "ubuntu-26.04"},
         {"os": "linux", "arch": "arm64", "runner": "ubuntu-26.04-arm"}]
