name: Skills

# Copies the shared skills in .claude/skills again from zeabur-oss/skills and opens a pull request
# with what changed, in the shared workflow of zeabur-oss/.github: after each change to a skill
# there (its Skills dispatch sends zeabur-oss-skills), and Monday morning in Asia/Taipei.
on:
  schedule:
    - cron: '0 17 * * 0'
  repository_dispatch:
    types: [zeabur-oss-skills]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    uses: zeabur-oss/.github/.github/workflows/skills.yml@6ab106525ce16169ab0ecfebe4b0248e096797fa # main
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
