name: Skills

# Installs the shared skills of skills-lock.json again from their sources and opens a pull request
# with what changed, in the shared workflow of zeabur-oss/.github. Monday morning in Asia/Taipei,
# with Renovate.
on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    uses: zeabur-oss/.github/.github/workflows/skills.yml@3d106187b96a11dcc2b1c3024c95400a074de1a1 # main
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
