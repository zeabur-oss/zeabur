name: Changeset

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A title edit, a label and a push in a row leave only the last run.
concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    uses: zeabur-oss/.github/.github/workflows/changeset.yml@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
    with:
      runner: ${{ vars.CI_RUNNER_LINT || 'ubuntu-26.04-arm' }}
