name: Changeset

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A title edit, a label and a push in a row leave only the last run.
concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    uses: zeabur-oss/.github/.github/workflows/changeset.yml@3efa9e88a66e5a355574fe708fd4ed4106e87fcd # main
