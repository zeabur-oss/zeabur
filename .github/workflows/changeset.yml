name: Changeset

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A title edit, a label and a push in a row leave only the last run.
concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    uses: zeabur-oss/.github/.github/workflows/changeset.yml@993db7daf21a752dc7d3940f227e03478ee613cc # main
