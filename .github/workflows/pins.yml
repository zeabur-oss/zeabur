name: Pins

# Moves every pin of zeabur-oss/.github to the newest commit of its main and opens a pull request,
# in the shared workflow of zeabur-oss/.github: when its main sends the event after each push, and
# Monday morning in Asia/Taipei, which catches an event that never arrived. Renovate leaves these
# pins alone.
on:
  schedule:
    - cron: '0 17 * * 0'
  repository_dispatch:
    types: [zeabur-oss-github]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    uses: zeabur-oss/.github/.github/workflows/pins.yml@6ab106525ce16169ab0ecfebe4b0248e096797fa # main
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
