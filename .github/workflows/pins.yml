name: Pins

# Moves every pin of zeabur-oss/.github to the newest commit of its main and opens a pull request,
# in the shared workflow of zeabur-oss/.github. Its main sends the event after each push.
on:
  repository_dispatch:
    types: [zeabur-oss-github]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    uses: zeabur-oss/.github/.github/workflows/pins.yml@0c71bf4017582c7cabe03d79842254694964a385 # main
    secrets:
      private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
