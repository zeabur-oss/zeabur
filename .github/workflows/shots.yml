name: Screenshots

# Takes the docs screenshots (web/e2e/shots/docs.ts) again for each release: when zeabur-oss-bot
# pushes release/next, the release pull request's branch, this runs next to its CI and commits the
# images that changed onto release/next, so the release carries them. A release does not wait for
# it (docs/internal/screenshots.md, docs/internal/releasing.md). It pushes as the organization's
# GitHub App (`ZEABUR_OSS_BOT_CLIENT_ID`, `ZEABUR_OSS_BOT_PRIVATE_KEY`), because a push made with
# GITHUB_TOKEN does not start CI again.

on:
  push:
    branches: [release/next]
    # Its own commit changes only docs; that needs no second run.
    paths-ignore: [docs/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  shots:
    if: github.ref == 'refs/heads/release/next'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04-arm' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      # No build cache: a cache restored into a run that pushes to the release branch could poison it.
      - run: nix develop --command scripts/docs-shots.sh docs
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
          permission-contents: write
      # The commit's author must match its sign-off (the DCO check). A plain push fails when
      # release/next moved meanwhile; the next run takes the screenshots again.
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "No screenshot changed."
            exit 0
          fi
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit --quiet --signoff -m "docs: take the screenshots again"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/release/next
