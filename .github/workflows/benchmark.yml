name: Benchmark

# Run by hand: runs the CI jobs that can run on Instabox on each runner in `runners`, `repetitions`
# times, with the caches of main, and writes the wait and run time of each job and runner to the
# run's summary (scripts/benchmark-report.sh). `machine` writes what each runner has: the CPU,
# memory and disk, Docker, /dev/kvm and a k3d cluster. Run it on main, once to fill the caches of
# a new runner and then to measure.
# instabox-large is only a comparison: a CI job uses it only when its run there is shorter than on
# the GitHub runner.
on:
  workflow_dispatch:
    inputs:
      runners:
        description: JSON array of runner labels
        default: '["ubuntu-26.04-arm", "instabox-small", "instabox-medium", "instabox-large"]'
      repetitions:
        description: Runs of each job on each runner
        default: "3"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repetitions:
    runs-on: ubuntu-slim
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          N: ${{ inputs.repetitions }}
        run: echo "list=$(jq -cn --argjson n "$N" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  machine:
    name: machine ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
      - env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: nix develop -c scripts/runner-facts.sh

  lint:
    needs: repetitions
    name: lint ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/lint.sh

  test:
    needs: repetitions
    name: test ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/test.sh

  ui:
    needs: repetitions
    name: ui ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/ui.sh

  no-ui:
    needs: repetitions
    name: no-ui ${{ matrix.runner }} ${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
        rep: ${{ fromJSON(needs.repetitions.outputs.list) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/no-ui.sh

  report:
    if: always()
    needs: [machine, lint, test, ui, no-ui]
    runs-on: ubuntu-slim
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/benchmark-report.sh
