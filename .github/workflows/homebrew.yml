name: Homebrew

# Publishes the Homebrew formula and cask for a release to the zeabur-oss/homebrew-tap repository
# (docs/internal/releasing.md#homebrew). generate writes them from the release's signed
# SHA256SUMS, check installs them on macOS and Linux from a copy of the tap, and only then does
# publish commit them to the tap's main, so a broken file never lands. The push uses the
# organization's GitHub App (`ZEABUR_OSS_BOT_CLIENT_ID`, `ZEABUR_OSS_BOT_PRIVATE_KEY`), which
# needs the tap repository.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "A published release to move the formula and the cask to (v0.3.0)"
        required: true

permissions: {}

concurrency:
  group: homebrew
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  generate:
    runs-on: instabox-small
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
      - name: Write the formula and the cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/sums" \
            --pattern SHA256SUMS --pattern SHA256SUMS.sigstore.json
          nix develop --command bun install --frozen-lockfile
          nix develop --command bun scripts/homebrew.ts "$VERSION" "$RUNNER_TEMP/sums" "$RUNNER_TEMP/tap-files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew
          path: ${{ runner.temp }}/tap-files
          if-no-files-found: error

  check:
    needs: generate
    name: check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions: {}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew
          path: ${{ runner.temp }}/tap-files
      # brew taps a repository's commits, so the copy is committed first.
      - name: Tap a copy of the tap with the new files
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$HOMEBREW_PREFIX/bin" >> "$GITHUB_PATH"
          fi
          git clone --quiet https://github.com/zeabur-oss/homebrew-tap.git "$RUNNER_TEMP/tap"
          cp -R "$RUNNER_TEMP/tap-files/." "$RUNNER_TEMP/tap/"
          git -C "$RUNNER_TEMP/tap" add -A
          git -C "$RUNNER_TEMP/tap" -c user.name=ci -c user.email=ci@invalid commit --quiet --allow-empty -m check
          brew tap zeabur-oss/tap "$RUNNER_TEMP/tap"
      # Installing by the full name trusts it, as it does for people, so audit comes after.
      - name: Install and test zeaburctl
        run: |
          brew style zeabur-oss/tap/zeaburctl
          brew install zeabur-oss/tap/zeaburctl
          brew audit --strict zeabur-oss/tap/zeaburctl
          brew test zeabur-oss/tap/zeaburctl
      - name: Install Zeabur Desktop
        if: runner.os == 'macOS'
        run: |
          # A release without the macOS app has no cask.
          [[ -f "$RUNNER_TEMP/tap-files/Casks/zeabur-desktop.rb" ]] || exit 0
          brew style --cask zeabur-oss/tap/zeabur-desktop
          brew install --cask zeabur-oss/tap/zeabur-desktop
          brew audit --strict --cask zeabur-oss/tap/zeabur-desktop
          spctl --assess --type execute -vv /Applications/Zeabur.app

  publish:
    needs: check
    runs-on: instabox-small
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew
          path: ${{ runner.temp }}/tap-files
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.ZEABUR_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ZEABUR_OSS_BOT_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write
      # The commit's author must match its sign-off (the DCO check). A plain push fails when main
      # moved meanwhile; run the workflow again.
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/zeabur-oss/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cp -R "$RUNNER_TEMP/tap-files/." .
          git add -A
          if git diff --cached --quiet; then
            echo "The tap already has ${VERSION}."
            exit 0
          fi
          id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git -c user.name="${APP_SLUG}[bot]" -c user.email="${id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit --quiet --signoff -m "zeabur ${VERSION}"
          git push origin HEAD:main
