name: CI

# Every job of `scripts/ci.sh --list`, each as `scripts/ci.sh <job>`, through the shared CI workflow
# of zeabur-oss/.github: it only checks out, installs Nix and restores caches. A job runs the same
# on any Linux machine with Nix (scripts/ci-local.sh).
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI on the commit it releases.
  workflow_call:

permissions:
  contents: read

# Called from the release workflow, `github.workflow` is the caller's name; the prefix keeps this
# group apart from the caller's own (group names ignore case).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
    with:
      rust-cache: true
      # `fallow audit` in the ui job compares HEAD with HEAD^.
      fetch-depth: 2
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@9d500376d4e7202c9343656fb6b85dc2eba26dd3 # main
