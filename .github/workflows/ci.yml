name: CI

# Every job of `scripts/ci.sh --list`, each as `scripts/ci.sh <job>`, through the shared CI workflow
# of zeabur-oss/.github: it only checks out, installs Nix and restores caches. A job runs the same
# on any Linux machine with Nix (scripts/ci-local.sh).
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: zeabur-oss/.github/.github/workflows/ci.yml@07053982f99078683ff95ebb5003d5223420aa2e # main
    with:
      rust-cache: true
      # `fallow audit` in the ui job compares HEAD with HEAD^.
      fetch-depth: 2
  dco:
    uses: zeabur-oss/.github/.github/workflows/dco.yml@07053982f99078683ff95ebb5003d5223420aa2e # main
