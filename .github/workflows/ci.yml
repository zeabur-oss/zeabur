name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally, except docs, which
# runs the website's check of docs/ (locally: bun scripts/docs-check.ts <this checkout> in the
# website), and zeaburctl-windows, which runs zeaburctl's release scripts outside the shell. Pull
# requests and pushes run lint, test, ui, desktop and docs, and zeaburctl-windows when a pull request
# changes how zeaburctl builds. The merge queue runs the jobs that gate a merge on the commit about
# to land. The nightly run runs everything, also fuzz and the canary, which are not in the merge
# queue, and keeps main's caches for the merge queue's jobs. A failed nightly-only job (fuzz,
# canary, e2e-full, zeaburctl-windows) opens or updates one issue (scripts/nightly-issues.sh),
# and closes it when the job passes again. Jobs that compile Rust run on instabox-medium, the others on instabox-small.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/api-break.ts reads the commits since the base for a `BREAKING CHANGE:` footer.
          fetch-depth: 0
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c bun install --frozen-lockfile
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsafe-report
          path: target/unsafe-report.md
          if-no-files-found: ignore
          retention-days: 14

  test:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/test.sh

  ui:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fallow audit compares HEAD with HEAD^.
          fetch-depth: 2
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/ui.sh

  # desktop/, its own Cargo workspace, with the main workspace's rules (scripts/check-desktop.sh).
  desktop:
    runs-on: instabox-medium
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop .#desktop -c scripts/ci/desktop.sh

  # Four to six minutes, set up included: nightly and by hand, not in the merge queue.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: instabox-medium
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/fuzz.sh

  no-ui:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/no-ui.sh

  wording:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: instabox-small
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      # zhtw-mcp builds from source; main's scheduled run keeps it, keyed on the lock file.
      - id: zhtw-mcp
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zhtw-mcp-store
          key: zhtw-mcp-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
      # Root trusts the unsigned local store.
      - if: steps.zhtw-mcp.outputs.cache-hit == 'true'
        run: sudo "$(command -v nix)" copy --no-check-sigs --from "file://$HOME/.cache/zhtw-mcp-store" --all
      - run: nix develop .#zh -c scripts/ci/wording.sh
      - if: github.ref == 'refs/heads/main' && steps.zhtw-mcp.outputs.cache-hit != 'true'
        run: nix copy --to "file://$HOME/.cache/zhtw-mcp-store" "$(nix build .#zhtw-mcp --no-link --print-out-paths)"
      - if: github.ref == 'refs/heads/main' && steps.zhtw-mcp.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zhtw-mcp-store
          key: zhtw-mcp-${{ runner.arch }}-${{ hashFiles('flake.lock') }}

  cluster:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/cluster.sh

  e2e:
    if: github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/e2e.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-measurements
          path: target/dev-cluster/measurements.json
          if-no-files-found: ignore
          retention-days: 14

  # The specs the default cluster skips (Git, upload and database deploys, which need Zeabur Builder
  # and the database operators): nightly and by hand.
  e2e-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/e2e-full.sh

  # Zeabur Proxy against the real VictoriaLogs: nightly and by hand.
  canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/canary.sh

  # zeaburctl for Windows as release.yml's zeaburctl-build builds it, unsigned, then run from its
  # archive as release.yml's verify runs it: nightly, by hand, and on a pull request that changes
  # how it builds. The build is outside the Nix shell, which has no Windows toolchain; this job
  # prepares what it needs from the shell.
  zeaburctl-windows-inputs:
    if: github.event_name != 'merge_group' && !(github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: instabox-small
    timeout-minutes: 30
    outputs:
      run: ${{ steps.changed.outputs.run }}
      version: ${{ steps.versions.outputs.version }}
      toolchain: ${{ steps.versions.outputs.toolchain }}
      cargo-auditable: ${{ steps.versions.outputs.cargo-auditable }}
      catalog-commit: ${{ steps.versions.outputs.catalog-commit }}
    steps:
      - id: changed
        name: Whether this run builds zeaburctl for Windows
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            run=false
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            while read -r file; do
              case "$file" in
                scripts/release-build-zeaburctl.sh | scripts/release-pack.sh | \
                  scripts/azure-signtool.sh | scripts/release-verify-windows.sh | \
                  .github/workflows/release.yml | .github/workflows/ci.yml) run=true ;;
              esac
            done <<<"$files"
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.changed.outputs.run == 'true'
        uses: zeabur-oss/.github/actions/ci-setup@395adf27d31c77538ebf7c154946b52822387b96 # main
      - if: steps.changed.outputs.run == 'true'
        uses: ./.github/actions/catalog-release
      - id: versions
        if: steps.changed.outputs.run == 'true'
        run: nix develop .#desktop -c scripts/ci/desktop-inputs.sh | tee -a "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeaburctl-windows-inputs
          path: |
            web/dist/
            target/desktop-inputs/
          if-no-files-found: error
          retention-days: 1

  zeaburctl-windows:
    needs: zeaburctl-windows-inputs
    if: needs.zeaburctl-windows-inputs.outputs.run == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.zeaburctl-windows-inputs.outputs.version }}
      RUSTUP_TOOLCHAIN: ${{ needs.zeaburctl-windows-inputs.outputs.toolchain }}
      ZEABUR_CATALOG_COMMIT: ${{ needs.zeaburctl-windows-inputs.outputs.catalog-commit }}
      ZEABUR_CATALOG_RELEASE: ${{ github.workspace }}/target/desktop-inputs/catalog
      ZEABUR_UI_DIST: ${{ github.workspace }}/web/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zeaburctl-windows-inputs
      - env:
          CARGO_AUDITABLE: ${{ needs.zeaburctl-windows-inputs.outputs.cargo-auditable }}
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-auditable --version "=$CARGO_AUDITABLE" --locked
      - run: scripts/release-build-zeaburctl.sh compile "$VERSION" windows amd64 dist
      - run: scripts/release-build-zeaburctl.sh package "$VERSION" windows amd64 dist
      - run: scripts/release-verify-windows.sh "$VERSION" dist

  # One issue for each failing nightly job, opened or updated while it fails, closed when it passes.
  nightly-issues:
    if: always() && github.event_name == 'schedule'
    needs: [fuzz, canary, e2e-full, zeaburctl-windows]
    runs-on: instabox-small
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/nightly-issues.sh

  docs:
    runs-on: instabox-small
    timeout-minutes: 10
    steps:
      - uses: zeabur-oss/website/.github/actions/docs-check@c116a11cf3e0b0c940b50d962457c565881fb95a # main

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs:
      [lint, test, ui, desktop, fuzz, canary, no-ui, wording, cluster, e2e, e2e-full, zeaburctl-windows, docs]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
