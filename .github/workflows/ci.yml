name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally. Pull requests and
# pushes run lint, test and ui. The merge queue runs the jobs that gate a merge on the commit about
# to land. The nightly run runs everything, also fuzz and the canary, which are not in the merge
# queue, and keeps main's caches for the merge queue's jobs. A failed nightly-only job (fuzz,
# canary, e2e-full) opens or updates one issue (scripts/nightly-issues.sh), and closes it when the
# job passes again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/lint.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsafe-report
          path: target/unsafe-report.md
          if-no-files-found: ignore
          retention-days: 14

  test:
    runs-on: instabox-small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/test.sh

  ui:
    runs-on: instabox-small
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # fallow audit compares HEAD with HEAD^.
          fetch-depth: 2
      - uses: zeabur-oss/.github/actions/ci-setup@c43a5d36ad39f938de24e0b59109c82a20f6265a # main
        with:
          rust-cache: true
      - uses: ./.github/actions/catalog-release
      - run: nix develop -c scripts/ci/ui.sh
