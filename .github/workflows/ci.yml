name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI on the commit it releases.
  workflow_call:

permissions:
  contents: read

# Called from the release workflow, `github.workflow` is the caller's name; the prefix keeps this
# group apart from the caller's own (group names ignore case).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  # Every job's checks are in scripts/ci.sh, which runs the same on any Linux machine with Nix
  # (scripts/ci-local.sh); the jobs here only check out, install Nix and restore caches.
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
          - name: clippy
          - name: docs
          - name: test
          - name: cargo-deny
          - name: unsafe-report
          - name: levels
          - name: ui
          - name: no-ui
          - name: chart
          # zhtw-mcp builds from source in a dev shell of its own and needs no Rust cache.
          - name: wording
            no-rust: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      # rust-cache keys on `rustc -vV`: put the pinned toolchain from the dev shell on PATH first,
      # otherwise it fails ("Command failed: rustc -vV") or keys on the image's rustc.
      - if: ${{ !matrix.no-rust }}
        run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - if: ${{ !matrix.no-rust }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - run: ./scripts/ci.sh ${{ matrix.name }}
      - if: matrix.name == 'unsafe-report' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsafe-report
          path: target/unsafe-report.md

  kubernetes:
    name: kubernetes (k3s ${{ matrix.k3s }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        k3s: [v1.36.5-k3s1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: kubernetes
      - name: Integration tests, engawactl doctor, browser tests, image
        env:
          K3S_IMAGE: rancher/k3s:${{ matrix.k3s }}
        run: ./scripts/ci.sh kubernetes
      - name: Report sizes
        if: always()
        run: |
          {
            echo "### Sizes (k3s ${{ matrix.k3s }})"
            echo "| Measure | Bytes |"
            echo "|---|---|"
            echo "| Image \`engawa:ci\` | $(docker image inspect --format '{{.Size}}' engawa:ci 2>/dev/null || echo n/a) |"
          } >> "$GITHUB_STEP_SUMMARY"

  kubernetes-l2:
    name: kubernetes-l2 (k3s ${{ matrix.k3s }})
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        k3s: [v1.36.5-k3s1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: kubernetes-l2
      - id: genkan
        run: echo "rev=$(tr -d '[:space:]' < GENKAN_PINNED)" >> "$GITHUB_OUTPUT"
      # Full history: scripts/e2e-l2.sh reads it as `git+file://…?rev=`, and Nix's git fetcher
      # refuses a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: engawahq/genkan
          ref: ${{ steps.genkan.outputs.rev }}
          path: .genkan
          fetch-depth: 0
          persist-credentials: false
      - name: End-to-end test (passkey sign-in, elevation, terminal, rights, memory, removal)
        env:
          GENKAN_SRC: ${{ github.workspace }}/.genkan
          K3S_IMAGE: rancher/k3s:${{ matrix.k3s }}
        run: ./scripts/ci.sh kubernetes-l2
      - name: Report memory
        if: always()
        run: |
          {
            echo "### engawa in the cluster (k3s ${{ matrix.k3s }})"
            echo "| Measure | Bytes |"
            echo "|---|---|"
            echo "| Pod working set after 60 s idle | $(jq -r .pod_working_set_bytes target/e2e-l2/measurements.json 2>/dev/null || echo n/a) |"
          } >> "$GITHUB_STEP_SUMMARY"

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
