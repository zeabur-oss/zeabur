[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/zeabur-oss/zeabur"
publish = false

# Lint policy (see CONTRIBUTING.md).
# Everything is `warn` so work in progress still compiles; CI runs with `-D warnings`.

# Crate levels, checked by scripts/check-levels.sh: a crate may depend (normal and build
# dependencies) only on workspace crates of a lower level. Test crates are dev-dependencies only.
# (Levels order crates; the product layers L0-L4 in docs/reference/architecture.mdx are a different thing.)
[workspace.metadata.levels]
zeabur-core = 1
zeabur-model = 0
zeabur-embed = 0
zeabur-ui = 1
zeabur-kube = 2
zeabur-proxy = 1
zeabur-auth = 2
zeabur-graph = 2
zeabur-modules = 3
zeabur-gaps = 3
zeabur-plan = 3
zeabur-catalog = 3
zeabur-api = 4
zeabur = 5
zeaburctl = 5
zeabur-test-support = 6
zeabur-installer-plan = 0
zeabur-installer-host = 1
zeabur-installer = 5
# Development tasks (`cargo xtask`); nothing depends on it.
xtask = 7

# Integrations with installed components (see zeabur-modules' README), also checked by
# scripts/check-levels.sh: only the composers may depend on a module crate, so the core crates
# never know which modules a build has.
[workspace.metadata.modules]
crates = ["zeabur-modules"]
composers = ["zeabur-api", "zeabur", "zeaburctl"]

# Crates that run as their own component with a small trusted base, also checked by
# scripts/check-levels.sh: each may depend only on the workspace crates listed for it.
[workspace.metadata.isolated]
zeabur-proxy = []

# Crates with no I/O and no key, also checked by scripts/check-levels.sh: a pure crate depends only on pure workspace crates.
[workspace.metadata.pure]
crates = [
  "zeabur-model",
  "zeabur-graph",
  "zeabur-gaps",
  "zeabur-plan",
]

[workspace.dependencies]
# Workspace crates, levelled from the bottom up.
zeabur-core = { path = "crates/zeabur-core" }
zeabur-model = { path = "crates/zeabur-model" }
zeabur-kube = { path = "crates/zeabur-kube" }
zeabur-graph = { path = "crates/zeabur-graph" }
zeabur-gaps = { path = "crates/zeabur-gaps" }
zeabur-catalog = { path = "crates/zeabur-catalog" }
zeabur-modules = { path = "crates/zeabur-modules" }
zeabur-plan = { path = "crates/zeabur-plan" }
zeabur-api = { path = "crates/zeabur-api" }
zeabur-ui = { path = "crates/zeabur-ui" }
zeabur-auth = { path = "crates/zeabur-auth" }
zeabur-test-support = { path = "crates/zeabur-test-support" }
zeabur-embed = { path = "crates/zeabur-embed" }
zeabur-installer-plan = { path = "crates/zeabur-installer-plan" }
zeabur-installer-host = { path = "crates/zeabur-installer-host" }

# Third-party crates.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "alloc", "ring-io"] }
# Already in the binary through k8s-openapi; Secret values are base64 on the wire.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# The htpasswd hash of a basic auth password (zeabur-plan); Traefik reads bcrypt.
bcrypt = { version = "0.19", default-features = false, features = ["alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing", "json", "ws"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
# Unpacking the RKE2 release and packing a local chart (zeabur-installer-host), and reading
# Velero backups (zeabur-api).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "io", "async-await-macro"] }
hex = "0.4"
http = "1"
http-body = "1"
http-body-util = "0.1"
# The HTTP client stack kube-rs already ships, used directly for the OAuth client (zeabur-auth).
bytes = "1"
# Generate the embedded interfaces' file tables (zeabur-embed and the build scripts using it).
proc-macro2 = "1"
quote = "1"
# Decodes the embedded interface for a client without brotli (zeabur-ui); decoder only.
brotli-decompressor = { version = "6.1", default-features = false, features = ["std"] }
hyper = { version = "1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "aws-lc-rs"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
# The read and write timeouts of kube-rs's default client (zeabur-kube).
hyper-timeout = "0.5"
# Certificates for the TLS tests (zeabur-test-support).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
time = { version = "0.3", default-features = false, features = ["std"] }
# The TLS listener of zeabur-proxy; already under hyper-rustls.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws_lc_rs"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_34"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "aws-lc-rs", "ws"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# The input patterns of Zeabur Catalog templates (RE2 syntax), checked before a template renders.
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
# Process settings that keep a person's tokens out of core dumps (zeabur-core's `secret`).
rustix = { version = "1", default-features = false, features = ["std", "process"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = "1"
# SHA-256 for derived names in the pure crates (zeabur-model), which hold no C library.
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
# A WebSocket client for the terminal's tests; the server side comes with axum's `ws` feature.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# The request tracing of kube-rs's default client (zeabur-kube).
tower-http = { version = "0.7", default-features = false, features = ["trace"] }
tracing = "0.1"
# OpenAPI from the code. Reviewed 2026-10-28 (zeabur-api README): no `yaml` feature (it pulls a
# c2rust libyaml); the spec is written with serde-saphyr. Never enable `config`.
utoipa = { version = "=6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "=0.3.0"
# The installer's downloads: rustls with aws-lc-rs and the system's CA store. ureq's own `rustls`
# feature would bring ring and webpki-roots, both banned in deny.toml.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
unit_bindings = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Duplicate versions are tracked by cargo-deny, not clippy.
multiple_crate_versions = "allow"
# Contradicts rustc's `unreachable_pub`, which we keep: items are `pub(crate)` unless exported.
redundant_pub_crate = "allow"

# Selected `restriction` lints.
# Panics on attacker-controlled input are a denial-of-service bug in a server.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
# Security-relevant logic must handle every case explicitly.
wildcard_enum_match_arm = "warn"
# Errors must keep their cause.
map_err_ignore = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
unused_result_ok = "warn"
# Suppressions must be explicit and justified.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Output goes through `tracing`; the CLI writes through one audited module.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Hygiene.
clone_on_ref_ptr = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
mem_forget = "warn"
mod_module_files = "warn"
multiple_inherent_impl = "warn"
partial_pub_fields = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
verbose_file_reads = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
