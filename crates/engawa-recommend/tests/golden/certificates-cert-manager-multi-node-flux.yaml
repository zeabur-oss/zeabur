# Profile: multi-node. Commit to the repository Flux reconciles.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: oci://quay.io/jetstack/charts/cert-manager
  ref:
    tag: v1.21.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cert-manager
  targetNamespace: cert-manager
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: cert-manager
  values:
    cainjector:
      podDisruptionBudget:
        enabled: true
      replicaCount: 2
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      enableGatewayAPI: true
      kind: ControllerConfiguration
    crds:
      enabled: true
      keep: true
    enableCertificateOwnerRef: true
    podDisruptionBudget:
      enabled: true
    replicaCount: 2
    webhook:
      podDisruptionBudget:
        enabled: true
      replicaCount: 2
