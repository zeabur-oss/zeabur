# On k3s, first disable the packaged metrics-server: add it to `disable` in
# /etc/rancher/k3s/config.yaml on every server, then restart k3s.
# The metrics API is unavailable until this one runs.
# https://docs.k3s.io/installation/packaged-components
# Profile: single-node. Commit to the repository Flux reconciles.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/metrics-server
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  releaseName: metrics-server
  targetNamespace: kube-system
  install:
    createNamespace: true
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  values:
    args:
    - --metric-resolution=15s
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 48Mi
