[package]
name = "zeabur-ui"
description = "zeabur: the embedded web interface and the handler that serves it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Zeabur's own web interface (`ZEABUR_UI_DIST`), with `router`, `assets` and `is_page`. Without it,
# the crate serves only a table another crate embeds (the installer's page).
interface = []

[dependencies]
axum.workspace = true
brotli-decompressor.workspace = true

[build-dependencies]
proc-macro2.workspace = true
quote.workspace = true
zeabur-embed.workspace = true

[dev-dependencies]
tower.workspace = true
zeabur-core.workspace = true
tokio.workspace = true
