displayName: VictoriaMetrics (k8s stack)
homepage: https://victoriametrics.com
license: Apache-2.0
maturity: independent
rationale: >
  Keeps metrics history and evaluates alerts with a fraction of Prometheus'
  memory. On one node it idles at about 220Mi with node-exporter, more as
  pods add series.
alternatives:
  metrics-server: Serves live CPU and memory only; it is installed alongside for the metrics API.
  kube-prometheus-stack: An existing installation is reused, but its memory use keeps it from being recommended.
defaults:
  single-node: recommended
  multi-node: recommended
persistsData: true
dependsOn: [observability-operator/victoria-metrics-operator]

releases:
  - name: k8s-stack
    namespace: observability
    releaseName: vm
    chart: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
    version: 0.95.2
    values: |
      victoria-metrics-operator:
        # The operator is its own component, shared with logs.
        enabled: false
      grafana:
        # Grafana adds ~150Mi; install it separately if needed.
        enabled: false
      defaultDashboards:
        # Dashboards only matter with Grafana.
        enabled: false
      kube-state-metrics:
        # Maps pods to workloads and exposes requests, limits and object state.
        enabled: true
      vmagent:
        spec:
          # 30s cuts scrape cost by a third versus the chart's 20s.
          scrapeInterval: 30s
    profiles:
      single-node: |
        prometheus-node-exporter:
          # Node disk use (node_filesystem_*) has no other source; Zeabur reads it.
          enabled: true
          extraArgs:
            # Only the collectors the default node-exporter, node and kubernetes rules query.
            - --collector.disable-defaults
            - --collector.filesystem
            - --collector.cpu
            - --collector.meminfo
            - --collector.loadavg
            - --collector.vmstat
            - --collector.diskstats
            - --collector.netdev
            - --collector.netclass
            - --collector.filefd
            - --collector.conntrack
            - --collector.timex
            - --collector.mdadm
            - --collector.bonding
            - --collector.textfile
            # The chart's excludes plus containerd's per-pod shm mounts (k3s keeps them under /run/k3s).
            # /var/lib/kubelet itself stays visible; only mounts below it are dropped.
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|run/k3s/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
            - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs)$
          resources:
            # One small exporter per node.
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
        kube-state-metrics:
          # Only the objects needed to map pods to workloads.
          collectors: [pods, replicasets, deployments, statefulsets, daemonsets, jobs, cronjobs, nodes, persistentvolumeclaims, namespaces]
          metricLabelsAllowlist:
            - pods=[app.kubernetes.io/name,app.kubernetes.io/component]
        kubeControllerManager:
          # Embedded in k3s; nothing to scrape.
          enabled: false
        kubeScheduler:
          # Embedded in k3s; nothing to scrape.
          enabled: false
        kubeEtcd:
          # k3s single-node uses SQLite (kine), not etcd.
          enabled: false
        kubeApiServer:
          # Its histograms are ~half of all series; its alert rules go with it.
          enabled: false
        kubelet:
          vmScrape:
            spec:
              metricRelabelConfigs:
                # Chart defaults: UIDs and cgroup ids only multiply series.
                - action: labeldrop
                  regex: (uid)
                - action: labeldrop
                  regex: (id|name)
                # k3s kubelet also exports API server and kine histograms (~45% of series).
                - action: drop
                  source_labels: [__name__]
                  regex: .+_bucket|(apiserver|etcd|kine|rest_client|workqueue|scheduler|authentication|authorization|aggregator|admission|watch_cache|storage)_.+
        vmsingle:
          spec:
            # A week of history fits 5Gi on one node.
            retentionPeriod: 7d
            storage:
              resources:
                requests: {storage: 5Gi}
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 512Mi}
        vmagent:
          spec:
            # Small scrape set on one node.
            resources:
              requests: {cpu: 20m, memory: 64Mi}
              limits: {memory: 256Mi}
        vmalert:
          spec:
            # Evaluates the default alert rules.
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
        alertmanager:
          spec:
            # Routes alerts to configured receivers.
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
      multi-node: |
        prometheus-node-exporter:
          # Node disk and network metrics for capacity planning.
          enabled: true
        vmsingle:
          spec:
            # Two weeks of history; the volume is sized for it.
            retentionPeriod: 14d
            storage:
              resources:
                requests: {storage: 20Gi}
            resources:
              requests: {cpu: 100m, memory: 512Mi}
              limits: {memory: 2Gi}
        vmagent:
          spec:
            # More targets across nodes.
            resources:
              requests: {cpu: 50m, memory: 128Mi}
              limits: {memory: 1Gi}

detection:
  crds: [vmsingles.operator.victoriametrics.com]
  helmCharts: [victoria-metrics-k8s-stack]

security:
  summary: Manages VictoriaMetrics objects and scrapes pods in all namespaces.
  clusterWide: true
  tenants: admin-only
  tenantCRDs: [VMServiceScrape, VMPodScrape, VMRule, VMProbe]
  risks:
    - risk: VMRule and PrometheusRule queries see every tenant's metrics.
      mitigation: Keep rules admin-only until vmalert enforces a namespace label.
    - risk: Probe targets can reach any address (SSRF), including cloud metadata.
      mitigation: Admit only the namespace's own hostnames or public URLs with an admission policy.
    - risk: Scrape objects can select pods in other namespaces.
      mitigation: Restrict tenant scrapes to their own namespace with an admission policy.

leftovers: [persistentvolumeclaims]

smoke:
  - name: vmsingle-operational
    wait: ["-n observability vmsingle --all --for=jsonpath={.status.updateStatus}=operational"]
