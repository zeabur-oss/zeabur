displayName: CloudNativePG
homepage: https://cloudnative-pg.io
license: Apache-2.0
maturity: cncf-sandbox
rationale: >
  Runs PostgreSQL clusters from a Cluster object in the tenant's namespace:
  replicas, failover, and backups to S3 through the Barman Cloud plugin.
alternatives:
  percona-mongodb: MongoDB, not PostgreSQL.
defaults:
  single-node: optional
  multi-node: optional
# The Barman Cloud plugin talks to the operator over mTLS from cert-manager.
dependsOn: [certificates]
persistsData: true

releases:
  - name: cloudnative-pg
    namespace: cnpg-system
    releaseName: cnpg
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    version: 0.29.1
    values: |
      config:
        # Reconcile Clusters in every namespace.
        clusterWide: true
      monitoring:
        # No Prometheus operator assumed; metrics stay on the pod port.
        podMonitorEnabled: false
        grafanaDashboard:
          create: false
    profiles:
      single-node: |
        resources:
          # Idles near 25Mi; grows with Clusters. Chart sets none.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      multi-node: |
        # Leader election keeps one active; the webhook stays up during drains.
        replicaCount: 2
        resources:
          # More Clusters to watch.
          requests: {cpu: 20m, memory: 128Mi}
          limits: {memory: 512Mi}

  # Must share the operator's namespace; it registers itself with the operator.
  - name: plugin-barman-cloud
    namespace: cnpg-system
    repo: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    version: 0.8.1
    values: |
      certificate:
        # Self-signed issuer for the operator-plugin mTLS, made by the chart.
        createIssuer: true
    profiles:
      single-node: |
        resources:
          # Idles near 15Mi; backups run in the instance sidecar, not here.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      multi-node: |
        resources:
          # Same work; more Clusters to serve.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}

detection:
  crds: [clusters.postgresql.cnpg.io, objectstores.barmancloud.cnpg.io]
  helmCharts: [cloudnative-pg, plugin-barman-cloud]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: cloudnative-pg}
    - kind: Deployment
      labels: {app.kubernetes.io/name: plugin-barman-cloud}

security:
  summary: Manages pods, Services, Secrets and PVCs for Clusters in every namespace.
  clusterWide: true
  credentials: optional
  credentialsNote: Backups need S3 credentials, stored as a Secret in the tenant namespace.
  tenants: namespaced
  tenantCRDs: [Cluster, Backup, ScheduledBackup, Pooler, Database, ObjectStore]
  risks:
    - risk: >
        ObjectStore inheritFromIAMRole, inheritFromAzureAD, useDefaultAzureCredentials
        and gkeEnvironment use the node's or pod's cloud identity, not the tenant's.
      mitigation: Require explicit credentials with an admission policy where nodes carry a cloud identity.
    - risk: externalClusters and bootstrap from pg_basebackup or recovery can pull data from any reachable host.
      mitigation: NetworkPolicies between namespaces; the credentials still come from the tenant's own Secrets.
    - risk: imageName and imageCatalogRef run any image as the database.
      mitigation: It runs under the namespace's Pod Security level, as any tenant pod does.
    - risk: managed.services can add LoadBalancer Services that expose the database.
      mitigation: Restrict LoadBalancer Services with the same policy used for other workloads.

leftovers: [customresourcedefinitions]

smoke:
  - name: one-instance-cluster
    manifest: |
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        instances: 1
        storage: {size: 1Gi}
    wait: ["-n catalog-smoke cluster/smoke --for=condition=Ready"]
    # initdb pulls the PostgreSQL image first.
    timeout: 600s
  - name: object-store
    manifest: |
      apiVersion: barmancloud.cnpg.io/v1
      kind: ObjectStore
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        retentionPolicy: 7d
        configuration:
          destinationPath: s3://smoke/
          endpointURL: http://s3.invalid:9000
          s3Credentials:
            accessKeyId: {name: smoke-s3, key: ACCESS_KEY_ID}
            secretAccessKey: {name: smoke-s3, key: ACCESS_SECRET_KEY}
    wait: ["-n cnpg-system deployment/plugin-barman-cloud --for=condition=Available"]

upgradeNotes:
  - versions: "*"
    note: Upgrade the Barman Cloud plugin with the operator; check the plugin's supported operator versions.
