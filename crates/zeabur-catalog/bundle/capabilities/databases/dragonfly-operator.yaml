displayName: Dragonfly Operator
homepage: https://www.dragonflydb.io/docs/managing-dragonfly/operator/installation
# The operator is Apache-2.0; the Dragonfly images it runs are BUSL-1.1, which
# is not OSI-approved.
license: Apache-2.0 AND BUSL-1.1
maturity: independent
rationale: >
  Runs Dragonfly, a Redis-compatible in-memory store, from a Dragonfly object
  in the tenant's namespace: a primary with replicas, failover, and snapshots
  to a volume or S3. Dragonfly is source-available, so it is never on by default.
defaults:
  single-node: optional
  multi-node: optional
persistsData: true

releases:
  - name: dragonfly-operator
    namespace: dragonfly-operator-system
    chart: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
    version: v1.7.1
    values: |
      crds:
        # The chart's default, stated: CRDs outlive the release, and with them
        # every Dragonfly object.
        keep: true
      # Restricted Pod Security; the chart sets only runAsNonRoot.
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
    profiles:
      single-node: |
        manager:
          resources:
            # The chart sets none; grows with Dragonfly objects.
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
        rbacProxy:
          resources:
            # Guards the metrics port; the chart asks for 64Mi.
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
      multi-node: |
        # Leader election keeps one active; survives a drain.
        replicaCount: 2
        podDisruptionBudget:
          # Keeps one replica through voluntary evictions.
          enabled: true
        manager:
          resources:
            # More Dragonfly objects to reconcile.
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
        rbacProxy:
          resources:
            # Guards the metrics port; the chart asks for 64Mi.
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}

detection:
  crds: [dragonflies.dragonflydb.io]
  helmCharts: [dragonfly-operator]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: dragonfly-operator}

security:
  summary: Manages pods, StatefulSets, Services and PDBs for Dragonfly objects in every namespace.
  clusterWide: true
  egress: [docker.dragonflydb.io, quay.io]
  credentials: optional
  credentialsNote: S3 snapshots need credentials, stored as a Secret in the tenant namespace.
  tenants: namespaced
  tenantCRDs: [Dragonfly]
  risks:
    - risk: >
        Dragonfly is BUSL-1.1 until four years after each release. Its
        Additional Use Grant excludes offering it to third parties as a
        hosted or managed service, or as an in-memory data store product.
      mitigation: >
        Fine for running a team's own applications; a provider selling
        databases to others needs a licence from DragonflyDB or a
        BSD-licensed engine such as Valkey. Show the licence before install.
    - risk: >
        Dragonfly pods start as root and drop to UID 999 themselves, with no
        seccomp profile, unless the object sets podSecurityContext and
        containerSecurityContext.
      mitigation: Set both on each Dragonfly (see the smoke test); restricted namespaces reject the pods otherwise.
    - risk: Without spec.authentication, any pod that reaches the Service can read and write every key.
      mitigation: Set authentication.passwordFromSecret, and NetworkPolicies between namespaces.
    - risk: The admin port 9999 has no TLS and no authentication.
      mitigation: It is not on the Service; a NetworkPolicy can close it to other pods.

leftovers: [customresourcedefinitions]

smoke:
  - name: one-instance
    manifest: |
      # Proves Dragonfly runs under restricted Pod Security.
      apiVersion: v1
      kind: Namespace
      metadata:
        name: catalog-smoke
        labels: {pod-security.kubernetes.io/enforce: restricted}
      ---
      apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        replicas: 1
        args: ["--proactor_threads=1"]
        resources:
          requests: {cpu: 50m, memory: 256Mi}
          limits: {memory: 512Mi}
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 999
          fsGroup: 999
          seccompProfile: {type: RuntimeDefault}
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
    wait: ["-n catalog-smoke dragonfly/smoke --for=jsonpath={.status.phase}=Ready"]
    # Pulls the Dragonfly image first.
    timeout: 600s

upgradeNotes:
  - versions: "*"
    note: >
      A new operator rolls Dragonfly pods to its default image unless spec.image
      pins one; pin it in each object to upgrade Dragonfly on your own schedule.
