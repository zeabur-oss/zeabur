displayName: KEDA
homepage: https://keda.sh
license: Apache-2.0
maturity: cncf-graduated
rationale: >
  Scales workloads on events, down to zero, with scaling configured per
  namespace. Optional on a single node: there it costs more memory than
  scaling saves.
defaults:
  single-node: optional
  multi-node: recommended

releases:
  - name: keda
    namespace: keda
    repo: https://kedacore.github.io/charts
    chart: keda
    version: 2.21.0
    profiles:
      single-node: |
        resources:
          # Chart defaults (100Mi/1000Mi) far exceed idle use.
          operator:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          metricServer:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 256Mi}
          webhooks:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      multi-node: |
        operator:
          # Leader-elected standby survives node drains.
          replicaCount: 2
        resources:
          # Room for a few hundred ScaledObjects.
          operator:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          metricServer:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 512Mi}
          webhooks:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 256Mi}

detection:
  crds: [scaledobjects.keda.sh]
  apiServices: [v1beta1.external.metrics.k8s.io]
  helmCharts: [keda]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: keda-operator}

security:
  summary: Reads scale targets and trigger secrets cluster-wide; serves the external metrics API.
  clusterWide: true
  credentials: optional
  credentialsNote: Queue and cloud triggers use a TriggerAuthentication in the tenant namespace.
  tenants: namespaced
  tenantCRDs: [ScaledObject, ScaledJob, TriggerAuthentication]
  risks:
    - risk: A ScaledObject can use cluster-level credentials through ClusterTriggerAuthentication.
      mitigation: Reject tenant references to ClusterTriggerAuthentication with an admission policy.
    - risk: URL-based triggers make the operator call any address (SSRF).
      mitigation: Reject private and link-local trigger addresses with the same policy.

leftovers: [customresourcedefinitions]
