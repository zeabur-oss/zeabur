displayName: KEDA HTTP Add-on
homepage: https://github.com/kedacore/http-add-on
license: Apache-2.0
maturity: cncf-graduated
stability: beta
rationale: >
  Scales HTTP services on request rate, including to zero; the interceptor
  holds the first request while the workload wakes. It is pre-1.0, so it is
  marked beta.
defaults:
  single-node: optional
  multi-node: optional
dependsOn: [event-autoscaling/keda]

releases:
  - name: http-add-on
    namespace: keda
    releaseName: keda-add-ons-http
    repo: https://kedacore.github.io/charts
    chart: keda-add-ons-http
    version: 0.16.0
    profiles:
      single-node: |
        interceptor:
          replicas:
            # Three interceptors add nothing on one node.
            min: 1
            max: 3
          # On one node a PDB only blocks maintenance.
          pdb:
            enabled: false
        scaler:
          # One scaler is enough on one node.
          replicas: 1
      multi-node: |
        interceptor:
          replicas:
            # All scaled traffic passes the interceptor; keep the chart's floor.
            min: 3
            max: 50
        scaler:
          # Keeps scaling during node drains.
          replicas: 2

detection:
  crds: [httpscaledobjects.http.keda.sh]
  helmCharts: [keda-add-ons-http]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/component: interceptor, app.kubernetes.io/part-of: keda-add-ons-http}

security:
  summary: Reads HTTPScaledObjects, Services and EndpointSlices cluster-wide; creates ScaledObjects.
  clusterWide: true
  tenants: namespaced
  tenantCRDs: [HTTPScaledObject]
  risks:
    - risk: An HTTPScaledObject can claim another tenant's hostname.
      mitigation: Admit only hosts the namespace's own HTTPRoutes serve.

leftovers: [customresourcedefinitions]

upgradeNotes:
  - versions: "<1.0.0"
    note: HTTPScaledObject fields change between minor versions; read the release notes before upgrading.
