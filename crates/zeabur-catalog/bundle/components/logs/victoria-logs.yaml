apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: VictoriaLogs
  description: >
    Keeps and searches log history with low memory and disk use. It is
    Apache-2.0, unlike Loki, and runs on the VictoriaMetrics operator.
  license: Apache-2.0
  homepage: https://docs.victoriametrics.com/victorialogs/
maturity: independent
alternatives:
  loki: Licensed AGPL-3.0; an existing installation is reused.
defaults:
  single-node: recommended
  multi-node: recommended
persistsData: true
requires: [observability-operator/victoria-metrics-operator]

releases:
  - name: logs
    namespace: observability
    manifests: |
      # The log store.
      apiVersion: operator.victoriametrics.com/v1
      kind: VLSingle
      metadata:
        name: victoria-logs
        namespace: observability
      spec:
        # Two weeks, or less when the volume reaches 8GiB of its 10Gi.
        retentionPeriod: 14d
        retentionMaxDiskSpaceUsageBytes: 8GiB
        storage:
          resources:
            requests: {storage: 10Gi}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 1Gi}
      ---
      # One collector per node, reading container logs.
      apiVersion: operator.victoriametrics.com/v1
      kind: VLAgent
      metadata:
        name: collector
        namespace: observability
      spec:
        k8sCollector:
          enabled: true
          # Namespace, pod and container suffice; labels add cardinality.
          includePodLabels: false
        remoteWrite:
          - url: http://vlsingle-victoria-logs.observability.svc:9428/internal/insert
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {memory: 256Mi}
      ---
      # Only the collector, the metrics stack's vmagent (the operator's scrape of
      # /metrics) and Zeabur Proxy in the zeabur namespace reach the log store.
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: victoria-logs
        namespace: observability
      spec:
        podSelector:
          matchLabels: {app.kubernetes.io/name: vlsingle, app.kubernetes.io/instance: victoria-logs}
        policyTypes: [Ingress]
        ingress:
          - ports: [{port: 9428, protocol: TCP}]
            from:
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: vlagent, app.kubernetes.io/instance: collector}
              - podSelector:
                  matchLabels: {app.kubernetes.io/name: vmagent}
              # Both selectors: anyone can label a pod in their own namespace.
              - namespaceSelector:
                  matchLabels: {kubernetes.io/metadata.name: zeabur}
                podSelector:
                  matchLabels: {app.kubernetes.io/name: zeabur-proxy}

detection:
  crds: [vlsingles.operator.victoriametrics.com]
  helmCharts: [victoria-logs-single, victoria-logs-collector]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: vlsingle}
    - kind: StatefulSet
      labels: {app.kubernetes.io/name: victoria-logs-single}

security:
  summary: The collector reads pod metadata and node log files.
  clusterWide: true
  privileged: true
  risks:
    - risk: The log store holds every tenant's logs in one place.
      mitigation: >-
        A NetworkPolicy lets only the collector, vmagent and Zeabur Proxy reach it;
        tenants query through Zeabur Proxy, which filters by namespace.
    - risk: >-
        The collector adds a pod's JSON log fields to the line, so a pod can
        print kubernetes.pod_namespace to pose as another namespace.
      mitigation: >-
        VictoriaLogs drops a line whose stream fields repeat, so it never lands
        under another namespace; re-run Zeabur Proxy's canary test on upgrades.

smoke:
  - name: operational
    wait:
      - "-n observability vlsingle/victoria-logs --for=jsonpath={.status.updateStatus}=operational"
      - "-n observability vlagent/collector --for=jsonpath={.status.updateStatus}=operational"

leftovers: [persistentvolumeclaims]
