apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Traefik Proxy
  description: >
    Serves Gateway API and Ingress, and hosts the CrowdSec bouncer. Ingress NGINX
    was retired in March 2026.
  license: MIT
  homepage: https://traefik.io/traefik/
maturity: independent
alternatives:
  envoy-gateway: Serves Gateway API on Envoy; an existing installation is reused.
defaults:
  single-node: recommended
  multi-node: recommended
disruptsTraffic: true

releases:
  - name: gateway-api-crds
    namespace: kube-system
    # Traefik chart 42.1 needs Gateway API v1.6.3; the chart lacks these CRDs.
    skipIfPresent: [httproutes.gateway.networking.k8s.io]
    urls:
      - https://github.com/kubernetes-sigs/gateway-api/releases/download/{version}/standard-install.yaml
    version: v1.6.3

  - name: traefik
    namespace: traefik
    chart: oci://ghcr.io/traefik/helm/traefik
    version: 42.1.3
    values: |
      providers:
        kubernetesGateway:
          # Route web services with HTTPRoute.
          enabled: true
        kubernetesIngress:
          # Many charts still ship Ingress objects.
          enabled: true
        kubernetesCRD:
          # Middleware objects, such as the CrowdSec bouncer.
          enabled: true
          # No references to other namespaces.
          allowCrossNamespace: false
          # Only the traefik namespace can set the default TLS store.
          defaultTLSResourcesNamespace: traefik
      gatewayClass:
        # Gateways reference GatewayClass "traefik".
        enabled: true
        name: traefik
      gateway:
        # Gateways and listeners are created per domain, not by the chart.
        enabled: false
      api:
        # Unauthenticated surface; not needed.
        dashboard: false
      service:
        spec:
          # Skip source NAT so Traefik sees client addresses (CrowdSec, rate
          # limits, logs); only nodes running Traefik serve traffic.
          externalTrafficPolicy: Local
      accessLog:
        # JSON access logs for metrics, log search and CrowdSec.
        enabled: true
        format: json
        fields:
          # Keep only the fields below; secrets live in headers and queries.
          defaultMode: drop
          names:
            RequestHost: keep
            RequestMethod: keep
            RequestPath: keep
            RequestProtocol: keep
            DownstreamStatus: keep
            DownstreamContentSize: keep
            RequestContentSize: keep
            Duration: keep
            RouterName: keep
            StartUTC: keep
          headers:
            # Headers carry cookies and bearer tokens.
            defaultMode: drop
          queryParameters:
            # Query strings carry OAuth codes and signed-URL secrets.
            defaultMode: drop
    profiles:
      single-node: |
        deployment:
          # A second copy gains nothing on one node.
          replicas: 1
        resources:
          # Idles near 40Mi; the limit contains leaks.
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
      multi-node: |
        deployment:
          # One pod per node, so every node keeps client addresses under the
          # Local traffic policy; k3s ServiceLB source-NATs on nodes without one.
          # From a Deployment, annotate it helm.sh/resource-policy=keep before the
          # upgrade and delete it after, or ingress drops for a few seconds.
          kind: DaemonSet
        tolerations:
          # The taints k3s ServiceLB tolerates, so Traefik runs wherever it listens.
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: CriticalAddonsOnly
            operator: Exists
        metrics:
          prometheus:
            # Request rate and latency metrics.
            service:
              enabled: true
        resources:
          # Headroom for higher request rates.
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}

detection:
  gatewayControllers: [traefik.io/gateway-controller]
  ingressControllers: [traefik.io/ingress-controller]
  crds: [ingressroutes.traefik.io, middlewares.traefik.io]
  helmCharts: [traefik]
  k3sAddons: [traefik]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: traefik}
    - kind: DaemonSet
      labels: {app.kubernetes.io/name: traefik}

security:
  summary: Reads Services, Secrets and routes cluster-wide; writes route status.
  clusterWide: true
  tenants: namespaced
  tenantCRDs: [HTTPRoute, GRPCRoute]
  risks:
    - risk: A tenant HTTPRoute can claim another tenant's hostname on a shared listener.
      mitigation: Use one listener per verified domain, with allowedRoutes limited to its namespace.
    - risk: Traefik CRDs can reference other namespaces.
      mitigation: allowCrossNamespace is false and tenants get no Traefik CRDs.

leftovers: [customresourcedefinitions]

smoke:
  - name: gateway-class-accepted
    wait: ["gatewayclass/traefik --for=condition=Accepted"]
