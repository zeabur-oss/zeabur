apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: MOCO
  description: >
    Runs MySQL 8 from a MySQLCluster object in the tenant's namespace, one
    instance or a semi-synchronous primary with replicas, with backups and
    point-in-time recovery from S3. For applications that need MySQL itself.
  # The operator is Apache-2.0; the MySQL images it runs are GPL-2.0.
  license: Apache-2.0 AND GPL-2.0-only
  homepage: https://cybozu-go.github.io/moco/
maturity: independent
alternatives:
  mariadb-operator: MariaDB, for applications that accept it in place of MySQL.
defaults:
  single-node: optional
  multi-node: optional
# The webhook and the controller-agent mTLS certificates come from cert-manager.
requires: [certificates]
persistsData: true

releases:
  - name: moco
    namespace: moco-system
    repo: https://cybozu-go.github.io/moco/
    chart: moco
    version: 0.27.0
    profiles:
      single-node: |
        # One node: a second replica gains nothing.
        replicaCount: 1
        resources:
          # The chart asks for 100m and 20Mi; grows with MySQLClusters.
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 256Mi}
      multi-node: |
        # The chart's default, stated: leader election keeps one active.
        replicaCount: 2
        resources:
          # More MySQLClusters to reconcile.
          requests: {cpu: 20m, memory: 128Mi}
          limits: {memory: 512Mi}

detection:
  crds: [mysqlclusters.moco.cybozu.com]
  helmCharts: [moco]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: moco}

security:
  summary: >
    Manages pods, StatefulSets, Services, Secrets, PVCs, CronJobs, Jobs and
    Roles for MySQLClusters in every namespace, and copies certificates into them.
  clusterWide: true
  credentials: optional
  credentialsNote: Backups need S3 credentials, passed to the backup Job from the tenant namespace.
  tenants: namespaced
  tenantCRDs: [MySQLCluster, BackupPolicy]
  risks:
    - risk: >
        The controller's container security context is fixed in the chart without
        dropped capabilities or a seccomp profile, so moco-system needs baseline
        Pod Security, not restricted.
      mitigation: Label moco-system baseline; MySQL pods in tenant namespaces can still be restricted.
    - risk: >
        MySQL pods have no seccomp profile or dropped capabilities unless the
        MySQLCluster sets them in podTemplate and overwriteContainers.
      mitigation: Set them on each MySQLCluster (see the smoke test); restricted namespaces reject the pods otherwise.
    - risk: A BackupPolicy runs Jobs with any ServiceAccount in its namespace and the credentials given in its env.
      mitigation: Use a ServiceAccount without other rights, and one bucket path and key pair per tenant.
    - risk: Traffic between the controller and mysqld is not TLS; passwords rely on caching_sha2_password.
      mitigation: NetworkPolicies between namespaces.

# The CRDs carry helm.sh/resource-policy: keep.
leftovers: [customresourcedefinitions]

smoke:
  - name: one-instance
    manifest: |
      # Proves MySQL runs under restricted Pod Security.
      apiVersion: v1
      kind: Namespace
      metadata:
        name: catalog-smoke
        labels: {pod-security.kubernetes.io/enforce: restricted}
      ---
      apiVersion: moco.cybozu.com/v1beta2
      kind: MySQLCluster
      metadata: {name: smoke, namespace: catalog-smoke}
      spec:
        replicas: 1
        podTemplate:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: mysqld
                image: ghcr.io/cybozu-go/moco/mysql:8.4.10.1
                securityContext:
                  runAsUser: 10000
                  runAsGroup: 10000
                  allowPrivilegeEscalation: false
                  capabilities: {drop: [ALL]}
          overwriteContainers:
            - name: agent
              securityContext: &system
                runAsUser: 10000
                runAsGroup: 10000
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
            - name: moco-init
              securityContext: *system
            - name: copy-moco-init
              securityContext: *system
            - name: slow-log
              securityContext: *system
        volumeClaimTemplates:
          - metadata: {name: mysql-data}
            spec:
              accessModes: [ReadWriteOnce]
              resources: {requests: {storage: 1Gi}}
    wait: ["-n catalog-smoke mysqlcluster/smoke --for=condition=Healthy"]
    # Pulls the MySQL image and initialises the data directory first.
    timeout: 600s

upgradeNotes:
  - versions: "*"
    note: >
      An operator upgrade that changes the moco-agent image restarts every MySQL pod.
      Kubernetes 1.35 needs 1.35.4 or later, or the MaxUnavailableStatefulSet
      feature gate off (kubernetes/kubernetes#137409).
