apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: System Upgrade Controller
  description: >
    Upgrades k3s or RKE2 and node packages one node at a time from declarative Plans,
    with cordon, drain and concurrency limits. The catalog installs it from
    upstream manifests because the Rancher chart lags behind releases.
  license: Apache-2.0
  homepage: https://github.com/rancher/system-upgrade-controller
maturity: independent
alternatives:
  kured: If installed, kured keeps handling reboots.
defaults:
  single-node: recommended
  multi-node: recommended
# Its Plans replace the k3s or RKE2 binary (rancher/k3s-upgrade, rancher/rke2-upgrade), and its
# manifest needs a control-plane node label that other distributions (KubeSolo) do not set.
distributions: [k3s, rke2]

releases:
  - name: crds
    namespace: system-upgrade
    urls:
      - https://github.com/rancher/system-upgrade-controller/releases/download/{version}/crd.yaml
    version: v0.20.2
  - name: controller
    namespace: system-upgrade
    urls:
      - https://github.com/rancher/system-upgrade-controller/releases/download/{version}/system-upgrade-controller.yaml
    version: v0.20.2

detection:
  crds: [plans.upgrade.cattle.io]
  helmCharts: [system-upgrade-controller]
  workloads:
    - kind: Deployment
      labels: {upgrade.cattle.io/controller: system-upgrade-controller}

security:
  summary: Cordons and drains nodes, and creates privileged Jobs that run Plan images on the host.
  clusterWide: true
  privileged: true
  tenants: admin-only
  risks:
    - risk: A Plan runs any image as root on the host, so whoever writes Plans owns every node.
      mitigation: Restrict Plan writes to administrators and use only signed, digest-pinned images.

leftovers: [customresourcedefinitions]
