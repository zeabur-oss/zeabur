apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: Stakater Reloader
  description: >
    Rolls Deployments, StatefulSets and DaemonSets when a ConfigMap or Secret they
    use changes, whoever changed it. Optional: only workloads that opt in with an
    annotation restart.
  license: Apache-2.0
  homepage: https://github.com/stakater/Reloader
maturity: independent
defaults:
  single-node: optional
  multi-node: optional

releases:
  - name: reloader
    namespace: reloader
    repo: https://stakater.github.io/stakater-charts
    chart: reloader
    version: 2.2.18
    values: |
      reloader:
        # Only workloads annotated reloader.stakater.com/auto or */reload restart.
        autoReloadAll: false
        # Marks the pod template with an annotation instead of adding an
        # environment variable, which the upstream README prefers for Flux and Argo CD.
        reloadStrategy: annotations
        # Leave Jobs alone and never create Jobs from CronJobs; this also drops
        # the chart's batch RBAC rules.
        ignoreJobs: true
        ignoreCronJobs: true
        # Tenants opt in per workload; a namespace list would differ per cluster.
        watchGlobally: true
    profiles:
      single-node: |
        reloader:
          deployment:
            resources:
              # Caches every ConfigMap and Secret; grows with their count.
              requests: {cpu: 10m, memory: 64Mi}
              limits: {memory: 256Mi}
      multi-node: |
        reloader:
          # Leader election, so a standby takes over when the leader's node
          # drains. A change made before it holds the Lease (up to 15s) is
          # missed: syncAfterRestart would cover it by rolling every tracked
          # workload on each handoff, so it stays off.
          enableHA: true
          deployment:
            # One leader and one standby.
            replicas: 2
            resources:
              # More ConfigMaps and Secrets to cache.
              requests: {cpu: 20m, memory: 128Mi}
              limits: {memory: 512Mi}

detection:
  helmCharts: [reloader]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: reloader}

security:
  summary: >
    ClusterRole: reads, lists and watches every Secret and ConfigMap; reads,
    updates and patches Deployments, StatefulSets and DaemonSets; creates
    Events. Role in its namespace: lists, reads, watches, creates and updates
    every ConfigMap there, not only its own, and on multi-node the
    leader-election Lease.
  clusterWide: true
  tenants: namespaced
  risks:
    - risk: It reads every Secret in the cluster, so its token exposes all of them.
      mitigation: >
        Set watchGlobally to false and list namespaces: the chart then creates a
        Role per listed namespace and no ClusterRole. resourceLabelSelector
        narrows what it caches, not its RBAC.
    - risk: It can rewrite the pod template of any Deployment, StatefulSet or DaemonSet, including kube-system's.
      mitigation: Keep its namespace admin-only; it runs as non-root with the RuntimeDefault seccomp profile.

smoke:
  - name: deployment-ready
    manifest: |
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: smoke, namespace: catalog-smoke}
      data: {revision: "1"}
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: smoke
        namespace: catalog-smoke
        annotations: {reloader.stakater.com/auto: "true"}
      spec:
        selector: {matchLabels: {app: smoke}}
        template:
          metadata: {labels: {app: smoke}}
          spec:
            containers:
              - name: pause
                image: registry.k8s.io/pause:3.10
                envFrom: [{configMapRef: {name: smoke}}]
    wait: ["-n catalog-smoke deployment/smoke --for=condition=Available"]
  - name: rolls-on-configmap-change
    manifest: |
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: smoke, namespace: catalog-smoke}
      data: {revision: "2"}
    wait:
      - "-n catalog-smoke deployment/smoke --for=jsonpath={.spec.template.metadata.annotations.reloader\\.stakater\\.com/last-reloaded-from}"
      - "-n catalog-smoke deployment/smoke --for=jsonpath={.metadata.generation}=2"
      - "-n catalog-smoke deployment/smoke --for=condition=Available"

# Reloader creates reloader-meta-info itself, without an owner, so helm
# uninstall leaves it in the namespace.
leftovers: [configmaps/reloader-meta-info]
