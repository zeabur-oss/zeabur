apiVersion: catalog.zeabur.com/v1
kind: Component
metadata:
  name: ExternalDNS
  description: >
    Creates DNS records for route hostnames (Kubernetes SIG). Optional: it needs a
    provider token, and a wildcard record often suffices.
  license: Apache-2.0
  homepage: https://kubernetes-sigs.github.io/external-dns/
maturity: kubernetes-sig
defaults:
  single-node: optional
  multi-node: optional
requires: [ingress]

inputs:
  - name: provider
    description: ExternalDNS writes records through this provider, spelled as ExternalDNS names it, such as cloudflare or route53.
    path: provider.name
    required: true
    testValue: inmemory
  - name: domain-filters
    description: ExternalDNS changes records only in these zones.
    path: domainFilters
    required: true
    testValue: [example.test]
  - name: owner-id
    description: ExternalDNS marks this cluster's records with this ID, so two clusters never fight over one record.
    path: txtOwnerId
    required: true
    testValue: catalog-ci

releases:
  - name: external-dns
    namespace: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    version: 1.23.0
    values: |
      sources:
        # Hostnames from HTTPRoutes and Ingresses.
        - gateway-httproute
        - ingress
      # Never delete records others may rely on.
      policy: upsert-only
      # Touch only records it created.
      registry: txt
    profiles:
      single-node: |
        resources:
          # A small polling loop; idles under 30Mi.
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
      multi-node: |
        resources:
          # More routes to reconcile.
          requests: {cpu: 20m, memory: 64Mi}
          limits: {memory: 256Mi}

detection:
  helmCharts: [external-dns]
  workloads:
    - kind: Deployment
      labels: {app.kubernetes.io/name: external-dns}

security:
  summary: Reads Services, Ingresses and routes in all namespaces.
  clusterWide: true
  credentials: required
  credentialsNote: Needs a DNS provider token scoped to domainFilters.
  risks:
    - risk: A tenant route can publish a name in another tenant's domain.
      mitigation: Admit only verified hostnames; domainFilters limits the zones.
