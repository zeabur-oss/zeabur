apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: '{{ .Namespace }}'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        templates.zeabur.com/template: miniflux
        app.kubernetes.io/name: miniflux
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: miniflux
        image: miniflux/miniflux:2.3.5@sha256:8fd6c3c434ecc3d4083306f83e03c0bb74c632e0f8378da5ead7e1773b0b89c9
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: miniflux-db-app
              key: password
        - name: DATABASE_URL
          value: postgres://miniflux:$(DATABASE_PASSWORD)@miniflux-db-rw:5432/miniflux?sslmode=verify-full&sslrootcert=/db-ca/ca.crt
        - name: RUN_MIGRATIONS
          value: '1'
        - name: CREATE_ADMIN
          value: '1'
        - name: ADMIN_USERNAME
          value: admin
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: miniflux-secrets
              key: admin-password
        - name: LISTEN_ADDR
          value: 0.0.0.0:8080
        - name: BASE_URL
          value: https://{{ .Domain }}/
        volumeMounts:
        - name: db-ca
          mountPath: /db-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: http
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: db-ca
        secret:
          secretName: miniflux-db-ca
          items:
          - {key: ca.crt, path: ca.crt}
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: '{{ .Namespace }}'
spec:
  selector:
    app.kubernetes.io/name: miniflux
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miniflux
  namespace: '{{ .Namespace }}'
  annotations:
    cert-manager.io/cluster-issuer: '{{ .ClusterIssuer }}'
spec:
  ingressClassName: traefik
  tls:
  - hosts: ['{{ .Domain }}']
    secretName: miniflux-tls
  rules:
  - host: '{{ .Domain }}'
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miniflux
            port:
              number: 8080
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-db
  namespace: '{{ .Namespace }}'
spec:
  inheritedMetadata:
    labels:
      templates.zeabur.com/template: miniflux
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie@sha256:0675340b02be838319b9b6f323c206693e519dcd62ec729d539be9f46bb7a2f9
  enableSuperuserAccess: false
  enablePDB: true
  postgresUID: 26
  postgresGID: 26
  seccompProfile:
    type: RuntimeDefault
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
      encoding: UTF8
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: '100'
