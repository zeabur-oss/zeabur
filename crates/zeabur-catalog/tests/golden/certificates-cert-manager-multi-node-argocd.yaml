# Profile: multi-node. Apply in the namespace Argo CD runs in (argocd).
# Argo CD reads OCI Helm charts through a repository with enableOCI.
apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: cert-manager-oci
  url: quay.io/jetstack/charts
  enableOCI: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        cainjector:
          podDisruptionBudget:
            enabled: true
          replicaCount: 2
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          enableGatewayAPI: true
          kind: ControllerConfiguration
        crds:
          enabled: true
          keep: true
        enableCertificateOwnerRef: true
        podDisruptionBudget:
          enabled: true
        replicaCount: 2
        webhook:
          podDisruptionBudget:
            enabled: true
          replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# issuers (namespace cert-manager)
# Try here first; production rate limits are far lower. Staging
# certificates are not trusted by browsers.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # No email: ACME accounts need no contact, and Let's Encrypt sends
    # no expiry emails since 2025. Setting spec.acme.email later updates
    # the registered account.
    # Account key, created by cert-manager in its own namespace.
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # HTTP-01 through Traefik's Ingress support; needs no Gateway, and
      # also answers for names served by Gateway listeners. The name
      # must reach port 80 of the cluster from the internet.
      - http01:
          ingress:
            ingressClassName: traefik
---
# Trusted certificates; same settings as staging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
