# Profile: single-node. Apply with kubectl, or save in /var/lib/rancher/k3s/server/manifests/
# (K3s) or /var/lib/rancher/rke2/server/manifests/ (RKE2).
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# cloud: Velero reads the bucket's credentials from this AWS-style credentials file.
apiVersion: v1
kind: Secret
metadata:
  name: velero-credentials
  namespace: velero
stringData:
  cloud: "<credentials>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# repository-password: Kopia encrypts file-system backups with this password. Without the Secret, Velero uses its built-in password, which is public.
apiVersion: v1
kind: Secret
metadata:
  name: velero-repo-credentials
  namespace: velero
stringData:
  repository-password: "<random: openssl rand -hex 64>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# key: The S3 server encrypts every backup object, Secrets included, with this SSE-C key. The AWS plugin needs exactly 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: velero-backup-key
  namespace: velero
stringData:
  key: "<random: openssl rand -base64 24 | tr '+/' '-_' | tr -d '='>"
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: velero
  namespace: kube-system
spec:
  chart: velero
  repo: https://vmware-tanzu.github.io/helm-charts
  version: 12.2.1
  targetNamespace: velero
  createNamespace: true
  valuesContent: |-
    configuration:
      backupStorageLocation:
      - bucket: <bucket>
        config:
          customerKeyEncryptionSecret: velero-backup-key/key
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: <s3-url>
        default: true
        name: default
        provider: aws
      defaultVolumesToFsBackup: false
      uploaderType: kopia
    credentials:
      existingSecret: velero-credentials
      useSecret: true
    deployNodeAgent: false
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2@sha256:37396519f399536e5f01427d723565ae69294ec3fb5625cf1c87c09eaa9de16b
    initContainers:
    - image: >-
        velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
      name: velero-plugin-for-aws
      volumeMounts:
      - mountPath: /target
        name: plugins
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 20m
        memory: 64Mi
    snapshotsEnabled: false
