# Profile: single-node. Commit to the repository Flux reconciles.
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# key: The Traefik bouncer uses this key to call the CrowdSec local API.
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-bouncer-key
  namespace: crowdsec
stringData:
  key: "<random: openssl rand -hex 64>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# csLapiSecret: The local API (LAPI) signs agent sessions with this shared secret.
# registrationToken: Agents register with the local API using this token.
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
stringData:
  csLapiSecret: "<random: openssl rand -hex 64>"
  registrationToken: "<random: openssl rand -hex 64>"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
  ref:
    tag: 0.24.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  releaseName: crowdsec
  targetNamespace: crowdsec
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: crowdsec
  values:
    agent:
      acquisition:
      - namespace: traefik
        podName: traefik-*
        program: traefik
      env:
      - name: COLLECTIONS
        value: crowdsecurity/traefik
      resources:
        limits:
          memory: 192Mi
        requests:
          cpu: 20m
          memory: 48Mi
    container_runtime: containerd
    lapi:
      env:
      - name: DISABLE_ONLINE_API
        value: "true"
      - name: BOUNCER_KEY_traefik
        valueFrom:
          secretKeyRef:
            key: key
            name: crowdsec-bouncer-key
      persistentVolume:
        config:
          enabled: true
        data:
          enabled: true
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 64Mi
    secrets:
      externalSecret:
        name: crowdsec-lapi
---
# bouncer-middleware (namespace crowdsec)
# Referenced from Traefik's entrypoints as crowdsec-bouncer@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bouncer
  namespace: crowdsec
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      # Local copy of decisions; requests never wait on LAPI.
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      # Read from the Secret in the Middleware's namespace.
      crowdsecLapiKey: urn:k8s:secret:crowdsec-bouncer-key:key
      # Fail open: if LAPI is unreachable, keep serving traffic.
      updateMaxFailure: -1
