# Profile: single-node. Commit to the repository Flux reconciles.
apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# key: The Traefik bouncer uses this key to call the CrowdSec local API.
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-bouncer-key
  namespace: crowdsec
stringData:
  key: "<random: openssl rand -hex 64>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# csLapiSecret: The local API (LAPI) signs agent sessions with this shared secret.
# registrationToken: The chart's LAPI reads this token. Auto-registration is off, so nothing uses it.
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
stringData:
  csLapiSecret: "<random: openssl rand -hex 64>"
  registrationToken: "<random: openssl rand -hex 64>"
---
# ca (namespace crowdsec)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: crowdsec-selfsigned, namespace: crowdsec}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: crowdsec-ca, namespace: crowdsec}
spec:
  isCA: true
  commonName: crowdsec-ca
  secretName: crowdsec-ca
  # Ten years, like the certificates it signs.
  duration: 87600h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: crowdsec-selfsigned, kind: Issuer}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: crowdsec-ca, namespace: crowdsec}
spec:
  ca: {secretName: crowdsec-ca}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/crowdsecurity/helm-charts/crowdsec
  ref:
    tag: 0.24.2
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1h
  releaseName: crowdsec
  targetNamespace: crowdsec
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: crowdsec
  values:
    agent:
      acquisition:
      - namespace: traefik
        podName: traefik-*
        program: traefik
      env:
      - name: COLLECTIONS
        value: crowdsecurity/traefik
      resources:
        limits:
          memory: 192Mi
        requests:
          cpu: 20m
          memory: 48Mi
      wait_for_lapi:
        image:
          repository: crowdsecurity/crowdsec
          tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    config:
      config.yaml.local: |
        db_config:
          flush:
            agents_autodelete:
              # Deletes the machine a restarted agent leaves behind.
              cert: 7d
    container_runtime: containerd
    image:
      repository: crowdsecurity/crowdsec
      tag: v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    lapi:
      env:
      - name: DISABLE_ONLINE_API
        value: "true"
      - name: BOUNCER_KEY_traefik
        valueFrom:
          secretKeyRef:
            key: key
            name: crowdsec-bouncer-key
      persistentVolume:
        config:
          enabled: false
        data:
          enabled: true
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 20m
          memory: 64Mi
    secrets:
      externalSecret:
        name: crowdsec-lapi
    tls:
      certManager:
        duration: 87600h
        issuerRef:
          kind: Issuer
          name: crowdsec-ca
        renewBefore: 720h
        secretTemplate:
          labels:
            app.kubernetes.io/part-of: crowdsec
      enabled: true
---
# bouncer-middleware (namespace crowdsec)
# Referenced from Traefik's entrypoints as crowdsec-bouncer@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bouncer
  namespace: crowdsec
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      # Local copy of decisions; requests never wait on LAPI.
      crowdsecMode: stream
      crowdsecLapiScheme: https
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      # The CA from the ca release, which signs the LAPI certificate.
      crowdsecLapiTlsCertificateAuthority: urn:k8s:secret:crowdsec-lapi-tls:ca.crt
      # Read from the Secret in the Middleware's namespace.
      crowdsecLapiKey: urn:k8s:secret:crowdsec-bouncer-key:key
      # Fail open: if LAPI is unreachable, keep serving traffic.
      updateMaxFailure: -1
