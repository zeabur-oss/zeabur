# Profile: single-node. Apply in the namespace Argo CD runs in (argocd).
# Argo CD reads OCI Helm charts through a repository with enableOCI.
apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: cert-manager-oci
  url: quay.io/jetstack/charts
  enableOCI: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        cainjector:
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          enableGatewayAPI: true
          kind: ControllerConfiguration
        crds:
          enabled: true
          keep: true
        enableCertificateOwnerRef: true
        prometheus:
          enabled: true
          servicemonitor:
            enabled: false
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        startupapicheck:
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
        webhook:
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 24Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
