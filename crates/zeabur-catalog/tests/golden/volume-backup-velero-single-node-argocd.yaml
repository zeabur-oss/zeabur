# Profile: single-node. Apply in the namespace Argo CD runs in (argocd).
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# cloud: Velero reads the bucket's credentials from this AWS-style credentials file.
apiVersion: v1
kind: Secret
metadata:
  name: velero-credentials
  namespace: velero
stringData:
  cloud: "<credentials>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# repository-password: Kopia encrypts file-system backups with this password. Without the Secret, Velero uses its built-in password, which is public.
apiVersion: v1
kind: Secret
metadata:
  name: velero-repo-credentials
  namespace: velero
stringData:
  repository-password: "<random: openssl rand -hex 64>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# key: The S3 server encrypts every backup object, Secrets included, with this SSE-C key. The AWS plugin needs exactly 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: velero-backup-key
  namespace: velero
stringData:
  key: "<random: openssl rand -base64 24 | tr '+/' '-_' | tr -d '='>"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.2.1
    helm:
      releaseName: velero
      valuesObject:
        configuration:
          backupStorageLocation:
          - bucket: <bucket>
            config:
              customerKeyEncryptionSecret: velero-backup-key/key
              region: us-east-1
              s3ForcePathStyle: "true"
              s3Url: <s3-url>
            default: true
            name: default
            provider: aws
          defaultVolumesToFsBackup: false
          uploaderType: kopia
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        credentials:
          existingSecret: velero-credentials
          useSecret: true
        deployNodeAgent: false
        image:
          repository: docker.io/velero/velero
          tag: v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
        initContainers:
        - image: >-
            velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
          name: velero-plugin-for-aws
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
          - mountPath: /target
            name: plugins
        podSecurityContext:
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1002
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 64Mi
        snapshotsEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
