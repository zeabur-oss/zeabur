# Profile: single-node. Commit to the repository Flux reconciles.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    zeabur.com/platform: "true"
  name: velero
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# cloud: Velero reads the bucket's credentials from this AWS-style credentials file.
apiVersion: v1
kind: Secret
metadata:
  name: velero-credentials
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
stringData:
  cloud: "<credentials>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# ca.crt: The CA certificate, in PEM, that signs the S3 endpoint's certificate, such as a self-hosted MinIO's own CA. Leave it empty for a store with a public certificate.
apiVersion: v1
kind: Secret
metadata:
  name: velero-ca
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
stringData:
  ca.crt: "<caCert>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# repository-password: Kopia encrypts file-system backups with this password. Without the Secret, Velero uses its built-in password, which is public.
apiVersion: v1
kind: Secret
metadata:
  name: velero-repo-credentials
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
stringData:
  repository-password: "<random: openssl rand -hex 64>"
---
# Keep these values out of Git (SOPS, Sealed Secrets or a secret manager).
# key: The S3 server encrypts every backup object, Secrets included, with this SSE-C key. The AWS plugin needs exactly 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: velero-backup-key
  namespace: velero
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
stringData:
  key: "<random: openssl rand -base64 24 | tr '+/' '-_' | tr -d '='>"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 1h
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: flux-system
spec:
  interval: 1h
  releaseName: velero
  targetNamespace: velero
  install:
    createNamespace: true
  chart:
    spec:
      chart: velero
      version: 12.2.5
      sourceRef:
        kind: HelmRepository
        name: velero
  values:
    configuration:
      backupStorageLocation:
      - bucket: <bucket>
        caCertRef:
          key: ca.crt
          name: velero-ca
        config:
          customerKeyEncryptionSecret: velero-backup-key/key
          region: us-east-1
          s3ForcePathStyle: "true"
          s3Url: <s3Url>
        default: true
        name: default
        provider: aws
      defaultVolumesToFsBackup: false
      uploaderType: kopia
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    credentials:
      existingSecret: velero-credentials
      useSecret: true
    deployNodeAgent: false
    image:
      repository: docker.io/velero/velero
      tag: v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
    initContainers:
    - image: >-
        velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
      name: velero-plugin-for-aws
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
      volumeMounts:
      - mountPath: /target
        name: plugins
    podSecurityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1002
      seccompProfile:
        type: RuntimeDefault
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 20m
        memory: 64Mi
    snapshotsEnabled: false
