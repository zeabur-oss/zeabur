apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: pg, namespace: shop, uid: pg-uid}
spec:
  instances: 1
  storage: {size: 1Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-1
  namespace: shop
  ownerReferences:
    - {apiVersion: postgresql.cnpg.io/v1, kind: Cluster, name: pg, uid: pg-uid, controller: true}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: files-filer
  namespace: shop
  ownerReferences:
    - {apiVersion: seaweed.seaweedfs.com/v1, kind: Seaweed, name: files, uid: files-uid, controller: true}
spec:
  serviceName: files-filer
  selector: {matchLabels: {app: files-filer}}
  template:
    metadata: {labels: {app: files-filer}}
    spec: {containers: [{name: filer, image: chrislusf/seaweedfs}]}
  volumeClaimTemplates:
    - metadata: {name: files-filer}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: files-filer-files-filer-0, namespace: shop}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: shop
  ownerReferences:
    - {apiVersion: k8s.mariadb.com/v1alpha1, kind: MariaDB, name: db, uid: db-uid, controller: true}
spec:
  serviceName: db
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec: {containers: [{name: mariadb, image: mariadb}]}
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: storage-db-0, namespace: shop}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: db-replica, namespace: shop, uid: replica-uid}
spec:
  serviceName: db-replica
  selector: {matchLabels: {app: db-replica}}
  template:
    metadata: {labels: {app: db-replica}}
    spec: {containers: [{name: mariadb, image: mariadb}]}
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: storage-db-replica-0, namespace: shop}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-db-replica-1
  namespace: shop
  ownerReferences:
    - {apiVersion: apps/v1, kind: StatefulSet, name: db-replica, uid: replica-uid, controller: true}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: uploads, namespace: shop}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
