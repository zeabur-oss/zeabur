[package]
name = "zeabur-installer"
description = "Installs RKE2, Zeabur Catalog components, Zeabur Identity and Zeabur on one Linux server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "../../docs/get-started/quickstart.mdx"

[dependencies]
zeabur-installer-host.workspace = true
zeabur-installer-plan.workspace = true
zeabur-telemetry.workspace = true
# zeabur-ui serves the `gui` page; without its `interface` feature, Zeabur's own interface stays out.
zeabur-ui.workspace = true
axum.workspace = true
form_urlencoded.workspace = true
tokio.workspace = true
tower.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
serde-saphyr = { workspace = true, features = ["serialize"] }
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
zeabur-embed.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
