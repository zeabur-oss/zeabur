[package]
name = "zeabur"
description = "Kubernetes made simple and secure by default: the in-cluster server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ui"]
ui = ["dep:zeabur-ui", "zeabur-ui/interface"]

[dependencies]
zeabur-api.workspace = true
zeabur-auth.workspace = true
zeabur-core.workspace = true
zeabur-kube.workspace = true
zeabur-plan.workspace = true
zeabur-telemetry.workspace = true
zeabur-ui = { workspace = true, optional = true }
axum.workspace = true
bytes.workspace = true
clap.workspace = true
form_urlencoded.workspace = true
http-body-util.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
zeabur-kube = { workspace = true, features = ["memory"] }
zeabur-auth = { workspace = true, features = ["testing"] }
http-body-util.workspace = true
tower.workspace = true
