[package]
name = "engawactl"
description = "Kubernetes made simple and secure by default: the command-line tool (ui, mcp, doctor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ui"]
ui = ["dep:engawa-ui"]

[dependencies]
engawa-api.workspace = true
engawa-core.workspace = true
engawa-kube.workspace = true
engawa-mcp.workspace = true
engawa-ui = { workspace = true, optional = true }
axum.workspace = true
clap.workspace = true
rmcp.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true

[dev-dependencies]
engawa-kube = { workspace = true, features = ["memory"] }
engawa-test-support = { workspace = true, features = ["sandbox"] }
# The client side, for the session tests.
rmcp = { workspace = true, features = ["client"] }
# The cluster test prepares its namespace and person as admin.
kube.workspace = true
# The cluster test runs the built binary and speaks to it with rmcp's client.
tokio = { workspace = true, features = ["process"] }
