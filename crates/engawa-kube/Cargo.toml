[package]
name = "engawa-kube"
description = "engawa: the only crate that talks to kube-apiserver, always as the requesting user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The in-memory cluster for tests (`memory`), also used by the tests of the crates above and by
# `engawa-api`'s demo example; no shipped binary enables it.
memory = []

[dependencies]
engawa-core.workspace = true
futures-util.workspace = true
http.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Already under kube's `ws` feature: the byte streams of `pods/exec`.
tokio.workspace = true

[dev-dependencies]
engawa-kube = { workspace = true, features = ["memory"] }
engawa-test-support = { workspace = true, features = ["sandbox"] }
