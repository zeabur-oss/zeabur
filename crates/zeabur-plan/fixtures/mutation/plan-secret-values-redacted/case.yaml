description: "A Secret key change shows which key changes but never a value, and is written as base64 after a test of the value it replaces."
operation: mutation.plan
params:
  request:
    changes:
      - op: data
        kind: Secret
        name: db
        changes:
          - {op: set, key: password, value: hunter2}
  secretValues:
    db: {password: hunter1, user: admin}
