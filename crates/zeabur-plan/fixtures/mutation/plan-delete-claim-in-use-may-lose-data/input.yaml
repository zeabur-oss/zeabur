apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: demo
  resourceVersion: "5"
spec:
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: example/db:1
          volumeMounts:
            - {name: data, mountPath: /var/lib/db}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: demo
  uid: c-data
  resourceVersion: "9"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
  volumeName: pv-data
status:
  phase: Bound
