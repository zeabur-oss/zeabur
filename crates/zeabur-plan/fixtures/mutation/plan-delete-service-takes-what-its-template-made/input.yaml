apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: demo
  uid: d-webui
  resourceVersion: "7"
  labels: {app.kubernetes.io/instance: chat, templates.zeabur.com/template: chat}
spec:
  selector:
    matchLabels: {app: webui}
  template:
    metadata:
      labels: {app: webui}
    spec:
      containers:
        - name: webui
          image: example/webui:1
          envFrom:
            - secretRef: {name: app-secrets}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: webui-data}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
  namespace: demo
  uid: d-pipeline
  resourceVersion: "8"
  labels: {app.kubernetes.io/instance: chat, templates.zeabur.com/template: chat}
spec:
  selector:
    matchLabels: {app: pipeline}
  template:
    metadata:
      labels: {app: pipeline}
    spec:
      containers:
        - name: pipeline
          image: example/pipeline:1
          envFrom:
            - secretRef: {name: app-secrets}
---
apiVersion: v1
kind: Service
metadata:
  name: webui
  namespace: demo
  uid: s-webui
  resourceVersion: "9"
  labels: {app.kubernetes.io/instance: chat, templates.zeabur.com/template: chat}
spec:
  selector: {app: webui}
  ports:
    - {port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webui
  namespace: demo
  uid: i-webui
  resourceVersion: "10"
  labels: {app.kubernetes.io/instance: chat, templates.zeabur.com/template: chat}
spec:
  rules:
    - host: chat.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: webui, port: {number: 8080}}}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: demo
  uid: sec-app
  resourceVersion: "11"
  labels: {app.kubernetes.io/instance: chat, templates.zeabur.com/template: chat}
type: Opaque
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webui-data
  namespace: demo
  uid: pvc-webui
  resourceVersion: "12"
  labels: {app.kubernetes.io/instance: chat, templates.zeabur.com/template: chat}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
  volumeName: pv-webui
