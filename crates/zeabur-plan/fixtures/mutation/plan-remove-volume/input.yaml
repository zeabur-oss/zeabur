apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:3.0
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: web-data}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
  namespace: demo
  resourceVersion: "60"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
