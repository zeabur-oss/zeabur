apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: demo
  uid: 5b0c0a4e-1111-2222-3333-444455556666
  resourceVersion: "12"
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    metadata:
      labels: {app.kubernetes.io/name: nightly}
    spec:
      template:
        metadata:
          labels: {app.kubernetes.io/name: nightly}
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: example/web:1.0
              command: ["/bin/sh", "-c", "bin/cleanup"]
