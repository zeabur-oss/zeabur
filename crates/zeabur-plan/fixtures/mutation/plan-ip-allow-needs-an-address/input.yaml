apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
  uid: 7d1f5c2a-0000-4000-8000-000000000001
  resourceVersion: "9"
spec:
  ingressClassName: traefik
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 8080}}
