apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: web-www, namespace: demo, resourceVersion: "5"}
spec:
  parentRefs: [{name: public, namespace: gateway}]
  hostnames: [www.shop.example.test]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api}}, {path: {type: PathPrefix, value: /}}]
      filters: [{type: RequestRedirect, requestRedirect: {scheme: https, hostname: shop.example.test, statusCode: 301}}]
    - matches: [{path: {type: PathPrefix, value: /api}}]
      backendRefs: [{name: api, port: 9000}]
    - backendRefs: [{name: web, port: 8080}]
