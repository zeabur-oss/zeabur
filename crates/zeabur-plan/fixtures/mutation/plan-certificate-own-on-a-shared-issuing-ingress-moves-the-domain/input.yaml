apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
---
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
  uid: ingress-uid
  resourceVersion: "9"
  labels: {app.kubernetes.io/name: web}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: demo-shop-error-pages@kubernetescrd,demo-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shop.example.test]
      secretName: shop-tls
  rules:
    - host: www.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8080}
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  labels: {zeabur.com/page-server: "true"}
  namespace: demo
  resourceVersion: "6"
spec:
  selector: {app.kubernetes.io/name: error-pages}
  ports: [{name: pages, port: 8080}, {name: maintenance, port: 8081}]
