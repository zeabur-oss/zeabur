description: "The request sets LOG_LEVEL in the container before it moves the port, so the Deployment is in the plan first. PORT=3000 in web-env is still written before the Deployment, so the pods the new template starts read 3000."
operation: mutation.plan
params:
  request:
    changes:
      - op: env
        workload: {kind: Deployment, name: web}
        changes:
          - {op: set, name: LOG_LEVEL, value: debug}
      - {op: port, workload: {kind: Deployment, name: web}, from: 8080, to: 3000}
  secretValues:
    web-env: {PORT: "8080", NODE_ENV: production}
    db-credentials: {PORT: "5432", PASSWORD: hunter2}
