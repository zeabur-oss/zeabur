apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web}
    spec:
      containers:
        - name: web
          image: registry.local/demo/web:1
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: {name: db-credentials}
            - secretRef: {name: web-env}
          readinessProbe:
            tcpSocket: {port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
  resourceVersion: "7"
spec:
  selector: {app.kubernetes.io/name: web}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Secret
metadata:
  name: web-env
  namespace: demo
  resourceVersion: "5"
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo
  resourceVersion: "6"
type: Opaque
