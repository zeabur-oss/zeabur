description: "A redirect on an HTTPRoute that serves only its hostname replaces the rules with one RequestRedirect rule, as Gateway API refuses the filter next to backendRefs."
operation: mutation.plan
params:
  request:
    changes:
      - op: redirect
        route: {kind: HTTPRoute, name: web-www}
        workload: {kind: Deployment, name: web}
        hostname: www.shop.example.test
        to: shop.example.test
        permanent: false
