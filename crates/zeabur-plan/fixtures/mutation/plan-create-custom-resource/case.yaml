description: "A custom resource's kind the cluster serves is created like a built-in one, at the plural discovery names."
operation: mutation.plan
params:
  kinds:
    - {group: "", kind: ConfigMap, plural: configmaps, namespaced: true}
    - {group: "", kind: Secret, plural: secrets, namespaced: true}
    - {group: "", kind: Service, plural: services, namespaced: true}
    - {group: apps, kind: Deployment, plural: deployments, namespaced: true}
    - {group: cert-manager.io, kind: Certificate, plural: certificates, namespaced: true}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole, plural: clusterroles, namespaced: false}
  request:
    changes:
      - {"op": "create", "yaml": "apiVersion: cert-manager.io/v1\nkind: Certificate\nmetadata:\n  name: shop\nspec:\n  secretName: shop-tls\n  dnsNames: [shop.example.com]\n"}
