apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: demo
  resourceVersion: "9"
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: example/report:1.0.0
