apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-www
  namespace: demo
  resourceVersion: "5"
  annotations:
    zeabur.com/redirect-rules: '[{"matches":[{"path":{"type":"PathPrefix","value":"/api"}}],"backendRefs":[{"name":"web","port":8080}]}]'
spec:
  parentRefs: [{name: public, namespace: gateway}]
  hostnames: [www.shop.example.test]
  rules:
    - filters: [{type: RequestRedirect, requestRedirect: {scheme: https, hostname: shop.example.test, statusCode: 301}}]
