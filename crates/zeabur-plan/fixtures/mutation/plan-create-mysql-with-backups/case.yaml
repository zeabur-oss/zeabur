description: "A MOCO MySQLCluster with restricted security contexts, the Job that makes its app database, and the BackupPolicy its backups use are created in one plan."
operation: mutation.plan
params:
  request:
    changes:
      - {"op":"create","object":{"apiVersion":"moco.cybozu.com/v1beta2","kind":"MySQLCluster","metadata":{"name":"mysql","annotations":{"zeabur.com/app-database":"app","zeabur.com/app-secret":"mysql-app"}},"spec":{"replicas":3,"podTemplate":{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":10000,"runAsGroup":10000,"fsGroup":10000,"fsGroupChangePolicy":"OnRootMismatch","seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"mysqld","image":"ghcr.io/cybozu-go/moco/mysql:8.4.10","resources":{"requests":{"cpu":"100m","memory":"512Mi"},"limits":{"memory":"1Gi"}},"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}},"volumeClaimTemplates":[{"metadata":{"name":"mysql-data"},"spec":{"accessModes":["ReadWriteOnce"],"storageClassName":"local-path","resources":{"requests":{"storage":"10Gi"}}}}],"overwriteContainers":[{"name":"agent","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}},{"name":"moco-init","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}},{"name":"slow-log","securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}
      - {"op":"create","object":{"apiVersion":"batch/v1","kind":"Job","metadata":{"name":"mysql-app-setup"},"spec":{"backoffLimit":6,"template":{"spec":{"restartPolicy":"OnFailure","securityContext":{"runAsNonRoot":true,"runAsUser":10000,"runAsGroup":10000,"fsGroup":10000,"fsGroupChangePolicy":"OnRootMismatch","seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"setup","image":"ghcr.io/cybozu-go/moco/mysql:8.4.10","command":["bash","-c","set -eu\nsql() { mysql --defaults-extra-file=<(printf '[client]\\npassword=%s\\n' \"$WRITABLE_PASSWORD\") -h \"$HOST\" -u moco-writable \"$@\"; }\nfor _ in $(seq 120); do sql -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 5; done\nsql <<SQL\nCREATE DATABASE IF NOT EXISTS app;\nCREATE USER IF NOT EXISTS 'app'@'%' IDENTIFIED BY '$APP_PASSWORD';\nGRANT ALL ON app.* TO 'app'@'%';\nSQL"],"env":[{"name":"HOST","value":"moco-mysql-primary"},{"name":"WRITABLE_PASSWORD","valueFrom":{"secretKeyRef":{"name":"moco-mysql","key":"WRITABLE_PASSWORD"}}},{"name":"APP_PASSWORD","valueFrom":{"secretKeyRef":{"name":"mysql-app","key":"password"}}}],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}}}}
      - {"op":"create","object":{"apiVersion":"moco.cybozu.com/v1beta2","kind":"BackupPolicy","metadata":{"name":"mysql-backups"},"spec":{"schedule":"0 3 * * *","concurrencyPolicy":"Forbid","jobConfig":{"serviceAccountName":"default","bucketConfig":{"bucketName":"b","endpointURL":"https://s3.example.com","usePathStyle":true},"envFrom":[{"secretRef":{"name":"mysql-backups-s3"}}],"workVolume":{"ephemeral":{"volumeClaimTemplate":{"spec":{"accessModes":["ReadWriteOnce"],"storageClassName":"local-path","resources":{"requests":{"storage":"10Gi"}}}}}}}}}}
