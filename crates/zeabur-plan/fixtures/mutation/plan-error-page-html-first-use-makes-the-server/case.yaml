description: "The first error pages of a project make a ConfigMap with the four pages and nginx's configuration, and a Deployment and Service that serve them and pass the restricted Pod Security level."
operation: mutation.plan
params:
  request:
    changes:
      - op: errorPageHtml
        badGateway: "<p>502</p>"
        serviceUnavailable: "<p>503</p>"
        gatewayTimeout: "<p>504</p>"
        maintenance: "<p>Back soon</p>"
