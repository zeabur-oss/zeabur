apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
  resourceVersion: "9"
  annotations:
    zeabur.com/maintenance-backend: '{"shop.example.test":[{"service":{"name":"web","port":{"number":8080}}}]}'
spec:
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: zeabur-error-pages, port: {number: 8081}}
          - path: /api
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 8080}}
