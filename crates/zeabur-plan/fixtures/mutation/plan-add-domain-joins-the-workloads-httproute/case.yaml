description: "A new hostname joins the HTTPRoute that already routes to the workload when its listener serves the hostname."
operation: mutation.plan
params:
  gateways:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {namespace: gateway, name: public}
      spec:
        listeners:
          - name: https
            port: 443
            protocol: HTTPS
            hostname: "*.example.test"
            allowedRoutes: {namespaces: {from: All}}
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata: {namespace: gateway, name: internal}
      spec:
        listeners:
          - {name: http, port: 80, protocol: HTTP}
  request:
    changes:
      - op: addDomain
        workload: {kind: Deployment, name: web}
        hostname: b.example.test
