apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - name: http
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-a-example-test
  namespace: demo
  resourceVersion: "3"
spec:
  parentRefs: [{name: public, namespace: gateway, sectionName: https}]
  hostnames: [a.example.test]
  rules:
    - backendRefs: [{name: web, port: 8080}]
