description: "Limiting where a workload connects creates a NetworkPolicy for Egress that selects its pods and keeps the project and DNS."
operation: mutation.plan
params:
  request:
    changes:
      - op: egressLimit
        workload: {kind: Deployment, name: web}
        enabled: true
        cidrs: [203.0.113.0/24, 198.51.100.7]
