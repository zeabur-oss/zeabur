apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
  managedFields:
    - manager: kubectl-client-side-apply
      operation: Update
      apiVersion: apps/v1
      fieldsType: FieldsV1
      fieldsV1:
        f:spec:
          f:template:
            f:spec:
              f:containers:
                'k:{"name":"app"}':
                  f:env:
                    'k:{"name":"LOG_LEVEL"}':
                      .: {}
                      f:name: {}
                      f:value: {}
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:1.0
          env:
            - name: LOG_LEVEL
              value: info
            - name: MODE
              value: production
