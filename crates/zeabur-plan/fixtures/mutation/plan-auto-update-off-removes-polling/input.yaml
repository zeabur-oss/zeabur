apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: demo
  resourceVersion: "52"
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "0 0 3 * * 0"
    zeabur.com/icon: redis
spec:
  serviceName: redis
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:latest
