apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:1.0
          env:
            - name: MODE
              valueFrom:
                configMapKeyRef: {name: settings, key: MODE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: demo
  resourceVersion: "7"
data:
  MODE: production
