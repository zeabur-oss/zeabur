apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: demo
  uid: 7d1f5c2a-0000-4000-8000-000000000001
  resourceVersion: "9"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: demo-shop-basic-auth@kubernetescrd
spec:
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 8080}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shop-basic-auth
  namespace: demo
  uid: 7d1f5c2a-0000-4000-8000-000000000002
  resourceVersion: "10"
  ownerReferences:
    - {apiVersion: networking.k8s.io/v1, kind: Ingress, name: shop, uid: 7d1f5c2a-0000-4000-8000-000000000001}
spec:
  basicAuth: {secret: shop-basic-auth, removeHeader: true}
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-basic-auth
  namespace: demo
  uid: 7d1f5c2a-0000-4000-8000-000000000003
  resourceVersion: "11"
type: Opaque
