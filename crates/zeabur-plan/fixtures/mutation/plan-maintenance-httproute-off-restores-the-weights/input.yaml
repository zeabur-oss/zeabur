apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: web-www, namespace: demo, resourceVersion: "5"}
spec:
  parentRefs: [{name: public, namespace: gateway}]
  hostnames: [www.shop.example.test]
  rules:
    - matches: [{path: {type: PathPrefix, value: /api}}]
      backendRefs: [{name: api, port: 9000, weight: 0}, {name: error-pages, port: 8081, weight: 1}]
    - backendRefs: [{name: web, port: 8080, weight: 0}, {name: error-pages, port: 8081, weight: 1}]

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: error-pages
  labels: {zeabur.com/page-server: "true"}
  namespace: demo
  resourceVersion: "4"
data:
  502.html: "<p>502</p>"
  503.html: "<p>503</p>"
  504.html: "<p>504</p>"
  maintenance.html: "<p>Back soon</p>"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: error-pages, namespace: demo, resourceVersion: "5"}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: error-pages}}
  template:
    metadata: {labels: {app.kubernetes.io/name: error-pages}}
    spec:
      containers: [{name: nginx, image: nginx}]
---
apiVersion: v1
kind: Service
metadata:
  name: error-pages
  labels: {zeabur.com/page-server: "true"}
  namespace: demo
  resourceVersion: "6"
spec:
  selector: {app.kubernetes.io/name: error-pages}
  ports: [{name: pages, port: 8080}, {name: maintenance, port: 8081}]
