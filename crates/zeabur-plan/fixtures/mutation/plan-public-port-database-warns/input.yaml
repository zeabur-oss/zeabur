apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: demo
  resourceVersion: "12"
spec:
  serviceName: db
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - {name: postgres, containerPort: 5432}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo
spec:
  type: ClusterIP
  selector: {app: db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres, protocol: TCP}
