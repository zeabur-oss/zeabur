apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: app
          image: example/web:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector: {app: web}
  ports:
    - {port: 8080, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: web-public-8080
  namespace: demo
  resourceVersion: "7"
  labels: {app.kubernetes.io/name: web}
spec:
  type: LoadBalancer
  selector: {app: web}
  ports:
    - {port: 8080, protocol: TCP, nodePort: 31234}
