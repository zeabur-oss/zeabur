description: "The container imports web-defaults, which holds PORT=8080, and then web-config, which holds no PORT. The request first sets PORT=8080 in web-config, which then wins, and moves the port. The port change sets PORT=3000 in web-config and leaves web-defaults alone."
operation: mutation.plan
params:
  request:
    changes:
      - op: data
        kind: ConfigMap
        name: web-config
        changes:
          - {op: set, key: PORT, value: "8080"}
      - {op: port, workload: {kind: Deployment, name: web}, from: 8080, to: 3000}
