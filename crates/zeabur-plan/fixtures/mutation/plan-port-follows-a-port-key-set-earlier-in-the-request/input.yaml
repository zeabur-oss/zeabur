apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  resourceVersion: "41"
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: web}
  template:
    metadata:
      labels: {app.kubernetes.io/name: web}
    spec:
      containers:
        - name: web
          image: registry.local/demo/web:1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: web-defaults}
            - configMapRef: {name: web-config}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-defaults
  namespace: demo
  resourceVersion: "5"
data: {PORT: "8080"}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: demo
  resourceVersion: "6"
data: {LOG_LEVEL: info}
