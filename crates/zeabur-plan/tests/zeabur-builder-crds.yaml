                      "maxLength": 1024,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "conditions": {
                    "description": "`Ready`, `Reconciling` and `Stalled` as kstatus reads them, with `SourceReady` and\n`BuilderReady` as the causes. `Ready` is `True` only when the newest run of the current\n`metadata.generation` succeeded. A `Build` with no `observedGeneration` is a new one, and\nits first status write marks that the controller has cleared its repositories.",
                    "items": {
                      "description": "A status condition, as `metav1.Condition`.",
                      "properties": {
                        "lastTransitionTime": {
                          "description": "When the status last changed (RFC 3339).",
                          "format": "date-time",
                          "type": "string"
                        },
                        "message": {
                          "description": "A human-readable message.",
                          "maxLength": 32768,
                          "type": "string"
                        },
                        "observedGeneration": {
                          "description": "The `metadata.generation` the condition was computed from.",
                          "format": "int64",
                          "minimum": 0.0,
                          "nullable": true,
                          "type": "integer"
                        },
                        "reason": {
                          "description": "A `CamelCase` reason.",
                          "maxLength": 1024,
                          "minLength": 1,
                          "type": "string"
                        },
                        "status": {
                          "description": "`True`, `False` or `Unknown`.",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ],
                          "type": "string"
                        },
                        "type": {
                          "description": "The type.",
                          "enum": [
                            "Ready",
                            "SourceReady",
                            "BuilderReady",
                            "Reconciling",
                            "Stalled",
                            "Unknown"
                          ],
                          "type": "string"
                        }
                      },
                      "required": [
                        "lastTransitionTime",
                        "reason",
                        "status",
                        "type"
                      ],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "exposedPorts": {
                    "description": "Ports the newest successful build's image declares in its `ExposedPorts`, as the image\nconfig writes them (`3000/tcp`, `53/udp`), sorted. Empty when it declares none.",
                    "items": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
                  "lastBuildRunRef": {
                    "description": "The newest `BuildRun`.",
                    "maxLength": 253,
                    "nullable": true,
                    "type": "string"
                  },
                  "lastResolvedAt": {
                    "description": "When the ref was last resolved.",
                    "format": "date-time",
                    "nullable": true,
                    "type": "string"
                  },
                  "lastRunGeneration": {
                    "description": "The `metadata.generation` the controller last created a `BuildRun` for. A different\ngeneration builds the revision again; deleting that run does not.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "lastRunRevision": {
                    "description": "The revision the controller last created a `BuildRun` for. Deleting that run does not\nbuild the revision again.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "lastWebhookAt": {
                    "description": "When a webhook last woke this `Build`; written by the receiver only. Later than\n`lastResolvedAt`: the ref is asked again.",
                    "format": "date-time",
                    "nullable": true,
                    "type": "string"
                  },
                  "latestImage": {
                    "description": "Its image, `<repository>:<tag>@<digest>`.",
                    "maxLength": 1024,
                    "nullable": true,
                    "type": "string"
                  },
                  "latestRevision": {
                    "description": "The commit or archive digest of the newest successful build.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "observedGeneration": {
                    "description": "The generation last acted on.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "plan": {
                    "description": "The plan of the newest successful run with a planner. A new run reuses it while the\n`Build` names the builder that made it, unless the `Build` has\n`builder.zeabur.com/plan: fresh`.",
                    "nullable": true,
                    "properties": {
                      "builder": {
                        "description": "The `ClusterBuilder` whose planner wrote it.",
                        "maxLength": 253,
                        "type": "string"
                      },
                      "image": {
                        "description": "The plan artifact, `<repository>@<digest>`.",
                        "maxLength": 1024,
                        "type": "string"
                      }
                    },
                    "required": [
                      "builder",
                      "image"
                    ],
                    "type": "object"
                  },
                  "remoteRevision": {
                    "description": "The commit the ref points at, or the archive's digest.",
                    "maxLength": 71,
                    "nullable": true,
                    "pattern": "^([0-9a-f]{40}|sha256:[0-9a-f]{64})$",
                    "type": "string"
                  },
                  "resolvedRef": {
