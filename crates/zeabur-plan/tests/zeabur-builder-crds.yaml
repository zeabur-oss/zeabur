                    "description": "The namespace's buildkitd Pod, such as `buildkitd-team-a-0`, set once the run is admitted.",
                    "maxLength": 253,
                    "nullable": true,
                    "type": "string"
                  },
                  "cacheStats": {
                    "description": "Build steps and cache hits.",
                    "nullable": true,
                    "properties": {
                      "cached": {
                        "description": "Steps answered from cache.",
                        "format": "int64",
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "total": {
                        "description": "Distinct steps.",
                        "format": "int64",
                        "minimum": 0.0,
                        "type": "integer"
                      }
