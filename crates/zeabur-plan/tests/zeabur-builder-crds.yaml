                          "maxLength": 1024,
                          "minLength": 1,
                          "type": "string"
                        },
                        "status": {
                          "description": "`True`, `False` or `Unknown`.",
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ],
                          "type": "string"
                        },
                        "type": {
                          "description": "The type.",
                          "enum": [
                            "Ready",
                            "SourceReady",
                            "BuilderReady",
                            "Reconciling",
                            "Stalled",
                            "Unknown"
                          ],
                          "type": "string"
                        }
                      },
                      "required": [
