                        "reason",
                        "status",
                        "type"
                      ],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "exposedPorts": {
                    "description": "Ports the image declares in its `ExposedPorts`, as the image config writes them\n(`3000/tcp`), sorted.",
                    "items": {
                      "maxLength": 32,
                      "type": "string"
                    },
                    "maxItems": 32,
                    "type": "array"
                  },
