                      "cached": {
                        "description": "Whether it came from cache.",
                        "type": "boolean"
                      },
                      "completionTime": {
                        "description": "When it finished.",
                        "format": "date-time",
                        "nullable": true,
                        "type": "string"
                      },
                      "message": {
                        "description": "Its error.",
                        "maxLength": 120,
                        "type": "string"
                      },
                      "name": {
                        "description": "Its name, such as `[2/3] RUN npm ci`.",
                        "maxLength": 120,
                        "type": "string"
                      },
                      "startTime": {
                        "description": "When it started.",
                        "format": "date-time",
                        "nullable": true,
                        "type": "string"
                      },
