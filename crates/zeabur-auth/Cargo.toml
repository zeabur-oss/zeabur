[package]
name = "zeabur-auth"
description = "zeabur: signing people in through Zeabur Identity as a confidential OAuth client, and their sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# An in-process issuer for tests (`testing`), also used by the `zeabur` binary's tests.
testing = ["dep:axum", "tokio/net", "tokio/rt"]

[dependencies]
zeabur-core.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
zeabur-test-support = { workspace = true, features = ["tls"] }
