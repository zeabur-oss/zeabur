[package]
name = "engawa-modules"
description = "engawa: integrations with components installed in a cluster, one module per provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The JSON Schema of `PrometheusRange`, a tool argument of engawa-mcp; the API describes it with
# utoipa.
schemars = ["dep:schemars"]

[dependencies]
engawa-adapters.workspace = true
engawa-kube.workspace = true
engawa-model.workspace = true
k8s-openapi.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
utoipa.workspace = true

[dev-dependencies]
engawa-test-support.workspace = true
