apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:1.0
          ports:
            - name: web
              containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: api-1
  namespace: demo
  labels:
    app: api
spec:
  containers:
    - name: api
      image: example/api:1.0
status:
  phase: Running
  containerStatuses:
    - name: api
      image: example/api:1.0
      imageID: ""
      ready: true
      restartCount: 0
      state:
        running:
          startedAt: "2026-10-15T11:00:00Z"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
