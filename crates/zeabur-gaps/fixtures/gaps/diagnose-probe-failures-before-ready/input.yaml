apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo
spec:
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: example/api:2.0
          readinessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: api-started
  namespace: demo
  labels:
    app: api
spec:
  containers:
    - name: api
      image: example/api:2.0
      readinessProbe:
        tcpSocket:
          port: 8080
status:
  phase: Running
  conditions:
    - type: Ready
      status: "True"
      lastTransitionTime: "2026-10-15T11:58:10Z"
  containerStatuses:
