apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example/web:1.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: web-1
  namespace: demo
  labels:
    app: web
spec:
  containers:
    - name: web
      image: example/web:1.0
status:
  phase: Running
  containerStatuses:
    - name: web
      image: example/web:1.0
      imageID: ""
      ready: true
      restartCount: 0
      state:
        running:
          startedAt: "2026-10-17T10:00:00Z"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: c-missing-port
  namespace: demo
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gw
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: web
          port: 8081
          weight: 1
status:
  parents:
    - conditions:
        - lastTransitionTime: "2026-10-17T10:02:18Z"
          message: ""
          observedGeneration: 1
          reason: Accepted
          status: "True"
          type: Accepted
        - lastTransitionTime: "2026-10-17T10:02:18Z"
          message: 'Cannot load HTTPBackendRef demo/web: service port 8081 not found'
          observedGeneration: 1
          reason: BackendNotFound
          status: "False"
          type: ResolvedRefs
      controllerName: traefik.io/gateway-controller
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: gw
