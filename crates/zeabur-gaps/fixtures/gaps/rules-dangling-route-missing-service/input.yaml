apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: example/web:1.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shop
spec:
  selector:
    app: web
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shop
spec:
  selector:
    app: api
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: shop
spec:
  defaultBackend:
    service:
      name: fallback
      port:
        number: 80
  rules:
    - host: shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: fallback
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthy
  namespace: shop
spec:
  rules:
    - host: api.shop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-route
  namespace: shop
spec:
  parentRefs:
    - name: public
      namespace: infra
  hostnames: [www.shop.example.test]
  rules:
    - backendRefs:
        - name: web
          port: 80
        - name: billing-api
          namespace: billing
          port: 80
        - name: shared
          group: multicluster.x-k8s.io
          kind: ServiceImport
          port: 80
    - backendRefs:
        - name: frontned
          port: 80
        # Weight 0 forwards nothing, so a missing Service here loses no request.
        - name: retired
          port: 80
          weight: 0
status:
  parents:
    - parentRef:
        name: public
        namespace: infra
      controllerName: example.test/gateway-controller
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
        - type: ResolvedRefs
          status: "False"
          reason: BackendNotFound
