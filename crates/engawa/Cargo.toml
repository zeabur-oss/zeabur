[package]
name = "engawa"
description = "Kubernetes made simple and secure by default: the in-cluster server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ui"]
ui = ["dep:engawa-ui"]

[dependencies]
engawa-api.workspace = true
engawa-auth.workspace = true
engawa-core.workspace = true
engawa-kube.workspace = true
engawa-plan.workspace = true
engawa-ui = { workspace = true, optional = true }
axum.workspace = true
clap.workspace = true
form_urlencoded.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
engawa-auth = { workspace = true, features = ["testing"] }
http-body-util.workspace = true
tower.workspace = true
