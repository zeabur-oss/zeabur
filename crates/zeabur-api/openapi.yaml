  "/api/v1/projects/{project}/pods/{pod}/exec":
    get:
      tags:
      - pods
      summary: A terminal in a container, over a WebSocket.
      description: |-
        Binary messages carry terminal bytes both ways; text messages are JSON control frames,
        `ClientFrame` to the server and `ServerFrame` to the browser. The handshake answers `101
        Switching Protocols`; every later failure (`403` with `denied` naming `get` on
        `pods/exec`, `elevation-required` where admin rights are offered and not in use; a pod or
        container that does not exist, a container that is not running) arrives as an `error` frame,
        which a browser can read where it cannot read a refused handshake. After `exit` or `error` the
        server closes with `1000`; it closes with `4000` when the credential in use expires (the admin
        one's while it is in use) and `4001` after 15 minutes without a byte either way. A handshake
        from another origin is refused with `403`.
      operationId: exec
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: pod
        in: path
        required: true
        schema:
          type: string
      - name: container
        in: query
        description: |-
          The container; by default the one the pod's `kubectl.kubernetes.io/default-container`
          annotation names, or its first.
        required: false
        schema:
          type: string
      - name: command
        in: query
        description: >-
          The command, one argument per parameter (`command=ls&command=-l`); `/bin/sh` by
          default.
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "101":
          description: Switched to the terminal's WebSocket
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
