      - name: pod
        in: path
        required: true
        schema:
          type: string
      - name: container
        in: query
        description: The container; required when the pod has several.
        required: false
        schema:
          type: string
      - name: tailLines
        in: query
        description: Only the last lines (default 500).
        required: false
        schema:
          type: integer
          format: int64
      - name: sinceSeconds
        in: query
        description: Only lines newer than this many seconds.
        required: false
        schema:
          type: integer
          format: int64
      - name: previous
        in: query
        description: The previous instance of the container, after a restart.
        required: false
        schema:
