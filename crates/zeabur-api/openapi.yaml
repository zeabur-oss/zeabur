              schema:
                $ref: "#/components/schemas/Files"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
