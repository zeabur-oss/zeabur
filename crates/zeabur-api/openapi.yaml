          additionalProperties:
            type: string
          propertyNames:
            type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/BackupProvider"
          description: The providers this build has.
        runs:
          type: array
          items:
            $ref: "#/components/schemas/BackupRun"
          description: The newest runs, newest first, ten at most.
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/BackupSchedule"
          description: Every schedule that covers something of the project.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
        unscheduled:
          type: array
          items:
            $ref: "#/components/schemas/BackupTarget"
          description: Claims and databases no active schedule covers.
    ProjectBuildRun:
      allOf:
      - $ref: "#/components/schemas/ZeaburBuilderRun"
        description: The run.
      - type: object
        required:
        - containers
        properties:
          containers:
            type: array
            items:
              type: string
            description: The pod's containers, in the order they run (`fetch`, `plan`, `build`).
          pod:
            type:
            - string
            - "null"
            description: Its pod, while it is there.
      description: A run and the pod that ran it.
    ProjectBuilds:
      type: object
      description: A project's builds.
      required:
      - state
      - builds
      - runs
      - keel
      - unreadable
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/ZeaburBuilderBuild"
          description: The `Build`s, by name.
        keel:
          type: array
          items:
            $ref: "#/components/schemas/KeelPolicy"
          description: The workloads Keel updates; read only when there is a `Build`.
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ProjectBuildRun"
          description: Their runs, newest first.
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether Zeabur Builder could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    ProjectDatabases:
      type: object
      description: A project's databases.
      required:
      - operators
      - items
      - unreadable
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Database"
          description: The databases, by engine, then name.
        operators:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseOperator"
          description: One per engine this build knows.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    ProjectDetails:
      type: object
      description: |-
        A project's details, as its namespace's annotations give them. Each is absent when its
        annotation is missing or blank (or, for the icon, names no built-in icon).
      properties:
        description:
          type:
          - string
          - "null"
          description: What the project is.
        displayName:
          type:
          - string
          - "null"
          description: The name to show instead of the namespace's.
        icon:
          oneOf:
          - $ref: "#/components/schemas/ProjectIcon"
            description: Its icon.
          - type: "null"
    ProjectDocument:
      allOf:
      - $ref: "#/components/schemas/Project"
        description: The projection.
      - type: object
        required:
        - id
        - unreadable
        - extensions
        properties:
          extensions:
            $ref: "#/components/schemas/ProjectExtensions"
            description: >-
              What the integrations add, by module; a module whose API is not served adds
              nothing.
          id:
            type: string
            description: "`projects/<name>`."
          unreadable:
            type: array
            items:
              $ref: "#/components/schemas/UnreadableView"
            description: Kinds the person could not list; the projection is missing what they hide.
      description: |-
        A project: its services, the resources they use and how they relate, read as the person.
        
        The one document a client needs for a project: the service, variables and objects views are
        cut from it rather than read again.
    ProjectExtensions:
      type: object
      description: What integrations add to a project document, one member per module.
      properties:
        networkPolicy:
          oneOf:
          - $ref: "#/components/schemas/NetworkPolicyReachability"
            description: |-
              Who may reach each service, from the project's NetworkPolicy objects. Whether the
              cluster's network plugin enforces them is not known.
          - type: "null"
    ProjectGrant:
      type: object
      description: A member's role in a project.
      required:
      - project
      - role
      properties:
        project:
          type: string
          description: The project (its namespace).
        role:
          $ref: "#/components/schemas/ProjectRole"
          description: The role there.
      additionalProperties: false
    ProjectHealth:
      type: object
      description: |-
        How many of a project's services are in each state, for lists that show a project's health
        without its whole document.
      required:
      - services
      - healthy
      - progressing
      - warning
      - failing
      properties:
        failing:
          type: integer
          description: Services failing ([`Health::Fail`]).
          minimum: 0
        healthy:
          type: integer
          description: "Services that are fine: [`Health::Ok`] or [`Health::Idle`]."
          minimum: 0
        progressing:
          type: integer
          description: Services rolling out ([`Health::Progress`]).
          minimum: 0
        services:
          type: integer
          description: Services (workloads, without the Jobs a CronJob runs).
          minimum: 0
        warning:
          type: integer
          description: Services with too few ready replicas ([`Health::Warn`]).
          minimum: 0
    ProjectIcon:
      type: string
      description: |-
        The icons a project may have: a built-in set, so nothing is uploaded and the interface draws
        each from its own icon font. An annotation naming another value is ignored.
      enum:
      - folder
      - globe
      - storefront
      - rocket
      - cube
      - database
      - cloud
      - code
      - terminal
      - chart
      - chat
      - book
      - flask
      - game
      - heart
      - briefcase
    ProjectList:
      type: object
      description: The projects (namespaces) the person may list.
      required:
      - items
      - canCreate
      properties:
        canCreate:
          $ref: "#/components/schemas/Permission"
          description: >-
            Whether the person may create a project (`create` on `namespaces`,
            cluster-wide).
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
          description: Adopted projects first, then the other namespaces, each sorted by name.
    ProjectNamespace:
      allOf:
      - $ref: "#/components/schemas/ProjectDetails"
        description: The name, description and icon given to it.
      - type: object
        required:
        - origin
        - name
        - adopted
        - system
        - canChange
        - canAdopt
        - can
        - labelsGuarded
        - workloadPatch
        properties:
          adopted:
            type: boolean
            description: It carries Zeabur's project label.
          can:
            $ref: "#/components/schemas/ProjectRights"
            description: |-
              What you may change in the project. A project Viewer may change nothing, nor read the
              pods' logs.
          canAdopt:
            $ref: "#/components/schemas/Permission"
            description: |-
              Whether the person may adopt it or let it go: patch it, and where the admission policy
              guards its labels, also `zeabur-manage` it. Changing its Pod Security level needs the
              same.
          canChange:
            $ref: "#/components/schemas/Permission"
            description: "Whether the person may patch the Namespace: change its details."
          labelsGuarded:
            type: boolean
            description: |-
              The chart's admission policy is installed: patching the Namespace without `zeabur-manage`
              changes only its details.
          name:
            type: string
            description: Its name.
          origin:
            $ref: "#/components/schemas/Origin"
            description: The Namespace.
          podSecurity:
            oneOf:
            - $ref: "#/components/schemas/PodSecurityLevel"
              description: |-
                The Pod Security level enforced in it, its `pod-security.kubernetes.io/enforce` label;
                absent when the label is not set, and the cluster's default applies, or names no level.
            - type: "null"
          role:
            oneOf:
            - $ref: "#/components/schemas/AccountRole"
              description: >-
                Your role in the project, from your rights there; absent when they could not be
                read.
            - type: "null"
          system:
            type: boolean
            description: Kubernetes keeps it for itself (`kube-` prefix); it cannot be adopted.
          workloadPatch:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadPatch"
            description: |-
              Which Deployments, StatefulSets and DaemonSets the person may patch (change their
              variables).
      description: A project's Namespace.
    ProjectObjectStorage:
      type: object
      description: A project's object storage.
      required:
      - module
      - state
      - items
      - unreadable
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SeaweedObjectStorage"
          description: The stores, by name.
        module:
          type: string
          description: The operator's module (`seaweedfs-operator`).
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether its objects could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    ProjectRights:
      type: object
      description: What the person may change in one project.
      required:
      - deploy
      - changeServices
      - deleteServices
      - scale
      - readSecrets
      - changeSecrets
      - changeConfig
      - changeDomains
      - changeStorage
      - changeDatabases
      - backUpDatabases
      - changeObjectStorage
      - backUpVolumes
      - openTerminal
      - readLogs
      - build
      - deployFromGit
      - changeNetworkPolicies
      - changeMembers
      properties:
        backUpDatabases:
          $ref: "#/components/schemas/Permission"
          description: "Back up databases: `create` on an operator's backups."
        backUpVolumes:
          $ref: "#/components/schemas/Permission"
          description: "Back up volumes: `create` on K8up's schedules, backups and pod configs."
        build:
          $ref: "#/components/schemas/Permission"
          description: "Build again: `patch` on Zeabur Builder's builds."
        changeConfig:
          $ref: "#/components/schemas/Permission"
          description: "Create and change ConfigMaps: `create` and `patch` on configmaps."
        changeDatabases:
          $ref: "#/components/schemas/Permission"
          description: Create, change and delete databases of any operator Zeabur knows.
        changeDomains:
          $ref: "#/components/schemas/Permission"
          description: "Add, change and remove domains: `create`, `patch` and `delete` on ingresses or HTTPRoutes."
        changeMembers:
          $ref: "#/components/schemas/Permission"
          description: "Give people access to the project: `create` on rolebindings."
        changeNetworkPolicies:
          $ref: "#/components/schemas/Permission"
          description: "Change network policies: `create` and `patch` on networkpolicies."
        changeObjectStorage:
          $ref: "#/components/schemas/Permission"
          description: |-
            Create, change and delete object storage: `create`, `patch` and `delete` on the `SeaweedFS`
            Operator's seaweeds.
        changeSecrets:
          $ref: "#/components/schemas/Permission"
          description: "Create and change Secrets: `create` and `patch` on secrets."
        changeServices:
          $ref: "#/components/schemas/Permission"
          description: "Change, restart and redeploy services: `patch` on a workload kind."
        changeStorage:
          $ref: "#/components/schemas/Permission"
          description: "Add and change volumes: `create` and `patch` on persistentvolumeclaims."
        deleteServices:
          $ref: "#/components/schemas/Permission"
          description: "Delete services: `delete` on a workload kind."
        deploy:
          $ref: "#/components/schemas/Permission"
          description: "Create services: `create` on deployments and services."
        deployFromGit:
          $ref: "#/components/schemas/Permission"
          description: "Deploy a service from Git: `create` on deployments, services and Zeabur Builder's builds."
        openTerminal:
          $ref: "#/components/schemas/Permission"
          description: "Open a terminal in a container: `create` on `pods/exec`."
        readLogs:
          $ref: "#/components/schemas/Permission"
          description: "Read the pods' logs: `get` on `pods/log`."
        readSecrets:
          $ref: "#/components/schemas/Permission"
          description: "Read Secret values: `get` on secrets."
        scale:
          $ref: "#/components/schemas/Permission"
          description: "Change the number of replicas: `patch` on `deployments/scale` or `statefulsets/scale`."
    ProjectRole:
      type: string
      description: What a member may do in one project.
      enum:
      - developer
      - viewer
    ProjectStorage:
      type: object
      description: A project's storage.
      required:
      - id
      - classes
      - claims
      - unreadable
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/ClaimStorage"
          description: The project's PersistentVolumeClaims, by name.
        classes:
          type: array
          items:
            $ref: "#/components/schemas/StorageClassView"
          description: >-
            The cluster's `StorageClasses`, the default first; empty when they may not be
            listed.
        id:
          type: string
          description: "`projects/{project}/storage`."
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: |-
            What could not be read: `storageclasses.storage.k8s.io`, `persistentvolumeclaims`,
            `persistentvolumes`.
    ProjectSummary:
      allOf:
      - $ref: "#/components/schemas/ProjectDetails"
        description: The name, description and icon given to it (its namespace's annotations).
      - type: object
        required:
        - id
        - origin
        - name
        - adopted
        - system
        properties:
          adopted:
            type: boolean
            description: |-
              Whether the namespace carries Zeabur's project label. Any namespace can be opened; adopting
              it only adds the label.
          health:
            oneOf:
            - $ref: "#/components/schemas/ProjectHealth"
              description: |-
                How many of its services are healthy, rolling out, warning or failing. Only for adopted
                projects, and absent when their workloads cannot be read.
            - type: "null"
          id:
            type: string
            description: "`projects/<name>`."
          name:
            type: string
            description: "The project's name: its namespace's name."
          origin:
            $ref: "#/components/schemas/Origin"
            description: The namespace.
          services:
            type:
            - array
            - "null"
            items:
              $ref: "#/components/schemas/ServiceSummary"
            description: |-
              Its services with their health, from the same read as `health`: sorted by kind, then
              name, as in the project document. Only for adopted projects, and absent when their
              workloads cannot be read.
          system:
            type: boolean
            description: |-
              The namespace is one Kubernetes keeps for itself (`kube-` prefix), which cannot be
              adopted.
      description: A project in the list.
    ProjectUsage:
      type: object
      description: What a project's pods use now.
      required:
      - id
      - state
      - pods
      - unreadable
      properties:
        id:
          type: string
          description: "`projects/{project}/usage`."
        pods:
          type: array
          items:
            $ref: "#/components/schemas/PodUsage"
          description: Every pod with a sample, by name. A running pod missing here has none yet.
        state:
          $ref: "#/components/schemas/MetricsState"
          description: Whether usage could be read.
        timestamp:
          type:
          - string
          - "null"
          description: When the newest sample was taken (RFC 3339).
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
        window:
          type:
          - string
          - "null"
          description: The window CPU is averaged over, as metrics-server writes it (`15s`).
    PrometheusRange:
      type: string
      description: How far back a history reaches.
      enum:
      - 1h
      - 6h
      - 24h
      - 7d
    PrometheusRestart:
      type: object
      description: A restart of a pod's container.
      required:
      - pod
      - at
      - oomKilled
      properties:
        at:
          type: integer
          format: int64
          description: The end of the step it happened in (Unix seconds).
        oomKilled:
          type: boolean
          description: "Its container had last ended `OOMKilled` by then: it went over its memory limit."
        pod:
          type: string
          description: The pod.
    PrometheusSeries:
      type: object
      description: One pod's values, one per time of the range; `null` where it had no sample.
      required:
      - pod
      - values
      properties:
        pod:
          type: string
          description: The pod.
        values:
          type: array
          items:
            type:
            - number
            - "null"
            format: double
          description: The values.
    ProtocolInference:
      type: object
      description: A port's application protocol and how it was decided.
      required:
      - protocol
      - inferredFrom
      properties:
        inferredFrom:
          $ref: "#/components/schemas/InferredFrom"
          description: The signal that decided it.
        protocol:
          $ref: "#/components/schemas/PortProtocol"
          description: The protocol.
    Provenance:
      type: object
      description: Which tool manages an object, if any.
      required:
      - warnBeforeEdit
      properties:
        managedBy:
          type:
          - string
          - "null"
          description: The `app.kubernetes.io/managed-by` label, verbatim.
        tool:
          oneOf:
          - $ref: "#/components/schemas/Tool"
            description: The managing tool, when its labels or annotations are present.
          - type: "null"
        warnBeforeEdit:
          type: boolean
          description: A direct edit is likely to be reverted, so a client warns before making one.
    ProviderState:
      type: string
      description: Whether a provider's objects could be read.
      enum:
      - installed
      - not-installed
      - refused
    PublicPortChange:
      type: object
      description: A [`Change::PublicPort`].
      required:
      - workload
      - service
      - port
      properties:
        port:
          type: integer
          format: int32
          description: The Service port. It is also the port on the internet.
        remove:
          type: boolean
          description: "Close the port instead: delete the `LoadBalancer` Service that opened it."
        service:
          type: string
          description: The workload's Service that has the port.
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: The workload.
    Quantities:
      type: object
      description: >-
        CPU and memory as Kubernetes quantity strings, such as `250m` and `512Mi`, and
        as numbers.
      properties:
        cpu:
          type:
          - string
          - "null"
          description: CPU.
        cpuMillicores:
          type:
          - integer
          - "null"
          format: int64
          description: CPU in millicores, rounded up; absent when `cpu` is absent or not a quantity.
          minimum: 0
        memory:
          type:
          - string
          - "null"
          description: Memory.
        memoryBytes:
          type:
          - integer
          - "null"
          format: int64
          description: Memory in bytes, rounded up; absent when `memory` is absent or not a quantity.
          minimum: 0
    ReadOnlyReason:
      oneOf:
      - type: object
        description: |-
          Another field manager owns the container's `envFrom`. The list is atomic, so changing one
          entry takes the whole list from that manager and its next apply conflicts.
        required:
        - manager
        - reason
        properties:
          manager:
            type: string
            description: The field manager.
          reason:
            type: string
            enum:
            - listManagedBy
      - type: object
        description: >-
          The imported object is managed by a tool that restores its contents on the next
          sync.
        required:
        - tool
        - reason
        properties:
          reason:
            type: string
            enum:
            - sourceManagedBy
          tool:
            $ref: "#/components/schemas/Tool"
            description: The tool.
      description: |-
        Why an `envFrom` entry is read-only. Either way the way out is the same: override one
        variable with a same-named `env` entry, which takes precedence and leaves the import alone.
    Readiness:
      type: string
      description: Whether an issuer is ready, from its `Ready` condition.
      enum:
      - ready
      - notReady
      - unknown
    RedirectChange:
      type: object
      description: A [`Change::Redirect`].
      required:
      - route
      - workload
      - hostname
      properties:
        hostname:
          type: string
          description: The hostname that redirects.
        permanent:
          type: boolean
          description: "`301 Moved Permanently` when true, else `302 Found`."
        route:
          $ref: "#/components/schemas/RouteRef"
          description: The route.
        to:
          type:
          - string
          - "null"
          description: The hostname to redirect to; absent stops the redirect.
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: |-
            The workload the route sends requests to. An `HTTPRoute` that stops redirecting sends
            them to it again.
    Refers:
      type: object
      description: How a variable points at a database service.
      required:
      - service
      - part
      properties:
        part:
          $ref: "#/components/schemas/Part"
          description: What the value is.
        service:
          type: string
          description: The database service, by Kubernetes name.
    RegistryLogin:
      type: object
      description: Credentials for the image's registry.
      required:
      - server
      - username
      - password
      properties:
        password:
          type: string
          description: The password or access token.
        server:
          type: string
          description: The registry, such as `ghcr.io`; used only when it is the image's.
        username:
          type: string
          description: The username.
    Release:
      type: object
      description: One Kubernetes minor release and its support window. Dates are `YYYY-MM-DD`.
      required:
      - minor
      - released
      - maintenanceFrom
      - endOfLife
      properties:
        endOfLife:
          type: string
          description: The last day it gets patches.
        maintenanceFrom:
          type: string
          description: From this day only critical fixes are made ("maintenance mode").
        minor:
          type: string
          description: "`1.34`."
        released:
          type: string
          description: Its first release.
    ReleaseRef:
      type: object
      description: A release, as an entry names it.
      required:
      - revision
      - name
      - images
      - current
      properties:
        changeCause:
          type:
          - string
          - "null"
          description: "`kubernetes.io/change-cause`."
        current:
          type: boolean
          description: It runs now.
        images:
          type: array
          items:
            type: string
          description: Its images.
        name:
          type: string
          description: The `ReplicaSet` or `ControllerRevision`.
        revision:
          type: integer
          format: int64
          description: Its number.
    ReloaderState:
      type: string
      description: Whether Reloader runs.
      enum:
      - running
      - stopped
      - notInstalled
      - unknown
    Removal:
      type: object
      description: A field the plan removes.
      required:
      - target
      - path
      - before
      - leftOutOfEdit
      properties:
        before:
          type: string
          description: Its value now (redacted for a Secret).
        leftOutOfEdit:
          type: boolean
          description: It was left out of an edited YAML, rather than asked to be removed.
        path:
          type: string
          description: The field.
        target:
          $ref: "#/components/schemas/ObjectName"
          description: The object.
    RemovalRefusal:
      type: string
      description: Why a node cannot be removed now.
      enum:
      - lastNode
      - lastServer
      - notDrained
    Replicas:
      type: object
      description: Ready and desired replicas (per node for a DaemonSet, completions for a Job).
      required:
      - ready
      - desired
      properties:
        desired:
          type: integer
          format: int32
          description: Desired pods.
        ready:
          type: integer
          format: int32
          description: Ready (or, for a Job, succeeded) pods.
    Resource:
      type: object
      description: A resource of the namespace and the workloads it belongs to.
      required:
      - id
      - kind
      - name
      - attribution
      - provenance
      - origin
      properties:
        attribution:
          $ref: "#/components/schemas/Attribution"
          description: Owned, shared or orphan, and by which workloads.
        id:
          type: string
          description: >-
            Its resource name, `projects/<project>/resources/<kind>/<name>`; see
            [`crate::id`].
        keyCount:
          type:
          - integer
          - "null"
          description: For a ConfigMap or Secret, how many keys it holds, when known.
          minimum: 0
        kind:
          $ref: "#/components/schemas/ResourceKind"
          description: The resource's kind.
        name:
          type: string
          description: The resource's name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The resource object.
        provenance:
          $ref: "#/components/schemas/Provenance"
          description: The tool that manages the resource, if any.
        sharedVariables:
          type: boolean
          description: "A ConfigMap or Secret of shared variables, labelled `zeabur.com/shared-variables: \"true\"`."
    ResourceKind:
      type: string
      description: The kinds of resource attributed to workloads.
      enum:
      - ConfigMap
      - Ingress
      - PersistentVolumeClaim
      - Secret
      - Service
    ResourceRef:
      type: object
      description: A namespaced resource, as a request path names it.
      required:
      - version
      - resource
      properties:
        group:
          type: string
          description: The API group; empty for the core group.
        resource:
          type: string
          description: The resource (plural).
        version:
          type: string
          description: The version.
    Resources:
      type: object
      description: CPU, memory and pods in plain units.
      required:
      - cpuMillicores
      - memoryBytes
      properties:
        cpuMillicores:
          type: integer
          format: int64
          description: CPU in millicores (1000 is one core).
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          description: Memory in bytes.
          minimum: 0
        pods:
          type:
          - integer
          - "null"
          format: int64
          description: Pods; only where a count of pods applies.
          minimum: 0
    RevealedSecret:
      type: object
      description: A Secret's values, shown because the person asked.
      required:
      - origin
      - values
      properties:
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Secret.
        values:
          type: object
          description: Its values by key.
          additionalProperties:
            $ref: "#/components/schemas/SecretValue"
          propertyNames:
            type: string
    Risk:
      type: object
      description: A known risk of a component.
      required:
      - risk
      - mitigation
      properties:
        mitigation:
          type: string
          description: How to contain it.
        risk:
          type: string
          description: The risk.
    Rollout:
      type: object
      description: One workload whose pods a plan changes.
      required:
      - workload
      - actions
      - downtime
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RolloutAction"
          description: What happens to its pods.
        downtime:
          type: boolean
          description: There is a moment with no pod serving (on a node, for a DaemonSet).
        fields:
          type: array
          items:
            type: string
          description: The pod template fields that change, at most ten.
        fromReplicas:
          type:
          - integer
          - "null"
          format: int32
          description: Replicas before, for a scale.
        replicas:
          type:
          - integer
          - "null"
          format: int32
          description: Replicas after.
        strategy:
          type:
          - string
          - "null"
          description: "`RollingUpdate`, `Recreate` or `OnDelete`, for a roll."
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: The workload.
    RolloutAction:
      type: string
      description: What happens to a workload's pods.
      enum:
      - roll
      - scale
      - start
      - stop
      - pendingRestart
    RolloutProgress:
      type: object
      description: How far a service's rollout has come.
      required:
      - id
      - workload
      - status
      - message
      - desired
      - updated
      - updatedReady
      - old
      - oldReady
      - evidence
      - unreadable
      properties:
        desired:
          type: integer
          format: int32
          description: The pods it should have (nodes, for a DaemonSet).
        diagnoses:
          type: array
          items:
            $ref: "#/components/schemas/Diagnosis"
          description: The diagnoses of the new pods.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: The status fields it rests on.
        id:
          type: string
          description: "`projects/<project>/services/<kind>/<name>/rollout`."
        message:
          $ref: "#/components/schemas/Message"
          description: "`rollout.<progressing|done|paused|waitsForDeletion>` or `rollout.stuck.<reason>`."
        old:
          type: integer
          format: int32
          description: Pods of earlier releases still there.
        oldReady:
          type: integer
          format: int32
          description: Of those, ready.
        reason:
          oneOf:
          - $ref: "#/components/schemas/StuckReason"
            description: Why it is stuck.
          - type: "null"
        revision:
          type:
          - integer
          - "null"
          format: int64
          description: The release it rolls out.
        rollback:
          oneOf:
          - $ref: "#/components/schemas/PlanRequest"
            description: >-
              The changes that return to the release before, to send to `plan`; while it is
              not done.
          - type: "null"
        status:
          $ref: "#/components/schemas/RolloutStatus"
          description: Where it stands.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused.
        updated:
          type: integer
          format: int32
          description: Pods of the new release.
        updatedReady:
          type: integer
          format: int32
          description: Of those, ready.
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: The workload.
    RolloutStatus:
      type: string
      description: Where a rollout stands.
      enum:
      - progressing
      - done
      - stuck
      - paused
      - waitsForDeletion
    Route:
      type: object
      description: |-
        An Ingress or a Gateway API `HTTPRoute` routing to workloads' Services: how they are reached
        from outside.
      required:
      - name
      - hostnames
      - backends
      - rules
      - provenance
      - origin
      properties:
        backends:
          type: array
          items:
            type: string
          description: The Services it routes to, sorted, without duplicates.
        basicAuth:
          oneOf:
          - $ref: "#/components/schemas/RouteMiddleware"
            description: |-
              The middleware Zeabur makes for Traefik to ask for a user name and password; its Secret
              of users has the same name.
          - type: "null"
        class:
          type:
          - string
          - "null"
          description: |-
            Its class: `spec.ingressClassName`, else the older `kubernetes.io/ingress.class`
            annotation [k8s-ingress-class].
            
            [k8s-ingress-class]: https://kubernetes.io/docs/concepts/services-networking/ingress/#deprecated-annotation
        errorPages:
          oneOf:
          - $ref: "#/components/schemas/RouteMiddleware"
            description: The Traefik `errors` middleware Zeabur makes to show the project's error pages.
          - type: "null"
        hostnames:
          type: array
          items:
            type: string
          description: The hosts its rules match.
        issuer:
          type:
          - string
          - "null"
          description: |-
            The cert-manager issuer the Ingress names in `cert-manager.io/cluster-issuer` or
            `cert-manager.io/issuer`: cert-manager issues a certificate for each of its `spec.tls`
            entries [cm-ingress].
            
            [cm-ingress]: https://cert-manager.io/docs/usage/ingress/
        maintenance:
          type: array
          items:
            type: string
          description: The hosts that show the maintenance page instead of their workload, sorted.
        name:
          type: string
          description: The Ingress's or `HTTPRoute`'s name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Ingress object.
        provenance:
          $ref: "#/components/schemas/Provenance"
          description: The tool that manages the Ingress, if any.
        redirects:
          type: array
          items:
            $ref: "#/components/schemas/RouteMiddleware"
          description: |-
            The hosts that Traefik redirects to another host, with the middleware Zeabur makes,
            sorted by host.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RouteRule"
          description: |-
            Which requests reach which Service port: the default backend first, then each rule's
            paths in order. Every rule of the Ingress is listed, also those for other workloads'
            Services, so a client filters by `service`.
        tls:
          type: array
          items:
            $ref: "#/components/schemas/RouteTls"
          description: >-
            The Secret that holds each HTTPS host's certificate, from `spec.tls`, sorted by
            host.
        tlsHosts:
          type: array
          items:
            type: string
          description: |-
            The hosts its `spec.tls` serves over HTTPS, sorted, without duplicates. It says HTTPS is
            configured, not that the certificate is valid.
    RouteKind:
      type: string
      description: The kinds of route object.
      enum:
      - Ingress
      - HTTPRoute
    RouteMiddleware:
      type: object
      description: A Traefik `Middleware` an Ingress lists.
      required:
      - middleware
      properties:
        host:
          type:
          - string
          - "null"
          description: The host it acts on; absent when it acts on every host of the Ingress.
        middleware:
          type: string
          description: >-
            The `Middleware`'s name; on an `HTTPRoute`, which redirects with a filter, the
            route's.
        permanent:
          type:
          - boolean
          - "null"
          description: Whether that redirect is permanent (status 301 or 308).
        to:
          type:
          - string
          - "null"
          description: |-
            The host a redirect sends to, when the route says it: an `HTTPRoute`'s `RequestRedirect`
            filter. A Traefik redirect says it in its `Middleware`.
    RouteRef:
      type: object
      description: "A route object: an Ingress or a Gateway API `HTTPRoute`."
      required:
      - kind
      - name
      properties:
        kind:
          $ref: "#/components/schemas/RouteKind"
          description: "`Ingress` or `HTTPRoute`."
        name:
          type: string
          description: Its name.
    RouteRule:
      type: object
      description: "One backend of an Ingress: the requests that reach a Service port."
      required:
      - service
      - origin
      properties:
        host:
          type:
          - string
          - "null"
          description: The host it matches; absent matches every host.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The backend in its Ingress.
        path:
          type:
          - string
          - "null"
          description: The path it matches; absent for the default backend.
        pathType:
          type:
          - string
          - "null"
          description: "`Prefix`, `Exact` or `ImplementationSpecific`; absent for the default backend."
        port:
          type:
          - string
          - "null"
          description: The backend Service port, a number or a port name.
        service:
          type: string
          description: The backend Service's name.
    RouteTls:
      type: object
      description: The Secret an Ingress names for one HTTPS host.
      required:
      - host
      properties:
        host:
          type: string
          description: The host.
        secret:
          type:
          - string
          - "null"
          description: |-
            The `kubernetes.io/tls` Secret; absent when the entry names none and the controller's
            default certificate serves the host.
    RouteTrace:
      type: object
      description: The way to one address of a service.
      required:
      - kind
      - address
      - via
      - hops
      - status
      properties:
        address:
          type: string
          description: >-
            The domain (`*` for a rule without a host) or the Service's DNS name, with its
            port.
        domain:
          oneOf:
          - $ref: "#/components/schemas/DomainCheck"
            description: |-
              For a domain with a host: where its DNS should point, where it points, and its
              certificate.
          - type: "null"
        hops:
          type: array
          items:
            $ref: "#/components/schemas/Hop"
          description: The hops, in the order traffic takes them.
        kind:
          $ref: "#/components/schemas/AddressKind"
          description: A domain or the private address.
        status:
          $ref: "#/components/schemas/HopStatus"
          description: "`failed` when a hop failed, `unknown` when none failed and one is unknown, else `ok`."
        via:
          $ref: "#/components/schemas/Origin"
          description: "The object that makes the address: the Ingress, `HTTPRoute` or Service."
    RouteTraceView:
      allOf:
      - $ref: "#/components/schemas/RouteTrace"
        description: The way.
      - type: object
        properties:
          fix:
            oneOf:
            - $ref: "#/components/schemas/PlanRequest"
              description: |-
                The changes that fix its first failed hop, to send to `plan`; absent when Zeabur cannot
                write the fix.
            - type: "null"
      description: >-
        One address's way, and the plan that fixes where it stops when Zeabur can write
        one.
    RunAs:
      type: object
      description: |-
        The user and groups a workload's pods run as: its first container's security context, else
        the pod's. An absent user or group is the image's.
      properties:
        fsGroup:
          type:
          - integer
          - "null"
          format: int64
          description: The pod's `fsGroup`.
        group:
          type:
          - integer
          - "null"
          format: int64
          description: "`runAsGroup`."
        user:
          type:
          - integer
          - "null"
          format: int64
          description: "`runAsUser`."
    RunStatus:
      type: string
      description: How a run stands.
      enum:
      - running
      - succeeded
      - failed
    RuntimeAlerts:
      type: object
      description: Falco's recent alerts in one place.
      required:
      - state
      - items
      - unreadable
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FalcoAlert"
          description: |-
            Newest first. A report keeps its newest alerts only (100 when Zeabur Catalog installs
            Falco), so older ones may be gone.
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether the reports could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    S3Destination:
      type: object
      description: One S3 destination, without its keys.
      required:
      - name
      - endpoint
      - bucket
      - region
      - prefix
      - origin
      properties:
        bucket:
          type: string
          description: The bucket.
        endpoint:
          type: string
          description: The S3-compatible endpoint, `https://…`.
        name:
          type: string
          description: Its name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The ConfigMap.
        prefix:
          type: string
          description: A folder in the bucket that backups go under; empty for the bucket's root.
        region:
          type: string
          description: The region; empty when the service takes any.
    S3DestinationFields:
      type: object
      description: A destination's fields, and its keys.
      required:
      - name
      - endpoint
      - bucket
      properties:
        accessKeyId:
          type: string
          description: The access key ID; empty with the secret to keep the keys the destination has.
        bucket:
          type: string
          description: The bucket.
        endpoint:
          type: string
          description: The S3-compatible endpoint, `https://…`.
        name:
          type: string
          description: "Its name: lower-case letters, digits and `-`, at most 63."
        prefix:
          type: string
          description: A folder in the bucket.
        region:
          type: string
          description: The region.
        secretAccessKey:
          type: string
          description: The secret access key.
    S3DestinationWrite:
      type: object
      description: One object a plan writes.
      required:
      - action
      - kind
      - name
      - namespace
      properties:
        action:
          $ref: "#/components/schemas/S3DestinationWriteAction"
          description: What it does.
        afterYaml:
          type:
          - string
          - "null"
          description: The object as it will be, YAML, a Secret's values hidden; absent for a deletion.
        beforeYaml:
          type:
          - string
          - "null"
          description: The object as it is, YAML; absent for a creation and for a Secret.
        kind:
          type: string
          description: The object's kind.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace; empty for a Namespace.
    S3DestinationWriteAction:
      type: string
      description: What a write does.
      enum:
      - create
      - patch
      - delete
    S3Destinations:
      type: object
      description: The cluster's S3 destinations.
      required:
      - namespace
      - items
      - canChange
      - canUseKeys
      - unreadable
      properties:
        canChange:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may add, change and remove destinations.
        canUseKeys:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may read the keys, which copying them into a project needs.
        items:
          type: array
          items:
            $ref: "#/components/schemas/S3Destination"
          description: The destinations, by name.
        namespace:
          type: string
          description: The namespace they are kept in.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    S3DestinationsApplied:
      type: object
      description: What an apply wrote.
      required:
      - written
      properties:
        written:
          type: array
          items:
            type: string
          description: The objects written, `Kind/name`.
    S3DestinationsApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    S3DestinationsPlan:
      type: object
      description: A plan, and the token that applies it.
      required:
      - token
      - expiresAt
      - writes
      - keptCopies
      properties:
        copiesUnknown:
          type: boolean
          description: >-
            The person may not list Secrets in every namespace, so the plan did not look
            for copies.
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        keptCopies:
          type: array
          items:
            $ref: "#/components/schemas/KeptCopy"
          description: Copies of the keys that the plan leaves with the old keys.
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/S3DestinationWrite"
          description: The writes, in order; empty when nothing changes.
    S3DestinationsPlanRequest:
      oneOf:
      - allOf:
        - $ref: "#/components/schemas/S3DestinationFields"
          description: Add a destination, or change one.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - save
        description: Add a destination, or change one.
      - type: object
        description: Remove a destination. Secrets its keys were copied into stay.
        required:
        - name
        - op
        properties:
          name:
            type: string
            description: The destination.
          op:
            type: string
            enum:
            - remove
      description: What to plan.
    SeaweedAccessKey:
      type: object
      description: The access key services use, from an `S3Credentials` of the store.
      required:
      - name
      - user
      properties:
        id:
          type:
          - string
          - "null"
          description: The access key ID, once the operator made it; it is not secret.
        name:
          type: string
          description: The `S3Credentials` object's name.
        phase:
          type:
          - string
          - "null"
          description: "`Pending`, `Ready`, `Failed` or `Terminating`, as the operator says."
        user:
          type: string
          description: The IAM user it belongs to.
    SeaweedBucket:
      type: object
      description: One bucket.
      required:
      - origin
      - name
      - s3Name
      - deletesContents
      properties:
        deletesContents:
          type: boolean
          description: Deleting the object deletes the bucket and its contents.
        message:
          type:
          - string
          - "null"
          description: The message of a condition that is not true, when there is one.
        name:
          type: string
          description: The object's name.
        objects:
          type:
          - integer
          - "null"
          format: int64
          description: The objects stored, as last counted.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `Bucket` object.
        phase:
          type:
          - string
          - "null"
          description: "`Pending`, `Ready`, `Failed` or `Terminating`, as the operator says."
        s3Name:
          type: string
          description: The S3 bucket name.
        usedBytes:
          type:
          - integer
          - "null"
          format: int64
          description: The bytes stored, as last counted.
    SeaweedObjectStorage:
      type: object
      description: One object store.
      required:
      - origin
      - name
      - state
      - members
      - ready
      - iam
      - buckets
      - object
      - pods
      properties:
        accessKey:
          oneOf:
          - $ref: "#/components/schemas/SeaweedAccessKey"
            description: The access key services use; absent when the store has none.
          - type: "null"
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/SeaweedBucket"
          description: Its buckets, by name.
        connection:
          oneOf:
          - $ref: "#/components/schemas/DatabaseConnection"
            description: |-
              Where to connect, inside the cluster, and the Secret with the access key. Absent until the
              store has an access key.
          - type: "null"
        created:
          type:
          - string
          - "null"
          description: When it was created, RFC 3339.
        iam:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: "Its IAM objects: identities, credentials, policies and policy bindings, by kind and name."
        image:
          type:
          - string
          - "null"
          description: The `SeaweedFS` image.
        members:
          type: integer
          format: int64
          description: Pods asked for, over the master, volume servers, filer and S3 gateway.
        message:
          type:
          - string
          - "null"
          description: The operator's message, when it is not ready.
        name:
          type: string
          description: Its name.
        object:
          type: object
          description: The object as written, without `status` and `managedFields`.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `Seaweed` object.
        pods:
          type: array
          items:
            $ref: "#/components/schemas/PodSummary"
          description: Its pods, by name; empty when they cannot be read.
        ready:
          type: integer
          format: int64
          description: Pods ready.
        state:
          $ref: "#/components/schemas/DatabaseState"
          description: How it is.
        storage:
          type:
          - string
          - "null"
          description: The size of each volume server's disk, as asked for.
        storageClass:
          type:
          - string
          - "null"
          description: >-
            The `StorageClass` of the volume servers' disks; absent for the cluster's
            default.
        version:
          type:
          - string
          - "null"
          description: The `SeaweedFS` version, from the image tag.
    SecretValue:
      type: object
      description: One value of a revealed Secret.
      required:
      - value
      - encoding
      properties:
        encoding:
          type: string
          description: "`utf-8` or `base64`."
        value:
          type: string
          description: "The value: text as is, binary data as base64."
    Security:
      type: object
      description: What a component's RBAC and network access amount to, from the catalogue.
      required:
      - summary
      properties:
        clusterWide:
          type: boolean
          description: It has cluster-scoped RBAC.
        credentials:
          type:
          - string
          - "null"
          description: "External credentials: `optional` or `required`; absent means none."
        credentialsNote:
          type:
          - string
          - "null"
          description: What the credentials are for.
        egress:
          type: array
          items:
            type: string
          description: Hosts it connects to.
        privileged:
          type: boolean
          description: It runs privileged.
        risks:
          type: array
          items:
            $ref: "#/components/schemas/Risk"
          description: Known risks and how to contain them.
        summary:
          type: string
          description: What its RBAC lets it do.
        tenants:
          type:
          - string
          - "null"
          description: |-
            Who may use its custom resources: `namespaced` or `admin-only`; absent means tenants never
            do.
    ServerFrame:
      oneOf:
      - type: object
        description: The process runs; terminal bytes may flow.
        required:
        - container
        - type
        properties:
          container:
            type: string
            description: The container it runs in.
          type:
            type: string
            enum:
            - ready
      - type: object
        description: The process ended.
        required:
        - type
        properties:
          code:
            type:
            - integer
            - "null"
            format: int32
            description: Its exit code, when it exited on its own.
          message:
            type:
            - string
            - "null"
            description: The container runtime's message, for `failed`.
          reason:
            oneOf:
            - $ref: "#/components/schemas/ExitReason"
              description: Why it ended, when there is no code.
            - type: "null"
          type:
            type: string
            enum:
            - exit
      - type: object
        description: The terminal could not be opened.
        required:
        - problem
        - type
        properties:
          problem:
            $ref: "#/components/schemas/Problem"
            description: What went wrong.
          type:
            type: string
            enum:
            - error
      description: A control frame to the browser.
    Service:
      allOf:
      - $ref: "#/components/schemas/WorkloadSummary"
        description: The workload.
      - type: object
        required:
        - id
        - status
        - pods
        - containers
        - endpointNames
        - routeNames
        properties:
          configReload:
            oneOf:
            - $ref: "#/components/schemas/ConfigReload"
              description: |-
                Which of its ConfigMaps and Secrets Stakater Reloader restarts it for, from its
                annotations; absent when they ask for none. Whether Reloader runs is the cluster's.
            - type: "null"
          containers:
            type: array
            items:
              $ref: "#/components/schemas/Container"
            description: Its init and regular containers, in that order.
          dataStore:
            oneOf:
            - $ref: "#/components/schemas/DataStore"
              description: |-
                What kind of data store it is, when it is one: named like a well-known data store
                image, in the `databases` group, or a StatefulSet with persistent storage. Image names
                are a convention, so this is a hint for how to show the service, not a fact about it.
            - type: "null"
          diagnoses:
            type: array
            items:
              $ref: "#/components/schemas/Diagnosis"
            description: |-
              What is going wrong with it, in plain words, sorted by kind then container. The
              projection leaves this empty: diagnoses need the namespace's events and the time of the
              read, so the API fills it in when it serves the project document.
          endpointNames:
            type: array
            items:
              type: string
            description: |-
              The names of the Kubernetes Services selecting its pods, sorted by name; each is in
              the document's `endpoints`.
          id:
            type: string
            description: >-
              Its resource name, `projects/<project>/services/<kind>/<name>`; see
              [`crate::id`].
          podSecurity:
            oneOf:
            - $ref: "#/components/schemas/PodSecurityLevel"
              description: |-
                The strictest Pod Security Standards level its pod template meets; absent when it has
                none. Whether the namespace enforces a level is the namespace's.
            - type: "null"
          pods:
            type: array
            items:
              $ref: "#/components/schemas/PodSummary"
            description: Its pods, sorted by name.
          routeNames:
            type: array
            items:
              type: string
            description: |-
              The names of the Ingresses and `HTTPRoute`s routing to those Services, sorted by name;
              each is in the document's `routes`.
          runAs:
            oneOf:
            - $ref: "#/components/schemas/RunAs"
              description: The user and groups its pods run as; absent when its template sets none.
            - type: "null"
          status:
            $ref: "#/components/schemas/ServiceStatus"
            description: Its health and the word for it, from the workload and its pods.
      description: "A workload and what it uses: what people think of as \"a service\"."
    ServiceDocument:
      allOf:
      - $ref: "#/components/schemas/Service"
        description: The service.
      - type: object
        required:
        - endpoints
        - routes
        - unreadable
        properties:
          endpoints:
            type: array
            items:
              $ref: "#/components/schemas/Endpoint"
            description: The Kubernetes Services selecting its pods, in the order of `endpointNames`.
          routes:
            type: array
            items:
              $ref: "#/components/schemas/Route"
            description: The Ingresses routing to them, in the order of `routeNames`.
          unreadable:
            type: array
            items:
              $ref: "#/components/schemas/UnreadableView"
            description: Kinds the person could not list.
      description: |-
        One service of a project, as the project document holds it, with the details of its own
        endpoints and routes.
        
        In both documents `endpoints` and `routes` hold the details and a service's
        `endpointNames` and `routeNames` name its own; here they are only the service's, so the
        document stays the size of one workload.
    ServiceHistory:
      type: object
      description: A service's CPU, memory and restarts over a range, one value per pod and time.
      required:
      - id
      - state
      - source
      - range
      - step
      - times
      - cpu
      - memory
      - unreadable
      properties:
        cpu:
          type: array
          items:
            $ref: "#/components/schemas/PrometheusSeries"
          description: |-
            CPU per pod, in millicores; every pod the store knows in the range, also those replaced
            since.
        id:
          type: string
          description: "`projects/{project}/services/{kind}/{name}/history`."
        memory:
          type: array
          items:
            $ref: "#/components/schemas/PrometheusSeries"
          description: Memory per pod, the working set's highest in each step, in bytes.
        message:
          type:
          - string
          - "null"
          description: kube-apiserver's or the store's words when it did not answer.
        range:
          $ref: "#/components/schemas/PrometheusRange"
          description: The range.
        restarts:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/PrometheusRestart"
          description: |-
            Restarts, oldest first; absent when the store has no restart counts (it does not scrape
            kube-state-metrics), which is not the same as none.
        source:
          $ref: "#/components/schemas/HistorySource"
          description: The store.
        state:
          $ref: "#/components/schemas/StoreState"
          description: Whether the store answered.
        step:
          type: integer
          format: int64
          description: Seconds between two times.
        times:
          type: array
          items:
            type: integer
            format: int64
          description: The times of the values (Unix seconds), oldest first.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: The settings ConfigMap or the store, when the person may not read it.
    ServiceStatus:
      type: object
      description: A service's health, the word for it, and why when a pod keeps failing.
      required:
      - health
      - word
      properties:
        health:
          $ref: "#/components/schemas/Health"
          description: What its status dot shows.
        reason:
          type:
          - string
          - "null"
          description: |-
            The first failing pod's reason, as `kubectl get pods` shows it (`CrashLoopBackOff`), or,
            for a pod that runs again after a recent crash, how that crash ended (`Error`); absent
            when no pod fails or the kubelet gives no reason.
        word:
          $ref: "#/components/schemas/StatusWord"
          description: The word for it.
    ServiceSummary:
      type: object
      description: |-
        One service of a project in the list: which it is, how healthy and why, without its
        containers, variables or configuration (those are in the project document).
      required:
      - id
      - kind
      - name
      - health
      - restarts
      properties:
        desired:
          type:
          - integer
          - "null"
          format: int32
          description: Desired replicas (completions for a Job); absent for a CronJob.
        health:
          $ref: "#/components/schemas/Health"
          description: Its health, by the rule the project counts use.
        id:
          type: string
          description: "`projects/<project>/services/<kind>/<name>`."
        kind:
          $ref: "#/components/schemas/WorkloadKind"
          description: The workload's kind.
        name:
          type: string
          description: The workload's name.
        ready:
          type:
          - integer
          - "null"
          format: int32
          description: Ready replicas (succeeded pods for a Job); absent for a CronJob.
        reason:
          type:
          - string
          - "null"
          description: |-
            Why its first failing pod fails, as `kubectl get pods` shows it (`CrashLoopBackOff`);
            absent when no pod fails or the kubelet gives no reason.
        restarts:
          type: integer
          format: int32
          description: Restarts, summed over its pods.
    ServiceTrace:
      type: object
      description: Every way to a service, and the diagnoses where they stop.
      required:
      - id
      - routes
      - diagnoses
      - unreadable
      - ingressAddresses
      properties:
        diagnoses:
          type: array
          items:
            $ref: "#/components/schemas/Diagnosis"
          description: The first failed hop of each address, as a diagnosis, once per cause.
        id:
          type: string
          description: "`projects/<project>/services/<kind>/<name>/trace`."
        ingressAddresses:
          type: array
          items:
            type: string
          description: |-
            The addresses the project's Ingresses are served on: where a new domain's DNS should
            point. Empty when no Ingress has an address in its status.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteTraceView"
          description: Its domains, by route and host, then its private addresses.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused; hops that needed them are unknown.
    SessionView:
      type: object
      description: How the person is signed in to Zeabur.
      required:
      - signsIn
      - elevation
      properties:
        elevatedUntil:
          type:
          - string
          - "null"
          description: When the administrator rights end, RFC 3339, while they are in use.
        elevation:
          $ref: "#/components/schemas/ElevationState"
          description: Whether administrator rights are offered and in use.
        expiresAt:
          type:
          - string
          - "null"
          description: |-
            When the credential in use expires, RFC 3339: the everyday one, which Zeabur renews
            before then while the session lasts, or while admin rights are in use theirs, which is
            `elevatedUntil` and is not renewed.
        signsIn:
          type: boolean
          description: |-
            Whether people sign in to this server, and so can sign out. `false` on this machine
            (`zeaburctl ui`), which acts with the kubeconfig of whoever started it.
    SettingSource:
      type: string
      description: Where the metrics store in use comes from.
      enum:
      - default
      - setting
    SetupLinkRequest:
      type: object
      description: A member's setup link.
      properties:
        reset:
          type: boolean
          description: |-
            Also remove their passkeys, linked accounts, sessions and other links first, so only
            whoever opens this link gets in.
      additionalProperties: false
    SetupLinkView:
      type: object
      description: "A one-time setup link, shown once: only its hash is kept."
      required:
      - url
      - username
      - expiresAt
      - name
      - createdMember
      - reset
      properties:
        createdMember:
          type: boolean
          description: Whether the member was created now.
        expiresAt:
          type: string
          description: When it stops working, RFC 3339.
        name:
          type: string
          description: The `Invitation` object's name, to revoke it.
        reset:
          type: boolean
          description: Whether their passkeys, sessions and other links were removed first.
        url:
          type: string
          description: The link; whoever opens it first adds a passkey to the account.
        username:
          type: string
          description: Whose account it adds a passkey to.
    SetupLinks:
      type: object
      description: Whether setup links can be made and redeemed here.
      properties:
        accepted:
          type:
          - boolean
          - "null"
          description: |-
            Whether Zeabur Identity redeems invitations (`--invitations`), from its Deployment;
            `None` when it could not be read.
        issuer:
          type:
          - string
          - "null"
          description: |-
            The address links open at; `None` when neither the server's configuration nor the
            Identity Deployment (where it can be read) names it.
    Severity:
      type: string
      description: How much a state matters, from nothing to act on to act now.
      enum:
      - none
      - info
      - warning
      - danger
    ShellExposure:
      type: object
      description: |-
        A binding that lets someone other than cluster administrators create pods in the node shell
        namespace or run commands in them.
      required:
      - kind
      - name
      - role
      - rights
      - subjects
      properties:
        kind:
          type: string
          description: "`RoleBinding` or `ClusterRoleBinding`."
        name:
          type: string
          description: Its name.
        rights:
          type: array
          items:
            type: string
          description: |-
            What the role grants: `create pods` (bound in the namespace), `create` or `get` on
            `pods/exec` and `pods/attach`.
        role:
          type: string
          description: The role it binds, `Role/name` or `ClusterRole/name`.
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/ShellSubject"
          description: Who it lets in.
    ShellPhase:
      type: string
      description: How a node shell pod is doing.
      enum:
      - starting
      - running
      - ended
    ShellSubject:
      type: object
      description: Someone a binding lets into node shells.
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          description: "`User`, `Group` or `ServiceAccount`."
        name:
          type: string
          description: Its name.
        namespace:
          type:
          - string
          - "null"
          description: A service account's namespace.
    ShellWrite:
      type: object
      description: One object a plan writes.
      required:
      - action
      - kind
      - name
      properties:
        action:
          $ref: "#/components/schemas/ShellWriteAction"
          description: What it does.
        kind:
          type: string
          description: The object's kind.
        name:
          type: string
          description: Its name.
        namespace:
          type:
          - string
          - "null"
          description: Its namespace, for a namespaced object.
        yaml:
          type:
          - string
          - "null"
          description: The object as it will be (as it is, for a deletion), YAML.
    ShellWriteAction:
      type: string
      description: What a write does.
      enum:
      - create
      - patch
      - delete
    SourceKind:
      type: string
      description: |-
        What an environment variable's value is read from.
        
        This is the *value's* source, which is what a client needs to show or change it: a literal is
        edited in place, a Secret or ConfigMap key is edited in that object.
      enum:
      - Literal
      - Secret
      - ConfigMap
      - PodField
      - ResourceField
      - File
    StatusWord:
      type: string
      description: |-
        What a service is doing, in one word for a person. An open set: clients must show an unknown
        value by its [`Health`].
      enum:
      - ready
      - rollingOut
      - failing
      - degraded
      - scheduled
      - paused
      - failed
      - rolloutStuck
      - scaledToZero
      - completed
      - unknown
      - building
    StayReason:
      type: string
      description: Why a pod stays.
      enum:
      - daemonSet
      - static
    StorageClassView:
      type: object
      description: A `StorageClass`.
      required:
      - origin
      - name
      - provisioner
      - kind
      - default
      - allowExpansion
      - reclaimPolicy
      - bindingMode
      properties:
        allowExpansion:
          type: boolean
          description: "`allowVolumeExpansion`: its claims may grow."
        bindingMode:
          type: string
          description: |-
            `volumeBindingMode`: `WaitForFirstConsumer` makes the volume where its first pod runs,
            `Immediate` when the claim is made.
        default:
          type: boolean
          description: The cluster's default (`storageclass.kubernetes.io/is-default-class`).
        kind:
          $ref: "#/components/schemas/StorageKind"
          description: What kind of disk it gives.
        name:
          type: string
          description: Its name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `StorageClass`.
        provisioner:
          type: string
          description: "`provisioner`."
        reclaimPolicy:
          type: string
          description: "`reclaimPolicy`: what becomes of a volume when its claim is deleted (`Delete`, `Retain`)."
    StorageKind:
      type: string
      description: What kind of disk a `StorageClass` gives, from its provisioner.
      enum:
      - local
      - replicated
      - other
    StoreState:
      type: string
      description: Whether the metrics store answered, as the person. An open set.
      enum:
      - available
      - not-configured
      - unreadable
      - unavailable
    StuckReason:
      type: string
      description: Why a rollout is stuck.
      enum:
      - crashLoop
      - outOfMemory
      - imagePull
      - unschedulable
      - quota
      - configMissing
      - runFailed
      - podSecurity
      - deadlineExceeded
      - replicaFailure
    SuffixCheck:
      type: object
      description: How DNS answers for one suffix.
      required:
      - name
      - probe
      - dns
      properties:
        dns:
          $ref: "#/components/schemas/DnsState"
          description: Whether it resolves to an address of the cluster's ingress.
        name:
          type: string
          description: The suffix, such as `apps.example.com`.
        probe:
          type: string
          description: "The name looked up: one no one uses, so only a wildcard record answers it."
        resolved:
          type: array
          items:
            type: string
          description: The addresses it resolved to.
        sslip:
          type:
          - string
          - "null"
          description: For an sslip.io or nip.io suffix, the address it carries.
    Suggestion:
      type: string
      description: How strongly the catalogue suggests a missing capability.
      enum:
      - recommended
      - optional
      - unsupported
    SystemUpgradeControllerPlan:
      type: object
      description: A Plan, reduced to what an upgrade overview needs.
      required:
      - namespace
      - name
      - applying
      properties:
        applying:
          type: array
          items:
            type: string
          description: "`status.applying`: the nodes being upgraded now."
        channel:
          type:
          - string
          - "null"
          description: "`spec.channel`: the URL the controller resolves to the newest version."
        latestVersion:
          type:
          - string
          - "null"
          description: "`status.latestVersion`: what the channel (or `version`) resolved to."
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
        version:
          type:
          - string
          - "null"
          description: "`spec.version`: a fixed target version."
    SystemUpgradeControllerUpgrades:
      type: object
      description: What system-upgrade-controller adds to the cluster's upgrades.
      required:
      - plans
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/SystemUpgradeControllerPlan"
          description: The Plans, by namespace and name.
    Taint:
      type: object
      description: A node taint.
      required:
      - key
      - effect
      properties:
        effect:
          type: string
          description: "`NoSchedule`, `PreferNoSchedule` or `NoExecute`."
        key:
          type: string
          description: Its key.
        value:
          type:
          - string
          - "null"
          description: Its value.
    TaskConcurrency:
      type: string
      description: |-
        A CronJob's `concurrencyPolicy` [k8s-concurrency].
        
        [k8s-concurrency]: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/#concurrency-policy
      enum:
      - forbid
      - allow
      - replace
    TaskRun:
      type: object
      description: One run of a CronJob.
      required:
      - name
      - status
      - manual
      - pods
      properties:
        finished:
          type:
          - string
          - "null"
          description: When it ended, in RFC 3339.
        manual:
          type: boolean
          description: "Someone started it by hand (`cronjob.kubernetes.io/instantiate: manual`)."
        name:
          type: string
          description: The Job's name.
        pods:
          type: array
          items:
            type: string
          description: Its pods, newest last, for their logs.
        started:
          type:
          - string
          - "null"
          description: When it started, in RFC 3339.
        status:
          $ref: "#/components/schemas/RunStatus"
          description: How it stands.
    TaskRuns:
      type: object
      description: A CronJob's runs.
      required:
      - id
      - runs
      properties:
        id:
          type: string
          description: "`projects/<project>/services/cronjob/<name>/runs`."
        runs:
          type: array
          items:
            $ref: "#/components/schemas/TaskRun"
          description: The newest runs first, at most 50.
    TaskSchedule:
      type: object
      description: |-
        When a CronJob runs [k8s-cronjob].
        
        [k8s-cronjob]: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
      required:
      - cron
      - concurrency
      - keepSucceeded
      - keepFailed
      properties:
        command:
          type:
          - string
          - "null"
          description: >-
            The command, when the only container runs `/bin/sh -c <command>` as a task
            Zeabur made.
        concurrency:
          $ref: "#/components/schemas/TaskConcurrency"
          description: >-
            What happens when a run is due while the last one still runs
            (`spec.concurrencyPolicy`).
        cron:
          type: string
          description: The cron expression (`spec.schedule`).
        keepFailed:
          type: integer
          format: int32
          description: How many failed runs Kubernetes keeps (`spec.failedJobsHistoryLimit`).
        keepSucceeded:
          type: integer
          format: int32
          description: How many succeeded runs Kubernetes keeps (`spec.successfulJobsHistoryLimit`).
        lastScheduled:
          type:
          - string
          - "null"
          description: When a run was last started, in RFC 3339.
        suspended:
          type: boolean
          description: The controller starts no new runs (`spec.suspend`).
        taskOf:
          type:
          - string
          - "null"
          description: "The service it was made from: its `zeabur.com/task-of` label."
        timeZone:
          type:
          - string
          - "null"
          description: "The IANA time zone of the expression (`spec.timeZone`); absent: the controller's."
    TemplateView:
      type: object
      description: A template of Zeabur Catalog.
      required:
      - id
      properties:
        id:
          type: string
          description: Its id (`error-pages`).
        idle:
          oneOf:
          - $ref: "#/components/schemas/IdleUse"
            description: What its pods use when idle; absent until Zeabur Catalog has measured it.
          - type: "null"
    Timeline:
      type: object
      description: A timeline.
      required:
      - id
      - items
      - truncated
      - unreadable
      properties:
        id:
          type: string
          description: "`projects/<project>/timeline` or `projects/<project>/services/<kind>/<name>/timeline`."
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
          description: Newest first, at most 200.
        truncated:
          type: boolean
          description: Older entries were left out.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused; their entries are missing.
    TimelineEntry:
      type: object
      description: One thing that happened.
      required:
      - at
      - kind
      - workload
      - message
      properties:
        at:
          type: string
          description: "When, RFC 3339: the release's creation, the write, the last event, the termination."
        count:
          type:
          - integer
          - "null"
          format: int32
          description: How many times, for warnings.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: "The objects and fields it rests on: the events, the pod's container status."
        fields:
          type: array
          items:
            type: string
          description: The fields the manager owns, for a write.
        kind:
          $ref: "#/components/schemas/EntryKind"
          description: What it records.
        message:
          $ref: "#/components/schemas/Message"
          description: |-
            What happened, in one sentence: `timeline.release`, `timeline.write.<tool>`,
            `timeline.warning.<crashLoop|evicted|imagePull|probe|quota|other>`,
            `timeline.warning.unschedulable.<claimMissing|claimUnbound|cpu|memory|placement|other>`,
            `timeline.termination.<oomKilled|exited>`. A warning names the service and, when it is
            about a pod, the replica; the component's own words are in `note`, not in the sentence.
        release:
          oneOf:
          - $ref: "#/components/schemas/ReleaseRef"
            description: The release.
          - type: "null"
        revert:
          oneOf:
          - $ref: "#/components/schemas/PlanRequest"
            description: The changes that undo it, to send to `plan`.
          - type: "null"
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: The workload.
        writer:
          oneOf:
          - $ref: "#/components/schemas/Writer"
            description: Who wrote, for a write.
          - type: "null"
    Tool:
      type: string
      description: A deployment tool that would revert a direct edit on its next sync or upgrade.
      enum:
      - Helm
      - Argo CD
      - Flux
    ToolsPodStatus:
      type: object
      description: A tools pod of the person's.
      required:
      - name
      - namespace
      - image
      - phase
      - ready
      - terminals
      properties:
        image:
          type: string
          description: Its image.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
        phase:
          type: string
          description: "The pod's phase: `Pending`, `Running`, `Succeeded`, `Failed`."
        problem:
          oneOf:
          - $ref: "#/components/schemas/Problem"
            description: Why it does not start, when it cannot.
          - type: "null"
        project:
          type:
          - string
          - "null"
          description: The project it was opened from.
        ready:
          type: boolean
          description: Whether a terminal can open in it now.
        startedAt:
          type:
          - string
          - "null"
          description: When it started, RFC 3339.
        stopsAt:
          type:
          - string
          - "null"
          description: >-
            When it stops whatever happens (`activeDeadlineSeconds` after it started), RFC
            3339.
        terminals:
          type: integer
          description: How many terminals are open in it on this server.
          minimum: 0
    ToolsStatus:
      type: object
      description: The person's tools pods.
      required:
      - namespace
      - available
      - pods
      - deleted
      properties:
        available:
          type: boolean
          description: |-
            Whether Zeabur can open a tools terminal here; `false` in local mode, which holds no
            token to hand over.
        deleted:
          type: array
          items:
            type: string
          description: The tools pods that had stopped or outlived their deadline and were deleted now.
        namespace:
          type: string
          description: The namespace these tools pods go in.
        pods:
          type: array
          items:
            $ref: "#/components/schemas/ToolsPodStatus"
          description: |-
            The person's tools pods there that have not stopped and are not being deleted, oldest
            first.
    UnavailableLog:
      type: string
      description: Why a container's log cannot be read, from the kubelet's answer.
      enum:
      - no-previous-run
      - not-started
      - removed
    Unlimited:
      type: object
      description: How many pods set no limit, for each resource.
      required:
      - cpu
      - memory
      properties:
        cpu:
          type: integer
          format: int64
          description: Pods without a CPU limit.
          minimum: 0
        memory:
          type: integer
          format: int64
          description: Pods without a memory limit.
          minimum: 0
    UnreadableReason:
      type: string
      description: Why an image's configuration could not be read.
      enum:
      - not-found
      - unauthorized
      - no-platform
      - credentials
      - unreachable
      - unexpected
    UnreadableView:
      type: object
      description: A kind the person could not read, and kube-apiserver's answer.
      required:
      - resource
      - kubernetes
      properties:
        kubernetes:
          $ref: "#/components/schemas/KubernetesStatus"
          description: kube-apiserver's answer.
        resource:
          type: string
          description: The resource (`secrets`, `deployments.apps`, …).
    UpgradeExtensions:
      type: object
      description: What integrations add to the cluster's upgrades, one member per module.
      properties:
        systemUpgradeController:
          oneOf:
          - $ref: "#/components/schemas/SystemUpgradeControllerUpgrades"
            description: system-upgrade-controller's Plans.
          - type: "null"
    UpgradeState:
      type: string
      description: |-
        What the cluster's version calls for. An open set: clients must ignore values they do not
        know.
      enum:
      - patch-available
      - minor-available
      - maintenance
      - end-of-life
      - skew-unsupported
      - skew-mixed
      - upgrading
      - newer-than-data
    Upgrades:
      type: object
      description: The cluster's own version and what it calls for.
      required:
      - id
      - kubernetesVersion
      - dataAsOf
      - states
      - severity
      - skew
      - upgrading
      - unreadable
      - extensions
      properties:
        dataAsOf:
          type: string
          description: When the bundled table was copied from the Kubernetes schedule (`YYYY-MM-DD`).
        distribution:
          type:
          - string
          - "null"
          description: "`k3s` or `rke2`, when the version names one."
        extensions:
          $ref: "#/components/schemas/UpgradeExtensions"
          description: |-
            What the integrations add, by module; a module whose component is not installed adds
            nothing.
        id:
          type: string
          description: "`cluster/upgrades`."
        kubernetesVersion:
          type: string
          description: kube-apiserver's version.
        minor:
          type:
          - string
          - "null"
          description: "`1.34`."
        nextMinor:
          type:
          - string
          - "null"
          description: >-
            The next minor's build a Plan resolved (upgrade one minor at a time); absent
            otherwise.
        patch:
          type:
          - string
          - "null"
          description: |-
            A newer build of the same minor, from system-upgrade-controller's Plans; absent when no
            Plan resolved a newer version.
        release:
          oneOf:
          - $ref: "#/components/schemas/Release"
            description: That minor's support window, from Zeabur's bundled table.
          - type: "null"
        severity:
          $ref: "#/components/schemas/Severity"
          description: The most severe state's severity.
        skew:
          type: array
          items:
            $ref: "#/components/schemas/NodeSkew"
          description: Nodes whose kubelet minor differs from kube-apiserver's.
        states:
          type: array
          items:
            $ref: "#/components/schemas/UpgradeState"
          description: Every state that applies, most severe first. An open set.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read (nodes, Plans); the rest is still right.
        upgrading:
          type: array
          items:
            type: string
          description: Nodes system-upgrade-controller is upgrading now.
    UsageTotals:
      type: object
      description: Every namespace together.
      required:
      - requests
      - limits
      properties:
        limits:
          $ref: "#/components/schemas/Resources"
          description: Limits.
        requests:
          $ref: "#/components/schemas/Resources"
          description: Reserved.
        usage:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: In use; absent unless `metrics` is `available`.
          - type: "null"
    ValueSource:
      type: object
      description: "The source of a value: its kind and, for references, the object and key it reads."
      required:
      - kind
      properties:
        fieldPath:
          type:
          - string
          - "null"
          description: The pod field (`PodField`), resource (`ResourceField`) or file path (`File`).
        key:
          type:
          - string
          - "null"
          description: The key within that object.
        kind:
          $ref: "#/components/schemas/SourceKind"
          description: What the value is read from.
        name:
          type:
          - string
          - "null"
          description: |-
            The referenced Secret or ConfigMap; the container for a `ResourceField`; the volume for
            a `File`.
        optional:
          type: boolean
          description: "The reference is marked optional: the container starts without it."
    VeleroBackup:
      type: object
      description: One backup.
      required:
      - name
      - namespaces
      - outcome
      - errors
      - warnings
      properties:
        bytes:
          type:
          - integer
          - "null"
          format: int64
          description: Bytes its file-system backups copied.
          minimum: 0
        errors:
          type: integer
          format: int64
          description: Errors Velero counted.
          minimum: 0
        expires:
          type:
          - string
          - "null"
          description: When Velero deletes it, RFC 3339.
        failure:
          oneOf:
          - $ref: "#/components/schemas/VeleroFailure"
            description: Why it did not finish well.
          - type: "null"
        finished:
          type:
          - string
          - "null"
          description: When it finished, RFC 3339.
        items:
          type:
          - integer
          - "null"
          format: int64
          description: Objects copied.
          minimum: 0
        name:
          type: string
          description: Its name.
        namespaces:
          type: array
          items:
            type: string
          description: The namespaces it covers; empty for every namespace.
        outcome:
          $ref: "#/components/schemas/BackupOutcome"
          description: How it went.
        phase:
          type:
          - string
          - "null"
          description: Velero's phase.
        reason:
          type:
          - string
          - "null"
          description: Velero's own words for it (`failureReason`, `validationErrors`).
        schedule:
          type:
          - string
          - "null"
          description: The schedule that made it.
        started:
          type:
          - string
          - "null"
          description: When it started, RFC 3339.
        totalItems:
          type:
          - integer
          - "null"
          format: int64
          description: Objects it set out to copy.
          minimum: 0
        warnings:
          type: integer
          format: int64
          description: Warnings Velero counted.
          minimum: 0
    VeleroFailure:
      type: string
      description: Why a backup did not finish well, in the words the interface explains.
      enum:
      - locationUnavailable
      - invalid
      - itemsFailed
      - interrupted
      - other
    VeleroLocation:
      type: object
      description: Where backups go.
      required:
      - name
      - namespace
      - default
      - provider
      - bucket
      - phase
      properties:
        bucket:
          type: string
          description: The bucket.
        credential:
          type:
          - string
          - "null"
          description: The Secret holding its keys; absent when it uses Velero's own.
        default:
          type: boolean
          description: Backups that name no location go here.
        endpoint:
          type:
          - string
          - "null"
          description: The S3-compatible endpoint (`s3Url`); absent for AWS itself.
        lastValidated:
          type:
          - string
          - "null"
          description: When Velero last checked, RFC 3339.
        message:
          type:
          - string
          - "null"
          description: Velero's message about the last check.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Velero's namespace.
        phase:
          $ref: "#/components/schemas/VeleroLocationPhase"
          description: Whether Velero can reach it.
        prefix:
          type:
          - string
          - "null"
          description: The folder in the bucket.
        provider:
          type: string
          description: The object store plugin (`aws`).
        region:
          type:
          - string
          - "null"
          description: The region.
    VeleroLocationPhase:
      type: string
      description: Whether Velero can reach a location.
      enum:
      - available
      - unavailable
      - unknown
    VeleroRestore:
      type: object
      description: One restore.
      required:
      - name
      - backup
      - namespaces
      - outcome
      - errors
      - warnings
      properties:
        backup:
          type: string
          description: The backup it restores.
        errors:
          type: integer
          format: int64
          description: Errors Velero counted.
          minimum: 0
        finished:
          type:
          - string
          - "null"
          description: When it finished, RFC 3339.
        name:
          type: string
          description: Its name.
        namespaces:
          type: array
          items:
            type: string
          description: The namespaces it restores; empty for every namespace of the backup.
        outcome:
          $ref: "#/components/schemas/BackupOutcome"
          description: How it went.
        phase:
          type:
          - string
          - "null"
          description: Velero's phase.
        reason:
          type:
          - string
          - "null"
          description: Velero's own words when it failed (`failureReason`, `validationErrors`).
        started:
          type:
          - string
          - "null"
          description: When it started, RFC 3339.
        warnings:
          type: integer
          format: int64
          description: Warnings Velero counted, such as objects that were already there.
          minimum: 0
    VeleroSchedule:
      type: object
      description: When backups run and what they take.
      required:
      - name
      - namespace
      - cron
      - paused
      - namespaces
      - excluded
      - fsBackup
      - validationErrors
      - zeabur
      properties:
        cron:
          type: string
          description: The cron expression, in the Velero server's clock (UTC unless set otherwise).
        excluded:
          type: array
          items:
            type: string
          description: The namespaces it leaves out.
        fsBackup:
          type: boolean
          description: It copies the files on every volume (file-system backup).
        keepDays:
          type:
          - integer
          - "null"
          format: int32
          description: The same in whole days, when it is.
          minimum: 0
        lastBackup:
          type:
          - string
          - "null"
          description: When it last made a backup, RFC 3339.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Velero's namespace.
        namespaces:
          type: array
          items:
            type: string
          description: The namespaces it covers; empty for every namespace.
        paused:
          type: boolean
          description: No backups run while paused.
        ttl:
          type:
          - string
          - "null"
          description: How long each backup is kept, as Velero writes it (`168h0m0s`).
        validationErrors:
          type: array
          items:
            type: string
          description: Why Velero refused it (`status.validationErrors`).
        zeabur:
          type: boolean
          description: It is the schedule Zeabur sets up ([`SCHEDULE`]).
    VolumeRequest:
      type: object
      description: "A new volume for a workload: a PersistentVolumeClaim and where it is mounted."
      required:
      - size
      - mountPath
      properties:
        accessMode:
          oneOf:
          - $ref: "#/components/schemas/AccessMode"
            description: How the nodes may mount the claim; absent for `ReadWriteOnce`.
          - type: "null"
        claimName:
          type:
          - string
          - "null"
          description: >-
            The claim's name; absent for `<workload>-<name>`. A claim that exists is never
            reused.
        mountPath:
          type: string
          description: Where the container sees it; absolute.
        name:
          type: string
          description: The volume's name in the pod.
        size:
          type: string
          description: The size, a Kubernetes quantity such as `5Gi`.
        storageClass:
          type:
          - string
          - "null"
          description: The `StorageClass`; absent for the cluster's default.
    VolumeUsage:
      type: object
      description: How full one claim's volume is.
      required:
      - claim
      - capacityBytes
      - usedBytes
      - availableBytes
      properties:
        availableBytes:
          type: integer
          format: int64
          description: Free to use.
          minimum: 0
        capacityBytes:
          type: integer
          format: int64
          description: Its filesystem's size. It can differ a little from the claim's.
          minimum: 0
        claim:
          type: string
          description: The PersistentVolumeClaim.
        usedBytes:
          type: integer
          format: int64
          description: In use.
          minimum: 0
    VolumeUsageList:
      type: object
      description: How full a project's volumes are.
      required:
      - id
      - state
      - items
      - unreadable
      properties:
        id:
          type: string
          description: "`projects/{project}/volumes`."
        items:
          type: array
          items:
            $ref: "#/components/schemas/VolumeUsage"
          description: Every claim the store has values for, by claim.
        state:
          $ref: "#/components/schemas/DiskState"
          description: Whether the metrics store could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: The settings ConfigMap or the store, when the person may not read it.
    WhoAmI:
      type: object
      description: Who the cluster says the person is.
      required:
      - username
      - groups
      properties:
        groups:
          type: array
          items:
            type: string
          description: Groups.
        username:
          type: string
          description: User name.
    WorkloadKind:
      type: string
      description: |-
        The workload kinds Zeabur projects.
        
        Declared in alphabetical order, so the derived [`Ord`] sorts as the kind names do.
      enum:
      - CronJob
      - DaemonSet
      - Deployment
      - Job
      - StatefulSet
    WorkloadPatch:
      type: object
      description: Whether the person may patch the workloads of one kind.
      required:
      - kind
      - all
      - names
      properties:
        all:
          $ref: "#/components/schemas/Permission"
          description: Every one of them.
        kind:
          type: string
          description: "`Deployment`, `StatefulSet` or `DaemonSet`."
        names:
          type: array
          items:
            type: string
          description: The ones a rule limited to names (`resourceNames`) allows.
    WorkloadRef:
      type: object
      description: |-
        A workload, by kind and name.
        
        The derived order is kind, then name, as strings: [`WorkloadKind`]'s variants are declared
        in alphabetical order.
      required:
      - kind
      - name
      properties:
        kind:
          $ref: "#/components/schemas/WorkloadKind"
          description: The workload's kind.
        name:
          type: string
          description: The workload's name.
    WorkloadRelease:
      type: object
      description: One pod template a workload has run.
      required:
      - revision
      - name
      - images
      - current
      - pods
      - template
      - templateYaml
      properties:
        changeCause:
          type:
          - string
          - "null"
          description: Why it was made, from `kubernetes.io/change-cause`.
        created:
          type:
          - string
          - "null"
          description: When it was made, RFC 3339.
        current:
          type: boolean
          description: It is the template the workload runs now.
        images:
          type: array
          items:
            type: string
          description: The images of its containers, in order.
        name:
          type: string
          description: The ReplicaSet or ControllerRevision that holds it.
        pods:
          $ref: "#/components/schemas/WorkloadReleasePods"
          description: Its pods.
        revision:
          type: integer
          format: int64
          description: Its number; higher is newer.
        template:
          type: object
          description: The pod template, as the workload would hold it again after a rollback.
        templateYaml:
          type: string
          description: "`template` as YAML, written as the object's YAML view writes it."
    WorkloadReleaseList:
      type: object
      description: A workload's releases.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadRelease"
          description: Newest first. Jobs and CronJobs have none.
    WorkloadReleasePods:
      type: object
      description: How many of a release's pods there are and how many are ready.
      required:
      - ready
      - total
      properties:
        ready:
          type: integer
          format: int32
          description: Ready.
        total:
          type: integer
          format: int32
          description: All.
    WorkloadSummary:
      allOf:
      - $ref: "#/components/schemas/Classification"
        description: Group, display name and managing resource.
      - type: object
        required:
        - kind
        - name
        - namespace
        - phase
        - provenance
        - origin
        properties:
          created:
            type:
            - string
            - "null"
            description: When the workload was created, in RFC 3339.
          image:
            type:
            - string
            - "null"
            description: The first container's image, as a quick identifier.
          kind:
            $ref: "#/components/schemas/WorkloadKind"
            description: The workload's kind.
          name:
            type: string
            description: The workload's name.
          namespace:
            type: string
            description: The workload's namespace.
          origin:
            $ref: "#/components/schemas/Origin"
            description: The workload object.
          phase:
            $ref: "#/components/schemas/Phase"
            description: The status badge.
          provenance:
            $ref: "#/components/schemas/Provenance"
            description: The tool that manages the workload, if any.
          replicas:
            oneOf:
            - $ref: "#/components/schemas/Replicas"
              description: Ready and desired replicas; absent for a CronJob, which has no meaningful ratio.
            - type: "null"
          schedule:
            oneOf:
            - $ref: "#/components/schemas/TaskSchedule"
              description: A CronJob's schedule; absent for other kinds.
            - type: "null"
      description: A workload as lists show it.
    Writer:
      type: object
      description: Who wrote, as far as `managedFields` say.
      required:
      - manager
      - tool
      properties:
        manager:
          type: string
          description: The field manager.
        operation:
          type:
          - string
          - "null"
          description: "`Apply` or `Update`."
        subresource:
          type:
          - string
          - "null"
          description: The subresource written, such as `scale`.
        tool:
          $ref: "#/components/schemas/ManagerTool"
          description: The tool it is.
    ZeaburBuilderBuild:
      type: object
      description: A `Build`.
      required:
      - name
      - env
      - suspended
      - keelWebhooks
      properties:
        builder:
          type:
          - string
          - "null"
          description: The `ClusterBuilder`.
        contextDir:
          type:
          - string
          - "null"
          description: The build context inside the repository; none for its root.
        credentials:
          type:
          - string
          - "null"
          description: The Secret it reads the repository's credentials from.
        dockerfile:
          type:
          - string
          - "null"
          description: The Dockerfile, relative to the context; none for `Dockerfile`.
        env:
          type: array
          items:
            $ref: "#/components/schemas/ZeaburBuilderEnv"
          description: The build variables, by name. A literal value is left out.
        gitRef:
          type:
          - string
          - "null"
          description: >-
            The branch or tag it follows; `HEAD` (or none) follows the repository's default
            branch.
        gitUrl:
          type:
          - string
          - "null"
          description: The Git repository.
        keelWebhooks:
          type: array
          items:
            type: string
          description: The Keel webhooks it tells of new images.
        latestImage:
          type:
          - string
          - "null"
          description: The newest successful image, `repository:tag@sha256:…`.
        latestRevision:
          type:
          - string
          - "null"
          description: The commit it was built from.
        message:
          type:
          - string
          - "null"
          description: The message.
        name:
          type: string
          description: Its name.
        problem:
          oneOf:
          - $ref: "#/components/schemas/ZeaburBuilderProblem"
            description: "Why it cannot build: `SourceReady` or `BuilderReady` when `False`."
          - type: "null"
        ready:
          type:
          - string
          - "null"
          description: "The `Ready` condition: `True`, `False` or `Unknown`."
        reason:
          type:
          - string
          - "null"
          description: Its reason and message, as the controller wrote them.
        rebuildRequested:
          type:
          - string
          - "null"
          description: The value of the rebuild annotation, when set.
        remoteRevision:
          type:
          - string
          - "null"
          description: The commit the ref points at.
        repository:
          type:
          - string
          - "null"
          description: |-
            The repository it pushes to, without tag or digest; unknown until the first image when
            the controller's default registry is used.
        resolvedRef:
          type:
          - string
          - "null"
          description: |-
            The ref the newest commit came from, such as `refs/heads/master`, when the controller
            reports it.
        suspended:
          type: boolean
          description: Whether builds are paused.
    ZeaburBuilderEnv:
      type: object
      description: A build variable of a `Build`.
      required:
      - name
      properties:
        key:
          type:
          - string
          - "null"
          description: The key in that Secret.
        name:
          type: string
          description: The name.
        secret:
          type:
          - string
          - "null"
          description: The Secret the value comes from; none for a literal value.
    ZeaburBuilderProblem:
      type: object
      description: |-
        A `Build` that cannot build: the ref cannot be resolved (`SourceReady`) or its
        `ClusterBuilder` is missing (`BuilderReady`).
      required:
      - condition
      - lasting
      properties:
        condition:
          type: string
          description: "`SourceReady` or `BuilderReady`."
        lasting:
          type: boolean
          description: |-
            Whether it needs someone to act. Only `ResolveFailed` (a timeout or a server error) may
            clear by itself, so it counts once it has lasted [`TRANSIENT`].
        message:
          type:
          - string
          - "null"
          description: The controller's message.
        reason:
          type:
          - string
          - "null"
          description: >-
            The controller's reason, such as `RefNotFound`, `AuthFailed` or
            `HostKeyMismatch`.
        since:
          type:
          - string
          - "null"
          description: When the condition turned `False`.
    ZeaburBuilderRun:
      type: object
      description: A `BuildRun`.
      required:
      - name
      - build
      - tags
      properties:
        build:
          type: string
          description: The `Build`.
        created:
          type:
          - string
          - "null"
          description: When it was created.
        digest:
          type:
          - string
          - "null"
          description: The pushed manifest's digest.
        finished:
          type:
          - string
          - "null"
          description: When it finished.
        gitRef:
          type:
          - string
          - "null"
          description: The ref the commit came from, such as `refs/heads/master`.
        message:
          type:
          - string
          - "null"
          description: Details, at most 1 KiB of the Job's output.
        name:
          type: string
          description: Its name, also its Job's and its pod's label.
        phase:
          type:
          - string
          - "null"
          description: "`Pending`, `Planning`, `Building`, `Succeeded`, `Failed` or `Cancelled`."
        reason:
          type:
          - string
          - "null"
          description: Why it waits or failed.
        revision:
          type:
          - string
          - "null"
          description: The commit.
        started:
          type:
          - string
          - "null"
          description: When it started.
        tags:
          type: array
          items:
            type: string
          description: The tags pushed.
        trigger:
          type:
          - string
          - "null"
          description: "`webhook`, `poll` or `manual`."
tags:
- name: identity
  description: Who you are and what you may do
- name: members
  description: "Everyone Zeabur Identity signs in: passkeys, setup links, removals"
- name: cluster
  description: The cluster and what it has installed
- name: projects
  description: "Projects (namespaces), their events, and changes: plan, then apply"
- name: services
  description: "A project's services (workloads): releases and usage history"
- name: pods
  description: "A pod's containers: logs, a terminal over a WebSocket, and their files"
- name: resources
  description: A project's resources and objects of any kind, as YAML
- name: settings
  description: Zeabur's own settings
