      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterNameChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterNameSetting"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/settings/domains:
    get:
      tags:
      - settings
      summary: |-
        The domains new URLs are suggested under, whether a wildcard record sends each to the
        cluster, the addresses it should point to, and whether you may change them. Readable by
        everyone signed in; each request looks the suffixes up again.
      operationId: getDomains
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainsSetting"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - settings
      summary: |-
        Changes the domains new URLs are suggested under, or goes back to the ones Zeabur was
        installed with (`null`), by writing the settings ConfigMap as you. Existing URLs keep their
        names. Who may: whoever may update (and create) the ConfigMap `zeabur-settings` in Zeabur's
        namespace.
      operationId: setDomains
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainsChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainsSetting"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/settings/metrics-store:
    get:
      tags:
      - settings
      summary: |-
        The metrics store: which Service history is read from, where that came from, whether it
        answers and whether you may change it. Readable by everyone signed in; the store answers
        only those allowed `get` on its `services/proxy`.
      operationId: getMetricsStore
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsStoreSetting"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - settings
      summary: |-
        Changes the metrics store, or goes back to the default with `null`, by writing the
        settings ConfigMap as you (created the first time). Who may: whoever may update (and
        create) the ConfigMap `zeabur-settings` in Zeabur's namespace. Answers the setting as it
        now is, with the new store's probe.
      operationId: setMetricsStore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricsStoreChange"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsStoreSetting"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/whoami:
    get:
      tags:
      - identity
      summary: Who the cluster says you are.
      operationId: whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmI"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    AccessMode:
      type: string
      description: |-
        How the nodes may mount a new claim [k8s-access-modes].
        
        Whether a mode works is up to the `StorageClass`'s provisioner (k3s's local-path provisioner
        offers only `ReadWriteOnce` and `ReadWriteOncePod`), so no mode is refused here: the plan's
        dry run and the provisioner decide.
        
        [k8s-access-modes]: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
      enum:
      - ReadWriteOnce
      - ReadWriteOncePod
      - ReadWriteMany
      - ReadOnlyMany
    AccountRole:
      type: string
      description: A product role in a project, from the person's rights there.
      enum:
      - none
      - viewer
      - developer
      - admin
    AccountView:
      type: object
      description: Who you are, what you may do, and where to manage how you sign in.
      required:
      - id
      - username
      - groups
      - clusterAdmin
      properties:
        clusterAdmin:
          type: boolean
          description: "Whether you may do anything anywhere: Admin in every project."
        groups:
          type: array
          items:
            type: string
          description: Your groups, as kube-apiserver authenticated you.
        id:
          type: string
          description: "`account`."
        manageSignInUrl:
          type:
          - string
          - "null"
          description: The issuer's page for your sign-in methods, when it names one.
        projects:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/ProjectAccess"
          description: >-
            Your role in each adopted project, by name; absent when the projects could not
            be listed.
        username:
          type: string
          description: Your user name, as kube-apiserver authenticated you.
    AddDomainChange:
      type: object
      description: A [`Change::AddDomain`].
      required:
      - workload
      - hostname
      properties:
        certificate:
          oneOf:
          - $ref: "#/components/schemas/CertificateSource"
            description: |-
              Where its certificate comes from; absent: as the route already does, else the chart's
              `ClusterIssuer`. With a source the hostname goes on an Ingress (see the `certificates`
              module).
          - type: "null"
        hostname:
          type: string
          description: The hostname.
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: The workload.
    AddressKind:
      type: string
      description: What kind of address a trace follows.
      enum:
      - domain
      - private
    AffectedService:
      type: object
      description: A service an incident reaches.
      required:
      - id
      - project
      - kind
      - name
      properties:
        id:
          type: string
          description: Its id, `projects/<project>/services/<kind>/<name>`.
        kind:
          $ref: "#/components/schemas/WorkloadKind"
          description: The workload's kind.
        name:
          type: string
          description: The workload's name.
        project:
          type: string
          description: The project.
        symptoms:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosisKind"
          description: >-
            The kinds of its diagnoses this incident explains, sorted; empty when it shows
            none yet.
    AlertmanagerChannel:
      type: object
      description: One channel, without its secrets.
      required:
      - name
      - config
      - kind
      - events
      - managed
      - status
      properties:
        config:
          type: string
          description: The `VMAlertmanagerConfig`.
        events:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerEvent"
          description: The events it receives; empty for one Zeabur did not make.
        fields:
          type: object
          description: |-
            Its settings that are not secret, by the request's field names (`chatId`, `to`, `from`,
            `smarthost`, `username`); empty for one Zeabur did not make.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        kind:
          $ref: "#/components/schemas/AlertmanagerChannelKind"
          description: Where it sends.
        managed:
          type: boolean
          description: Whether Zeabur made it, and so may change it.
        name:
          type: string
          description: The channel's name; the config's for one Zeabur did not make.
        reason:
          type:
          - string
          - "null"
          description: Why the operator refused it.
        status:
          $ref: "#/components/schemas/AlertmanagerChannelStatus"
          description: Whether Alertmanager took it.
        target:
          type:
          - string
          - "null"
          description: The address, chat or server it sends to, when it is not a secret.
    AlertmanagerChannelKind:
      type: string
      description: Where a channel sends.
      enum:
      - slack
      - discord
      - telegram
      - email
      - webhook
      - ntfy
      - gotify
      - other
    AlertmanagerChannelSettings:
      oneOf:
      - type: object
        description: A Slack incoming webhook.
        required:
        - webhookUrl
        - kind
        properties:
          kind:
            type: string
            enum:
            - slack
          webhookUrl:
            type: string
            description: "`https://hooks.slack.com/services/…`."
      - type: object
        description: A Discord webhook.
        required:
        - webhookUrl
        - kind
        properties:
          kind:
            type: string
            enum:
            - discord
          webhookUrl:
            type: string
            description: "`https://discord.com/api/webhooks/…`."
      - type: object
        description: A Telegram bot and chat.
        required:
        - botToken
        - chatId
        - kind
        properties:
          botToken:
            type: string
            description: The bot's token, from `@BotFather`.
          chatId:
            type: integer
            format: int64
            description: The chat to post in.
          kind:
            type: string
            enum:
            - telegram
      - type: object
        description: Email through an SMTP server.
        required:
        - to
        - from
        - smarthost
        - kind
        properties:
          from:
            type: string
            description: The sender's address.
          kind:
            type: string
            enum:
            - email
          password:
            type: string
            description: The SMTP password.
          smarthost:
            type: string
            description: The SMTP server, `host:port`.
          to:
            type: string
            description: The address to send to.
          username:
            type: string
            description: The SMTP user; empty for none.
      - type: object
        description: Alertmanager's JSON, posted to a URL.
        required:
        - url
        - kind
        properties:
          bearerToken:
            type: string
            description: "Sent as `Authorization: Bearer …`; empty for none."
          kind:
            type: string
            enum:
            - webhook
          url:
            type: string
            description: The URL, `https://…` or `http://…`.
      - type: object
        description: An ntfy topic.
        required:
        - topic
        - kind
        properties:
          accessToken:
            type: string
            description: An access token for a protected topic; empty for none.
          kind:
            type: string
            enum:
            - ntfy
          server:
            type: string
            description: The ntfy server; `https://ntfy.sh` when empty.
          topic:
            type: string
            description: The topic.
      - type: object
        description: A Gotify application, through the Gotify bridge.
        required:
        - appToken
        - kind
        properties:
          appToken:
            type: string
            description: The application's token.
          kind:
            type: string
            enum:
            - gotify
      description: |-
        A channel's settings, secrets included. They go into the channel's Secret and spec; Zeabur
        never shows them again.
    AlertmanagerChannelStatus:
      type: string
      description: Whether Alertmanager took a channel.
      enum:
      - active
      - rejected
      - waiting
    AlertmanagerEvent:
      type: string
      description: An event a channel can receive.
      enum:
      - build-failed
      - build-succeeded
      - deploy-failed
      - deploy-succeeded
      - crash-loop
      - out-of-memory
      - database-unhealthy
      - backup-failed
      - volume-almost-full
      - certificate
      - node-not-ready
      - runtime-security
    Applied:
      type: object
      description: One object an apply wrote.
      required:
      - target
      properties:
        resourceVersion:
          type:
          - string
          - "null"
          description: Its `resourceVersion` after the write.
        target:
          $ref: "#/components/schemas/PlanTarget"
          description: The object.
    AppliedObject:
      type: object
      description: An object an apply wrote.
      required:
      - apiVersion
      - kind
      - plural
      - name
      properties:
        apiVersion:
          type: string
          description: Its `apiVersion`.
        kind:
          type: string
          description: Its kind.
        name:
          type: string
          description: Its name.
        plural:
          type: string
          description: The plural resource name in its path.
        resourceVersion:
          type:
          - string
          - "null"
          description: Its `resourceVersion` after the write.
    ApplyRequest:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    ApplyResponse:
      type: object
      description: What an apply wrote.
      required:
      - applied
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/Applied"
          description: The objects, in the order written.
    Attribution:
      type: object
      description: The resolved ownership of one resource.
      required:
      - ownership
      - owners
      properties:
        owners:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadRef"
          description: |-
            The referencing workloads, sorted by kind then name, without duplicates; always present,
            empty for an orphan.
        ownership:
          $ref: "#/components/schemas/Ownership"
          description: Owned, shared or orphan.
    BackupCoverage:
      type: object
      description: One target's coverage across providers.
      required:
      - target
      - scheduledBy
      properties:
        lastRun:
          oneOf:
          - $ref: "#/components/schemas/BackupRun"
            description: Its latest run, by any provider.
          - type: "null"
        scheduledBy:
          type: array
          items:
            type: string
          description: The schedules covering it (`<provider>:<namespace>/<name>`), active ones only.
        target:
          $ref: "#/components/schemas/BackupTarget"
          description: The target.
    BackupOutcome:
      type: string
      description: How a backup run went.
      enum:
      - succeeded
      - partiallyFailed
      - failed
      - running
      - unknown
    BackupProvider:
      type: object
      description: One backup provider of this build.
      required:
      - module
      - state
      properties:
        module:
          type: string
          description: The module (`k8up`).
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether it could be read.
    BackupRun:
      type: object
      description: One backup run.
      required:
      - name
      - provider
      - targets
      - outcome
      properties:
        finished:
          type:
          - string
          - "null"
          description: When it finished, RFC 3339.
        message:
          type:
          - string
          - "null"
          description: The provider's message, for a failure.
        name:
          type: string
          description: The provider's object name.
        outcome:
          $ref: "#/components/schemas/BackupOutcome"
          description: How it went.
        provider:
          type: string
          description: The provider (module id).
        restoreFrom:
          type:
          - string
          - "null"
          description: |-
            What a restore of this backup names: CloudNativePG's backup ID, Percona's destination, or
            the time MOCO and mariadb-operator restore to. Absent when it cannot be restored yet.
        started:
          type:
          - string
          - "null"
          description: When it started, RFC 3339.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/BackupTarget"
          description: What it covered.
    BackupSchedule:
      type: object
      description: One backup schedule.
      required:
      - name
      - provider
      - cron
      - paused
      - targets
      properties:
        cron:
          type: string
          description: >-
            The cron expression, as the provider writes it (CloudNativePG's has a seconds
            field).
        destination:
          type:
          - string
          - "null"
          description: >-
            Where it writes, such as `s3:https://s3.example.com/backups/shop`, when the
            provider says.
        name:
          type: string
          description: The provider's object, `<namespace>/<name>`.
        note:
          type:
          - string
          - "null"
          description: >-
            What else to know about the coverage (an i18n key), such as
            `velero.volumesNeedSnapshots`.
        paused:
          type: boolean
          description: The schedule is paused or suspended.
        provider:
          type: string
          description: The provider (module id).
        retention:
          type: object
          description: |-
            How many backups it keeps, by period (`last`, `hourly`, `daily`, `weekly`, `monthly`,
            `yearly`), when the provider counts them.
          additionalProperties:
            type: integer
            format: int64
          propertyNames:
            type: string
        runNow:
          type:
          - object
          - "null"
          description: |-
            The object that runs it once, without `metadata`: for K8up, a `Backup` with the schedule's
            backup spec and backend.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/BackupTarget"
          description: What it covers in the project.
    BackupTarget:
      type: object
      description: One thing a backup covers.
      required:
      - kind
      - name
      properties:
        kind:
          $ref: "#/components/schemas/BackupTargetKind"
          description: What it is.
        name:
          type: string
          description: "Its name: the claim, the database cluster or the namespace."
    BackupTargetKind:
      type: string
      description: What a backup covers.
      enum:
      - volume
      - database
      - namespace
    BackupWrite:
      type: object
      description: One object a plan writes.
      required:
      - action
      - kind
      - name
      - namespace
      properties:
        action:
          $ref: "#/components/schemas/BackupWriteAction"
          description: What it does.
        afterYaml:
          type:
          - string
          - "null"
          description: The object as it will be, YAML; a Secret's keys are not in it.
        beforeYaml:
          type:
          - string
          - "null"
          description: The object as it is, YAML; absent for a creation.
        kind:
          type: string
          description: The object's kind.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
    BackupWriteAction:
      type: string
      description: What a write does.
      enum:
      - create
      - patch
    BackupsApplied:
      type: object
      description: What an apply wrote.
      required:
      - written
      properties:
        backup:
          type:
          - string
          - "null"
          description: The backup a `backupNow` plan created.
        restore:
          type:
          - string
          - "null"
          description: The restore a `restore` plan created.
        written:
          type: array
          items:
            type: string
          description: The objects written, `Kind/name`.
    BackupsApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    BackupsPlan:
      type: object
      description: A plan, and the token that applies it.
      required:
      - token
      - expiresAt
      - writes
      properties:
        backup:
          type:
          - string
          - "null"
          description: The backup a `backupNow` plan creates.
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        restore:
          type:
          - string
          - "null"
          description: The restore a `restore` plan creates.
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/BackupWrite"
          description: The writes, in order; empty when nothing changes.
    BackupsPlanRequest:
      oneOf:
      - type: object
        description: Set where backups go.
        required:
        - bucket
        - op
        properties:
          accessKeyId:
            type: string
            description: The access key ID; empty with the secret to keep the keys the location has.
          bucket:
            type: string
            description: The bucket.
          destination:
            type:
            - string
            - "null"
            description: |-
              An S3 destination of the cluster's list to copy the keys from, instead of the keys
              given.
          endpoint:
            type: string
            description: The S3-compatible endpoint, `https://…`; empty for AWS S3.
          op:
            type: string
            enum:
            - location
          prefix:
            type: string
            description: A folder in the bucket.
          region:
            type: string
            description: The region; `us-east-1` when empty.
          secretAccessKey:
            type: string
            description: The secret access key.
      - type: object
        description: Set Zeabur's schedule.
        required:
        - cron
        - keepDays
        - op
        properties:
          cron:
            type: string
            description: Five cron fields, in the Velero server's clock.
          keepDays:
            type: integer
            format: int32
            description: How many days each backup is kept.
            minimum: 0
          namespaces:
            type: array
            items:
              type: string
            description: The namespaces to back up; empty for every namespace.
          op:
            type: string
            enum:
            - schedule
      - type: object
        description: Pause Zeabur's schedule, or resume it.
        required:
        - paused
        - op
        properties:
          op:
            type: string
            enum:
            - pause
          paused:
            type: boolean
            description: Paused after the change.
      - type: object
        description: Back up now with Zeabur's schedule's settings.
        required:
        - op
        properties:
          op:
            type: string
            enum:
            - backupNow
      - type: object
        description: >-
          Restore a backup into some of its namespaces. Velero skips objects that are
          there.
        required:
        - backup
        - namespaces
        - op
        properties:
          backup:
            type: string
            description: The backup.
          namespaces:
            type: array
            items:
              type: string
            description: The namespaces to restore.
          op:
            type: string
            enum:
            - restore
      description: What to plan.
    BaselinePolicy:
      type: object
      description: A baseline policy and the node addresses it does not let in.
      required:
      - namespace
      - missing
      - current
      properties:
        current:
          type: boolean
          description: Whether its blocks are exactly the nodes' addresses.
        missing:
          type: array
          items:
            type: string
          description: Node addresses it has no block for, sorted.
        namespace:
          type: string
          description: Its namespace.
    BasicAuthChange:
      type: object
      description: A [`Change::BasicAuth`].
      required:
      - route
      properties:
        route:
          $ref: "#/components/schemas/RouteRef"
          description: The Ingress.
        user:
          oneOf:
          - $ref: "#/components/schemas/BasicAuthUser"
            description: The one user that may sign in; absent stops asking.
          - type: "null"
    BasicAuthUser:
      type: object
      description: >-
        The user of a [`Change::BasicAuth`]. Zeabur keeps only a bcrypt hash of the
        password.
      required:
      - username
      - password
      properties:
        password:
          type: string
          description: The password, 8 to 72 bytes.
        username:
          type: string
          description: The user name; no colon.
    Blocker:
      type: object
      description: One limit the new pods exceed.
      required:
      - kind
      - resource
      - need
      - available
      properties:
        available:
          type: integer
          format: int64
          description: What is left.
          minimum: 0
        kind:
          $ref: "#/components/schemas/BlockerKind"
          description: A quota or the nodes.
        name:
          type:
          - string
          - "null"
          description: The quota's name.
        need:
          type: integer
          format: int64
          description: "What the plan needs, in the resource's unit: millicores, bytes or pods."
          minimum: 0
        resource:
          type: string
          description: "The resource: `requests.cpu`, `limits.memory`, `pods`, `cpu`, `memory`, …"
    BlockerKind:
      type: string
      description: What keeps a pod from being created or placed.
      enum:
      - quota
      - node
    BuildOptionsChange:
      type: object
      description: A [`Change::BuildOptions`]. A field left out stays as it is.
      required:
      - build
      properties:
        build:
          type: string
          description: The `Build`.
        contextDir:
          type:
          - string
          - "null"
          description: |-
            The build context inside the repository, `spec.source.git.contextDir`. Empty: the
            repository's root.
        dockerfile:
          type:
          - string
          - "null"
          description: "The Dockerfile, relative to the context, `spec.source.git.dockerfile`. Empty: `Dockerfile`."
        env:
          type: array
          items:
            $ref: "#/components/schemas/EnvEdit"
          description: |-
            The build variables to set or remove, `spec.env`. A value from a Secret names only
            `secretName` and `key`.
    BuildSettings:
      type: object
      description: |-
        Where a service deployed from Git keeps its images, as an administrator installed Zeabur (the
        chart's `builds`).
      properties:
        registry:
          type:
          - string
          - "null"
          description: |-
            The registry Zeabur Builder pushes to and nodes pull from, such as `zot.zot.svc:5000`; a
            new service's images are `<registry>/<project>/<service>`. `None`: services are not
            deployed from Git.
    Capability:
      type: object
      description: Whether a capability is present on the cluster, and on what evidence.
      required:
      - name
      - existing
      - evidence
      - components
      - installations
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/Component"
          description: "The catalogue's components for it: what to install when it is missing."
        evidence:
          type: array
          items:
            type: string
          description: |-
            What was found, one line per match (`IngressClass controller
            traefik.io/ingress-controller`).
        existing:
          type: boolean
          description: "`true` when any component of it was found."
        installations:
          type: array
          items:
            $ref: "#/components/schemas/Installation"
          description: The components found installed, with their versions and who manages them.
        name:
          type: string
          description: The capability (`ingress`, `certificates`, …).
        suggestion:
          oneOf:
          - $ref: "#/components/schemas/Suggestion"
            description: |-
              For a missing capability, whether the catalogue recommends installing it on a cluster of
              this shape; `None` when it exists.
          - type: "null"
    CapabilityList:
      type: object
      description: Which capabilities the cluster has.
      required:
      - catalogueCommit
      - items
      properties:
        catalogueCommit:
          type: string
          description: Zeabur Catalog's commit.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
          description: "Each capability, sorted by name: existing (with evidence) or not (with what to install)."
    CapacityStatus:
      type: string
      description: Whether the other nodes have room for the pods that move.
      enum:
      - fits
      - short
      - unknown
    CertificateChange:
      type: object
      description: A [`Change::Certificate`].
      required:
      - route
      - hostname
      - certificate
      properties:
        certificate:
          $ref: "#/components/schemas/CertificateSource"
          description: Where its certificate comes from.
        hostname:
          type: string
          description: The hostname.
        route:
          $ref: "#/components/schemas/RouteRef"
          description: The route; only an Ingress names its certificates.
    CertificateCheck:
      type: object
      description: A domain's certificate, as cert-manager reports it.
      required:
      - state
      properties:
        message:
          type:
          - string
          - "null"
          description: cert-manager's own words, in English.
        name:
          type:
          - string
          - "null"
          description: The `Certificate`, when one manages it.
        notAfter:
          type:
          - string
          - "null"
          description: When it expires (`status.notAfter`).
        reason:
          type:
          - string
          - "null"
          description: cert-manager's reason (`Failed`, `DoesNotExist`) or the ACME challenge's state.
        state:
          $ref: "#/components/schemas/CertificateState"
          description: How it stands.
    CertificateDates:
      type: object
      description: The dates of the certificate in a `kubernetes.io/tls` Secret. Never its key.
      required:
      - secret
      - notBefore
      - notAfter
      properties:
        notAfter:
          type: string
          description: When it expires, RFC 3339.
        notBefore:
          type: string
          description: From when the certificate is valid, RFC 3339.
        secret:
          type: string
          description: The Secret.
    CertificateSource:
      oneOf:
      - type: object
        description: cert-manager issues and renews it through this `ClusterIssuer`.
        required:
        - name
        - from
        properties:
          from:
            type: string
            enum:
            - issuer
          name:
            type: string
            description: The `ClusterIssuer`.
      - type: object
        description: >-
          The person's own certificate, kept in a `kubernetes.io/tls` Secret. Nothing
          renews it.
        required:
        - certificate
        - key
        - from
        properties:
          certificate:
            type: string
            description: The certificate, then its intermediates, PEM.
          from:
            type: string
            enum:
            - own
          key:
            type: string
            description: Its private key, PEM. It is never shown again.
      description: Where the certificate of a hostname comes from.
    CertificateState:
      type: string
      description: How a domain's certificate stands.
      enum:
      - ready
      - issuing
      - failed
      - notChecked
    Change:
      oneOf:
      - type: object
        description: Set or remove environment variables of one container of a workload.
        required:
        - workload
        - changes
        - op
        properties:
          changes:
            type: array
            items:
              $ref: "#/components/schemas/EnvEdit"
            description: The variables to set or remove.
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          op:
            type: string
            enum:
            - env
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: Set or remove keys of a ConfigMap or Secret.
        required:
        - kind
        - name
        - changes
        - op
        properties:
          changes:
            type: array
            items:
              $ref: "#/components/schemas/DataEdit"
            description: The keys to set or remove.
          kind:
            $ref: "#/components/schemas/DataKind"
            description: "`ConfigMap` or `Secret`."
          name:
            type: string
            description: Its name.
          op:
            type: string
            enum:
            - data
      - allOf:
        - $ref: "#/components/schemas/AddDomainChange"
          description: Route a new hostname to a workload.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - addDomain
        description: Route a new hostname to a workload.
      - type: object
        description: Replace a hostname of a route with another.
        required:
        - route
        - from
        - to
        - op
        properties:
          from:
            type: string
            description: The hostname now.
          op:
            type: string
            enum:
            - renameDomain
          route:
            $ref: "#/components/schemas/RouteRef"
            description: The route.
          to:
            type: string
            description: The hostname wanted.
      - type: object
        description: Stop routing a hostname.
        required:
        - route
        - hostname
        - op
        properties:
          hostname:
            type: string
            description: The hostname.
          op:
            type: string
            enum:
            - removeDomain
          route:
            $ref: "#/components/schemas/RouteRef"
            description: The route.
      - allOf:
        - $ref: "#/components/schemas/RedirectChange"
          description: Redirect a hostname to another hostname, or stop (see the `access` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - redirect
        description: Redirect a hostname to another hostname, or stop (see the `access` module).
      - allOf:
        - $ref: "#/components/schemas/BasicAuthChange"
          description: |-
            Ask for a user name and password on every hostname of an Ingress, or stop (see the
            `access` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - basicAuth
        description: |-
          Ask for a user name and password on every hostname of an Ingress, or stop (see the
          `access` module).
      - allOf:
        - $ref: "#/components/schemas/ErrorPageHtml"
          description: |-
            Write the HTML of the project's error pages, in the ConfigMap of its page server (see the
            `error_pages` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - errorPageHtml
        description: |-
          Write the HTML of the project's error pages, in the ConfigMap of its page server (see the
          `error_pages` module).
      - allOf:
        - $ref: "#/components/schemas/ErrorPageHtml"
          description: |-
            Deploy the page server from Zeabur Catalog's `error-pages` template, with this HTML in
            place of the template's pages. The API opens it into the `create` of each object; the
            NetworkPolicy that denies traffic to every pod of the namespace is left out, so the
            project's other services keep their traffic.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - pageServer
        description: |-
          Deploy the page server from Zeabur Catalog's `error-pages` template, with this HTML in
          place of the template's pages. The API opens it into the `create` of each object; the
          NetworkPolicy that denies traffic to every pod of the namespace is left out, so the
          project's other services keep their traffic.
      - allOf:
        - $ref: "#/components/schemas/ErrorPagesChange"
          description: Show the project's error pages on every hostname of an Ingress, or stop.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - errorPages
        description: Show the project's error pages on every hostname of an Ingress, or stop.
      - allOf:
        - $ref: "#/components/schemas/MaintenanceChange"
          description: Show the maintenance page on a hostname instead of its workload, or stop.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - maintenance
        description: Show the maintenance page on a hostname instead of its workload, or stop.
      - allOf:
        - $ref: "#/components/schemas/CertificateChange"
          description: |-
            Change where the certificate of one hostname of an Ingress comes from (see the
            `certificates` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - certificate
        description: |-
          Change where the certificate of one hostname of an Ingress comes from (see the
          `certificates` module).
      - allOf:
        - $ref: "#/components/schemas/EnvImportChange"
          description: |-
            Give a container every key of a ConfigMap or Secret as variables (`envFrom`), or stop
            (see the `shared` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - envImport
        description: |-
          Give a container every key of a ConfigMap or Secret as variables (`envFrom`), or stop
          (see the `shared` module).
      - allOf:
        - $ref: "#/components/schemas/PublicPortChange"
          description: |-
            Open a port of a workload to the internet with a `LoadBalancer` Service, or close it (see
            the `public_port` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - publicPort
        description: |-
          Open a port of a workload to the internet with a `LoadBalancer` Service, or close it (see
          the `public_port` module).
      - type: object
        description: Replace a workload's pods, as `kubectl rollout restart` does.
        required:
        - workload
        - op
        properties:
          op:
            type: string
            enum:
            - restart
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          Return a workload's pod template to an earlier release, as `kubectl rollout undo
          --to-revision` does. ConfigMap and Secret contents stay as they are.
        required:
        - workload
        - revision
        - op
        properties:
          op:
            type: string
            enum:
            - rollback
          revision:
            type: integer
            format: int64
            description: The release to return to.
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: "The workload: a Deployment, StatefulSet or DaemonSet."
      - type: object
        description: Ask for more space on a PersistentVolumeClaim; claims only grow.
        required:
        - claim
        - size
        - op
        properties:
          claim:
            type: string
            description: The claim.
          op:
            type: string
            enum:
            - expandVolume
          size:
            type: string
            description: The new size, a Kubernetes quantity such as `20Gi`.
      - allOf:
        - $ref: "#/components/schemas/LabelVolumeChange"
          description: |-
            Add labels and annotations to a PersistentVolumeClaim, such as the ones a backup tool
            selects claims by.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - labelVolume
        description: |-
          Add labels and annotations to a PersistentVolumeClaim, such as the ones a backup tool
          selects claims by.
      - type: object
        description: Create a PersistentVolumeClaim and mount it in a container of a workload.
        required:
        - workload
        - volume
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          op:
            type: string
            enum:
            - addVolume
          volume:
            $ref: "#/components/schemas/VolumeRequest"
            description: The volume.
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: Move a mount, or make it read-only or writable.
        required:
        - workload
        - mountPath
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          mountPath:
            type: string
            description: Where it is mounted now.
          newMountPath:
            type:
            - string
            - "null"
            description: Where to mount it instead.
          op:
            type: string
            enum:
            - editMount
          readOnly:
            type:
            - boolean
            - "null"
            description: Mount it read-only (or not).
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          Stop mounting a volume in a container, and drop it from the pod template once nothing
          mounts it. A PersistentVolumeClaim it names stays, with its data.
        required:
        - workload
        - mountPath
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          mountPath:
            type: string
            description: Where it is mounted.
          op:
            type: string
            enum:
            - removeVolume
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: Set or remove a liveness, readiness or startup probe of a container.
        required:
        - workload
        - probe
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          op:
            type: string
            enum:
            - probe
          probe:
            $ref: "#/components/schemas/ProbeKind"
            description: Which probe.
          set:
            oneOf:
            - $ref: "#/components/schemas/ProbeRequest"
              description: The probe; absent to remove it.
            - type: "null"
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          Have Stakater Reloader replace a workload's pods when a ConfigMap or Secret it reads
          changes, or stop it: the workload's `reloader.stakater.com/auto` annotation (see the
          `reload` module).
        required:
        - workload
        - enabled
        - op
        properties:
          enabled:
            type: boolean
            description: On or off.
          op:
            type: string
            enum:
            - configReload
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: "The workload: a Deployment, StatefulSet or DaemonSet."
      - type: object
        description: Run another image in one container of a workload.
        required:
        - workload
        - image
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          image:
            type: string
            description: The image reference, such as a Zeabur Builder `Build`'s `status.latestImage`.
          op:
            type: string
            enum:
            - image
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: Build a Zeabur Builder `Build`'s current commit again (see the `builds` module).
        required:
        - build
        - op
        properties:
          build:
            type: string
            description: The `Build`.
          op:
            type: string
            enum:
            - rebuild
      - allOf:
        - $ref: "#/components/schemas/BuildOptionsChange"
          description: |-
            Set what a Zeabur Builder `Build` builds: its directory, its Dockerfile and its build
            variables (see the `builds` module).
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - buildOptions
        description: |-
          Set what a Zeabur Builder `Build` builds: its directory, its Dockerfile and its build
          variables (see the `builds` module).
      - type: object
        description: >-
          Have Keel move a workload to each new image, or stop it (see the `builds`
          module).
        required:
        - workload
        - enabled
        - op
        properties:
          build:
            type:
            - string
            - "null"
            description: The `Build` whose new images Keel is told of, when turning it on.
          enabled:
            type: boolean
            description: On or off.
          op:
            type: string
            enum:
            - autoUpdate
          webhook:
            type:
            - string
            - "null"
            description: Keel's native webhook, `…/v1/webhooks/native`.
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: "The workload: a Deployment, StatefulSet or DaemonSet."
      - type: object
        description: Run this many pods of a Deployment or StatefulSet.
        required:
        - workload
        - replicas
        - op
        properties:
          op:
            type: string
            enum:
            - scale
          replicas:
            type: integer
            format: int32
            description: The replicas.
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          Set a container's CPU, memory and ephemeral storage requests and limits; those left out
          are removed, other resources (such as GPUs) are kept.
        required:
        - workload
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container; may be left out when the workload has only one.
          limits:
            type: object
            description: Limits, the same way.
            additionalProperties:
              type: string
            propertyNames:
              type: string
          op:
            type: string
            enum:
            - resources
          requests:
            type: object
            description: Requests, by resource (`cpu`, `memory`, `ephemeral-storage`).
            additionalProperties:
              type: string
            propertyNames:
              type: string
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          Set the Pod Security level a workload's pods meet (see the `pod_security` module):
          `restricted` writes the settings the restricted standard asks for into its pod template;
          `baseline` removes the ones that keep an image running as root from starting. The pods
          are replaced.
        required:
        - workload
        - profile
        - op
        properties:
          op:
            type: string
            enum:
            - securityProfile
          profile:
            $ref: "#/components/schemas/PodSecurityLevel"
            description: "`restricted` or `baseline`."
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: "The workload: a Deployment, StatefulSet, DaemonSet or CronJob."
      - type: object
        description: |-
          Set the Pod Security level enforced in the project, the Namespace's
          `pod-security.kubernetes.io/enforce` label (see the `pod_security` module). `baseline`
          lowers only a `restricted` label and writes nothing otherwise; `restricted` is refused
          while a workload, as the plan leaves it, does not meet it. Written before the other
          changes of the plan.
        required:
        - level
        - op
        properties:
          level:
            $ref: "#/components/schemas/PodSecurityLevel"
            description: "`restricted` or `baseline`."
          op:
            type: string
            enum:
            - podSecurity
      - type: object
        description: |-
          Replace one object of the project with an edited copy, written as YAML.
          
          Fields the server sets (`status`, `resourceVersion`, `managedFields`, …) are kept whatever
          the copy says. A ConfigMap's or Secret's edit becomes key changes: a Secret value shown
          masked and sent back unchanged is kept.
        required:
        - resource
        - name
        - yaml
        - op
        properties:
          name:
            type: string
            description: Its name.
          op:
            type: string
            enum:
            - edit
          resource:
            $ref: "#/components/schemas/ResourceRef"
            description: The object's resource.
          yaml:
            type: string
            description: The edited object, YAML (JSON is YAML too).
      - type: object
        description: |-
          Create one object in the project, of any namespaced kind the cluster serves (see the
          `create` module). Its namespace is the project's; an object of that name must not exist
          yet. Several are created in dependency order, without a transaction.
        required:
        - op
        properties:
          object:
            type:
            - object
            - "null"
            description: |-
              The object: `apiVersion`, `kind`, `metadata.name`, and its fields. Left out when
              `yaml` gives it.
          op:
            type: string
            enum:
            - create
          yaml:
            type:
            - string
            - "null"
            description: |-
              The object as one YAML document, as a person wrote it; a problem with it names the
              line.
      - type: object
        description: |-
          Create the Secret that holds an SSH deploy key Zeabur generated, for Zeabur Builder to
          fetch a private repository: a `kubernetes.io/ssh-auth` Secret with the private key and the
          Git host's `known_hosts`, labelled `builder.zeabur.com/git-credentials: "true"`. The key is
          sealed by the server that made it; the API opens it and plans the Secret as a `create`,
          so the private key never travels in the clear.
        required:
        - name
        - key
        - op
        properties:
          key:
            type: string
            description: The sealed key, as `POST /projects/{p}/deploy-keys` returned it.
          name:
            type: string
            description: The Secret's name.
          op:
            type: string
            enum:
            - deployKey
      - allOf:
        - $ref: "#/components/schemas/CopyS3KeysChange"
          description: |-
            Create a Secret with the keys of an S3 destination from the cluster's list. The API reads
            the destination's Secret as the person and plans the Secret as a `create`, so the keys
            never travel through the browser. The Secret is labelled with the destination and names
            its keys, so a plan that changes the destination's keys can update it.
        - type: object
          required:
          - op
          properties:
            op:
              type: string
              enum:
              - copyS3Keys
        description: |-
          Create a Secret with the keys of an S3 destination from the cluster's list. The API reads
          the destination's Secret as the person and plans the Secret as a `create`, so the keys
          never travel through the browser. The Secret is labelled with the destination and names
          its keys, so a plan that changes the destination's keys can update it.
      - type: object
        description: |-
          Delete one object of the project, as `kubectl delete` does: what it owns goes after it
          (background propagation). Refused for an object Helm, Argo CD or Flux manages, and for one
          a controller owns, except a Pod, which its owner replaces (see the `delete` module).
        required:
        - resource
        - name
        - op
        properties:
          name:
            type: string
            description: Its name.
          op:
            type: string
            enum:
            - delete
          owned:
            type: boolean
            description: |-
              For a workload: also delete what the service made and nothing else uses, its
              Kubernetes Services, routes, ConfigMaps, Secrets and claims (see the `owned` module).
              What it uses that stays is named in a warning with the reason.
          resource:
            $ref: "#/components/schemas/ResourceRef"
            description: The object's resource.
          resourceVersion:
            type:
            - string
            - "null"
            description: |-
              The `resourceVersion` the object must still have, such as the one an apply returned
              for an object it just created; when left out, the version the plan reads.
      - type: object
        description: |-
          Make the namespace a project: add the label `zeabur.com/project: "true"` to the
          Namespace, and nothing else. Refused for the namespaces Kubernetes keeps for itself
          (`kube-` prefix). Planned on its own or with the project's details only.
        required:
        - op
        properties:
          op:
            type: string
            enum:
            - adopt
      - type: object
        description: |-
          Stop showing the namespace as a project: remove that label, and nothing else. Nothing in
          the namespace is deleted.
        required:
        - op
        properties:
          op:
            type: string
            enum:
            - unadopt
      - type: object
        description: |-
          Create the project's Namespace, with the project label and, when given, its display
          name. Refused when a namespace of that name exists (adopt it instead), and for a name
          Kubernetes keeps for itself (`kube-` prefix). Planned on its own.
        required:
        - op
        properties:
          displayName:
            type:
            - string
            - "null"
            description: The name to show instead of the namespace's.
          op:
            type: string
            enum:
            - createProject
      - type: object
        description: |-
          Set the project's details, the Namespace's `zeabur.com/display-name`,
          `…/description` and `…/icon` annotations: each one left out (or blank) is removed.
        required:
        - op
        properties:
          description:
            type:
            - string
            - "null"
            description: What the project is.
          displayName:
            type:
            - string
            - "null"
            description: The name to show instead of the namespace's.
          icon:
            oneOf:
            - $ref: "#/components/schemas/ProjectIcon"
              description: Its icon.
            - type: "null"
          op:
            type: string
            enum:
            - details
      - type: object
        description: |-
          Make a scheduled task from a service: a CronJob that runs a command in a copy of one of
          its containers (see the `tasks` module).
        required:
        - from
        - name
        - schedule
        - command
        - op
        properties:
          command:
            type: string
            description: The command, run by `/bin/sh -c`.
          concurrency:
            $ref: "#/components/schemas/TaskConcurrency"
            description: What happens when a run is due while the last one still runs.
          container:
            type:
            - string
            - "null"
            description: The container to copy; may be left out when the workload has only one.
          from:
            $ref: "#/components/schemas/WorkloadRef"
            description: "The service: a Deployment, StatefulSet or DaemonSet."
          keepFailed:
            type: integer
            format: int32
            description: How many failed runs to keep.
          keepSucceeded:
            type: integer
            format: int32
            description: How many succeeded runs to keep.
          name:
            type: string
            description: The CronJob's name.
          op:
            type: string
            enum:
            - scheduleTask
          schedule:
            type: string
            description: When it runs, a cron expression such as `0 3 * * *`.
          timeZone:
            type:
            - string
            - "null"
            description: The IANA time zone of the schedule; by default the controller's, usually UTC.
      - type: object
        description: |-
          Run a CronJob now, as `kubectl create job --from=cronjob/<name>` does, under its
          `concurrencyPolicy`: `Forbid` refuses while a run is active, `Replace` deletes the active
          runs first.
        required:
        - cronJob
        - op
        properties:
          cronJob:
            type: string
            description: The CronJob.
          op:
            type: string
            enum:
            - runTask
      - type: object
        description: |-
          Change a scheduled task. Each field given replaces the CronJob's; the runs already started
          keep going.
        required:
        - cronJob
        - op
        properties:
          command:
            type:
            - string
            - "null"
            description: The command, run by `/bin/sh -c`. Only for a task whose only container runs one.
          concurrency:
            oneOf:
            - $ref: "#/components/schemas/TaskConcurrency"
              description: What happens when a run is due while the last one still runs.
            - type: "null"
          cronJob:
            type: string
            description: The CronJob.
          keepFailed:
            type:
            - integer
            - "null"
            format: int32
            description: How many failed runs to keep.
          keepSucceeded:
            type:
            - integer
            - "null"
            format: int32
            description: How many succeeded runs to keep.
          op:
            type: string
            enum:
            - editTask
          paused:
            type:
            - boolean
            - "null"
            description: Stop starting runs on schedule (`spec.suspend`), or start again.
          schedule:
            type:
            - string
            - "null"
            description: When it runs, a cron expression.
          timeZone:
            type:
            - string
            - "null"
            description: The IANA time zone of the schedule; empty removes it, for the controller's.
      - type: object
        description: |-
          Add a debug container to a pod, for a terminal in a container whose image has no shell:
          an ephemeral container with a shell image, sharing the target container's processes
          (see the `terminal` module). Kubernetes keeps it until the pod is replaced. When one of
          Zeabur's still runs for that container, the plan writes nothing and says so. Planned on
          its own.
        required:
        - pod
        - op
        properties:
          container:
            type:
            - string
            - "null"
            description: The container whose processes it shares; by default the pod's default container.
          op:
            type: string
            enum:
            - debugContainer
          pod:
            type: string
            description: The pod.
      - type: object
        description: |-
          Start a pod with `kubectl` and `helm` that act as the person, for a terminal (see the
          `terminal` module). When the person's tools pod still runs, the plan writes nothing and
          says so. Planned on its own.
        required:
        - op
        properties:
          op:
            type: string
            enum:
            - clusterTools
      description: One change a person asks for.
    Citation:
      type: object
      description: A public source a rule rests on.
      required:
      - title
      - url
      properties:
        title:
          type: string
          description: The document's title.
        url:
          type: string
          description: Where to read it.
    ClaimStorage:
      type: object
      description: Where one claim's data is.
      required:
      - origin
      - claim
      properties:
        capacity:
          type:
          - string
          - "null"
          description: The size it has (`status.capacity.storage`), once bound.
        claim:
          type: string
          description: Its name.
        node:
          type:
          - string
          - "null"
          description: >-
            The one node the PersistentVolume's node affinity names, by
            `kubernetes.io/hostname`.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The PersistentVolumeClaim.
        pinned:
          type:
          - boolean
          - "null"
          description: |-
            Whether the PersistentVolume may be used only on some nodes (a required node affinity);
            absent when it could not be read or there is none yet.
        storageClass:
          type:
          - string
          - "null"
          description: "`spec.storageClassName`; absent when it names none."
        volume:
          type:
          - string
          - "null"
          description: Its PersistentVolume (`spec.volumeName`), once bound.
    Classification:
      type: object
      description: Where a workload is listed and under which name.
      required:
      - group
      properties:
        displayName:
          type:
          - string
          - "null"
          description: |-
            The name to show instead of the workload's, when it stands for something a person named,
            such as the database cluster whose data it holds.
        group:
          type: string
          description: The group the workload is listed in.
        managedBy:
          oneOf:
          - $ref: "#/components/schemas/ManagedBy"
            description: The operator-managed resource the workload belongs to.
          - type: "null"
    ClientFrame:
      oneOf:
      - type: object
        description: The terminal's new size, in character cells.
        required:
        - cols
        - rows
        - type
        properties:
          cols:
            type: integer
            format: int32
            description: Columns.
            minimum: 0
          rows:
            type: integer
            format: int32
            description: Rows.
            minimum: 0
          type:
            type: string
            enum:
            - resize
      description: A control frame from the browser.
    Cluster:
      type: object
      description: The cluster.
      required:
      - name
      - nameSource
      - kubernetesVersion
      - domains
      - builds
      - can
      properties:
        builds:
          $ref: "#/components/schemas/BuildSettings"
          description: Where a service deployed from Git keeps its images.
        can:
          $ref: "#/components/schemas/ClusterRights"
          description: What you may change in the cluster itself.
        distribution:
          type:
          - string
          - "null"
          description: "The distribution, when the version names one: `k3s` or `rke2`."
        domains:
          $ref: "#/components/schemas/DomainSettings"
          description: How a new service's public URL is made.
        kubernetesVersion:
          type: string
          description: kube-apiserver's version (`gitVersion`, such as `v1.36.5+k3s1`).
        name:
          type: string
          description: |-
            What to call the cluster, never kube-apiserver's address (see
            `crate::settings::cluster_name`).
        nameSource:
          $ref: "#/components/schemas/NameSource"
          description: Where `name` comes from.
    ClusterBackups:
      type: object
      description: The cluster's backups as Velero keeps them.
      required:
      - state
      - namespace
      - locations
      - schedules
      - backups
      - restores
      - totalBackups
      - canChange
      - canRestore
      - unreadable
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/VeleroBackup"
          description: The newest backups, newest first, a hundred at most.
        canChange:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may create schedules in Velero's namespace.
        canRestore:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may create restores in Velero's namespace.
        keysFrom:
          type:
          - string
          - "null"
          description: The S3 destination the main location's keys were copied from.
        locations:
          type: array
          items:
            $ref: "#/components/schemas/VeleroLocation"
          description: Where backups go.
        namespace:
          type: string
          description: Velero's namespace.
        restores:
          type: array
          items:
            $ref: "#/components/schemas/VeleroRestore"
          description: The newest restores, newest first, a hundred at most.
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/VeleroSchedule"
          description: When they run.
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether Velero is installed and its objects could be read.
        totalBackups:
          type: integer
          description: How many backups there are.
          minimum: 0
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    ClusterEventList:
      type: object
      description: Events of the whole cluster, the newest `limit` of them.
      required:
      - items
      - totalSize
      - partial
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventView"
          description: >-
            Newest first (by `lastSeen`, events without one last), then by namespace and
            name.
        partial:
          type: boolean
          description: |-
            `true` when the cluster holds more events than Zeabur read (5,000): older ones may be
            missing.
        totalSize:
          type: integer
          description: How many events matched, also those past `limit`.
          minimum: 0
    ClusterHealth:
      type: object
      description: >-
        The API server's readiness, from the replica that answered (see
        `crate::cluster::health`).
      required:
      - id
      - ready
      - checks
      - failing
      - leaders
      properties:
        checks:
          type: integer
          description: How many checks ran.
          minimum: 0
        failing:
          type: array
          items:
            $ref: "#/components/schemas/FailingCheck"
          description: The checks that failed, in the API server's order.
        id:
          type: string
          description: "`cluster/health`."
        leaders:
          type: array
          items:
            $ref: "#/components/schemas/LeaderLease"
          description: |-
            The leader leases of kube-scheduler and kube-controller-manager that exist and may be
            read, in that order.
        ready:
          type: boolean
          description: Every check passed.
    ClusterIssuers:
      type: object
      description: The cluster's `ClusterIssuers`.
      required:
      - state
      - issuers
      - canChange
      - unreadable
      properties:
        canChange:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may create `ClusterIssuers`.
        default:
          type:
          - string
          - "null"
          description: The issuer a new domain gets when none is chosen.
        issuers:
          type: array
          items:
            $ref: "#/components/schemas/IssuerView"
          description: The issuers, by name.
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether cert-manager is installed and its issuers could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    ClusterKind:
      type: object
      description: A kind that belongs to the whole cluster.
      required:
      - group
      - kind
      properties:
        group:
          type: string
          description: The API group; empty for the core group.
        kind:
          type: string
          description: The kind.
    ClusterNameChange:
      type: object
      description: A change of the cluster's name.
      properties:
        name:
          type:
          - string
          - "null"
          description: >-
            The name, at most 63 characters; `null` goes back to the name Zeabur finds
            itself.
      additionalProperties: false
    ClusterNameSetting:
      type: object
      description: The cluster's name setting.
      required:
      - id
      - canChange
      - unreadable
      properties:
        canChange:
          $ref: "#/components/schemas/Permission"
          description: >-
            Whether the person may change it, as far as their RBAC rules in that namespace
            tell.
        default:
          type:
          - string
          - "null"
          description: |-
            The name Zeabur was installed with (`ZEABUR_CLUSTER_NAME`); absent when it was not given
            one.
        id:
          type: string
          description: "`settings/cluster-name`."
        name:
          type:
          - string
          - "null"
          description: The name chosen in the settings; absent when none is.
        storedIn:
          oneOf:
          - $ref: "#/components/schemas/Origin"
            description: |-
              The ConfigMap a change is kept in; absent where Zeabur keeps no settings (on a person's
              computer).
          - type: "null"
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: The settings ConfigMap, when it could not be read.
    ClusterRights:
      type: object
      description: What the person may change in the cluster itself.
      required:
      - installComponents
      - changeNodes
      - changeBackups
      properties:
        changeBackups:
          $ref: "#/components/schemas/Permission"
          description: |-
            Set up Velero backups: `create` on `schedules.velero.io`. The backups page asks again in
            Velero's own namespace.
        changeNodes:
          $ref: "#/components/schemas/Permission"
          description: "Change nodes (labels, taints, cordon): `patch` on nodes."
        installComponents:
          $ref: "#/components/schemas/Permission"
          description: "Install components with Zeabur: `create` on `helmcharts.helm.cattle.io` in `kube-system`."
    ClusterToolsApplied:
      type: object
      description: What an apply did.
      required:
      - pod
      - namespace
      properties:
        namespace:
          type: string
          description: Its namespace.
        pod:
          type: string
          description: The pod a terminal opens in.
    ClusterToolsApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    ClusterToolsPlan:
      type: object
      description: >-
        A plan that starts the person's cluster tools pod, or uses the one that still
        runs.
      required:
      - expiresAt
      - namespace
      - pod
      - writes
      - warnings
      - exposed
      properties:
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        exposed:
          type: array
          items:
            $ref: "#/components/schemas/ShellExposure"
          description: |-
            Bindings that let others into the pod, and so to the credential in it; the plan cannot be
            applied while there is one.
        namespace:
          type: string
          description: The namespace of the pod.
        pod:
          type: string
          description: The pod it starts, or the one it uses.
        token:
          type:
          - string
          - "null"
          description: |-
            Send this to `apply` to carry out exactly this plan; absent while `exposed` lists
            bindings.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PlanWarning"
          description: |-
            Who `kubectl` acts as and until when, or that a running pod is used; who else could use
            the credential.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/ShellWrite"
          description: The writes, in order; none when it uses a running pod.
    ClusterUsage:
      type: object
      description: What each namespace reserves and uses.
      required:
      - id
      - items
      - totals
      - podScan
      - podsScanned
      - metrics
      - unreadable
      properties:
        id:
          type: string
          description: "`cluster/usage`."
        items:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceUsage"
          description: Each namespace with a pod or a sample, by name.
        metrics:
          $ref: "#/components/schemas/MetricsState"
          description: Whether usage could be read.
        podScan:
          $ref: "#/components/schemas/PodScan"
          description: "`complete`, or `partial` when the read stopped at 5,000 pods."
        podsScanned:
          type: integer
          description: How many unfinished pods were read.
          minimum: 0
        timestamp:
          type:
          - string
          - "null"
          description: When the newest sample was taken (RFC 3339).
        totals:
          $ref: "#/components/schemas/UsageTotals"
          description: Every namespace together.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
        window:
          type:
          - string
          - "null"
          description: The window CPU is averaged over, as metrics-server writes it (`15s`).
    Component:
      type: object
      description: "One component of the catalogue: an upstream project that provides a capability."
      required:
      - id
      - capability
      - displayName
      - homepage
      - license
      - description
      - defaults
      - distributions
      properties:
        capability:
          type: string
          description: The capability it provides (`ingress`).
        defaults:
          type: object
          description: |-
            Whether the catalogue installs it by default, per profile (`single-node`, `multi-node`):
            `recommended` or `optional`.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        description:
          type: string
          description: Why the catalogue chose it.
        displayName:
          type: string
          description: Human-readable name.
        distributions:
          type: array
          items:
            type: string
          description: The distributions it supports (`k3s`, …); empty means all.
        homepage:
          type: string
          description: The project's home page.
        id:
          type: string
          description: Its id, the file name in the catalogue (`traefik`).
        license:
          type: string
          description: Its licence (SPDX).
    ComponentUpgrade:
      type: string
      description: The installed version against the tested one. An open set.
      enum:
      - current
      - behind-patch
      - behind-minor
      - behind-major
      - ahead
      - unknown
    ComposeRequest:
      type: object
      description: A Compose file to convert.
      required:
      - yaml
      properties:
        envFiles:
          type: object
          description: |-
            The files `env_file` names, and `.env` for interpolation, by path as the Compose file
            writes it.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        yaml:
          type: string
          description: The Compose file, YAML.
    ComposeService:
      type: object
      description: One Compose service.
      required:
      - name
      - composeName
      - ports
      - published
      - variables
      - volumes
      - dependsOn
      - replicas
      - findings
      properties:
        args:
          type: array
          items:
            type: string
          description: The container's arguments (`command`).
        command:
          type: array
          items:
            type: string
          description: The container's command (`entrypoint`).
        composeName:
          type: string
          description: Its name in the Compose file.
        counterpart:
          oneOf:
          - $ref: "#/components/schemas/Counterpart"
            description: The operator-managed counterpart of its image, when it has one.
          - type: "null"
        dependsOn:
          type: array
          items:
            type: string
          description: The services it starts after, by Kubernetes name.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
          description: What is left out, and why.
        image:
          type:
          - string
          - "null"
          description: The image; absent when the service only has `build:`, which is then not made.
        name:
          type: string
          description: Its Kubernetes name, a DNS label.
        ports:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
          description: The TCP ports it listens on (`ports` targets, then `expose`), without repeats.
        published:
          type: boolean
          description: "Compose publishes one of its ports on the host: the service may want a public domain."
        replicas:
          type: integer
          format: int32
          description: How many replicas (`deploy.replicas` or `scale`), from 1 to 20.
          minimum: 0
        variables:
          type: array
          items:
            $ref: "#/components/schemas/ComposeVariable"
          description: Its variables, `env_file` first and `environment` over them.
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/ComposeVolume"
          description: Its volumes.
    ComposeVariable:
      type: object
      description: A variable of a service.
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Its name.
        refers:
          oneOf:
          - $ref: "#/components/schemas/Refers"
            description: The database service it points at, when it does.
          - type: "null"
        value:
          type: string
          description: Its value, interpolated.
    ComposeVolume:
      type: object
      description: A volume of a service.
      required:
      - name
      - mountPath
      - readOnly
      properties:
        mountPath:
          type: string
          description: Where it is mounted.
        name:
          type: string
          description: Its name, a DNS label; the claim is `<service>-<name>`.
        readOnly:
          type: boolean
          description: Mounted read-only.
    ConfigMapList:
      type: object
      description: The ConfigMaps of a project.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConfigMapView"
          description: Sorted by name.
    ConfigMapView:
      type: object
      description: "A ConfigMap, in full: ConfigMaps hold configuration, not secrets."
      required:
      - id
      - origin
      - data
      - binaryKeys
      properties:
        binaryKeys:
          type: array
          items:
            type: string
          description: Keys holding binary data (not shown).
        data:
          type: object
          description: Its text values.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        id:
          type: string
          description: "`projects/<project>/resources/configmap/<name>`."
        origin:
          $ref: "#/components/schemas/Origin"
          description: The ConfigMap.
    ConfigReload:
      type: object
      description: |-
        What a workload's Reloader annotations ask for [reloader]: its pods are replaced when one of
        these ConfigMaps or Secrets changes, whoever changed it, while Reloader runs in the cluster.
        
        Reloader also reads `reloader.stakater.com/search` with `reloader.stakater.com/match` on the
        ConfigMap or Secret, and `reloader.stakater.com/ignore`; those live on the data objects and
        are not part of this.
        
        [reloader]: https://github.com/stakater/Reloader#how-to-use-reloader
      required:
      - auto
      - allConfigMaps
      - allSecrets
      - configMaps
      - secrets
      properties:
        allConfigMaps:
          type: boolean
          description: "`configmap.reloader.stakater.com/auto: \"true\"`: every ConfigMap it reads."
        allSecrets:
          type: boolean
          description: "`secret.reloader.stakater.com/auto: \"true\"`: every Secret it reads."
        auto:
          type: boolean
          description: |-
            `reloader.stakater.com/auto: "true"`: every ConfigMap and Secret it reads. This is what
            Zeabur's setting writes.
        configMaps:
          type: array
          items:
            type: string
          description: ConfigMaps named in `configmap.reloader.stakater.com/reload`.
        secrets:
          type: array
          items:
            type: string
          description: Secrets named in `secret.reloader.stakater.com/reload`.
    ConfigReloadView:
      type: object
      description: Whether the cluster restarts workloads when their configuration changes.
      required:
      - id
      - reloader
      - deployments
      properties:
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: Its Deployments, when found.
        id:
          type: string
          description: "`cluster/config-reload`."
        reloader:
          $ref: "#/components/schemas/ReloaderState"
          description: Whether Reloader runs.
    Connection:
      type: object
      description: |-
        One service appearing to call another.
        
        Kubernetes has no field for "this workload talks to that one", so every connection is read
        from evidence and says which. It describes configuration, never observed traffic.
      required:
      - from
      - to
      - inferred
      - evidence
      properties:
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionEvidence"
          description: Why the connection is drawn, sorted.
        from:
          $ref: "#/components/schemas/WorkloadRef"
          description: The caller.
        inferred:
          type: boolean
          description: |-
            True when the only evidence is text inside a variable's value, false when a reference
            field of a Kubernetes object supports it.
        to:
          $ref: "#/components/schemas/WorkloadRef"
          description: The service called.
    ConnectionEvidence:
      oneOf:
      - type: object
        description: |-
          The caller and a data store read the same Secret or ConfigMap, which usually holds the
          store's address or credentials.
        required:
        - object
        - basis
        properties:
          basis:
            type: string
            enum:
            - sharedObject
          object:
            $ref: "#/components/schemas/ObjectRef"
            description: The Secret or ConfigMap.
      - type: object
        description: |-
          A literal variable's value names a Kubernetes Service that selects the target's pods,
          such as `redis://redis:6379` or `http://api.shop.svc.cluster.local`.
        required:
        - container
        - variable
        - service
        - basis
        properties:
          basis:
            type: string
            enum:
            - envValue
          container:
            type: string
            description: The caller's container.
          service:
            type: string
            description: The Kubernetes Service named.
          variable:
            type: string
            description: The variable.
      description: Why a [`Connection`] is drawn.
    ConnectionRef:
      type: object
      description: A connection between two services of the project.
      required:
      - from
      - to
      properties:
        from:
          $ref: "#/components/schemas/WorkloadRef"
          description: The caller.
        to:
          $ref: "#/components/schemas/WorkloadRef"
          description: The callee.
    Container:
      type: object
      description: One container of a workload.
      required:
      - name
      - env
      - importedEnv
      - mounts
      - origin
      properties:
        env:
          type: array
          items:
            $ref: "#/components/schemas/EnvVar"
          description: The `env` entries, in order.
        image:
          type:
          - string
          - "null"
          description: The image.
        importedEnv:
          type: array
          items:
            $ref: "#/components/schemas/ImportedEnv"
          description: The `envFrom` imports, in order.
        init:
          type: boolean
          description: An init container (including a restartable "sidecar").
        mounts:
          type: array
          items:
            $ref: "#/components/schemas/Mount"
          description: The volume mounts, in order.
        name:
          type: string
          description: The container's name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The container in its workload.
        probes:
          oneOf:
          - $ref: "#/components/schemas/Probes"
            description: Its liveness, readiness and startup probes; absent when it sets none.
          - type: "null"
        resources:
          oneOf:
          - $ref: "#/components/schemas/ContainerResources"
            description: The CPU and memory it requests and is limited to; absent when it sets neither.
          - type: "null"
    ContainerProbeHandler:
      type: string
      description: A probe's handler.
      enum:
      - HTTP
      - TCP
      - gRPC
      - exec
    ContainerResources:
      type: object
      description: |-
        A container's `resources`, as written: requests are what the scheduler reserves, limits what
        the kubelet enforces [k8s-resources].
        
        [k8s-resources]: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
      properties:
        limits:
          $ref: "#/components/schemas/Quantities"
          description: What the kubelet enforces.
        requests:
          $ref: "#/components/schemas/Quantities"
          description: What the scheduler reserves.
    ContainerStatusSummary:
      type: object
      description: |-
        One container's state in a pod [k8s-container-states].
        
        [k8s-container-states]: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-states
      required:
      - name
      - ready
      - restarts
      properties:
        init:
          type: boolean
          description: An init container (including a restartable "sidecar").
        lastTermination:
          oneOf:
          - $ref: "#/components/schemas/ContainerTermination"
            description: How its previous run ended, after a restart.
          - type: "null"
        name:
          type: string
          description: The container's name.
        ready:
          type: boolean
          description: Whether it passes its readiness probe.
        restarts:
          type: integer
          format: int32
          description: How many times the kubelet restarted it.
        terminated:
          oneOf:
          - $ref: "#/components/schemas/ContainerTermination"
            description: How it ended, when it is terminated now.
          - type: "null"
        waiting:
          oneOf:
          - $ref: "#/components/schemas/ContainerWaiting"
            description: Why it is waiting, when it is.
          - type: "null"
    ContainerTermination:
      type: object
      description: How a container run ended.
      required:
      - exitCode
      properties:
        exitCode:
          type: integer
          format: int32
          description: The process's exit code.
        finished:
          type:
          - string
          - "null"
          description: When it ended, in RFC 3339.
        message:
          type:
          - string
          - "null"
          description: The container's termination message, or the runtime's.
        reason:
          type:
          - string
          - "null"
          description: "`Error`, `Completed`, `OOMKilled`, `ContainerCannotRun`, …"
        started:
          type:
          - string
          - "null"
          description: When it started, in RFC 3339.
    ContainerUsage:
      type: object
      description: What one container uses.
      required:
      - name
      - cpuMillicores
      - memoryBytes
      properties:
        cpuMillicores:
          type: integer
          format: int64
          description: CPU, in millicores, rounded up.
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          description: Memory, the working set, in bytes.
          minimum: 0
        name:
          type: string
          description: The container.
    ContainerWaiting:
      type: object
      description: Why a container is waiting.
      properties:
        message:
          type:
          - string
          - "null"
          description: The kubelet's message.
        reason:
          type:
          - string
          - "null"
          description: "`CrashLoopBackOff`, `ImagePullBackOff`, `ErrImagePull`, `CreateContainerConfigError`, …"
    Conversion:
      type: object
      description: What a Compose file becomes.
      required:
      - services
      - missingEnvFiles
      - unset
      - waitImage
      properties:
        missingEnvFiles:
          type: array
          items:
            type: string
          description: Files `env_file` names that the request does not hold.
        services:
          type: array
          items:
            $ref: "#/components/schemas/ComposeService"
          description: The services, by Compose name.
        unset:
          type: array
          items:
            type: string
          description: Variables the file interpolates that nothing sets; they are empty.
        waitImage:
          type: string
          description: The image of the init containers that wait for a dependency (`depends_on`).
    CopyKept:
      type: string
      description: Why a plan does not update a copy.
      enum:
      - denied
      - unknownKeys
    CopyS3KeysChange:
      type: object
      description: The Secret of a [`Change::CopyS3Keys`].
      required:
      - destination
      - object
      - accessKeyId
      - secretAccessKey
      properties:
        accessKeyId:
          type: string
          description: The key the access key ID goes under.
        destination:
          type: string
          description: The destination's name.
        object:
          type: object
          description: The Secret to create, as for `create`; `stringData` holds its other keys.
        secretAccessKey:
          type: string
          description: The key the secret access key goes under.
    Counterpart:
      type: string
      description: The operator-managed counterpart of a database or object-storage image.
      enum:
      - postgresql
      - mysql
      - mariadb
      - mongodb
      - dragonfly
      - objectStorage
    CreatableKind:
      type: object
      description: A kind that can be created in a project.
      required:
      - group
      - version
      - resource
      - kind
      - custom
      - access
      properties:
        access:
          $ref: "#/components/schemas/ObjectAccess"
          description: Whether the person may create it, as the review hints.
        custom:
          type: boolean
          description: "Not one of Kubernetes' own groups: a custom resource, or an extension API."
        group:
          type: string
          description: The API group; empty for the core group.
        kind:
          type: string
          description: The kind.
        resource:
          type: string
          description: The plural resource name.
        version:
          type: string
          description: The preferred version.
    CreatableList:
      type: object
      description: What can be created in a project.
      required:
      - items
      - clusterScoped
      properties:
        clusterScoped:
          type: array
          items:
            $ref: "#/components/schemas/ClusterKind"
          description: The cluster-scoped kinds, which a project cannot hold.
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreatableKind"
          description: The namespaced kinds, by group then kind.
    DataEdit:
      type: object
      description: One requested change to a ConfigMap or Secret key.
      required:
      - op
      - key
      properties:
        key:
          type: string
          description: The key.
        op:
          type: string
          description: "`set` or `remove`."
        value:
          type:
          - string
          - "null"
          description: The value, for `set`; for a Secret, the plain value (Zeabur encodes it).
    DataKind:
      type: string
      description: A ConfigMap or a Secret.
      enum:
      - ConfigMap
      - Secret
    DataLoss:
      type: object
      description: Data a plan loses.
      required:
      - kind
      properties:
        claim:
          type:
          - string
          - "null"
          description: The claim, or the StatefulSet's claim template.
        kind:
          $ref: "#/components/schemas/DataLossKind"
          description: What kind.
        mountPaths:
          type: array
          items:
            type: string
          description: Where the containers mount it.
        volume:
          type:
          - string
          - "null"
          description: The volume.
        workload:
          oneOf:
          - $ref: "#/components/schemas/WorkloadRef"
            description: The workload whose pods hold it.
          - type: "null"
    DataLossKind:
      type: string
      description: What kind of data a plan loses.
      enum:
      - claimDeleted
      - emptyDir
      - claimsOfStatefulSet
    DataStore:
      type: string
      description: What kind of data store a service is, as far as its image's name tells.
      enum:
      - postgres
      - mysql
      - redis
      - mongo
      - queue
      - search
      - other
    Database:
      type: object
      description: One database cluster.
      required:
      - origin
      - engine
      - provider
      - apiVersion
      - kind
      - resource
      - name
      - state
      - members
      - ready
      - claims
      - connection
      - backups
      - object
      - pods
      properties:
        apiVersion:
          type: string
          description: The object's `apiVersion`.
        app:
          oneOf:
          - $ref: "#/components/schemas/DatabaseAppUser"
            description: |-
              The user a service connects as; absent when the database has none (a MongoDB without
              `spec.users`).
          - type: "null"
        backups:
          $ref: "#/components/schemas/DatabaseBackups"
          description: Its backups.
        claims:
          type: array
          items:
            type: string
          description: The members' PersistentVolumeClaims, as named by the operator's convention.
        connection:
          $ref: "#/components/schemas/DatabaseConnection"
          description: Where and as whom to connect.
        created:
          type:
          - string
          - "null"
          description: When it was created, RFC 3339.
        engine:
          $ref: "#/components/schemas/DatabaseEngine"
          description: The engine.
        image:
          type:
          - string
          - "null"
          description: The server image.
        kind:
          type: string
          description: The object's kind.
        members:
          type: integer
          format: int64
          description: Members asked for.
        message:
          type:
          - string
          - "null"
          description: The operator's message, when it says why.
        name:
          type: string
          description: Its name.
        object:
          type: object
          description: |-
            The object as written, without `status` and `managedFields`: what an edit (turning
            backups on) starts from, so the edit changes only what it adds.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The object it is read from.
        phase:
          type:
          - string
          - "null"
          description: The operator's own words for it (`Cluster in healthy state`, `ready`).
        pods:
          type: array
          items:
            $ref: "#/components/schemas/PodSummary"
          description: Its members' pods, by name; empty when they cannot be read.
        primary:
          type:
          - string
          - "null"
          description: The member taking writes.
        provider:
          type: string
          description: The provider (module id).
        ready:
          type: integer
          format: int64
          description: Members ready.
        resource:
          type: string
          description: The object's plural resource name.
        resources:
          type:
          - object
          - "null"
          description: CPU and memory each member asks for and may use, as written.
        restored:
          oneOf:
          - $ref: "#/components/schemas/DatabaseRestored"
            description: The backup it was restored from, when Zeabur made it from one.
          - type: "null"
        state:
          $ref: "#/components/schemas/DatabaseState"
          description: How it is.
        storage:
          type:
          - string
          - "null"
          description: The size of each member's volume, as asked for.
        storageClass:
          type:
          - string
          - "null"
          description: |-
            The `StorageClass` of each member's volume, as asked for; absent for the cluster's
            default.
        version:
          type:
          - string
          - "null"
          description: The server version, as reported, else from the image tag.
    DatabaseAppUser:
      type: object
      description: A database user for applications, and the Secret key holding its password.
      required:
      - username
      - secret
      - passwordKey
      properties:
        database:
          type:
          - string
          - "null"
          description: |-
            The database it may use, and authenticates against; absent when it may make its own
            (MOCO's `moco-writable`).
        passwordKey:
          type: string
          description: The Secret's key holding the password.
        secret:
          type: string
          description: The Secret holding its password, in the project.
        username:
          type: string
          description: The user name.
    DatabaseBackupStore:
      type: object
      description: "Where backups go: an S3-compatible bucket."
      required:
      - name
      - inUse
      properties:
        destination:
          type:
          - string
          - "null"
          description: The bucket and path (`s3://bucket/path`).
        endpoint:
          type:
          - string
          - "null"
          description: The endpoint URL, when not AWS S3's.
        inUse:
          type: boolean
          description: "The database uses this store for its backups (PostgreSQL: its WAL archive)."
        name:
          type: string
          description: "The object naming the target: an `ObjectStore`, or a storage of the database object."
        region:
          type:
          - string
          - "null"
          description: The bucket's region, when the store names one.
        retention:
          type:
          - string
          - "null"
          description: How long backups are kept, as the provider writes it (`30d`, or a count).
        secret:
          type:
          - string
          - "null"
          description: The Secret holding the access keys.
    DatabaseBackups:
      type: object
      description: A database's backups.
      required:
      - schedules
      - runs
      - ready
      properties:
        ready:
          type: boolean
          description: |-
            A backup can start now: the database runs with its store. False between setting up
            backups and the operator restarting the members with them.
        runs:
          type: array
          items:
            $ref: "#/components/schemas/BackupRun"
          description: Its backups, newest first.
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/BackupSchedule"
          description: The schedules that back it up.
        store:
          oneOf:
          - $ref: "#/components/schemas/DatabaseBackupStore"
            description: Where they go, when set up.
          - type: "null"
    DatabaseConnection:
      type: object
      description: Where and as whom to connect, inside the cluster.
      required:
      - host
      - port
      - secret
      - passwordKey
      properties:
        database:
          type:
          - string
          - "null"
          description: The database to connect to.
        host:
          type: string
          description: The Service's in-cluster DNS name.
        options:
          type:
          - string
          - "null"
          description: Extra connection-string options (`replicaSet=rs0`).
        passwordKey:
          type: string
          description: The Secret's key holding the password.
        port:
          type: integer
          format: int32
          description: The port.
          minimum: 0
        secret:
          type: string
          description: The Secret holding the credentials, in the project.
        username:
          type:
          - string
          - "null"
          description: The user name, when the spec says it.
        usernameKey:
          type:
          - string
          - "null"
          description: The Secret's key holding the user name.
    DatabaseEngine:
      type: string
      description: A database engine.
      enum:
      - postgresql
      - mongodb
      - mysql
      - mariadb
      - dragonfly
    DatabaseOperator:
      type: object
      description: Whether an engine's operator, and its backup component, could be read.
      required:
      - engine
      - module
      - state
      - backups
      properties:
        backups:
          $ref: "#/components/schemas/ProviderState"
          description: |-
            Whether what backups need could be read: the Barman Cloud plugin's `ObjectStore`s for
            PostgreSQL; the operator itself for MongoDB.
        engine:
          $ref: "#/components/schemas/DatabaseEngine"
          description: The engine.
        module:
          type: string
          description: The operator's module (`cloudnative-pg`).
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether its objects could be read.
    DatabaseRestored:
      type: object
      description: |-
        The backup a database was made from, as Zeabur noted it on the object when it planned the
        restore.
      required:
      - from
      properties:
        backup:
          type:
          - string
          - "null"
          description: The backup's name.
        from:
          type: string
          description: The database the backup is of.
        time:
          type:
          - string
          - "null"
          description: When the backup was taken, RFC 3339.
    DatabaseState:
      type: string
      description: How a database is, from its operator's status.
      enum:
      - ready
      - progressing
      - degraded
      - failed
      - paused
      - unknown
    DebugContainerStatus:
      type: object
      description: A debug container of Zeabur's.
      required:
      - name
      - image
      - state
      properties:
        image:
          type: string
          description: Its image.
        name:
          type: string
          description: "Its name: the terminal's `container`."
        reason:
          type:
          - string
          - "null"
          description: The kubelet's reason (`ErrImagePull`, `Completed`, …).
        state:
          $ref: "#/components/schemas/DebugState"
          description: Its state.
    DebugState:
      type: string
      description: The state of a debug container.
      enum:
      - running
      - waiting
      - terminated
      - unknown
    DebugStatus:
      type: object
      description: A pod's debug container for one of its containers.
      required:
      - pod
      - target
      properties:
        container:
          oneOf:
          - $ref: "#/components/schemas/DebugContainerStatus"
            description: |-
              Zeabur's debug container for it: the newest that runs or is starting, else the newest;
              absent when there is none, and a plan adds one.
          - type: "null"
        pod:
          type: string
          description: The pod.
        problem:
          oneOf:
          - $ref: "#/components/schemas/Problem"
            description: Why it does not start, when it cannot.
          - type: "null"
        target:
          type: string
          description: The container it shares processes with.
    Denied:
      type: object
      description: |-
        The request kube-apiserver refused with `403`, as Zeabur made it.
        
        These are the attributes its authorizers decide on [k8s-authz]. kube-apiserver's `Status` names
        the object (`details.kind`, `details.group`, `details.name`) but not the verb [api-conventions],
        and its message is not an interface, so these come from the request, not from the answer.
        
        [k8s-authz]: https://kubernetes.io/docs/reference/access-authn-authz/authorization/#review-your-request-attributes
        [api-conventions]: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#response-status-kind
      required:
      - verb
      - group
      - resource
      properties:
        group:
          type: string
          description: The API group; empty for the core group.
        name:
          type:
          - string
          - "null"
          description: The object's name.
        namespace:
          type:
          - string
          - "null"
          description: The object's namespace.
        resource:
          type: string
          description: The resource (plural, `deployments`).
        verb:
          type: string
          description: The request verb (`create`, `patch`, …).
    DeployKeyPublic:
      type: object
      description: The public half of a deploy key Zeabur made.
      required:
      - publicKey
      properties:
        publicKey:
          type: string
          description: One `ssh-ed25519 …` line, to add on the Git host again.
    DeployKeyRequest:
      type: object
      description: The Git host a deploy key is for.
      required:
      - host
      properties:
        host:
          type: string
          description: "`github.com` or `gitlab.com`."
    DeployKeyResponse:
      type: object
      description: A new deploy key.
      required:
      - publicKey
      - key
      - expiresAt
      properties:
        expiresAt:
          type: string
          description: When the sealed key stops working, RFC 3339.
        key:
          type: string
          description: "The private key, sealed: give it back in a plan's `deployKey` change."
        publicKey:
          type: string
          description: The public key, one `ssh-ed25519 …` line, to add on the Git host.
    Diagnosis:
      type: object
      description: One explained failure of a service's container.
      required:
      - kind
      - pods
      - cause
      - why
      - fix
      - evidence
      properties:
        cause:
          $ref: "#/components/schemas/Message"
          description: The cause, in one sentence.
        container:
          type: string
          description: |-
            The container it is about; absent for what is about the service as a whole (traffic,
            quota, scheduling, the fallback).
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: The status fields and events it rests on.
        fault:
          $ref: "#/components/schemas/Fault"
          description: Where the cause lies and who can remove it.
        fix:
          $ref: "#/components/schemas/Message"
          description: What to do about it, in one sentence.
        incident:
          type:
          - string
          - "null"
          description: |-
            The cluster incident this is a symptom of ([`Incident::id`]); set only in answers that
            read the incidents too.
        kind:
          $ref: "#/components/schemas/DiagnosisKind"
          description: What kind of failure.
        lastSeen:
          type:
          - string
          - "null"
          description: When it last happened, in RFC 3339, when known.
        pods:
          type: array
          items:
            type: string
          description: The pods it was seen in, sorted.
        why:
          $ref: "#/components/schemas/Message"
          description: "Why: the rule that applies, with this occurrence's numbers where Zeabur knows them."
    DiagnosisKind:
      type: string
      description: What kind of failure a diagnosis explains.
      enum:
      - crashLoop
      - runFailed
      - outOfMemory
      - imagePull
      - probeFailure
      - unreachable
      - quotaBlocked
      - unschedulable
      - configMissing
      - podSecurity
      - unexplained
    DiskState:
      type: string
      description: Whether disk use could be read from the metrics store. An open set.
      enum:
      - available
      - not-configured
      - unreadable
      - unavailable
      - not-collected
    DiskUsage:
      type: object
      description: A filesystem's size and use.
      required:
      - capacityBytes
      - usedBytes
      - availableBytes
      properties:
        availableBytes:
          type: integer
          format: int64
          description: >-
            Free to use; can be less than size less use where the filesystem keeps some
            back.
          minimum: 0
        capacityBytes:
          type: integer
          format: int64
          description: Its size.
          minimum: 0
        usedBytes:
          type: integer
          format: int64
          description: In use.
          minimum: 0
    Dns01Provider:
      oneOf:
      - type: object
        description: Cloudflare, with an API token that may edit the zone's DNS.
        required:
        - provider
        properties:
          apiToken:
            type: string
            description: The API token.
          provider:
            type: string
            enum:
            - cloudflare
      - type: object
        description: AWS Route 53, with an access key.
        required:
        - region
        - accessKeyId
        - provider
        properties:
          accessKeyId:
            type: string
            description: The access key ID.
          hostedZoneId:
            type: string
            description: The hosted zone; empty to let cert-manager find it.
          provider:
            type: string
            enum:
            - route53
          region:
            type: string
            description: The region.
          secretAccessKey:
            type: string
            description: The secret access key.
      - type: object
        description: Google Cloud DNS, with a service account key.
        required:
        - project
        - provider
        properties:
          project:
            type: string
            description: The Google Cloud project.
          provider:
            type: string
            enum:
            - cloudDns
          serviceAccountJson:
            type: string
            description: The service account's JSON key.
      - type: object
        description: "`DigitalOcean`, with an API token."
        required:
        - provider
        properties:
          provider:
            type: string
            enum:
            - digitalocean
          token:
            type: string
            description: The API token.
      - type: object
        description: Azure DNS, with a service principal.
        required:
        - subscriptionId
        - tenantId
        - clientId
        - resourceGroupName
        - hostedZoneName
        - provider
        properties:
          clientId:
            type: string
            description: The service principal's client ID.
          clientSecret:
            type: string
            description: Its client secret.
          hostedZoneName:
            type: string
            description: The zone.
          provider:
            type: string
            enum:
            - azureDns
          resourceGroupName:
            type: string
            description: The resource group of the zone.
          subscriptionId:
            type: string
            description: The subscription.
          tenantId:
            type: string
            description: The tenant.
      description: >-
        A DNS provider's settings for a DNS-01 solver. A blank secret field keeps the
        Secret's value.
    DnsState:
      type: string
      description: >-
        Whether a domain's DNS sends it to the cluster, as looked up from where Zeabur
        runs.
      enum:
      - pointsHere
      - elsewhere
      - missing
      - unknown
    DomainCheck:
      type: object
      description: What setting up a domain needs and how far it is.
      required:
      - target
      - dns
      properties:
        certificate:
          oneOf:
          - $ref: "#/components/schemas/CertificateCheck"
            description: Its certificate, when the route lists the host for HTTPS.
          - type: "null"
        dns:
          $ref: "#/components/schemas/DnsState"
          description: Whether it points there.
        resolved:
          type: array
          items:
            type: string
          description: The addresses it resolved to.
        target:
          type: array
          items:
            type: string
          description: |-
            The addresses the domain's DNS should point to: the route's `status.loadBalancer`, or
            another route's of the same class while it has none. Empty when none is known.
    DomainSettings:
      type: object
      description: |-
        How a new service's public URL is made, as an administrator installed Zeabur (the chart's
        `domains`).
      properties:
        clusterIssuer:
          type:
          - string
          - "null"
          description: |-
            The cert-manager `ClusterIssuer` a new URL's certificate comes from. `None`: a new URL
            is HTTP only.
        suffixes:
          type: array
          items:
            type: string
          description: |-
            The domains a new URL is suggested under, as `<service>-<project>.<suffix>`, the first by
            default; a wildcard DNS record sends each to the cluster's ingress. Empty: people type the
            whole host. The list chosen on the cluster page, when there is one (see [`domains`]).
    DomainsChange:
      type: object
      description: A change of the suffixes.
      properties:
        suffixes:
          type:
          - array
          - "null"
          items:
            type: string
          description: >-
            The suffixes, the default first; `null` goes back to the ones Zeabur was
            installed with.
      additionalProperties: false
    DomainsSetting:
      type: object
      description: The domains new URLs are suggested under.
      required:
      - id
      - suffixes
      - source
      - default
      - target
      - canChange
      - unreadable
      properties:
        canChange:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may change them.
        clusterIssuer:
          type:
          - string
          - "null"
          description: "The `ClusterIssuer` a new URL's certificate comes from; absent: new URLs are HTTP only."
        default:
          type: array
          items:
            type: string
          description: The suffixes Zeabur was installed with (`ZEABUR_DOMAIN_SUFFIXES`).
        id:
          type: string
          description: "`settings/domains`."
        source:
          $ref: "#/components/schemas/SettingSource"
          description: Whether they were chosen on the cluster page or come from the install.
        storedIn:
          oneOf:
          - $ref: "#/components/schemas/Origin"
            description: The ConfigMap a change is kept in; absent where Zeabur keeps no settings.
          - type: "null"
        suffixes:
          type: array
          items:
            $ref: "#/components/schemas/SuffixCheck"
          description: The suffixes in use, the default first, each with its check.
        target:
          type: array
          items:
            type: string
          description: |-
            The addresses the cluster's Ingresses are served on: what a wildcard record points to.
            Empty when none could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    DrainCapacity:
      type: object
      description: The moving pods against the room on the other nodes.
      required:
      - status
      - needs
      - unplaced
      properties:
        needs:
          $ref: "#/components/schemas/Resources"
          description: What the moving pods request, with their count.
        room:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: |-
              What the other ready, schedulable nodes have left, with how many pods they take; absent
              when unknown.
          - type: "null"
        status:
          $ref: "#/components/schemas/CapacityStatus"
          description: The verdict.
        unplaced:
          type: array
          items:
            type: string
          description: The moving pods that fit on no node, as `namespace/name`.
    DrainPod:
      type: object
      description: A pod on the node, and what maintenance does to it.
      required:
      - namespace
      - name
      - fate
      - scratch
      - localClaims
      - budgetBlocks
      - zeabur
      - terminating
      - requests
      properties:
        budget:
          type:
          - string
          - "null"
          description: The `PodDisruptionBudget` that covers it.
        budgetBlocks:
          type: boolean
          description: |-
            That budget allows fewer disruptions now than this node has pods under it, so some of
            their evictions wait.
        fate:
          $ref: "#/components/schemas/PodFate"
          description: What happens to it.
        localClaims:
          type: array
          items:
            type: string
          description: Its claims bound to a volume kept on this node.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
        project:
          type:
          - string
          - "null"
          description: The project it is in, when its namespace is one.
        projectName:
          type:
          - string
          - "null"
          description: The project's display name, when it has one.
        requests:
          $ref: "#/components/schemas/Resources"
          description: What it requests.
        scratch:
          type: array
          items:
            type: string
          description: Its `emptyDir` volumes, emptied when it is evicted.
        stays:
          oneOf:
          - $ref: "#/components/schemas/StayReason"
            description: Why it stays, when it does.
          - type: "null"
        terminating:
          type: boolean
          description: Already being deleted.
        workload:
          oneOf:
          - $ref: "#/components/schemas/PodWorkload"
            description: Its workload, when its controller says which.
          - type: "null"
        zeabur:
          type: boolean
          description: One of Zeabur's own pods.
    DrainProgress:
      type: object
      description: The node after an apply or a pass.
      required:
      - cordoned
      - pods
      - remaining
      - done
      properties:
        cordoned:
          type: boolean
          description: Whether the node is cordoned.
        done:
          type: boolean
          description: None of them is left.
        pods:
          type: array
          items:
            $ref: "#/components/schemas/EvictedPod"
          description: >-
            The pods being evicted, in the plan's order; empty for stop and resume
            scheduling.
        remaining:
          type: integer
          description: How many of them are still on the node.
          minimum: 0
    ElevationState:
      type: string
      description: Whether administrator rights are offered and in use.
      enum:
      - unavailable
      - available
      - active
    Endpoint:
      type: object
      description: "A Kubernetes Service selecting workloads' pods: how they are reached inside the cluster."
      required:
      - name
      - ports
      - provenance
      - origin
      properties:
        clusterIP:
          type:
          - string
          - "null"
          description: The cluster IP.
        externalAddresses:
          type: array
          items:
            type: string
          description: |-
            For a `LoadBalancer` Service, the addresses its load balancer reports in
            `status.loadBalancer.ingress`, an IP or a hostname each; empty while it has none.
        name:
          type: string
          description: The Service's name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Service object.
        ports:
          type: array
          items:
            $ref: "#/components/schemas/Port"
          description: The ports.
        provenance:
          $ref: "#/components/schemas/Provenance"
          description: The tool that manages the Service, if any.
        type:
          type:
          - string
          - "null"
          description: The Service type, such as `ClusterIP`.
    EntryKind:
      type: string
      description: What an entry records.
      enum:
      - release
      - write
      - warning
      - termination
    EnvEdit:
      type: object
      description: One requested change to a container's environment.
      required:
      - op
      - name
      properties:
        name:
          type: string
          description: The variable.
        op:
          type: string
          description: "`set` or `remove`."
        value:
          type:
          - string
          - "null"
          description: The literal value, for `set`.
        valueFrom:
          oneOf:
          - $ref: "#/components/schemas/EnvValueFrom"
            description: Where the value is read from instead, for `set`.
          - type: "null"
    EnvImportChange:
      type: object
      description: A [`Change::EnvImport`].
      required:
      - workload
      - kind
      - name
      properties:
        container:
          type:
          - string
          - "null"
          description: The container; may be left out when the workload has only one.
        kind:
          $ref: "#/components/schemas/DataKind"
          description: "`ConfigMap` or `Secret`."
        name:
          type: string
          description: Its name.
        remove:
          type: boolean
          description: Stop importing it instead.
        workload:
          $ref: "#/components/schemas/WorkloadRef"
          description: The workload.
    EnvValueFrom:
      type: object
      description: A value read from a Secret or ConfigMap key, or a pod field.
      properties:
        configMapName:
          type:
          - string
          - "null"
          description: The ConfigMap.
        fieldPath:
          type:
          - string
          - "null"
          description: A pod field (the downward API).
        key:
          type:
          - string
          - "null"
          description: The key in that object.
        secretName:
          type:
          - string
          - "null"
          description: The Secret.
    EnvVar:
      type: object
      description: One `env` entry.
      required:
      - name
      - source
      - origin
      properties:
        masked:
          type: boolean
          description: |-
            A Secret-backed value: it is never part of the projection. Revealing it is a separate
            read made with the person's own credential.
        name:
          type: string
          description: The variable's name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The entry in its workload.
        pendingRestart:
          oneOf:
          - $ref: "#/components/schemas/PendingRestart"
            description: |-
              The ConfigMap or Secret it reads was written after a running pod started; see
              [`PendingRestart`].
          - type: "null"
        source:
          $ref: "#/components/schemas/ValueSource"
          description: Where the value is read from.
        value:
          type:
          - string
          - "null"
          description: The value, for a literal only.
    ErrorPageHtml:
      type: object
      description: |-
        A [`Change::ErrorPageHtml`] or [`Change::PageServer`]: the HTML of each page. A page left out
        keeps its HTML.
      properties:
        badGateway:
          type:
          - string
          - "null"
          description: "`502.html`: the workload sent no valid answer."
        gatewayTimeout:
          type:
          - string
          - "null"
          description: "`504.html`: the workload did not answer in time."
        maintenance:
          type:
          - string
          - "null"
          description: "`maintenance.html`: what a hostname in maintenance shows."
        serviceUnavailable:
          type:
          - string
          - "null"
          description: "`503.html`: the workload cannot answer now."
    ErrorPagesChange:
      type: object
      description: A [`Change::ErrorPages`].
      required:
      - route
      - enabled
      properties:
        enabled:
          type: boolean
          description: Show the pages when true; stop when false.
        route:
          $ref: "#/components/schemas/RouteRef"
          description: The Ingress.
    EventList:
      type: object
      description: Events of a project, the newest `limit` of them.
      required:
      - items
      - totalSize
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventView"
          description: Newest first (by `lastSeen`, events without one last), then by name.
        totalSize:
          type: integer
          description: How many events matched, also those past `limit`.
          minimum: 0
    EventView:
      type: object
      description: One event about an object.
      required:
      - id
      - origin
      - type
      - reason
      - note
      - count
      properties:
        count:
          type: integer
          format: int32
          description: How many times it happened.
        id:
          type: string
          description: "`projects/<project>/events/<name>`."
        lastSeen:
          type:
          - string
          - "null"
          description: When it last happened (RFC 3339).
        note:
          type: string
          description: What happened, as the component reported it.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Event object itself.
        reason:
          type: string
          description: Machine-readable reason (`BackOff`, `Pulled`, …).
        regarding:
          oneOf:
          - $ref: "#/components/schemas/Origin"
            description: The object the event is about.
          - type: "null"
        reporter:
          type:
          - string
          - "null"
          description: The component that reported it.
        type:
          type: string
          description: "`Normal` or `Warning`."
    EvictOutcome:
      type: string
      description: What a pass found or did for one pod.
      enum:
      - gone
      - leaving
      - waiting
      - refused
      - failed
      - last
    EvictedPod:
      type: object
      description: One pod of a pass.
      required:
      - namespace
      - name
      - outcome
      - zeabur
      properties:
        budget:
          type:
          - string
          - "null"
          description: The budget it waits on, when one was found.
        detail:
          type:
          - string
          - "null"
          description: kube-apiserver's message, for a refusal or a failure.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
        outcome:
          $ref: "#/components/schemas/EvictOutcome"
          description: What happened.
        retryAfterSeconds:
          type:
          - integer
          - "null"
          format: int32
          description: How long kube-apiserver asked to wait before trying again.
          minimum: 0
        zeabur:
          type: boolean
          description: |-
            One of Zeabur's own pods: once it is leaving, the passes after it fail until Zeabur is up
            again on another node.
    EvidenceBundle:
      type: object
      description: A service's evidence, as Markdown.
      required:
      - id
      - generatedAt
      - markdown
      - unreadable
      properties:
        generatedAt:
          type: string
          description: When it was read, RFC 3339.
        id:
          type: string
          description: "`projects/<project>/services/<kind>/<name>/evidence`."
        markdown:
          type: string
          description: The text to copy.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused; the text names them too.
    ExitReason:
      type: string
      description: How a terminal's process ended, when it gave no exit code.
      enum:
      - command-not-found
      - failed
    ExposedPort:
      type: object
      description: A port the image declares (`EXPOSE`).
      required:
      - port
      - protocol
      properties:
        port:
          type: integer
          format: int32
          description: The port number.
          minimum: 0
        protocol:
          type: string
          description: "`TCP`, `UDP` or `SCTP`, as a container port names it."
    FailingCheck:
      type: object
      description: A readiness check that failed.
      required:
      - name
      properties:
        name:
          type: string
          description: The check's name (`etcd`, `poststarthook/crd-informer-synced`).
        reason:
          type:
          - string
          - "null"
          description: What the API server gave as the reason; it withholds most (`reason withheld`).
    FalcoAlert:
      type: object
      description: One alert.
      required:
      - rule
      - severity
      - output
      - source
      - origin
      properties:
        command:
          type:
          - string
          - "null"
          description: The command line that triggered it.
        container:
          type:
          - string
          - "null"
          description: The container it concerns.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The report result it was read from.
        output:
          type: string
          description: Falco's own sentence, with every field it names.
        pod:
          type:
          - string
          - "null"
          description: The pod it concerns.
        rule:
          type: string
          description: The rule that fired (`Terminal shell in container`).
        severity:
          $ref: "#/components/schemas/FalcoSeverity"
          description: How serious Falco's rule says it is.
        source:
          type: string
          description: Falco's event source (`syscall`, `k8s_audit`).
        time:
          type:
          - string
          - "null"
          description: When it happened, RFC 3339.
        user:
          type:
          - string
          - "null"
          description: The user it ran as.
    FalcoSeverity:
      type: string
      description: Falco's priority as falcosidekick maps it to a report severity.
      enum:
      - info
      - low
      - medium
      - high
      - critical
    Fault:
      type: object
      description: Where a failure's cause lies, and who can fix it.
      required:
      - origin
      - fixer
      properties:
        component:
          type:
          - string
          - "null"
          description: |-
            The component or upstream service, for [`FaultOrigin::Component`] and
            [`FaultOrigin::Upstream`]: `ingress-controller`, `cert-manager`, `cluster-dns`,
            `metrics-server`, `node/<name>`, or a registry's host.
        fixer:
          $ref: "#/components/schemas/Fixer"
          description: Who can fix it.
        origin:
          $ref: "#/components/schemas/FaultOrigin"
          description: Where the cause lies.
    FaultOrigin:
      type: string
      description: >-
        Where the cause of a failure lies, so a cluster's fault never reads as the
        reader's.
      enum:
      - code
      - configuration
      - cluster
      - component
      - upstream
      - zeabur
      - unknown
    FieldCause:
      type: object
      description: |-
        A field kube-apiserver, or an admission webhook, found invalid: one of the `causes` in its
        `Status` details [api-conventions].
        
        [api-conventions]: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#response-status-kind
      required:
      - field
      properties:
        field:
          type: string
          description: |-
            The field, as kube-apiserver writes it (`spec.replicas`,
            `spec.template.spec.containers[0].image`).
        message:
          type: string
          description: kube-apiserver's message about the field.
        reason:
          type: string
          description: Why, as a machine-readable cause (`FieldValueInvalid`, `FieldValueRequired`, …).
    FieldChange:
      type: object
      description: One changed field.
      required:
      - path
      properties:
        after:
          type:
          - string
          - "null"
          description: The value after, absent when the field is removed.
        before:
          type:
          - string
          - "null"
          description: The value before, absent when the field is new.
        path:
          type: string
          description: The field, dotted; keyed list entries as `[name=app]`, others by position.
    FileEntry:
      type: object
      description: One entry of a folder.
      required:
      - name
      - type
      - link
      - modified
      properties:
        link:
          type: boolean
          description: It is a symbolic link.
        modified:
          type: integer
          format: int64
          description: When it was last modified, in seconds since 1970.
        name:
          type: string
          description: Its name.
        size:
          type:
          - integer
          - "null"
          format: int64
          description: Its size in bytes; absent for a folder, and in a Secret's volume.
          minimum: 0
        type:
          $ref: "#/components/schemas/FileEntryType"
          description: What it is, or what its link points to.
    FileEntryType:
      type: string
      description: What an entry is.
      enum:
      - file
      - directory
      - brokenLink
      - other
    FileLimits:
      type: object
      description: The limits of this server.
      required:
      - entries
      - transfer
      - preview
      properties:
        entries:
          type: integer
          description: The most entries a listing returns.
          minimum: 0
        preview:
          type: integer
          format: int64
          description: The largest text preview, in bytes.
          minimum: 0
        transfer:
          type: integer
          format: int64
          description: The largest download or upload, in bytes.
          minimum: 0
    FileList:
      type: object
      description: A folder's entries.
      required:
      - path
      - items
      - totalSize
      - more
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
          description: Its first entries by name, folders first, at most `limits.entries`.
        more:
          type: boolean
          description: It has more names than Zeabur reads; `totalSize` counts those read.
        path:
          type: string
          description: The folder.
        totalSize:
          type: integer
          description: How many entries it has (that match `filter`).
          minimum: 0
    FileLost:
      type: string
      description: When a mount's files go away.
      enum:
      - replaced
      - restart
    FileMount:
      type: object
      description: A place in the container's file system.
      required:
      - path
      - kind
      - readOnly
      - part
      properties:
        kind:
          $ref: "#/components/schemas/FileMountKind"
          description: What it is.
        lost:
          oneOf:
          - $ref: "#/components/schemas/FileLost"
            description: When its files go away; absent when they stay.
          - type: "null"
        object:
          type:
          - string
          - "null"
          description: The claim, ConfigMap or Secret behind it.
        part:
          type: boolean
          description: Only part of the volume is mounted (`subPath`).
        path:
          type: string
          description: Where it is mounted.
        readOnly:
          type: boolean
          description: Writes are refused.
        volume:
          type:
          - string
          - "null"
          description: The volume's name in the pod; absent for the image.
    FileMountKind:
      type: string
      description: What a mount is.
      enum:
      - claim
      - configMap
      - secret
      - emptyDir
      - image
      - other
    FileNewFolder:
      type: object
      description: A folder to make.
      required:
      - path
      properties:
        container:
          type:
          - string
          - "null"
          description: The container.
        path:
          type: string
          description: The folder's absolute path.
        via:
          type:
          - string
          - "null"
          description: Zeabur's debug container to write through.
      additionalProperties: false
    FilePreview:
      type: object
      description: A file shown as text.
      required:
      - path
      - size
      - tooLarge
      properties:
        path:
          type: string
          description: The file, links resolved.
        size:
          type: integer
          format: int64
          description: Its size in bytes.
          minimum: 0
        text:
          type:
          - string
          - "null"
          description: Its text; absent when it is not text or larger than `limits.preview`.
        tooLarge:
          type: boolean
          description: Larger than `limits.preview`.
    FileReader:
      type: object
      description: How the files are reached, and what is missing when they are not.
      required:
      - kind
      properties:
        canAddDebugContainer:
          type:
          - boolean
          - "null"
          description: |-
            For `none`: whether the person may add a debug container (`patch` on
            `pods/ephemeralcontainers`); absent when the cluster would not say.
        kind:
          $ref: "#/components/schemas/FileReaderKind"
          description: How.
        via:
          type:
          - string
          - "null"
          description: The debug container to pass as `via`.
    FileReaderKind:
      type: string
      description: How the files are reached.
      enum:
      - container
      - debugContainer
      - none
    FileRename:
      type: object
      description: A rename within a folder.
      required:
      - path
      - name
      properties:
        container:
          type:
          - string
          - "null"
          description: The container.
        name:
          type: string
          description: Its new name, in the same folder.
        path:
          type: string
          description: The entry's absolute path.
        via:
          type:
          - string
          - "null"
          description: Zeabur's debug container to write through.
      additionalProperties: false
    Files:
      type: object
      description: A container's mounts and how its files are reached.
      required:
      - pod
      - container
      - mounts
      - reader
      - limits
      properties:
        container:
          type: string
          description: The container.
        limits:
          $ref: "#/components/schemas/FileLimits"
          description: The limits.
        mounts:
          type: array
          items:
            $ref: "#/components/schemas/FileMount"
          description: Its mounts, by path, the image's last.
        pod:
          type: string
          description: The pod.
        reader:
          $ref: "#/components/schemas/FileReader"
          description: How the files are reached.
    Finding:
      oneOf:
      - type: object
        description: "`privileged: true`."
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - privileged
      - type: object
        description: "`network_mode: host`."
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - hostNetwork
      - type: object
        description: "`pid: host`."
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - hostPid
      - type: object
        description: "`cap_add`."
        required:
        - capabilities
        - code
        properties:
          capabilities:
            type: array
            items:
              type: string
            description: The capabilities.
          code:
            type: string
            enum:
            - capAdd
      - type: object
        description: "`devices`."
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - devices
      - type: object
        description: A mount of the Docker socket.
        required:
        - source
        - code
        properties:
          code:
            type: string
            enum:
            - dockerSocket
          source:
            type: string
            description: The path on the host.
      - type: object
        description: A mount of another host path; nothing is mounted there.
        required:
        - source
        - target
        - code
        properties:
          code:
            type: string
            enum:
            - hostPath
          source:
            type: string
            description: The path on the host.
          target:
            type: string
            description: Where it was mounted.
      - type: object
        description: "`build:`. With an image the image is run; without one the service is not made."
        required:
        - context
        - code
        properties:
          code:
            type: string
            enum:
            - build
          context:
            type: string
            description: The build context.
      - type: object
        description: "`healthcheck`; Zeabur checks the first port instead."
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - healthcheck
      - type: object
        description: A UDP port, which a Kubernetes Service from this form does not carry.
        required:
        - port
        - code
        properties:
          code:
            type: string
            enum:
            - udpPort
          port:
            type: integer
            format: int32
            description: The port.
            minimum: 0
      - type: object
        description: A volume other services mount too; each gets a volume of its own.
        required:
        - volume
        - code
        properties:
          code:
            type: string
            enum:
            - sharedVolume
          volume:
            type: string
            description: The volume's name in the Compose file.
      - type: object
        description: The Compose name is not a DNS label; other services reach it by the new name.
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - renamed
      description: A field of a service that is left out, or a difference to know of.
    Fit:
      type: object
      description: Whether the plan's new pods fit, and what blocks them.
      required:
      - status
      - pods
      - cpuMillicores
      - memoryBytes
      properties:
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/Blocker"
          description: What blocks them, quotas first.
        cpuMillicores:
          type: integer
          format: int64
          description: CPU requests it adds at its peak, millicores.
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          description: Memory requests it adds at its peak, bytes.
          minimum: 0
        pods:
          type: integer
          format: int64
          description: Pods the plan adds at its peak.
          minimum: 0
        status:
          $ref: "#/components/schemas/FitStatus"
          description: The verdict.
    FitStatus:
      type: string
      description: Whether the plan's new pods fit.
      enum:
      - notNeeded
      - fits
      - blocked
      - unknown
    Fix:
      type: object
      description: The fix of a gap.
      required:
      - kind
      - id
      properties:
        id:
          type: string
          description: The plan template or component.
        kind:
          $ref: "#/components/schemas/FixKind"
          description: How it is closed.
        params:
          type: object
          description: What the template or component is filled in with.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    FixKind:
      type: string
      description: How a gap is closed.
      enum:
      - plan
      - install
    Fixer:
      type: string
      description: Who can remove the cause.
      enum:
      - you
      - clusterAdmin
      - componentOwner
    Gap:
      type: object
      description: One finding of a rule.
      required:
      - rule
      - severity
      - subject
      - message
      - fix
      - citations
      properties:
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
          description: The guidance the rule rests on.
        fix:
          $ref: "#/components/schemas/Fix"
          description: How to close it.
        message:
          $ref: "#/components/schemas/Message"
          description: What is missing, in one sentence.
        rule:
          type: string
          description: The rule's stable id, such as `resource-limits`.
        service:
          type:
          - string
          - "null"
          description: The service it concerns, by id, when it concerns one.
        severity:
          $ref: "#/components/schemas/GapSeverity"
          description: How much it matters.
        subject:
          $ref: "#/components/schemas/Origin"
          description: The object, or field of it, the finding is about.
    GapList:
      type: object
      description: What a project or the cluster is missing.
      required:
      - items
      - unreadable
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
          description: "The findings: warnings first, then by rule and subject."
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused; rules that need them did not run on their facts.
    GapSeverity:
      type: string
      description: How much a gap matters.
      enum:
      - warning
      - advice
    Health:
      type: string
      description: "A service's health, from worst to best: what a status dot shows."
      enum:
      - fail
      - warn
      - progress
      - ok
      - idle
    HistorySource:
      type: object
      description: The store a history came from.
      required:
      - service
      properties:
        service:
          type: string
          description: Its Service port, `namespace/name:port`.
    Hop:
      type: object
      description: One hop and what was seen there.
      required:
      - step
      - status
      - message
      properties:
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: The objects and fields it rests on.
        expected:
          type:
          - string
          - "null"
          description: The value it should have, as Kubernetes or DNS writes it, when one is known.
        message:
          $ref: "#/components/schemas/Message"
          description: What was seen, in one sentence.
        saw:
          type:
          - string
          - "null"
          description: The value seen, the same way.
        status:
          $ref: "#/components/schemas/HopStatus"
          description: How it fared.
        step:
          $ref: "#/components/schemas/HopStep"
          description: Which hop.
    HopStatus:
      type: string
      description: How a hop fared.
      enum:
      - ok
      - failed
      - unknown
    HopStep:
      type: string
      description: One hop on the way to a service, in the order traffic takes them.
      enum:
      - dns
      - address
      - controller
      - certificate
      - route
      - service
      - targetPort
      - ready
    HttpOnlyReason:
      type: string
      description: Why a new hostname gets no HTTPS.
      enum:
      - noIssuer
      - certificatesElsewhere
      - wildcardNeedsDns01
    IdleUse:
      type: object
      description: >-
        What a template's pods used once idle, on a fresh cluster after its smoke
        checks.
      required:
      - memoryBytes
      - cpuMillicores
      - environment
      - measuredAt
      properties:
        cpuMillicores:
          type: integer
          format: int64
          description: The pods' CPU in millicores.
          minimum: 0
        environment:
          type: string
          description: "Where it was measured: `<profile>-<architecture>-<Kubernetes version>`."
        measuredAt:
          type: string
          description: The day it was measured (`2026-10-25`).
        memoryBytes:
          type: integer
          format: int64
          description: The pods' working set in bytes.
          minimum: 0
    ImageInspection:
      type: object
      description: What the image's configuration says, or why it could not be read.
      required:
      - image
      - exposedPorts
      properties:
        detail:
          type:
          - string
          - "null"
          description: |-
            The registry's or the network's own words for `unreadable`, or the platforms the image
            has for `no-platform`.
        digest:
          type:
          - string
          - "null"
          description: The digest of the platform's manifest.
        exposedPorts:
          type: array
          items:
            $ref: "#/components/schemas/ExposedPort"
          description: "`config.ExposedPorts`, sorted by port; empty when the image declares none or was not read."
        image:
          type: string
          description: The image as asked.
        platform:
          type:
          - string
          - "null"
          description: The platform read, such as `linux/amd64`; absent when nothing was read.
        runsAsRoot:
          type:
          - boolean
          - "null"
          description: "Whether the image runs as root: no user, `root` or UID `0`."
        unreadable:
          oneOf:
          - $ref: "#/components/schemas/UnreadableReason"
            description: Why nothing was read; absent when it was.
          - type: "null"
        user:
          type:
          - string
          - "null"
          description: |-
            `config.User` as written (`nginx`, `1000:1000`); empty when the image sets none and runs
            as root. Kubernetes' `runAsNonRoot` cannot check a name, only a number.
    ImportedEnv:
      type: object
      description: |-
        One `envFrom` entry. Imports are not flattened into variables: a ConfigMap's twelve keys
        shown as twelve entries would misrepresent what the workload says.
      required:
      - source
      - readOnly
      - origin
      properties:
        keyCount:
          type:
          - integer
          - "null"
          description: |-
            How many keys the imported object holds now; absent when that is unknown (the object
            is missing, or its key count was not read).
          minimum: 0
        origin:
          $ref: "#/components/schemas/Origin"
          description: The entry in its workload.
        pendingRestart:
          oneOf:
          - $ref: "#/components/schemas/PendingRestart"
            description: >-
              The imported object was written after a running pod started; see
              [`PendingRestart`].
          - type: "null"
        prefix:
          type:
          - string
          - "null"
          description: The prefix added to every imported name.
        readOnly:
          type: boolean
          description: The import must not be edited in place; see [`ReadOnlyReason`].
        readOnlyReason:
          oneOf:
          - $ref: "#/components/schemas/ReadOnlyReason"
            description: Why it is read-only.
          - type: "null"
        source:
          $ref: "#/components/schemas/ValueSource"
          description: The imported ConfigMap or Secret.
    Incident:
      type: object
      description: |-
        One cause on the cluster's side with everything it reaches, told once instead of as a
        separate problem of every service it breaks.
      required:
      - id
      - kind
      - cause
      - why
      - fix
      - fault
      - services
      - domains
      - projects
      - evidence
      properties:
        cause:
          $ref: "#/components/schemas/Message"
          description: The cause, in one sentence.
        domains:
          type: array
          items:
            type: string
          description: The public domains it reaches, sorted.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: The objects and fields it rests on.
        fault:
          $ref: "#/components/schemas/Fault"
          description: Where it lies and who can fix it.
        fix:
          $ref: "#/components/schemas/Message"
          description: What to do, and who does it.
        id:
          type: string
          description: "`incidents/<kind>/<name>`, stable while the cause lasts, so diagnoses link to it."
        kind:
          $ref: "#/components/schemas/IncidentKind"
          description: What kind of cause.
        projects:
          type: array
          items:
            type: string
          description: The projects it reaches, sorted.
        services:
          type: array
          items:
            $ref: "#/components/schemas/AffectedService"
          description: The services it reaches, sorted by id, as far as the reader could see them.
        since:
          type:
          - string
          - "null"
          description: Since when, in RFC 3339, when known.
        why:
          $ref: "#/components/schemas/Message"
          description: What stops working because of it.
    IncidentKind:
      type: string
      description: What kind of cluster-side cause an incident is.
      enum:
      - componentDown
      - nodeNotReady
    IncidentList:
      type: object
      description: The incidents found, and the reads that were refused.
      required:
      - items
      - unreadable
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
          description: The incidents, sorted by id.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused; incidents they would have shown are missing.
    InferredFrom:
      type: string
      description: |-
        Which signal decided a [`PortProtocol`], so a client can tell a declared protocol from a
        guessed one.
      enum:
      - appProtocol
      - name
      - protocol
    InspectRequest:
      type: object
      description: The image to read.
      required:
      - image
      properties:
        image:
          type: string
          description: The image reference, as a container's `image`.
        pullSecret:
          type:
          - string
          - "null"
          description: |-
            A `kubernetes.io/dockerconfigjson` or `kubernetes.io/dockercfg` Secret of the project,
            read as the person, whose entry for the image's registry is used.
        registry:
          oneOf:
          - $ref: "#/components/schemas/RegistryLogin"
            description: Credentials typed in, used instead of `pullSecret`.
          - type: "null"
    InstallAnswer:
      allOf:
      - $ref: "#/components/schemas/InstallGuide"
        description: The guide for the chosen profile.
      - type: object
        required:
        - defaultProfile
        properties:
          defaultProfile:
            type: string
            description: |-
              The profile that fits the cluster's node count (`single-node` when nodes could not be
              counted).
      description: How to install one component, and the profile that fits this cluster.
    InstallBlocked:
      type: string
      description: Why a plan cannot install a component; the texts still work.
      enum:
      - k3sPackaged
      - inputs
      - manifests
      - privileged
    InstallFormat:
      type: string
      description: One way to install a component.
      enum:
      - helm
      - k3s
      - flux
      - argoCd
    InstallGuide:
      type: object
      description: How to install one catalogue component, for one profile.
      required:
      - component
      - profile
      - profiles
      - requires
      - security
      - inputs
      - contributesTo
      - replacesK3sPackaged
      - formats
      properties:
        blocked:
          oneOf:
          - $ref: "#/components/schemas/InstallBlocked"
            description: Why no plan can install it.
          - type: "null"
        component:
          type: string
          description: "`<capability>/<id>`."
        contributesTo:
          type: array
          items:
            type: string
          description: |-
            Other components whose releases it adds values to (`<capability>/<id>`); those values
            are not in these texts.
        formats:
          type: array
          items:
            $ref: "#/components/schemas/InstallText"
          description: The texts, one per form.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/InstallInput"
          description: Values asked for or generated.
        profile:
          type: string
          description: The profile the texts are for.
        profiles:
          type: array
          items:
            type: string
          description: Every profile the catalogue sizes it for.
        replacesK3sPackaged:
          type: array
          items:
            type: string
          description: |-
            K3s packaged components of the same kind (`traefik`, `metrics-server`) that must be
            turned off on K3s, or their `rke2-` copies on RKE2, before installing this one; each text
            begins by saying how.
        requires:
          type: array
          items:
            type: string
          description: "What it needs installed first: `<capability>` (any provider) or `<capability>/<id>`."
        security:
          $ref: "#/components/schemas/Security"
          description: Its RBAC and network access.
    InstallInput:
      type: object
      description: A value the install needs from the person, or generates.
      required:
      - name
      - description
      - required
      - generated
      properties:
        description:
          type: string
          description: What it is.
        generated:
          type: boolean
          description: It is generated at random, not asked for.
        name:
          type: string
          description: Its name, the `<name>` placeholder in the texts.
        required:
          type: boolean
          description: It must be given.
    InstallSource:
      type: string
      description: How a component was installed.
      enum:
      - k3s
      - rke2
      - helm-chart
      - helm
      - other
    InstallText:
      type: object
      description: One rendering of the install.
      required:
      - format
      - text
      - objects
      properties:
        format:
          $ref: "#/components/schemas/InstallFormat"
          description: The form.
        namespace:
          type:
          - string
          - "null"
          description: "The namespace of the objects: `kube-system`, `flux-system` or `argocd`; absent for Helm."
        objects:
          type: array
          items:
            type: string
          description: |-
            The objects a plan creates, YAML, in install order, all in [`Self::namespace`]; empty for
            Helm and when the guide is blocked.
        text:
          type: string
          description: "The text to copy: shell for Helm, YAML for the others."
    Installation:
      type: object
      description: One installed component.
      required:
      - component
      - displayName
      - source
      properties:
        component:
          type: string
          description: The catalogue component (`traefik`).
        displayName:
          type: string
          description: Its name for people (`Traefik Proxy`).
        managedBy:
          type:
          - string
          - "null"
          description: "The tool that manages it and upgrades it (`k3s`, `RKE2`): never flagged for an upgrade."
        source:
          $ref: "#/components/schemas/InstallSource"
          description: How it was installed.
        tested:
          type:
          - string
          - "null"
          description: The chart version the catalogue tested, when it pins one.
        upgrade:
          oneOf:
          - $ref: "#/components/schemas/ComponentUpgrade"
            description: |-
              The installed version against the tested one. Absent when it is managed by k3s or RKE2, or
              the version is not known.
          - type: "null"
        version:
          type:
          - string
          - "null"
          description: The installed chart version, when it can be read.
    InvitationView:
      type: object
      description: |-
        A pending one-time setup link. Its token is not kept anywhere: it can be revoked, not shown
        again.
      required:
      - id
      - name
      - username
      - expiresAt
      - newMember
      - origin
      properties:
        createdAt:
          type:
          - string
          - "null"
          description: When it was made.
        expiresAt:
          type: string
          description: When it stops working, RFC 3339.
        id:
          type: string
          description: "`members/invitations/<name>`."
        name:
          type: string
          description: The `Invitation` object's name.
        newMember:
          type: boolean
          description: Whether it is for someone who cannot sign in yet (no credential).
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `Invitation`.
        username:
          type: string
          description: Who it enrols a passkey for.
    IssuerRequest:
      type: object
      description: A Let's Encrypt `ClusterIssuer` with a DNS-01 solver, to create or change.
      required:
      - name
      - dns
      properties:
        dns:
          $ref: "#/components/schemas/Dns01Provider"
          description: The DNS provider.
        email:
          type: string
          description: Where Let's Encrypt sends expiry notices; may be empty.
        name:
          type: string
          description: The `ClusterIssuer`'s name.
        staging:
          type: boolean
          description: Use Let's Encrypt's staging server, whose certificates browsers do not trust.
    IssuerView:
      type: object
      description: One `ClusterIssuer`.
      required:
      - name
      - staging
      - solvers
      - wildcards
      - ready
      properties:
        dns:
          oneOf:
          - $ref: "#/components/schemas/Dns01Provider"
            description: |-
              The provider's settings, secret blank, where the form can change it: one DNS-01 solver
              whose Secret is [`credentials_name`].
          - type: "null"
        email:
          type:
          - string
          - "null"
          description: Its email.
        message:
          type:
          - string
          - "null"
          description: The condition's message.
        name:
          type: string
          description: Its name.
        ready:
          $ref: "#/components/schemas/Readiness"
          description: Its `Ready` condition.
        server:
          type:
          - string
          - "null"
          description: The ACME server; absent for a CA, Vault or self-signed issuer.
        solvers:
          type: array
          items:
            type: string
          description: "Its challenge solvers: `http01`, or `dns01` with the provider, as `dns01:cloudflare`."
        staging:
          type: boolean
          description: It uses Let's Encrypt's staging server.
        wildcards:
          type: boolean
          description: It can issue wildcard certificates.
    IssuerWrite:
      type: object
      description: What an issuer plan writes.
      required:
      - action
      - kind
      - name
      - namespace
      - afterYaml
      properties:
        action:
          type: string
          description: "`create` or `patch`."
        afterYaml:
          type: string
          description: The object as it will be, YAML; a Secret's value is not in it.
        beforeYaml:
          type:
          - string
          - "null"
          description: The object as it is, YAML; absent for a creation.
        kind:
          type: string
          description: The object's kind.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace; empty for the `ClusterIssuer`.
    IssuersApplied:
      type: object
      description: What an apply wrote.
      required:
      - written
      properties:
        written:
          type: array
          items:
            type: string
          description: The objects written, `Kind/name`.
    IssuersApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    IssuersPlan:
      type: object
      description: An issuer plan, and the token that applies it.
      required:
      - token
      - expiresAt
      - writes
      properties:
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/IssuerWrite"
          description: The writes, in order; empty when nothing changes.
    JoinBlocked:
      type: string
      description: Why this cluster cannot take a node from Zeabur.
      enum:
      - notRke2
    JoinInfo:
      type: object
      description: What a new node needs to join, as far as the person may read it.
      required:
      - kubernetesVersion
      - tokens
      - unreadable
      properties:
        blocked:
          oneOf:
          - $ref: "#/components/schemas/JoinBlocked"
            description: Why nodes cannot be added; absent when they can.
          - type: "null"
        caHash:
          type:
          - string
          - "null"
          description: 64 hex characters of the cluster CA's SHA-256, for the `K10` token.
        kubernetesVersion:
          type: string
          description: kube-apiserver's version (`v1.34.1+rke2r1`).
        server:
          type:
          - string
          - "null"
          description: The supervisor a new node joins, `https://<address>:9345`.
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/JoinToken"
          description: Bootstrap tokens that have not expired, soonest to expire first.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: The reads that were refused.
    JoinToken:
      type: object
      description: A bootstrap token that has not expired, without its secret.
      required:
      - id
      - secret
      properties:
        created:
          type:
          - string
          - "null"
          description: When the Secret was created.
        description:
          type:
          - string
          - "null"
          description: Its `description`.
        expires:
          type:
          - string
          - "null"
          description: Its `expiration` (RFC 3339); absent when it never expires.
        id:
          type: string
          description: The token id; the Secret is `bootstrap-token-<id>`.
        managedBy:
          type:
          - string
          - "null"
          description: Its `app.kubernetes.io/managed-by` label (`zeabur`, `zeabur-installer`).
        secret:
          type: string
          description: The Secret's name.
    KeelPolicy:
      type: object
      description: A workload's Keel policy.
      required:
      - kind
      - name
      - policy
      properties:
        kind:
          type: string
          description: "`Deployment`, `StatefulSet` or `DaemonSet`."
        name:
          type: string
          description: Its name.
        policy:
          type: string
          description: "The `keel.sh/policy` annotation: `force`, `major`, `minor`, `patch`, `all`, `glob:…`."
    KeptCopy:
      type: object
      description: A copy of a destination's keys that a plan does not update.
      required:
      - namespace
      - name
      - reason
      properties:
        name:
          type: string
          description: The Secret.
        namespace:
          type: string
          description: The Secret's namespace.
        reason:
          $ref: "#/components/schemas/CopyKept"
          description: Why.
    KeptReason:
      type: string
      description: Why an object a deleted service uses or made stays.
      enum:
      - shared
      - routesElsewhere
      - controlled
      - managed
      - notMade
    Kind:
      type: string
      description: |-
        What went wrong, in categories a person can act on. An open set: clients must expect new
        values and treat an unknown one by its HTTP status.
      enum:
      - bad-request
      - unauthenticated
      - signed-out
      - forbidden
      - elevation-required
      - quota-exceeded
      - policy-denied
      - not-found
      - log-unavailable
      - conflict
      - managed
      - plan-expired
      - system-namespace
      - invalid
      - too-many-requests
      - unavailable
      - internal
    KubernetesStatus:
      type: object
      description: The answer kube-apiserver gave, unchanged.
      required:
      - code
      - reason
      - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 0
        message:
          type: string
          description: kube-apiserver's message.
        reason:
          type: string
          description: Machine-readable reason (`Forbidden`, `NotFound`, …).
        retryAfterSeconds:
          type:
          - integer
          - "null"
          format: int32
          description: |-
            How long kube-apiserver asked clients to wait before retrying
            (`details.retryAfterSeconds`).
          minimum: 0
    LabelVolumeChange:
      type: object
      description: A [`Change::LabelVolume`]. A key the claim has already is set to the new value.
      required:
      - claim
      properties:
        annotations:
          type: object
          description: Annotations to set.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        claim:
          type: string
          description: The claim.
        labels:
          type: object
          description: Labels to set.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    LeaderLease:
      type: object
      description: A component's leader lease in `kube-system`.
      required:
      - origin
      - component
      - current
      properties:
        component:
          type: string
          description: "`kube-scheduler` or `kube-controller-manager`."
        current:
          type: boolean
          description: "Renewed within its duration: a replica is leading."
        durationSeconds:
          type:
          - integer
          - "null"
          format: int32
          description: How long the lease holds without a renewal.
        holder:
          type:
          - string
          - "null"
          description: The leading replica, as it names itself.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Lease.
        renewed:
          type:
          - string
          - "null"
          description: When the leader last renewed the lease.
    LinkedAccountView:
      type: object
      description: A GitHub or Google account linked for everyday sign-in.
      required:
      - id
      - provider
      - origin
      properties:
        createdAt:
          type:
          - string
          - "null"
          description: When it was linked.
        id:
          type: string
          description: The `Credential` object's name.
        lastUsedAt:
          type:
          - string
          - "null"
          description: When it last signed in, where recorded.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `Credential`.
        provider:
          type: string
          description: "`GitHub` or `Google`."
    LogHistory:
      type: object
      description: A service's log lines over a range, every pod's, also those replaced since.
      required:
      - id
      - state
      - range
      - lines
      - limit
      - truncated
      properties:
        id:
          type: string
          description: "`projects/{project}/services/{kind}/{name}/logs/history`."
        limit:
          type: integer
          format: int32
          description: The most lines returned.
          minimum: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogHistoryLine"
          description: "The lines, oldest first: the newest ones when there were more than `limit`."
        message:
          type:
          - string
          - "null"
          description: Zeabur Proxy's or VictoriaLogs' words when it was not read.
        range:
          $ref: "#/components/schemas/PrometheusRange"
          description: The range.
        state:
          $ref: "#/components/schemas/LogHistoryState"
          description: Whether it could be read.
        truncated:
          type: boolean
          description: Whether there were more lines in the range than returned.
    LogHistoryLine:
      type: object
      description: One line.
      required:
      - time
      - pod
      - container
      - message
      properties:
        container:
          type: string
          description: Its container.
        message:
          type: string
          description: The line.
        pod:
          type: string
          description: The pod that wrote it, which may be gone.
        time:
          type: string
          description: When it was written, RFC 3339.
    LogHistoryState:
      type: string
      description: Whether the history could be read, as the person. An open set.
      enum:
      - available
      - not-installed
      - unreadable
      - unavailable
    LogSnapshot:
      type: object
      description: A snapshot of a container's log.
      required:
      - origin
      - lines
      properties:
        lines:
          type: array
          items:
            type: string
          description: The lines, oldest first.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The pod (and container, as `fieldPath`).
    MaintenanceApply:
      type: object
      description: >-
        The token of a plan, and what the person chose to evict besides the pods that
        move.
      required:
      - token
      properties:
        includeDeleted:
          type: boolean
          description: Also evict (delete) the pods without a controller.
        includeStuck:
          type: boolean
          description: Also evict the pods whose volume is kept on this node.
        token:
          type: string
          description: The token `plan` returned.
    MaintenanceChange:
      type: object
      description: A [`Change::Maintenance`].
      required:
      - route
      - hostname
      - enabled
      properties:
        enabled:
          type: boolean
          description: >-
            Show the maintenance page when true; send requests to the workload again when
            false.
        hostname:
          type: string
          description: The hostname.
        route:
          $ref: "#/components/schemas/RouteRef"
          description: The route.
        workload:
          oneOf:
          - $ref: "#/components/schemas/WorkloadRef"
            description: |-
              When stopping: the workload whose first Service gets the hostname when the rules changed
              after maintenance started, so the backends kept then no longer fit.
          - type: "null"
    MaintenancePlan:
      type: object
      description: What a plan changes, and the token that applies it.
      required:
      - token
      - expiresAt
      - node
      - action
      - cordoned
      - roles
      - otherSchedulable
      - zeaburHere
      - pods
      - unreadable
      properties:
        action:
          $ref: "#/components/schemas/NodeAction"
          description: The action.
        capacity:
          oneOf:
          - $ref: "#/components/schemas/DrainCapacity"
            description: Whether the moving pods fit elsewhere; maintenance only.
          - type: "null"
        cordoned:
          type: boolean
          description: Whether the node is cordoned now.
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        node:
          type: string
          description: The node.
        otherSchedulable:
          type: integer
          description: How many other nodes are ready and take new pods.
          minimum: 0
        pods:
          type: array
          items:
            $ref: "#/components/schemas/DrainPod"
          description: The pods on the node, those that move first, then by namespace and name.
        removal:
          oneOf:
          - $ref: "#/components/schemas/NodeRemoval"
            description: Whether the node can be removed; removing only.
          - type: "null"
        roles:
          type: array
          items:
            type: string
          description: Its roles (`control-plane`, `etcd`).
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: |-
            Reads that were refused and what they leave unchecked (`persistentvolumes`,
            `poddisruptionbudgets.policy`, `pods`).
        zeaburHere:
          type: boolean
          description: Zeabur itself runs on this node.
    MaintenanceRequest:
      type: object
      description: The action to plan.
      required:
      - action
      properties:
        action:
          $ref: "#/components/schemas/NodeAction"
          description: What to do.
    ManagedBy:
      type: object
      description: |-
        The custom resource whose operator controls a workload. Direct edits to the workload are
        reverted by that operator; the resource is what to change.
      required:
      - kind
      - name
      properties:
        engine:
          type:
          - string
          - "null"
          description: The database engine, such as `PostgreSQL`.
        kind:
          type: string
          description: The resource's kind as people create it, such as `PerconaPGCluster`.
        name:
          type: string
          description: The resource's name.
    ManagerTool:
      type: string
      description: The tool behind a field manager, by its name.
      enum:
      - zeabur
      - helm
      - argoCd
      - flux
      - kubectl
      - autoscaler
      - controller
      - other
    MemberApplied:
      type: object
      description: What an applied member plan made.
      properties:
        link:
          oneOf:
          - $ref: "#/components/schemas/SetupLinkView"
            description: "For an invitation: the link, shown once."
          - type: "null"
    MemberApplyRequest:
      type: object
      description: The token of a member plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    MemberChange:
      oneOf:
      - type: object
        description: |-
          Invite someone: a one-time link that adds a passkey to their account, the member made
          first when new. An existing member keeps their name and access.
        required:
        - username
        - op
        properties:
          admin:
            type: boolean
            description: Whether a new member may take on admin rights.
          displayName:
            type:
            - string
            - "null"
            description: Name shown in the interface, for a new member.
          op:
            type: string
            enum:
            - invite
          projects:
            type: array
            items:
              $ref: "#/components/schemas/ProjectGrant"
            description: A new member's roles in projects, when they are not an admin.
          username:
            type: string
            description: "Login name: lower-case letters, digits, `-` and `.`, at most 63 characters."
      - type: object
        description: |-
          Change what a member may do: admin rights, or roles in chosen projects (a project left out
          loses theirs). Nobody takes their own admin rights away.
        required:
        - username
        - admin
        - op
        properties:
          admin:
            type: boolean
            description: May take on admin rights, which cover every project.
          op:
            type: string
            enum:
            - access
          projects:
            type: array
            items:
              $ref: "#/components/schemas/ProjectGrant"
            description: Roles in projects; empty for an admin.
          username:
            type: string
            description: The member.
      - type: object
        description: |-
          Remove a member: the role bindings Zeabur made for them, their links, passkeys, linked
          accounts and sessions, then the member. Nobody removes themselves.
        required:
        - username
        - op
        properties:
          op:
            type: string
            enum:
            - remove
          username:
            type: string
            description: The member.
      description: A change to the members, as a person asks for it.
    MemberPlan:
      type: object
      description: A member plan and the token that applies it.
      required:
      - token
      - expiresAt
      - writes
      - newMember
      properties:
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        linkSeconds:
          type:
          - integer
          - "null"
          format: int64
          description: "For an invitation: how long its link will work once made, in seconds."
        newMember:
          type: boolean
          description: "For an invitation: whether it makes a new member."
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/MemberWrite"
          description: The writes, in order.
    MemberRole:
      type: string
      description: What a member may do in the cluster, as far as Zeabur Identity grants it.
      enum:
      - admin
      - member
    MemberView:
      type: object
      description: A person who can sign in.
      required:
      - id
      - username
      - groups
      - role
      - disabled
      - passkeys
      - linked
      - sessions
      - invitations
      - you
      - origin
      properties:
        disabled:
          type: boolean
          description: A disabled member cannot sign in.
        displayName:
          type:
          - string
          - "null"
          description: Name shown in the interface.
        groups:
          type: array
          items:
            type: string
          description: Groups; Kubernetes sees each as `zeabur:<group>`.
        id:
          type: string
          description: "`members/<username>`."
        invitations:
          type: integer
          description: Pending setup links.
          minimum: 0
        lastSignInAt:
          type:
          - string
          - "null"
          description: "The latest sign-in Zeabur Identity knows of: from live sessions and recorded last use."
        linked:
          type: array
          items:
            $ref: "#/components/schemas/LinkedAccountView"
          description: Linked GitHub or Google accounts.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `User`.
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyView"
          description: Passkeys, oldest first.
        projects:
          type:
          - array
          - "null"
          items:
            $ref: "#/components/schemas/ProjectGrant"
          description: |-
            A member's roles in projects, by project; `None` when Zeabur could not read them. An
            admin's are left out: their rights cover every project.
        role:
          $ref: "#/components/schemas/MemberRole"
          description: Admin or member.
        sessions:
          type: integer
          description: Signed-in sessions (grants) that can still renew.
          minimum: 0
        username:
          type: string
          description: Login name; Kubernetes sees `zeabur:<username>`.
        you:
          type: boolean
          description: Whether this is the person asking.
    MemberWrite:
      type: object
      description: One object a member plan writes.
      required:
      - apiVersion
      - kind
      - name
      - action
      properties:
        action:
          $ref: "#/components/schemas/MemberWriteAction"
          description: The write.
        afterYaml:
          type:
          - string
          - "null"
          description: The object as it will be, YAML; absent when it is deleted.
        apiVersion:
          type: string
          description: "`apiVersion`."
        beforeYaml:
          type:
          - string
          - "null"
          description: The object as it is, YAML; absent when it is created or not shown.
        kind:
          type: string
          description: The kind.
        name:
          type: string
          description: Its name; for the invitation, the prefix its random name starts with.
        namespace:
          type:
          - string
          - "null"
          description: Its namespace; absent for a cluster-scoped object.
    MemberWriteAction:
      type: string
      description: How a planned write changes its object.
      enum:
      - create
      - patch
      - delete
    MembersView:
      type: object
      description: Everyone who can sign in, and the links waiting to be used.
      required:
      - id
      - installed
      - items
      - invitations
      - setupLinks
      - canManage
      - projectRoles
      - unreadable
      properties:
        canManage:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may create invitations, as far as their rules tell.
        id:
          type: string
          description: "`members`."
        installed:
          type: boolean
          description: Whether Zeabur Identity is installed; when not, everything else is empty.
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/InvitationView"
          description: Pending invitations, soonest to expire first.
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberView"
          description: Members, by user name.
        projectRoles:
          type: boolean
          description: |-
            Whether members can be given Developer or Viewer in chosen projects (the chart's member
            roles are installed).
        setupLinks:
          $ref: "#/components/schemas/SetupLinks"
          description: Whether setup links can be made and redeemed.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: |-
            Kinds the person may not read (invitations, grants, role bindings), whose parts are left
            out.
    Message:
      type: object
      description: |-
        A sentence a client words in its own language: a stable key and the values it names.
        
        Zeabur never sends prose for diagnoses, gaps and the plain-language parts of a problem, so
        every interface translates them the same way and a key's meaning is part of the contract.
      required:
      - key
      properties:
        key:
          type: string
          description: The sentence, such as `diagnosis.crashLoop.cause.exitCode`.
        params:
          type: object
          description: The values it names, such as the container and the exit code.
          additionalProperties:
            type: string
          propertyNames:
            type: string
    MetricsState:
      type: string
      description: Whether usage could be read. An open set.
      enum:
      - available
      - not-installed
      - unreadable
      - unavailable
    MetricsStoreChange:
      type: object
      description: A change of the metrics store.
      properties:
        service:
          type:
          - string
          - "null"
          description: The Service port, `namespace/name:port`; `null` goes back to the default.
      additionalProperties: false
    MetricsStoreSetting:
      type: object
      description: The metrics store setting.
      required:
      - id
      - service
      - default
      - source
      - canChange
      - state
      - unreadable
      properties:
        canChange:
          $ref: "#/components/schemas/Permission"
          description: >-
            Whether the person may change it, as far as their RBAC rules in that namespace
            tell.
        default:
          type: string
          description: What the server was started with (`ZEABUR_METRICS_SERVICE`).
        id:
          type: string
          description: "`settings/metrics-store`."
        message:
          type:
          - string
          - "null"
          description: kube-apiserver's or the store's words when it does not.
        service:
          type: string
          description: The Service port in use, `namespace/name:port`.
        source:
          $ref: "#/components/schemas/SettingSource"
          description: Where `service` comes from.
        state:
          $ref: "#/components/schemas/StoreState"
          description: Whether the store answers, as the person.
        storedIn:
          oneOf:
          - $ref: "#/components/schemas/Origin"
            description: |-
              The ConfigMap a change is kept in; absent where Zeabur keeps no settings (on a
              person's computer).
          - type: "null"
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: "What could not be read: the settings ConfigMap, or the store through the proxy."
    Mount:
      type: object
      description: One volume mount of a container.
      required:
      - name
      - mountPath
      - kind
      - category
      - origin
      properties:
        accessModes:
          type: array
          items:
            type: string
          description: The claim's access modes.
        attribution:
          oneOf:
          - $ref: "#/components/schemas/Attribution"
            description: Which workloads use the ConfigMap, Secret or PVC.
          - type: "null"
        category:
          $ref: "#/components/schemas/MountCategory"
          description: Persistent, config or ephemeral.
        claimName:
          type:
          - string
          - "null"
          description: "The claim: the PVC's name, or for a StatefulSet's claim template the template's name."
        kind:
          type: string
          description: |-
            The volume source kind (`PersistentVolumeClaim`, `ConfigMap`, `Secret`, `Projected`,
            `DownwardAPI`, `EmptyDir`, `Ephemeral`, `Other`), or `Unknown` when no volume has the
            mount's name.
        mountPath:
          type: string
          description: Where it is mounted.
        name:
          type: string
          description: The volume's name in the pod spec.
        object:
          oneOf:
          - $ref: "#/components/schemas/ObjectRef"
            description: The ConfigMap, Secret or PVC the volume reads.
          - type: "null"
        origin:
          $ref: "#/components/schemas/Origin"
          description: The mount in its workload.
        readOnly:
          type: boolean
          description: Mounted read-only.
        size:
          type:
          - string
          - "null"
          description: The requested size, or an `emptyDir` size limit.
        sizeBytes:
          type:
          - integer
          - "null"
          format: int64
          description: "`size` in bytes, rounded up; absent when `size` is absent or not a quantity."
          minimum: 0
        status:
          type:
          - string
          - "null"
          description: The claim's phase, such as `Bound`, once a PVC exists.
        storageClass:
          type:
          - string
          - "null"
          description: The claim's storage class.
        subPath:
          type:
          - string
          - "null"
          description: The sub-path mounted, if not the whole volume.
        volumeMode:
          type:
          - string
          - "null"
          description: The claim's volume mode.
    MountCategory:
      type: string
      description: What kind of storage a mount is.
      enum:
      - persistent
      - config
      - ephemeral
    NameSource:
      type: string
      description: Where the cluster's name comes from.
      enum:
      - setting
      - install
      - kubeconfig
      - address
    NamespaceUsage:
      type: object
      description: One namespace's pods together.
      required:
      - origin
      - namespace
      - system
      - pods
      - requests
      - limits
      - unlimited
      properties:
        adopted:
          type:
          - boolean
          - "null"
          description: |-
            A project: the Namespace has the label `zeabur.com/project`. Absent when namespaces
            cannot be listed.
        displayName:
          type:
          - string
          - "null"
          description: A project's display name, when it has one.
        limits:
          $ref: "#/components/schemas/Resources"
          description: What those pods may use at most; a pod without a limit adds nothing.
        namespace:
          type: string
          description: The namespace.
        origin:
          $ref: "#/components/schemas/Origin"
          description: Its Namespace.
        pods:
          type: integer
          format: int64
          description: Its unfinished pods that were read.
          minimum: 0
        requests:
          $ref: "#/components/schemas/Resources"
          description: What those pods reserve.
        system:
          type: boolean
          description: A namespace Kubernetes keeps for itself (`kube-` prefix).
        unlimited:
          $ref: "#/components/schemas/Unlimited"
          description: Pods that set no limit.
        usage:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: |-
              What its pods use now, with `pods` the number measured; absent unless `metrics` is
              `available`.
          - type: "null"
    NetworkPolicyAccess:
      type: string
      description: How far a peer may reach.
      enum:
      - allowed
      - limited
      - blocked
    NetworkPolicyConnection:
      type: object
      description: |-
        A connection the project shows (inferred from configuration), and whether the policies let it
        through.
      required:
      - from
      - to
      - access
      - blockedAt
      properties:
        access:
          $ref: "#/components/schemas/NetworkPolicyAccess"
          description: The caller's egress and the callee's ingress together.
        blockedAt:
          type: array
          items:
            type: string
          description: "Where it is stopped, when [`Access::Blocked`]: `egress`, `ingress` or both."
        from:
          type: string
          description: The caller's id.
        to:
          type: string
          description: The callee's id.
    NetworkPolicyPeer:
      type: object
      description: A service and how far it may reach another.
      required:
      - service
      - access
      - via
      properties:
        access:
          $ref: "#/components/schemas/NetworkPolicyAccess"
          description: How far.
        service:
          type: string
          description: The service's id.
        via:
          type: array
          items:
            type: string
          description: |-
            The policies, by name, that decide it: those whose rules admit it, on its way out or on the
            service's way in; when it is blocked, those that isolate the blocking side and admit
            nothing from it. Empty when no policy isolates either side.
    NetworkPolicyPreset:
      type: object
      description: A ready-made policy for a service, to plan as a new object.
      required:
      - kind
      - object
      properties:
        from:
          type:
          - string
          - "null"
          description: For `allow-from-service`, the caller's id.
        kind:
          type: string
          description: "`isolate`, `allow-from-service` or `allow-from-ingress-controller`."
        object:
          type: object
          description: The NetworkPolicy to create.
    NetworkPolicyReachability:
      type: object
      description: The project's reachability.
      required:
      - policies
      - services
      - connections
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/NetworkPolicyConnection"
          description: The connections given, in that order.
        policies:
          type: array
          items:
            type: string
          description: The project's policies, by name.
        services:
          type: array
          items:
            $ref: "#/components/schemas/NetworkPolicyService"
          description: Every service, in the order given.
    NetworkPolicyService:
      type: object
      description: One service's reachability.
      required:
      - service
      - selectedBy
      - ingressIsolated
      - egressIsolated
      - fromServices
      - fromIngressController
      - fromOtherNamespaces
      - toDns
      - toOutside
      properties:
        egressIsolated:
          type: boolean
          description: A policy limits where it goes.
        fromIngressController:
          $ref: "#/components/schemas/NetworkPolicyAccess"
          description: The ingress controller (k3s's Traefik).
        fromOtherNamespaces:
          $ref: "#/components/schemas/NetworkPolicyAccess"
          description: Pods of other namespaces, whatever their labels.
        fromServices:
          type: array
          items:
            $ref: "#/components/schemas/NetworkPolicyPeer"
          description: Services of the project that may reach it, with how far.
        ingressIsolated:
          type: boolean
          description: A policy limits what reaches it.
        selectedBy:
          type: array
          items:
            type: string
          description: The policies that select its pods, by name.
        service:
          type: string
          description: The service's id.
        toDns:
          $ref: "#/components/schemas/NetworkPolicyAccess"
          description: Cluster DNS (port 53 in `kube-system`).
        toOutside:
          $ref: "#/components/schemas/NetworkPolicyAccess"
          description: Addresses outside the cluster's pods.
    NodeAction:
      type: string
      description: What a plan changes on a node.
      enum:
      - cordon
      - uncordon
      - drain
      - remove
    NodeBehind:
      type: object
      description: A node some baseline policy drops traffic from.
      required:
      - name
      - addresses
      properties:
        addresses:
          type: array
          items:
            type: string
          description: Its addresses a policy does not let in.
        name:
          type: string
          description: The node.
    NodeCondition:
      type: object
      description: |-
        A node condition that is not as it should be: `Ready` not `True`, or a pressure that is
        `True`.
      required:
      - type
      - status
      properties:
        message:
          type:
          - string
          - "null"
          description: The kubelet's message.
        reason:
          type:
          - string
          - "null"
          description: The kubelet's reason.
        status:
          type: string
          description: "`True`, `False` or `Unknown`."
        type:
          type: string
          description: "`Ready`, `MemoryPressure`, `DiskPressure`, `PIDPressure` or `NetworkUnavailable`."
    NodeList:
      type: object
      description: The nodes, with the cluster's totals.
      required:
      - items
      - totals
      - podScan
      - podsScanned
      - unscheduledPods
      - metrics
      - disk
      - unreadable
      properties:
        disk:
          $ref: "#/components/schemas/DiskState"
          description: Whether the nodes' disks could be read.
        items:
          type: array
          items:
            $ref: "#/components/schemas/NodeView"
          description: Sorted by name.
        metrics:
          $ref: "#/components/schemas/MetricsState"
          description: Whether usage could be read.
        podScan:
          $ref: "#/components/schemas/PodScan"
          description: How much of the pods the requests come from.
        podsScanned:
          type: integer
          description: How many unfinished pods were read.
          minimum: 0
        totals:
          $ref: "#/components/schemas/NodeTotals"
          description: Totals over every node.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
        unscheduledPods:
          type: integer
          description: Pods not yet placed on a node.
          minimum: 0
    NodePolicies:
      type: object
      description: The baseline policies against the nodes, as far as the person may read them.
      required:
      - addresses
      - policies
      - behind
      - canUpdate
      - unreadable
      properties:
        addresses:
          type: array
          items:
            type: string
          description: The addresses every baseline policy should let in, sorted.
        behind:
          type: array
          items:
            $ref: "#/components/schemas/NodeBehind"
          description: Nodes whose traffic a policy drops, by name.
        canUpdate:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may patch the policies that are not current.
        policies:
          type: array
          items:
            $ref: "#/components/schemas/BaselinePolicy"
          description: >-
            The baseline policies, by namespace; empty on a cluster the installer did not
            set up.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: The reads that were refused (`nodes`, `networkpolicies.networking.k8s.io`).
    NodePoliciesApplied:
      type: object
      description: What an apply wrote.
      required:
      - namespaces
      properties:
        namespaces:
          type: array
          items:
            type: string
          description: The namespaces whose policy was rewritten.
    NodePoliciesApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    NodePoliciesPlan:
      type: object
      description: >-
        A plan that brings the baseline policies up to date, and the token that applies
        it.
      required:
      - token
      - expiresAt
      - addresses
      - writes
      properties:
        addresses:
          type: array
          items:
            type: string
          description: The addresses the policies will let in.
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/PolicyWrite"
          description: The policies it rewrites; empty when all are current.
    NodeRemoval:
      type: object
      description: Whether a node can be removed.
      required:
      - ready
      - left
      - otherServers
      properties:
        left:
          type: integer
          description: >-
            Pods still on it that maintenance moves or deletes, those already leaving left
            out.
          minimum: 0
        otherServers:
          type: integer
          description: Other nodes that run the control plane.
          minimum: 0
        ready:
          type: boolean
          description: The kubelet reports the node Ready.
        refused:
          oneOf:
          - $ref: "#/components/schemas/RemovalRefusal"
            description: Why apply refuses now; absent when it removes the node.
          - type: "null"
    NodeShellApplied:
      type: object
      description: What an apply did.
      required:
      - pod
      - namespace
      - node
      properties:
        namespace:
          type: string
          description: Its namespace.
        node:
          type: string
          description: Its node.
        pod:
          type: string
          description: The pod.
    NodeShellApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    NodeShellPlan:
      type: object
      description: A plan that opens a shell on a node or removes a shell pod.
      required:
      - expiresAt
      - op
      - node
      - pod
      - namespace
      - image
      - deadlineSeconds
      - firstSessionSeconds
      - writes
      - exposed
      properties:
        deadlineSeconds:
          type: integer
          format: int64
          description: How long it runs at most, in seconds.
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        exposed:
          type: array
          items:
            $ref: "#/components/schemas/ShellExposure"
          description: >-
            Bindings that let others into node shells; the plan cannot be applied while
            there is one.
        firstSessionSeconds:
          type: integer
          format: int32
          description: How long it waits for its first session, in seconds.
          minimum: 0
        image:
          type: string
          description: The image it runs.
        kubectl:
          type:
          - string
          - "null"
          description: The `kubectl` command that opens the same shell.
        namespace:
          type: string
          description: Its namespace.
        node:
          type: string
          description: The node.
        op:
          type: string
          description: "`open` or `remove`."
        person:
          type:
          - string
          - "null"
          description: Who opens it (opened it, for a removal).
        pod:
          type: string
          description: The pod.
        token:
          type:
          - string
          - "null"
          description: |-
            Send this to `apply` to carry out exactly this plan; absent while `exposed` lists
            bindings.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/ShellWrite"
          description: The writes, in order.
    NodeShellPlanRequest:
      oneOf:
      - type: object
        description: Open a shell on `node`.
        required:
        - node
        - op
        properties:
          node:
            type: string
            description: The node.
          op:
            type: string
            enum:
            - open
      - type: object
        description: Remove the shell pod `pod`.
        required:
        - pod
        - op
        properties:
          op:
            type: string
            enum:
            - remove
          pod:
            type: string
            description: The pod.
      description: What to plan.
    NodeShellView:
      type: object
      description: A node shell pod.
      required:
      - name
      - node
      - mine
      - phase
      properties:
        createdAt:
          type:
          - string
          - "null"
          description: When it was created, RFC 3339.
        message:
          type:
          - string
          - "null"
          description: The kubelet's message while starting.
        mine:
          type: boolean
          description: Whether the person asking opened it, so may enter it.
        name:
          type: string
          description: The pod.
        node:
          type: string
          description: The node it runs on.
        person:
          type:
          - string
          - "null"
          description: Who opened it.
        phase:
          $ref: "#/components/schemas/ShellPhase"
          description: How it is doing.
        reason:
          type:
          - string
          - "null"
          description: |-
            The kubelet's reason: `ErrImagePull` while starting, `DeadlineExceeded` or `Completed`
            when ended.
        stopsAt:
          type:
          - string
          - "null"
          description: When its deadline stops it, RFC 3339.
    NodeShells:
      type: object
      description: The node shell pods.
      required:
      - shells
      properties:
        shells:
          type: array
          items:
            $ref: "#/components/schemas/NodeShellView"
          description: Oldest first.
    NodeSkew:
      type: object
      description: A node whose kubelet minor differs from kube-apiserver's.
      required:
      - node
      - kubeletVersion
      - unsupported
      properties:
        kubeletVersion:
          type: string
          description: Its kubelet's version.
        node:
          type: string
          description: The node.
        unsupported:
          type: boolean
          description: "`true` when outside the supported window."
    NodeTotals:
      type: object
      description: The cluster's totals over every node.
      required:
      - allocatable
      properties:
        allocatable:
          $ref: "#/components/schemas/Resources"
          description: Allocatable.
        disk:
          oneOf:
          - $ref: "#/components/schemas/DiskUsage"
            description: The nodes' root filesystems together; absent when none could be read.
          - type: "null"
        limits:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: Limits; absent when pods cannot be listed.
          - type: "null"
        requests:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: Requested; absent when pods cannot be listed.
          - type: "null"
        usage:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: In use; absent without metrics-server.
          - type: "null"
    NodeView:
      type: object
      description: "A node: its roles, health, versions and capacity."
      required:
      - id
      - origin
      - name
      - roles
      - ready
      - problems
      - cordoned
      - taints
      - kubeletVersion
      - osImage
      - kernelVersion
      - architecture
      - containerRuntime
      - allocatable
      - capacity
      properties:
        allocatable:
          $ref: "#/components/schemas/Resources"
          description: "What pods may use: capacity less what is reserved for the system."
        architecture:
          type: string
          description: The CPU architecture (`arm64`, `amd64`).
        capacity:
          $ref: "#/components/schemas/Resources"
          description: The machine's capacity.
        containerRuntime:
          type: string
          description: The container runtime (`containerd://2.1.4-k3s1`).
        cordoned:
          type: boolean
          description: "Cordoned: new pods are not scheduled here (`spec.unschedulable`)."
        created:
          type:
          - string
          - "null"
          description: When it joined the cluster (RFC 3339).
        disk:
          oneOf:
          - $ref: "#/components/schemas/DiskUsage"
            description: |-
              The kubelet's filesystem (`nodefs`), where pods' logs, writable layers and `emptyDir`
              volumes live, from the metrics store; absent when the store has no value for this node.
          - type: "null"
        id:
          type: string
          description: "`cluster/nodes/<name>`."
        kernelVersion:
          type: string
          description: The kernel version.
        kubeletVersion:
          type: string
          description: The kubelet's version.
        leavingPods:
          type:
          - integer
          - "null"
          format: int64
          description: How many of those are being deleted; absent when pods cannot be listed.
          minimum: 0
        limits:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: |-
              What the pods placed here may use at most (containers without a limit add nothing);
              absent when pods cannot be listed.
          - type: "null"
        movablePods:
          type:
          - integer
          - "null"
          format: int64
          description: |-
            The pods placed here that maintenance would move (all but a DaemonSet's, static pods'
            mirrors, finished pods and those in `pinnedPods`); absent when pods cannot be listed.
          minimum: 0
        name:
          type: string
          description: Its name.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Node.
        osImage:
          type: string
          description: The operating system image.
        pinnedPods:
          type:
          - integer
          - "null"
          format: int64
          description: |-
            Pods maintenance leaves here because a volume they use is only on this node, not counted
            in `movablePods`; 0 as well when PersistentVolumes cannot be listed.
          minimum: 0
        problems:
          type: array
          items:
            $ref: "#/components/schemas/NodeCondition"
          description: Conditions that are not as they should be.
        ready:
          type: string
          description: "The `Ready` condition: `True`, `False` or `Unknown`."
        requests:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: >-
              What the pods placed here request, with their count; absent when pods cannot be
              listed.
          - type: "null"
        roles:
          type: array
          items:
            type: string
          description: |-
            Its roles (`control-plane`, `etcd`, …), from `node-role.kubernetes.io/<role>` labels;
            empty for a plain worker.
        taints:
          type: array
          items:
            $ref: "#/components/schemas/Taint"
          description: Its taints.
        usage:
          oneOf:
          - $ref: "#/components/schemas/Resources"
            description: >-
              What it uses now, from metrics-server (approximate, for autoscaling); absent
              without it.
          - type: "null"
    NotificationWrite:
      type: object
      description: One object a plan writes.
      required:
      - action
      - kind
      - name
      - namespace
      properties:
        action:
          $ref: "#/components/schemas/NotificationWriteAction"
          description: What it does.
        afterYaml:
          type:
          - string
          - "null"
          description: The object as it will be, YAML, a Secret's values hidden; absent for a deletion.
        beforeYaml:
          type:
          - string
          - "null"
          description: The object as it is, YAML; absent for a creation and for a Secret.
        kind:
          type: string
          description: The object's kind.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
    NotificationWriteAction:
      type: string
      description: What a write does.
      enum:
      - create
      - patch
      - delete
    Notifications:
      type: object
      description: The channels of a project or of the cluster.
      required:
      - state
      - namespace
      - events
      - channels
      - canChange
      - canTest
      - unreadable
      properties:
        canChange:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may add, change and remove channels.
        canTest:
          $ref: "#/components/schemas/Permission"
          description: Whether the person may send a test.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerChannel"
          description: The channels, Zeabur's first, by name.
        events:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerEvent"
          description: The events a channel here can receive.
        namespace:
          type: string
          description: The namespace the channels are in.
        rulesInstalled:
          type:
          - boolean
          - "null"
          description: |-
            Whether the catalog's rule set is installed; for the cluster only, absent when it could
            not be read.
        state:
          $ref: "#/components/schemas/ProviderState"
          description: Whether the operator's API is served and the channels could be read.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: What could not be read.
    NotificationsApplied:
      type: object
      description: What an apply wrote.
      required:
      - written
      properties:
        written:
          type: array
          items:
            type: string
          description: The objects written, `Kind/name`.
    NotificationsApply:
      type: object
      description: The token of a plan to apply.
      required:
      - token
      properties:
        token:
          type: string
          description: The token `plan` returned.
    NotificationsPlan:
      type: object
      description: A plan, and the token that applies it.
      required:
      - token
      - expiresAt
      - writes
      properties:
        expiresAt:
          type: string
          description: When the token stops working, RFC 3339.
        token:
          type: string
          description: Send this to `apply` to carry out exactly this plan.
        writes:
          type: array
          items:
            $ref: "#/components/schemas/NotificationWrite"
          description: The writes, in order; empty when nothing changes.
    NotificationsPlanRequest:
      oneOf:
      - type: object
        description: Add a channel.
        required:
        - name
        - events
        - settings
        - op
        properties:
          events:
            type: array
            items:
              $ref: "#/components/schemas/AlertmanagerEvent"
            description: The events it receives.
          name:
            type: string
            description: Its name.
          op:
            type: string
            enum:
            - add
          settings:
            $ref: "#/components/schemas/AlertmanagerChannelSettings"
            description: Where it sends, secrets included.
      - type: object
        description: |-
          Change where a channel sends and which events it receives. A setting kept in the Secret
          (a URL, token, password, ntfy server or topic) left empty keeps its value; the kind stays.
        required:
        - name
        - events
        - settings
        - op
        properties:
          events:
            type: array
            items:
              $ref: "#/components/schemas/AlertmanagerEvent"
            description: The events it receives after the change.
          name:
            type: string
            description: The channel.
          op:
            type: string
            enum:
            - edit
          settings:
            $ref: "#/components/schemas/AlertmanagerChannelSettings"
            description: Its settings after the change.
      - type: object
        description: Change which events a channel receives.
        required:
        - name
        - events
        - op
        properties:
          events:
            type: array
            items:
              $ref: "#/components/schemas/AlertmanagerEvent"
            description: The events it receives after the change.
          name:
            type: string
            description: The channel.
          op:
            type: string
            enum:
            - events
      - type: object
        description: Remove a channel and its Secret.
        required:
        - name
        - op
        properties:
          name:
            type: string
            description: The channel.
          op:
            type: string
            enum:
            - remove
      - type: object
        description: Send a test to a channel.
        required:
        - name
        - op
        properties:
          name:
            type: string
            description: The channel.
          op:
            type: string
            enum:
            - test
      description: What to plan.
    ObjectAccess:
      type: string
      description: |-
        Whether the person may list a kind, as one `SelfSubjectRulesReview` hints, or as a list
        answered.
      enum:
      - allowed
      - denied
      - unknown
    ObjectDocument:
      type: object
      description: One object as YAML.
      required:
      - id
      - resource
      - yaml
      - origin
      - provenance
      properties:
        id:
          type: string
          description: "`projects/<p>/objects/<group>/<version>/<resource>/<name>`."
        origin:
          $ref: "#/components/schemas/Origin"
          description: The object.
        provenance:
          $ref: "#/components/schemas/Provenance"
          description: The tool that manages it, if any.
        resource:
          type: string
          description: The plural resource name.
        status:
          type:
          - object
          - "null"
          description: |-
            The object's `status` as the cluster reports it; absent when it has none, and never for a
            Secret.
        yaml:
          type: string
          description: The object as YAML, without the server's bookkeeping; a Secret's values hidden.
    ObjectKind:
      type: object
      description: The objects of one kind.
      required:
      - group
      - version
      - resource
      - kind
      - generated
      - curated
      - access
      - listed
      - items
      properties:
        access:
          $ref: "#/components/schemas/ObjectAccess"
          description: Whether the person may list it.
        curated:
          type: boolean
          description: One of the kinds a project usually holds, read without being asked for.
        generated:
          type: boolean
          description: Controllers create these on their own; read only when named in `kinds`.
        group:
          type: string
          description: The API group; empty for the core group.
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObjectSummary"
          description: By name; empty when not `listed`.
        kind:
          type: string
          description: The kind.
        listed:
          type: boolean
          description: >-
            Whether it was read in this answer; when `false`, `items` is empty and says
            nothing.
        resource:
          type: string
          description: The plural resource name.
        version:
          type: string
          description: The version.
    ObjectList:
      type: object
      description: Every object of a project, by kind.
      required:
      - id
      - items
      - scanned
      - unreadable
      properties:
        id:
          type: string
          description: "`projects/<p>/objects`."
        items:
          type: array
          items:
            $ref: "#/components/schemas/ObjectKind"
          description: >-
            Every listable namespaced kind the cluster serves, read or not, by group then
            kind.
        scanned:
          type: boolean
          description: Every kind that controllers do not generate was read (`?all=true`).
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Kinds the person may not list.
    ObjectName:
      type: object
      description: An object of the project, by kind and name.
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          description: The kind.
        name:
          type: string
          description: The name.
    ObjectRef:
      type: object
      description: A Kubernetes object in the projected namespace.
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          description: The object's kind, such as `ConfigMap`.
        name:
          type: string
          description: The object's name.
    ObjectSummary:
      type: object
      description: One object in a listing.
      required:
      - id
      - name
      properties:
        created:
          type:
          - string
          - "null"
          description: When it was created, RFC 3339.
        id:
          type: string
          description: "`projects/<p>/objects/<group>/<version>/<resource>/<name>`, `core` for the empty group."
        name:
          type: string
          description: Its name.
        ownerKind:
          type:
          - string
          - "null"
          description: The kind of its controlling owner, when it has one (`ReplicaSet` for a pod).
    Origin:
      type: object
      description: |-
        Where a value is *declared* or read from: the Kubernetes object and the field inside it.
        
        Every value the API returns carries one, so a client can always show which object to open,
        and a change plan knows which field it writes. It is the one provenance type of the API: the
        projection's values, events, logs, ConfigMaps, Secrets and projects all use it.
        
        Inside a project document `apiVersion` and `namespace` are left out: every object is in the
        project's namespace, and the kind names one API group. Responses that stand alone (an event,
        a log, a ConfigMap) carry both, so the reference is complete without its context; that is
        Kubernetes' `ObjectReference` shape [k8s-api-conventions].
        
        `field_path` names JSON fields with dots. A list whose entries Kubernetes merges by a key is
        addressed by that key, `containers[name=app]`; an atomic list by index, `envFrom[0]`.
        
        [k8s-api-conventions]: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#object-references
      required:
      - kind
      - name
      properties:
        apiVersion:
          type:
          - string
          - "null"
          description: The object's `apiVersion`, when the response stands alone.
        fieldPath:
          type:
          - string
          - "null"
          description: The field inside the object, absent when the value is the object as a whole.
        kind:
          type: string
          description: The object's kind, such as `Deployment`.
        name:
          type: string
          description: The object's name.
        namespace:
          type:
          - string
          - "null"
          description: >-
            The object's namespace, when the response stands alone and the object is
            namespaced.
        value:
          type:
          - string
          - "null"
          description: |-
            The value read at that field, as evidence names it (`4` at a quota's
            `status.hard.requests.cpu`); absent where the origin only says where a value comes from.
    Ownership:
      type: string
      description: How many workloads reference a resource, which decides where a client shows it.
      enum:
      - owned
      - shared
      - orphan
    PageServer:
      type: object
      description: |-
        The page server Zeabur Catalog's `error-pages` template deploys: the Service and the ConfigMap
        with the label `zeabur.com/page-server: "true"`.
      required:
      - service
      properties:
        pages:
          type:
          - string
          - "null"
          description: |-
            The ConfigMap of the pages, by file name such as `503.html`. Absent when no ConfigMap, or
            more than one, has the label.
        service:
          type: string
          description: The Service's name.
    Part:
      type: string
      description: What a variable that points at a database holds.
      enum:
      - url
      - host
      - password
      - user
      - database
      - mention
    PasskeyView:
      type: object
      description: "A passkey: a way to sign in that lives on a device or in a password manager."
      required:
      - id
      - synced
      - origin
      properties:
        authenticator:
          type:
          - string
          - "null"
          description: The authenticator model (AAGUID), when it reported one.
        createdAt:
          type:
          - string
          - "null"
          description: When it was added, RFC 3339.
        id:
          type: string
          description: The `Credential` object's name.
        label:
          type:
          - string
          - "null"
          description: The name its owner gave it, at enrolment or since.
        lastUsedAt:
          type:
          - string
          - "null"
          description: When it last signed in, where Zeabur Identity records it.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The `Credential`.
        synced:
          type: boolean
          description: >-
            Whether it may be synced to the owner's other devices (the authenticator's BE
            flag).
    PendingRestart:
      type: object
      description: |-
        A variable's ConfigMap or Secret was written after the oldest running pod started.
        
        That pod may still hold the old value: a container reads its variables once, when it starts
        [k8s-configmap-env].
        
        `managedFields` keep one time per field manager [k8s-ssa-fields], the time of its last write
        to any field it owns, so a manager owning this key that later wrote another key also counts:
        the pod *may* hold an old value, a restart settles it.
        
        [k8s-configmap-env]: https://kubernetes.io/docs/concepts/configuration/configmap/#configmaps-and-pods
        [k8s-ssa-fields]: https://kubernetes.io/docs/reference/using-api/server-side-apply/#field-management
      required:
      - writtenAt
      - manager
      - podStartedAt
      - pod
      properties:
        manager:
          type: string
          description: That manager.
        pod:
          type: string
          description: That pod.
        podStartedAt:
          type: string
          description: When the oldest running pod started (`status.startTime`), RFC 3339.
        writtenAt:
          type: string
          description: |-
            When the object was last written by a field manager that owns the key (for an `envFrom`
            import, any key), RFC 3339.
    Permission:
      type: string
      description: Whether the person may change something, as far as their RBAC rules tell.
      enum:
      - allowed
      - denied
      - unknown
    Phase:
      type: string
      description: |-
        A one-word aggregate of a workload's status for lists. The Kubernetes conditions stay the
        authority; this is only the badge.
      enum:
      - Running
      - Progressing
      - Degraded
      - Paused
      - Suspended
      - Completed
      - Failed
      - Unknown
    Plan:
      type: object
      description: What a plan will do.
      required:
      - objects
      - impact
      - warnings
      properties:
        impact:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadRef"
          description: The workloads it affects, sorted.
        objects:
          type: array
          items:
            $ref: "#/components/schemas/PlannedObject"
          description: The objects it writes, in the order it writes them.
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PlanWarning"
          description: What to know before applying.
    PlanFieldOwners:
      type: object
      description: The managers that own a field a write touches.
      required:
      - path
      - managers
      properties:
        managers:
          type: array
          items:
            type: string
          description: Its managers, sorted.
        path:
          type: string
          description: The field.
    PlanRequest:
      type: object
      description: What a person asks to change, as one plan.
      required:
      - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
          description: The changes, applied in order.
    PlanResponse:
      allOf:
      - $ref: "#/components/schemas/Plan"
        description: The plan.
      - type: object
        required:
        - token
        - expiresAt
        - preview
        properties:
          expiresAt:
            type: string
            description: When the token stops working, RFC 3339.
          gaps:
            type: array
            items:
              $ref: "#/components/schemas/Gap"
            description: "What the workloads it creates miss: resource requests and limits, health checks."
          preview:
            $ref: "#/components/schemas/Preview"
            description: |-
              What the plan does once applied: the pods it replaces, whether new ones fit, the data
              and fields it removes.
          token:
            type: string
            description: Send this to `apply` to carry out exactly this plan.
      description: A plan and the token that applies it.
    PlanTarget:
      type: object
      description: The object a planned write addresses.
      required:
      - apiVersion
      - kind
      - plural
      - name
      properties:
        apiVersion:
          type: string
          description: "`apiVersion`."
        kind:
          type: string
          description: The kind.
        name:
          type: string
          description: The name.
        plural:
          type: string
          description: The resource (plural).
    PlanWarning:
      oneOf:
      - type: object
        description: |-
          These workloads read a changed ConfigMap or Secret into environment variables, which a
          running container reads only when it starts: restart them for the change to take effect.
        required:
        - workloads
        - code
        properties:
          code:
            type: string
            enum:
            - restartNeeded
          workloads:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadRef"
            description: The workloads.
      - type: object
        description: |-
          These workloads read a changed ConfigMap or Secret and ask Stakater Reloader to replace
          their pods when it changes, so Reloader restarts them after the apply.
        required:
        - workloads
        - confirmed
        - code
        properties:
          code:
            type: string
            enum:
            - reloaderRestarts
          confirmed:
            type: boolean
            description: |-
              Whether Reloader was seen running in the cluster; `false` when that could not be
              read with the person's rights.
          workloads:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadRef"
            description: The workloads.
      - type: object
        description: |-
          A changed hostname was also listed for HTTPS; its certificate must be issued again for
          the new name.
        required:
        - route
        - hostname
        - code
        properties:
          code:
            type: string
            enum:
            - tlsHostChanged
          hostname:
            type: string
            description: The new hostname.
          route:
            type: string
            description: The route.
      - type: object
        description: |-
          The new hostname is listed for HTTPS on an Ingress cert-manager watches: once applied,
          cert-manager asks this issuer for its certificate.
        required:
        - hostname
        - issuer
        - code
        properties:
          code:
            type: string
            enum:
            - httpsCertificate
          hostname:
            type: string
            description: The hostname.
          issuer:
            type: string
            description: The `ClusterIssuer` or `Issuer` the Ingress names.
      - type: object
        description: The hostname is served with the person's own certificate, which nothing renews.
        required:
        - hostname
        - notAfter
        - code
        properties:
          code:
            type: string
            enum:
            - ownCertificate
          hostname:
            type: string
            description: The hostname.
          notAfter:
            type: string
            description: When the certificate expires, RFC 3339.
      - type: object
        description: |-
          The issuer is set on the whole Ingress, so these other hostnames also get their
          certificates from it.
        required:
        - route
        - issuer
        - hostnames
        - code
        properties:
          code:
            type: string
            enum:
            - issuerShared
          hostnames:
            type: array
            items:
              type: string
            description: The other hostnames listed for HTTPS.
          issuer:
            type: string
            description: The issuer.
          route:
            type: string
            description: The Ingress.
      - type: object
        description: The new hostname is served over HTTP only.
        required:
        - hostname
        - reason
        - code
        properties:
          code:
            type: string
            enum:
            - httpOnly
          hostname:
            type: string
            description: The hostname.
          reason:
            $ref: "#/components/schemas/HttpOnlyReason"
            description: Why.
          route:
            type:
            - string
            - "null"
            description: The Ingress whose certificates come from elsewhere, for `certificatesElsewhere`.
      - type: object
        description: The new `HTTPRoute` attaches to this Gateway, the first of several.
        required:
        - namespace
        - name
        - of
        - code
        properties:
          code:
            type: string
            enum:
            - gatewayChosen
          name:
            type: string
            description: Its name.
          namespace:
            type: string
            description: Its namespace.
          of:
            type: integer
            description: How many Gateways there are.
            minimum: 0
      - type: object
        description: Gateways could not be listed, so the new route is an Ingress.
        required:
        - code
        properties:
          code:
            type: string
            enum:
            - gatewaysUnreadable
      - type: object
        description: The Secret's values could not be read, so its diff shows only which keys change.
        required:
        - name
        - code
        properties:
          code:
            type: string
            enum:
            - secretValuesUnknown
          name:
            type: string
            description: The Secret.
      - type: object
        description: |-
          A rollback returns the pod template only; the ConfigMaps and Secrets the workload reads
          keep their current contents.
        required:
        - workload
        - code
        properties:
          code:
            type: string
            enum:
            - configNotRolledBack
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          The claim's `StorageClass` could not be read, so whether it can grow is known only when
          kube-apiserver answers.
        required:
        - claim
        - code
        properties:
          claim:
            type: string
            description: The claim.
          code:
            type: string
            enum:
            - storageClassUnknown
      - type: object
        description: |-
          A new `ReadWriteOnce` claim is mounted by a workload with several pods, which can share
          it only while they run on one node.
        required:
        - workload
        - code
        properties:
          code:
            type: string
            enum:
            - readWriteOnceShared
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          A new `ReadWriteOncePod` claim is mounted by a workload with several pods, of which only
          one at a time can use it.
        required:
        - workload
        - code
        properties:
          code:
            type: string
            enum:
            - readWriteOncePodShared
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          The deleted object owns these objects, as far as the person could read them; the garbage
          collector deletes them after it [k8s-gc].
          
          [k8s-gc]: https://kubernetes.io/docs/concepts/architecture/garbage-collection/
        required:
        - target
        - dependents
        - code
        properties:
          code:
            type: string
            enum:
            - deletesDependents
          dependents:
            type: array
            items:
              $ref: "#/components/schemas/ObjectName"
            description: What goes with it, owners before what they own.
          target:
            $ref: "#/components/schemas/ObjectName"
            description: The deleted object.
      - type: object
        description: The deleted Pod belongs to a controller, which starts a new one in its place.
        required:
        - pod
        - owner
        - code
        properties:
          code:
            type: string
            enum:
            - podReplaced
          owner:
            $ref: "#/components/schemas/ObjectName"
            description: Its controller.
          pod:
            type: string
            description: The Pod.
      - type: object
        description: |-
          Deleting the claim may lose its data: what happens to its PersistentVolume is the volume's
          reclaim policy, `Delete` (the volume and its data go) or `Retain` (they stay until an
          administrator removes them) [k8s-reclaim].
          
          [k8s-reclaim]: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#reclaiming
        required:
        - claim
        - code
        properties:
          claim:
            type: string
            description: The claim.
          code:
            type: string
            enum:
            - claimDataMayBeLost
          reclaimPolicy:
            type:
            - string
            - "null"
            description: The volume's `persistentVolumeReclaimPolicy`; absent when it could not be read.
          volume:
            type:
            - string
            - "null"
            description: Its PersistentVolume; absent while the claim is not bound.
      - type: object
        description: |-
          Deleting the service also deletes these objects: it made them and nothing else uses
          them.
        required:
        - target
        - objects
        - code
        properties:
          code:
            type: string
            enum:
            - deletesOwned
          objects:
            type: array
            items:
              $ref: "#/components/schemas/ObjectName"
            description: The objects, in the order they are deleted.
          target:
            $ref: "#/components/schemas/ObjectName"
            description: The deleted workload.
      - type: object
        description: The deleted service uses or made this object, and it stays.
        required:
        - object
        - reason
        - code
        properties:
          code:
            type: string
            enum:
            - stays
          object:
            $ref: "#/components/schemas/ObjectName"
            description: The object.
          owner:
            oneOf:
            - $ref: "#/components/schemas/ObjectName"
              description: Its controller, for `controlled`.
            - type: "null"
          reason:
            $ref: "#/components/schemas/KeptReason"
            description: Why.
          tool:
            oneOf:
            - $ref: "#/components/schemas/Tool"
              description: The tool that manages it, for `managed`.
            - type: "null"
          workloads:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadRef"
            description: The other workloads that use it, for `shared`.
      - type: object
        description: |-
          These workloads still use the deleted ConfigMap, Secret or claim: their pods that start
          after it is gone fail to start, and a claim in use stays until no pod uses it
          [k8s-in-use].
          
          [k8s-in-use]: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#storage-object-in-use-protection
        required:
        - target
        - workloads
        - code
        properties:
          code:
            type: string
            enum:
            - stillUsed
          target:
            $ref: "#/components/schemas/ObjectName"
            description: The deleted object.
          workloads:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadRef"
            description: The workloads.
      - type: object
        description: |-
          Deleting the NetworkPolicy opens traffic it held back: these services are no longer
          isolated, and these connections the project shows become allowed.
        required:
        - policy
        - ingressOpened
        - egressOpened
        - connectionsOpened
        - code
        properties:
          code:
            type: string
            enum:
            - networkPolicyRemoved
          connectionsOpened:
            type: array
            items:
              $ref: "#/components/schemas/ConnectionRef"
            description: Connections it blocked or limited that become allowed.
          egressOpened:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadRef"
            description: Services nothing limits sending once it is gone.
          ingressOpened:
            type: array
            items:
              $ref: "#/components/schemas/WorkloadRef"
            description: Services nothing limits reaching once it is gone.
          policy:
            type: string
            description: The policy.
      - type: object
        description: |-
          The plan adds this debug container to the pod. Kubernetes cannot remove an ephemeral
          container: it stays in the pod's spec, stopped once its shell exits, until the pod is
          replaced.
        required:
        - pod
        - container
        - target
        - image
        - code
        properties:
          code:
            type: string
            enum:
            - debugContainerStays
          container:
            type: string
            description: The debug container.
          image:
            type: string
            description: Its image.
          pod:
            type: string
            description: The pod.
          target:
            type: string
            description: The container whose processes it shares.
      - type: object
        description: |-
          A debug container of Zeabur's still runs (or is starting) for this container; the
          terminal uses it, and nothing is written.
        required:
        - pod
        - container
        - target
        - code
        properties:
          code:
            type: string
            enum:
            - debugContainerReused
          container:
            type: string
            description: The debug container.
          pod:
            type: string
            description: The pod.
          target:
            type: string
            description: The container whose processes it shares.
      - type: object
        description: |-
          The person's credential lacks rights the plan needs: kube-apiserver will refuse it unless
          an administrator grants them (or the person acts as one).
        required:
        - rights
        - code
        properties:
          code:
            type: string
            enum:
            - rightsMissing
          rights:
            type: array
            items:
              $ref: "#/components/schemas/Denied"
            description: Each right, as kube-apiserver would name it in a refusal.
      - type: object
        description: "The plan creates a tools pod: what runs where, as whom, until when."
        required:
        - namespace
        - pod
        - image
        - person
        - admin
        - deadlineSeconds
        - graceSeconds
        - code
        properties:
          admin:
            type: boolean
            description: >-
              Whether they act with the administrator's credential, which the person holds
              now.
          code:
            type: string
            enum:
            - toolsPod
          credentialExpiresAt:
            type:
            - string
            - "null"
            description: |-
              When the credential written into the pod expires, RFC 3339; `kubectl` is refused
              from then until a terminal opens again with a fresh one.
          deadlineSeconds:
            type: integer
            format: int64
            description: >-
              The pod stops this long after it starts, whatever happens
              (`activeDeadlineSeconds`).
          graceSeconds:
            type: integer
            format: int64
            description: It is deleted this long after its last terminal closes.
          image:
            type: string
            description: Its image.
          namespace:
            type: string
            description: Its namespace.
          person:
            type: string
            description: "Who `kubectl` and `helm` act as: the person's user name."
          pod:
            type: string
            description: Its name.
      - type: object
        description: |-
          While the credential is valid, anyone who can run commands in the tools pod, or read its
          memory, can use it as the person.
        required:
        - namespace
        - code
        properties:
          code:
            type: string
            enum:
            - toolsCredentialExposed
          namespace:
            type: string
            description: The pod's namespace, whose `pods/exec` grants decide who that is.
      - type: object
        description: The person's tools pod still runs; the terminal uses it, and nothing is written.
        required:
        - namespace
        - pod
        - code
        properties:
          code:
            type: string
            enum:
            - toolsPodReused
          namespace:
            type: string
            description: Its namespace.
          pod:
            type: string
            description: Its name.
      - type: object
        description: |-
          The hostname moved to a route of its own: for its own certificate, or for a redirect or
          maintenance that would apply to every hostname of an `HTTPRoute`.
        required:
        - hostname
        - from
        - to
        - code
        properties:
          code:
            type: string
            enum:
            - domainMoved
          from:
            $ref: "#/components/schemas/ObjectName"
            description: The route it leaves.
          hostname:
            type: string
            description: The hostname.
          to:
            $ref: "#/components/schemas/ObjectName"
            description: Its new route.
      - type: object
        description: The hostname was the route's last, so the route is deleted with it.
        required:
        - route
        - hostname
        - code
        properties:
          code:
            type: string
            enum:
            - routeDeleted
          hostname:
            type: string
            description: The hostname.
          route:
            $ref: "#/components/schemas/ObjectName"
            description: The route.
      - type: object
        description: |-
          The rules changed after maintenance started, so the hostname goes to this Service port
          instead of the backends kept then.
        required:
        - hostname
        - service
        - port
        - code
        properties:
          code:
            type: string
            enum:
            - maintenanceRestored
          hostname:
            type: string
            description: The hostname.
          port:
            type: integer
            format: int32
            description: Its port.
          service:
            type: string
            description: The Service.
      - type: object
        description: |-
          Browsers keep a permanent redirect: after it stops, visitors who saw it still go to the
          other hostname until their browser forgets it.
        required:
        - hostname
        - code
        properties:
          code:
            type: string
            enum:
            - permanentRedirect
          hostname:
            type: string
            description: The hostname that redirects.
      - type: object
        description: |-
          Anyone on the internet can connect to the port: no password of Zeabur's stands in front
          of it. For a data store, its own password is all that protects the data.
        required:
        - workload
        - port
        - code
        properties:
          code:
            type: string
            enum:
            - publicPort
          dataStore:
            oneOf:
            - $ref: "#/components/schemas/DataStore"
              description: What kind of data store the workload is, when it is one.
            - type: "null"
          port:
            type: integer
            format: int32
            description: The port.
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          A NetworkPolicy isolates the workload's pods and admits nothing from the internet, so the
          new public port does not answer until a policy admits it (added by the API, which reads the
          project's policies).
        required:
        - workload
        - port
        - policies
        - code
        properties:
          code:
            type: string
            enum:
            - publicPortBlocked
          policies:
            type: array
            items:
              type: string
            description: The policies that isolate its pods, by name.
          port:
            type: integer
            format: int32
            description: The port.
          workload:
            $ref: "#/components/schemas/WorkloadRef"
            description: The workload.
      - type: object
        description: |-
          The Ingress serves these hostnames over plain HTTP, so the password crosses the network
          readable on them.
        required:
        - route
        - hostnames
        - code
        properties:
          code:
            type: string
            enum:
            - passwordOverHttp
          hostnames:
            type: array
            items:
              type: string
            description: Its hostnames without HTTPS.
          route:
            type: string
            description: The Ingress.
      - type: object
        description: |-
          The new task runs the service's image as it is now; a later change to the service's
          image does not reach the task.
        required:
        - from
        - image
        - code
        properties:
          code:
            type: string
            enum:
            - taskImageCopied
          from:
            $ref: "#/components/schemas/WorkloadRef"
            description: The service.
          image:
            type: string
            description: The image.
      - type: object
        description: |-
          Once applied, every workload of the project meets the restricted level, but the project
          enforces only this one: a `podSecurity` change to `restricted` would raise it.
        required:
        - level
        - code
        properties:
          code:
            type: string
            enum:
            - projectCanBeRestricted
          level:
            $ref: "#/components/schemas/PodSecurityLevel"
            description: The level the project enforces now.
      description: Something a person should know before applying.
    PlannedObject:
      type: object
      description: One object a plan writes.
      required:
      - target
      - changes
      - owners
      - write
      properties:
        after:
          type:
          - object
          - "null"
          description: The object as it will be, the same way; absent when the write deletes it.
        afterYaml:
          type:
          - string
          - "null"
          description: "`after` as YAML, the same way."
        before:
          type:
          - object
          - "null"
          description: |-
            The object as it is, without `managedFields` and with Secret values redacted; absent
            when the write creates it.
        beforeYaml:
          type:
          - string
          - "null"
          description: "`before` as YAML, written as the object's YAML view writes it."
        change:
          type:
          - integer
          - "null"
          description: For an object a `create` makes, the index of that change in the request.
          minimum: 0
        changes:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"
          description: The fields that change.
        owners:
          type: array
          items:
            $ref: "#/components/schemas/PlanFieldOwners"
          description: Who owns the fields the write touches now.
        resourceVersion:
          type:
          - string
          - "null"
          description: The `resourceVersion` the plan was computed against; absent for a creation.
        target:
          $ref: "#/components/schemas/PlanTarget"
          description: The object.
        write:
          $ref: "#/components/schemas/PlannedWrite"
          description: The write.
    PlannedWrite:
      oneOf:
      - type: object
        description: A new object, created with `POST`; it fails if one of that name exists by then.
        required:
        - body
        - type
        properties:
          body:
            type: object
            description: The object, `apiVersion`, `kind` and `metadata` included.
          type:
            type: string
            enum:
            - create
      - type: object
        description: |-
          An RFC 6902 JSON Patch whose first operation tests `metadata.generation` (or, for an
          object without one, `metadata.resourceVersion`), and whose
          `test` operations check every value it replaces or removes.
        required:
        - operations
        - type
        properties:
          operations:
            type: array
            items:
              type: object
            description: The operations.
          type:
            type: string
            enum:
            - patch
      - type: object
        description: |-
          A `DELETE` with background propagation, refused (`409`) unless the object still has this
          `uid` and `resourceVersion`.
        required:
        - resourceVersion
        - type
        properties:
          resourceVersion:
            type: string
            description: The object's `metadata.resourceVersion`.
          type:
            type: string
            enum:
            - delete
          uid:
            type:
            - string
            - "null"
            description: The object's `metadata.uid`.
      - type: object
        description: |-
          An RFC 6902 JSON Patch of a Pod's `ephemeralcontainers` subresource that adds one
          container. Its first operation tests `metadata.uid`, so a pod replaced since the plan
          fails it.
        required:
        - operations
        - type
        properties:
          operations:
            type: array
            items:
              type: object
            description: The operations.
          type:
            type: string
            enum:
            - ephemeralContainers
      description: |-
        How a planned write changes its object: a new object is created whole, an existing one is
        patched or deleted. Creations and patches go as the field manager `zeabur`.
    PodFate:
      type: string
      description: What maintenance does to a pod.
      enum:
      - moves
      - stays
      - deleted
      - stuck
    PodScan:
      type: string
      description: How much of the pods were read for the requests. An open set.
      enum:
      - complete
      - partial
      - unreadable
    PodSecurityLevel:
      type: string
      description: A Pod Security Standards level, from the least to the most restrictive.
      enum:
      - privileged
      - baseline
      - restricted
    PodSummary:
      type: object
      description: One pod of a workload.
      required:
      - id
      - name
      - phase
      - ready
      - restarts
      - health
      - containers
      - origin
      properties:
        containerStatuses:
          type: array
          items:
            $ref: "#/components/schemas/ContainerStatusSummary"
          description: |-
            Each container's state as the kubelet reports it, init containers first; empty before
            the kubelet reports any.
        containers:
          type: array
          items:
            type: string
          description: Its containers' names, for picking whose log to read.
        created:
          type:
          - string
          - "null"
          description: When it was created, in RFC 3339.
        health:
          $ref: "#/components/schemas/Health"
          description: "`fail` when it keeps failing, `ok` when ready, `idle` when it succeeded, `warn` otherwise."
        id:
          type: string
          description: Its resource name, `projects/<project>/pods/<name>`; see [`crate::id`].
        name:
          type: string
          description: The pod's name.
        node:
          type:
          - string
          - "null"
          description: The node it runs on, once scheduled.
        origin:
          $ref: "#/components/schemas/Origin"
          description: The Pod object.
        phase:
          type: string
          description: "`Pending`, `Running`, `Succeeded`, `Failed` or `Unknown`, as the kubelet reports it."
        ready:
          type: boolean
          description: Whether every container is ready.
        reason:
          type:
          - string
          - "null"
          description: |-
            Why it is not running or not ready, as `kubectl get pods` shows it: a container's waiting
            reason (`CrashLoopBackOff`, `ImagePullBackOff`, `CreateContainerConfigError`), or, for a
            container that is not ready, why it last stopped (`OOMKilled`, `Error`).
        restarts:
          type: integer
          format: int32
          description: Restarts, summed over its containers.
    PodUsage:
      type: object
      description: What one pod uses, the sum of its containers.
      required:
      - origin
      - pod
      - cpuMillicores
      - memoryBytes
      - containers
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerUsage"
          description: Its containers.
        cpuMillicores:
          type: integer
          format: int64
          description: CPU, in millicores.
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          description: Memory, the working set, in bytes.
          minimum: 0
        origin:
          $ref: "#/components/schemas/Origin"
          description: Its `PodMetrics`.
        pod:
          type: string
          description: The pod.
    PodWorkload:
      type: object
      description: The workload a pod belongs to, as the interface links it.
      required:
      - kind
      - name
      properties:
        kind:
          type: string
          description: "`Deployment`, `StatefulSet`, `DaemonSet`, `Job`, or the controller's own kind."
        name:
          type: string
          description: Its name.
    PolicyWrite:
      type: object
      description: One policy a plan rewrites.
      required:
      - namespace
      - name
      properties:
        afterYaml:
          type:
          - string
          - "null"
          description: The policy as it will be, YAML.
        beforeYaml:
          type:
          - string
          - "null"
          description: The policy as it is, YAML.
        name:
          type: string
          description: Its name.
        namespace:
          type: string
          description: Its namespace.
    Port:
      allOf:
      - $ref: "#/components/schemas/ProtocolInference"
        description: The application protocol and how it was inferred.
      - type: object
        required:
        - port
        - origin
        properties:
          name:
            type:
            - string
            - "null"
            description: The port's name.
          nodePort:
            type:
            - integer
            - "null"
            format: int32
            description: The node port, for `NodePort` and `LoadBalancer` Services.
          origin:
            $ref: "#/components/schemas/Origin"
            description: The port in its Service.
          port:
            type: integer
            format: int32
            description: The Service port.
          targetPort:
            type:
            - string
            - "null"
            description: The target port, a number or a container port name.
      description: One port of a Kubernetes Service.
    PortProtocol:
      type: string
      description: The application protocol a Service port speaks.
      enum:
      - HTTP
      - HTTPS
      - gRPC
      - TCP
      - UDP
    PresetList:
      type: object
      description: The ready-made policies for one service.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NetworkPolicyPreset"
          description: Isolate first, then allow the ingress controller, then one per other service.
    Preview:
      type: object
      description: What a plan does once applied.
      required:
      - rollouts
      - fit
      - dataLoss
      - removals
      - unreadable
      properties:
        dataLoss:
          type: array
          items:
            $ref: "#/components/schemas/DataLoss"
          description: The data it loses.
        fit:
          $ref: "#/components/schemas/Fit"
          description: Whether the new pods fit.
        removals:
          type: array
          items:
            $ref: "#/components/schemas/Removal"
          description: The fields it removes, by object then path.
        rollouts:
          type: array
          items:
            $ref: "#/components/schemas/Rollout"
          description: The workloads whose pods change, sorted.
        unreadable:
          type: array
          items:
            $ref: "#/components/schemas/UnreadableView"
          description: Reads the person was refused, and what they left unchecked.
    ProbeHandler:
      type: string
      description: How a probe checks the container.
      enum:
      - HTTPGet
      - TCPSocket
      - GRPC
      - Exec
    ProbeKind:
      type: string
      description: |-
        The probes of a container [k8s-probes].
        
        [k8s-probes]: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
      enum:
      - liveness
      - readiness
      - startup
    ProbeRequest:
      type: object
      description: A probe as a person asks for it.
      required:
      - handler
      properties:
        command:
          type:
          - array
          - "null"
          items:
            type: string
          description: The command, for exec.
        failureThreshold:
          type:
          - integer
          - "null"
          format: int32
          description: Failures in a row that count.
        handler:
          $ref: "#/components/schemas/ProbeHandler"
          description: How it checks.
        initialDelaySeconds:
          type:
          - integer
          - "null"
          format: int32
          description: Seconds before the first check.
        path:
          type:
          - string
          - "null"
          description: The path, for HTTP.
        periodSeconds:
          type:
          - integer
          - "null"
          format: int32
          description: Seconds between checks.
        port:
          type:
          - integer
          - "null"
          format: int32
          description: The port, for HTTP and TCP.
        scheme:
          type:
          - string
          - "null"
          description: "`HTTP` (the default) or `HTTPS`, for HTTP."
        timeoutSeconds:
          type:
          - integer
          - "null"
          format: int32
          description: Seconds a check may take.
    ProbeSummary:
      type: object
      description: What one probe checks.
      required:
      - handler
      properties:
        handler:
          $ref: "#/components/schemas/ContainerProbeHandler"
          description: How it checks.
        path:
          type:
          - string
          - "null"
          description: The path (HTTP).
        port:
          type:
          - string
          - "null"
          description: The port, a number or a container port name (HTTP, TCP and gRPC).
    Probes:
      type: object
      description: |-
        A container's probes [k8s-probes].
        
        Liveness restarts the container when it fails, readiness takes the pod out of its Services'
        endpoints, and startup holds the other two back until the application has started.
        
        [k8s-probes]: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
      properties:
        liveness:
          oneOf:
          - $ref: "#/components/schemas/ProbeSummary"
            description: The liveness probe.
          - type: "null"
        readiness:
          oneOf:
          - $ref: "#/components/schemas/ProbeSummary"
            description: The readiness probe.
          - type: "null"
        startup:
          oneOf:
          - $ref: "#/components/schemas/ProbeSummary"
            description: The startup probe.
          - type: "null"
    Problem:
      type: object
      description: |-
        An RFC 9457 problem, with Zeabur's extension members `kind`, `summary`, `why`, `fix`,
        `evidence`, `fields`, `kubernetes`, `managedBy`, `denied`, `at` and `applied`.
      required:
      - type
      - title
      - status
      - detail
      - kind
      - summary
      - fix
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/AppliedObject"
          description: |-
            The objects an apply wrote before this refusal, in order. A plan of several writes is
            not one transaction, so these stay; a client can offer to delete exactly these.
        at:
          oneOf:
          - $ref: "#/components/schemas/ProblemAt"
            description: |-
              Where in the request it lies, for a request of several changes or one written as YAML:
              the change, and the line of its YAML or the field.
          - type: "null"
        denied:
          oneOf:
          - $ref: "#/components/schemas/Denied"
            description: |-
              The request the cluster refused, on a `403` from kube-apiserver to a request Zeabur can
              describe. A client names the missing permission from this member, not from the wording
              of `kubernetes.message`.
          - type: "null"
        detail:
          type: string
          description: What happened, in plain language, for this occurrence.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Origin"
          description: The objects and fields it rests on.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldCause"
          description: The fields kube-apiserver found invalid, so a form can mark them.
        fix:
          type: string
          description: What to do about it.
        fixKey:
          oneOf:
          - $ref: "#/components/schemas/Message"
            description: |-
              The fix as a sentence a client words in its own language, where Zeabur wrote `fix` for
              this occasion rather than for the kind (the quota to raise, the rule to ask for); absent
              when `fix` is the kind's own, which a client words from `kind`.
          - type: "null"
        kind:
          $ref: "#/components/schemas/Kind"
          description: The category.
        kubernetes:
          oneOf:
          - $ref: "#/components/schemas/KubernetesStatus"
            description: kube-apiserver's own answer, when the problem came from the cluster.
          - type: "null"
        managedBy:
          oneOf:
          - $ref: "#/components/schemas/Tool"
            description: |-
              The tool that manages the object, or owns the field, a write was refused for: the change
              belongs in that tool's configuration. A client tells this refusal apart by this member,
              not by the wording of `detail`.
          - type: "null"
        status:
          type: integer
          format: int32
          description: HTTP status code.
          minimum: 0
        summary:
          $ref: "#/components/schemas/Message"
          description: |-
            What happened, naming the object where Zeabur knows it: `problem.summary.{kind}`, with
            the values it names (`name`, `namespace`, `resource`, `verb`) as far as they are known.
        title:
          type: string
          description: Short summary of the kind.
        type:
          type: string
          description: Problem type URI.
        unavailableLog:
          oneOf:
          - $ref: "#/components/schemas/UnavailableLog"
            description: |-
              Why the container log asked for cannot be read, on a [`Kind::LogUnavailable`]. A client
              tells the reason by this member, not by the wording of `detail`.
          - type: "null"
        why:
          oneOf:
          - $ref: "#/components/schemas/Message"
            description: |-
              Why: the rule that applied, with this occurrence's numbers. Absent when the summary and
              fix say all there is.
          - type: "null"
    ProblemAt:
      type: object
      description: Where in a request a problem lies.
      required:
      - change
      properties:
        change:
          type: integer
          description: The index of the change in the request.
          minimum: 0
        field:
          type:
          - string
          - "null"
          description: The field, as kube-apiserver writes it (`metadata.namespace`).
        line:
          type:
          - integer
          - "null"
          format: int64
          description: The line of the change's YAML, from 1.
          minimum: 0
    Project:
      type: object
      description: >-
        One namespace projected into services, the resources around them and how they
        relate.
      required:
      - namespace
      - services
      - endpoints
      - routes
      - resources
      - connections
      properties:
        connections:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
          description: Which services appear to call which, sorted by source then target.
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
          description: |-
            Every Kubernetes Service that selects a service's pods, once, sorted by name; a service
            names its own in `endpointNames`.
        namespace:
          type: string
          description: The namespace.
        pageServer:
          oneOf:
          - $ref: "#/components/schemas/PageServer"
            description: |-
              The server of the error pages and the maintenance page. Absent when the project has none,
              or has more than one.
          - type: "null"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
          description: The ConfigMaps, Secrets, PVCs, Services and Ingresses, sorted by kind then name.
        routes:
          type: array
          items:
            $ref: "#/components/schemas/Route"
          description: |-
            Every Ingress that routes to one of those Services, once, sorted by name; a service names
            its own in `routeNames`.
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
          description: One service per workload, sorted by kind then name.
    ProjectAccess:
      type: object
      description: Your role in one adopted project.
      required:
      - name
      properties:
        displayName:
          type:
          - string
          - "null"
          description: The name shown instead, when one was given.
        name:
          type: string
          description: The Namespace's name.
        role:
          oneOf:
          - $ref: "#/components/schemas/AccountRole"
            description: Your role; absent when your rights there could not be read.
          - type: "null"
    ProjectBackups:
      type: object
      description: A project's backups across providers.
      required:
      - coverage
      - unscheduled
      - schedules
      - runs
      - providers
      - keysFrom
      - unreadable
      properties:
        coverage:
          type: array
          items:
            $ref: "#/components/schemas/BackupCoverage"
          description: One row per claim, then per database, then the namespace.
        keysFrom:
          type: object
          description: |-
            The S3 destination each Secret's keys were copied from, by the Secret's name; empty
