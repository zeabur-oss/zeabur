openapi: 3.1.0
info:
  title: Zeabur API
  description: |-
    Kubernetes made simple and secure by default. Every request acts as the person making it; errors are RFC 9457 problems that keep kube-apiserver's own answer.
    
    **Shapes.** A get returns the resource itself, with `unreadable` naming the kinds the person may not list. A list returns `{items}` with every item; events take a `limit` (100 by default, 500 at most) and say in `totalSize` how many matched. Every value names the Kubernetes object it came from (`origin`), every top-level node has an `id` in the shape of its path, and times are RFC 3339.
    
    **Caching.** Every answer carries `Cache-Control: no-store`.
    
    **Consistency.** A project is read with one consistent LIST per kind, issued concurrently. Kinds are not read at one shared resourceVersion, which Kubernetes does not offer across kinds, so a response can briefly show, for example, a pod that a just-deleted workload owned; the next read corrects it. Zeabur promises freshness (nothing older than the request), not a single-revision snapshot.
    
    **Errors.** The problem `kind` and `reason` are open enumerations: expect new values, treat an unknown `kind` by its HTTP status and ignore an unknown `reason`. `429` and `503` carry kube-apiserver's `Retry-After` when it gave one. Where admin rights are offered and not in use (`/api/v1/session`), a `403` from kube-apiserver comes as `elevation-required`, with the same `denied` and `kubernetes`; while they are in use, every request goes with them.
    
    **Compatibility.** The embedded web interface ships with the API; other clients are not yet promised a stable `/api/v1`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.0.1
paths:
  /api/v1/account:
    get:
      tags:
      - identity
      summary: Who you are, your role in each project, and where to manage how you sign in.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster:
    get:
      tags:
      - cluster
      summary: |-
        The cluster: its name and where that comes from, kube-apiserver's version and distribution.
        Readable by every signed-in person; the name may come from the nodes when they may list them.
      operationId: getCluster
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/alerts:
    get:
      tags:
      - cluster
      summary: |-
        Falco's recent alerts that concern no namespace (a node's own processes), newest first, read
        as the person.
      operationId: getClusterAlerts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAlerts"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/capabilities:
    get:
      tags:
      - cluster
      summary: |-
        Which capabilities the cluster has, by Zeabur Catalog, with the version of
        each installed component.
      description: |-
        Detection reads cluster-wide objects (CRDs, ingress classes, workloads in every namespace) as
        the person. If any of those reads is refused, the answer would show installed components as
        missing, so the endpoint answers `403` instead: managing the cluster's components is for
        people who can see the whole cluster, and the interface hides it for everyone else.
      operationId: listCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/cluster/components/{capability}/{component}/install":
    get:
      tags:
      - cluster
      summary: |-
        How to install a catalogue component yourself: Helm commands, a k3s `HelmChart`, Flux objects
        or an Argo CD `Application`, with the catalogue's pinned versions and values. Zeabur runs none
        of them.
      operationId: guide_for
      parameters:
      - name: capability
        in: path
        required: true
        schema:
          type: string
      - name: component
        in: path
        required: true
        schema:
          type: string
      - name: profile
        in: query
        description: "`single-node` or `multi-node`; by default the one that fits the cluster's node count."
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallAnswer"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/config-reload:
    get:
      tags:
      - cluster
      summary: |-
        Whether Stakater Reloader runs in the cluster, so a workload's Reloader annotation takes
        effect. Always answers: `unknown` when the person may not list Deployments in every
        namespace.
      operationId: getConfigReload
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigReloadView"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/events:
    get:
      tags:
      - cluster
      summary: |-
        Events of every namespace, the newest `limit` of them (100 by default), optionally only
        warnings, only recent ones and only those about the cluster itself: the cluster overview asks
        for the last hour's warnings with `scope=cluster`, leaving projects' events to their pages.
      description: |-
        At most 5,000 events are read (`partial` says when there were more); `totalSize` counts every
        event read that matched, also those past the limit.
      operationId: listClusterEvents
      parameters:
      - name: type
        in: query
        description: "Only events of this type: `Normal` or `Warning` (any case)."
        required: false
        schema:
          type: string
      - name: sinceSeconds
        in: query
        description: Only events that last happened within this many seconds.
        required: false
        schema:
          type: integer
          format: int64
      - name: scope
        in: query
        description: |-
          `cluster`: only events about the cluster itself (no namespace, a Node, or a `kube-`
          namespace); `all`, the default: every event.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: |-
          The most events to return, newest first: 100 by default, at most 500 (a larger value is
          lowered to 500).
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterEventList"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/gaps:
    get:
      tags:
      - cluster
      summary: |-
        What the cluster itself is missing, apart from any project: an IngressClass served by a
        retired controller.
      operationId: cluster
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/incidents:
    get:
      tags:
      - cluster
      summary: |-
        Every incident on the cluster: a component down or a node not ready, with the domains and
        projects it reaches, as far as the person can list Ingresses and pods. Services are not named:
        they are a project's, see `listProjectIncidents`.
      operationId: listClusterIncidents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/nodes:
    get:
      tags:
      - cluster
      summary: "The nodes: roles, health, versions, and what their pods request against what is allocatable."
      description: |-
        Requests and limits are summed per node from every unfinished pod, the way
        `kubectl describe node` sums them (see `capacity`); usage is added only when metrics-server
        is installed and readable, and is approximate ("meant only for autoscaling purposes"
        [metrics-server]). Each node's disk comes from the metrics store (see `disks`), and `disk`
        says when it could not. `403` when nodes cannot be listed; a refusal of pods, metrics or the
        store leaves those parts out and says so.
        
        [metrics-server]: https://github.com/kubernetes-sigs/metrics-server
      operationId: listNodes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/upgrades:
    get:
      tags:
      - cluster
      summary: |-
        The cluster's version and what it calls for: end of life from the bundled table, version
        skew between kube-apiserver and the kubelets, and newer patches and minors from
        system-upgrade-controller's Plans.
      description: |-
        Zeabur makes no outbound request: without Plans, newer versions are not reported (see
        [`zeabur_catalog::versions`]). Readable by everyone signed in; nodes and Plans the person
        may not list are named in `unreadable`, so the interface can say which permission is missing.
      operationId: getUpgrades
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upgrades"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/members:
    get:
      tags:
      - members
      summary: Everyone who can sign in, and the setup links waiting to be used.
      operationId: listMembers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersView"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/members/invitations:
    post:
      tags:
      - members
      summary: "Invites someone: a one-time link that adds a passkey to their account, made a member if new."
      operationId: inviteMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkView"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/members/invitations/{name}":
    delete:
      tags:
      - members
      summary: >-
        Revokes a setup link that has not been used. One already used or expired is
        gone already.
      operationId: revokeInvitation
      parameters:
      - name: name
        in: path
        description: The `Invitation` object's name
        required: true
        schema:
          type: string
      responses:
        "204": {}
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/members/{username}":
    delete:
      tags:
      - members
      summary: |-
        Removes a member: the role bindings Zeabur made for them, their links, passkeys, linked
        accounts and sessions, then the member. Projects and everything in them stay, and so do RBAC
        bindings made outside Zeabur.
      operationId: removeMember
      parameters:
      - name: username
        in: path
        description: The member's user name
        required: true
        schema:
          type: string
      responses:
        "204": {}
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/members/{username}/access":
    put:
      tags:
      - members
      summary: |-
        Changes what a member may do: admin rights, or roles in chosen projects (a project left out
        loses theirs). Nobody takes their own admin rights away.
      operationId: setMemberAccess
      parameters:
      - name: username
        in: path
        description: The member's user name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessRequest"
        required: true
      responses:
        "204": {}
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/members/{username}/credentials/{id}":
    delete:
      tags:
      - members
      summary: |-
        Removes a member's passkey or linked account. Sessions it started keep renewing until they
        end or are signed out; your own last passkey is refused.
      operationId: removeMemberCredential
      parameters:
      - name: username
        in: path
        description: The member's user name
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: The `Credential` object's name
        required: true
        schema:
          type: string
      responses:
        "204": {}
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/members/{username}/setup-links":
    post:
      tags:
      - members
      summary: "A new setup link for a member: to add a passkey, or (`reset`) to start over after a lost one."
      operationId: createSetupLink
      parameters:
      - name: username
        in: path
        description: The member's user name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupLinkView"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: The projects you may see, with the health of the adopted ones.
      operationId: list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}":
    get:
      tags:
      - projects
      summary: "A project's services, the resources they use, and how they relate: the project document."
      operationId: get
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDocument"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/alerts":
    get:
      tags:
      - projects
      summary: Falco's recent alerts about a project's pods, newest first, read as the person.
      operationId: getProjectAlerts
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAlerts"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/apply":
    post:
      tags:
      - projects
      summary: "Carries out a plan by its token: checks it, dry-runs every write, then writes."
      description: |-
        Reads and writes use the elevated credential while the person holds one, as every request
        does. The plan's binding alone is checked against the everyday identity: elevation adds groups
        but keeps the user name, so a plan made before elevating still applies after, and one made
        while elevated still applies once the rights have ended (and is refused then if the everyday
        credential may not write it). Where elevation is offered and not in use, a `403` from the
        cluster is answered as `elevation-required` (same status, same `denied`; see the `error`
        module), so the interface can offer to retry as an administrator.
      operationId: apply
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResponse"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/backups":
    get:
      tags:
      - projects
      summary: |-
        Backups of a project: which claims, databases and the namespace a schedule covers, and how
        the latest backups went, from every backup provider this build has (K8up, Velero,
        CloudNativePG), read as the person. Outcomes are as each provider reports them; Zeabur does
        not test restores.
      operationId: getProjectBackups
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectBackups"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/configmaps":
    get:
      tags:
      - resources
      summary: The ConfigMaps of a project, in full, sorted by name. Lists ConfigMaps only.
      operationId: config_maps
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigMapList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/events":
    get:
      tags:
      - projects
      summary: >-
        Events in a project, the newest `limit` of them (100 by default; see
        [`crate::query`]).
      description: |-
        Ordered by when they last happened, newest first (events that say nothing about when last),
        then by name. `totalSize` counts every event that matched, also those past the limit.
      operationId: events
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      - name: regarding
        in: query
        description: |-
          Only events about this object, as `<kind>/<name>` (`pod/web-1`, `Deployment/web`; the
          kind in any case).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: |-
          The most events to return, newest first: 100 by default, at most 500 (a larger value is
          lowered to 500).
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/gaps":
    get:
      tags:
      - projects
      summary: >-
        What a project is missing, by the built-in rules, each with its citations and
        fix.
      operationId: project
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/incidents":
    get:
      tags:
      - projects
      summary: |-
        What on the cluster's side is breaking this project's services: a component down or a node
        not ready, with the services, domains and projects it reaches.
      operationId: listProjectIncidents
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/namespace":
    get:
      tags:
      - projects
      summary: "A project's Namespace: adopted or not, its details, and whether you may change them."
      operationId: getProjectNamespace
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectNamespace"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/network-policy/presets":
    get:
      tags:
      - projects
      summary: |-
        Ready-made NetworkPolicy objects for one service, to plan as new objects (`create`): isolate
        it (its project and cluster DNS stay reachable), let the ingress controller (k3s's Traefik)
        reach it, or let one other service reach it. Nothing is written; whether the cluster enforces
        NetworkPolicy depends on its network plugin.
      operationId: listNetworkPolicyPresets
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: service
        in: query
        description: The service, `<kind>/<name>` (`deployment/api`; any case).
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetList"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/projects/{project}/objects":
    get:
      tags:
      - resources
      summary: |-
        Every listable namespaced kind of a project, kinds first: the usual kinds (or only those named
        in `kinds`) and, with `all`, every kind that controllers do not generate are read (names, ages
        and owners only); the rest come back unread. Each kind carries an access hint; kinds refused
        when read are named in `unreadable`.
      operationId: listObjects
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: kinds
        in: query
        description: |-
          Kinds to read instead of the usual ones, as `<group>/<resource>` (`core` for the core
