  "/api/v1/projects/{project}/services/{kind}/{name}/history":
    get:
      tags:
      - services
      summary: |-
        What a service's pods used over the last hour, 6 hours, day or week, from the metrics store,
        as you: CPU (millicores) and memory (the working set, bytes) per pod, and restarts when the
        store has kube-state-metrics. Pods are the service's by name, so those a rollout replaced
        are included. Always `200` once the parameters are valid: `state` says when there is no
        store, you may not read it (`get` on its `services/proxy`; `unreadable` names it), or it did
        not answer. Reading the store is reading every project's metrics: see the description of
        `GET /api/v1/settings/metrics-store`.
      operationId: getServiceHistory
      parameters:
      - name: project
        in: path
        description: The project's namespace
        required: true
        schema:
          type: string
      - name: kind
        in: path
        description: "`deployment`, `statefulset`, `daemonset`, `job` or `cronjob` (any case)"
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: range
        in: query
        description: "`1h` (the default, a point every 15 s), `6h` (1 min), `24h` (5 min) or `7d` (30 min)."
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceHistory"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
