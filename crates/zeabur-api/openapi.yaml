openapi: 3.1.0
info:
  title: Zeabur API
  description: |-
    Kubernetes made simple and secure by default. Every request acts as the person making it; errors are RFC 9457 problems that keep kube-apiserver's own answer.
    
    **Shapes.** A get returns the resource itself, with `unreadable` naming the kinds the person may not list. A list returns `{items}` with every item; events take a `limit` (100 by default, 500 at most) and say in `totalSize` how many matched. Every value names the Kubernetes object it came from (`origin`), every top-level node has an `id` in the shape of its path, and times are RFC 3339.
    
    **Caching.** Every answer carries `Cache-Control: no-store`.
    
    **Consistency.** A project is read with one consistent LIST per kind, issued concurrently. Kinds are not read at one shared resourceVersion, which Kubernetes does not offer across kinds, so a response can briefly show, for example, a pod that a just-deleted workload owned; the next read corrects it. Zeabur promises freshness (nothing older than the request), not a single-revision snapshot.
    
    **Errors.** The problem `kind` and `reason` are open enumerations: expect new values, treat an unknown `kind` by its HTTP status and ignore an unknown `reason`. `429` and `503` carry kube-apiserver's `Retry-After` when it gave one. Where admin rights are offered and not in use (`/api/v1/session`), a `403` from kube-apiserver comes as `elevation-required`, with the same `denied` and `kubernetes`; while they are in use, every request goes with them.
    
    **Compatibility.** The embedded web interface ships with the API; other clients are not yet promised a stable `/api/v1`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.0.1
paths:
  /api/v1/account:
    get:
      tags:
      - identity
      summary: Who you are, your role in each project, and where to manage how you sign in.
      operationId: getAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster:
    get:
      tags:
      - cluster
      summary: |-
        The cluster: its name and where that comes from, kube-apiserver's version and distribution.
        Readable by every signed-in person; the name may come from the nodes when they may list them.
        `can` is one `SelfSubjectRulesReview` in `kube-system`.
      operationId: getCluster
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/alerts:
    get:
      tags:
      - cluster
      summary: |-
        Falco's recent alerts that concern no namespace (a node's own processes), newest first, read
        as the person.
      operationId: getClusterAlerts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeAlerts"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/backups:
    get:
      tags:
      - cluster
      summary: |-
        The cluster's backups through Velero: its locations with whether Velero reaches them, its
        schedules, and the newest hundred backups with how each went. Read as the person; Velero not
        installed is `state: not-installed`, and a refused read is named in `unreadable`.
      operationId: getClusterBackups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterBackups"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/backups/apply:
    post:
      tags:
      - cluster
      summary: "Carries out a backups plan by its token: checks it, dry-runs every write, then writes."
      operationId: applyClusterBackups
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupsApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsApplied"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/backups/plan:
    post:
      tags:
      - cluster
      summary: |-
        Works out what setting the backup location or Zeabur's schedule, pausing or resuming it, or
        backing up now writes, and a token to apply it; writes nothing. The keys of a location never
        appear in the answer.
      operationId: planClusterBackups
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupsPlanRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsPlan"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/capabilities:
    get:
      tags:
      - cluster
      summary: |-
        Which capabilities the cluster has, by Zeabur Catalog, with the version of
        each installed component.
      description: |-
        Detection reads cluster-wide objects (CRDs, ingress classes, workloads in every namespace) as
        the person. If any of those reads is refused, the answer would show installed components as
        missing, so the endpoint answers `403` instead: managing the cluster's components is for
        people who can see the whole cluster, and the interface hides it for everyone else.
      operationId: listCapabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/cluster/components/{capability}/{component}/install":
    get:
      tags:
      - cluster
      summary: |-
        How to install a catalogue component: Helm commands, a k3s `HelmChart`, Flux objects or an
        Argo CD `Application`, with the catalogue's pinned versions and values. An object form is listed
        only when the cluster serves its controller, with the objects a plan creates.
      operationId: guide_for
      parameters:
      - name: capability
        in: path
        required: true
        schema:
          type: string
      - name: component
        in: path
        required: true
        schema:
          type: string
      - name: profile
        in: query
        description: "`single-node` or `multi-node`; by default the one that fits the cluster's node count."
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstallAnswer"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/config-reload:
    get:
      tags:
      - cluster
      summary: |-
        Whether Stakater Reloader runs in the cluster, so a workload's Reloader annotation takes
        effect. Always answers: `unknown` when the person may not list Deployments in every
        namespace.
      operationId: getConfigReload
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigReloadView"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/events:
    get:
      tags:
      - cluster
      summary: |-
        Events of every namespace, the newest `limit` of them (100 by default), optionally only
        warnings, only recent ones and only those about the cluster itself: the cluster overview asks
        for the last hour's warnings with `scope=cluster`, leaving projects' events to their pages.
      description: |-
        At most 5,000 events are read (`partial` says when there were more); `totalSize` counts every
        event read that matched, also those past the limit.
      operationId: listClusterEvents
      parameters:
      - name: type
        in: query
        description: "Only events of this type: `Normal` or `Warning` (any case)."
        required: false
        schema:
          type: string
      - name: sinceSeconds
        in: query
        description: Only events that last happened within this many seconds.
        required: false
        schema:
          type: integer
          format: int64
      - name: scope
        in: query
        description: |-
          `cluster`: only events about the cluster itself (no namespace, a Node, or a `kube-`
          namespace); `all`, the default: every event.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: |-
          The most events to return, newest first: 100 by default, at most 500 (a larger value is
          lowered to 500).
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterEventList"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/gaps:
    get:
      tags:
      - cluster
      summary: |-
        What the cluster itself is missing, apart from any project: an IngressClass served by a
        retired controller.
      operationId: cluster
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GapList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/health:
    get:
      tags:
      - cluster
      summary: |-
        The API server's readiness checks, of the replica that answered, with only the failing ones
        named, and the scheduler's and controller manager's leader leases when the person may read
        them (see [`mod@health`]). `403` when `/readyz` is refused.
      operationId: getClusterHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHealth"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/incidents:
    get:
      tags:
      - cluster
      summary: |-
        Every incident on the cluster: a component down or a node not ready, with the domains and
        projects it reaches, as far as the person can list Ingresses and pods. Services are not named:
        they are a project's, see `listProjectIncidents`.
      operationId: listClusterIncidents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/issuers:
    get:
      tags:
      - cluster
      summary: |-
        The `ClusterIssuers`, each with its `Ready` condition and, where the form can change it, its
        DNS provider's settings without the secret. Read as the person.
      operationId: getClusterIssuers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterIssuers"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/issuers/apply:
    post:
      tags:
      - cluster
      summary: "Carries out an issuer plan by its token: checks it, dry-runs every write, then writes."
      operationId: applyClusterIssuer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuersApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuersApplied"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/issuers/plan:
    post:
      tags:
      - cluster
      summary: |-
        Works out what creating or changing a Let's Encrypt `ClusterIssuer` with a DNS-01 solver
        writes, and a token to apply it; writes nothing. The provider's token never appears in the
        answer.
      operationId: planClusterIssuer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuerRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuersPlan"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/join:
    get:
      tags:
      - cluster
      summary: |-
        What a new node needs to join the cluster: the supervisor's address, the CA hash for the
        token, and the join tokens that have not expired (never their
        secrets). Each read is the person's; one they may not make is listed in `unreadable`.
      operationId: getJoin
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinInfo"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/node-policies:
    get:
      tags:
      - cluster
      summary: |-
        Whether the installer's baseline network policies let every node's traffic in. Read as the
        person; a read they may not make is listed in `unreadable`.
      operationId: getNodePolicies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePolicies"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/node-policies/apply:
    post:
      tags:
      - cluster
      summary: "Carries out a plan by its token: checks it, dry-runs every write, then writes."
      operationId: applyNodePolicies
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodePoliciesApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePoliciesApplied"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/node-policies/plan:
    post:
      tags:
      - cluster
      summary: |-
        Works out how the baseline network policies change to let every node in, and a token to apply
        it; writes nothing.
      operationId: planNodePolicies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePoliciesPlan"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/node-shells:
    get:
      tags:
      - cluster
      summary: The node shell pods, oldest first; cluster administrators only.
      operationId: nodeShells
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeShells"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/node-shells/apply:
    post:
      tags:
      - cluster
      summary: |-
        Carries out a plan by its token: checks it and the cluster again, dry-runs every write, then
        writes.
      operationId: applyNodeShell
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeShellApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeShellApplied"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/node-shells/plan:
    post:
      tags:
      - cluster
      summary: |-
        Works out what opening a shell on a node, or removing a shell pod, writes, and a token to
        apply it; writes nothing. Refused (`403`, `denied` naming `*` on `*`) unless the person may do
        everything everywhere; without a token while `exposed` lists bindings that let others into
        node shells.
      operationId: planNodeShell
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeShellPlanRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeShellPlan"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/cluster/node-shells/{pod}/terminal":
    get:
      tags:
      - cluster
      summary: The shell in a node shell pod the person opened, over a WebSocket.
      description: |-
        The same protocol as `…/pods/{pod}/exec` (`ClientFrame`, `ServerFrame`, close codes `4000`
        and `4001`); `ready` names the container `shell`. Failures arrive as an `error` frame: someone
        who may not do everything everywhere, or may not `create` `pods/exec` in the namespace
        (`403`, `elevation-required` where admin rights are offered and not in use), a pod that is not
        a node shell the person opened (`404`), one not running or already open in another terminal
        (`409`): one terminal per shell. When the terminal closes, Zeabur deletes the pod at once.
      operationId: nodeShellTerminal
      parameters:
      - name: pod
        in: path
        required: true
        schema:
          type: string
      responses:
        "101":
          description: Switched to the terminal's WebSocket
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/nodes:
    get:
      tags:
      - cluster
      summary: "The nodes: roles, health, versions, and what their pods request against what is allocatable."
      description: |-
        Requests and limits are summed per node from every unfinished pod, the way
        `kubectl describe node` sums them (see `capacity`); usage is added only when metrics-server
        is installed and readable, and is approximate ("meant only for autoscaling purposes"
        [metrics-server]). Each node's disk comes from the metrics store (see `disks`), and `disk`
        says when it could not. `403` when nodes cannot be listed; a refusal of pods, metrics or the
        store leaves those parts out and says so.
        
        [metrics-server]: https://github.com/kubernetes-sigs/metrics-server
      operationId: listNodes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeList"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/cluster/nodes/{node}/maintenance/apply":
    post:
      tags:
      - cluster
      summary: |-
        Carries out a plan by its token: patches `spec.unschedulable` and, for maintenance, makes the
        first eviction pass.
      operationId: applyNodeMaintenance
      parameters:
      - name: node
        in: path
        description: The node's name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainProgress"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/cluster/nodes/{node}/maintenance/evict":
    post:
      tags:
      - cluster
      summary: |-
        Evicts the pods of a maintenance plan that are still on the node, once; the browser calls it
        again while it waits. Accepted for an hour after the plan expires, while the node stays
        cordoned.
      operationId: evictNodePods
      parameters:
      - name: node
        in: path
        description: The node's name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainProgress"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/cluster/nodes/{node}/maintenance/plan":
    post:
      tags:
      - cluster
      summary: |-
        Works out what stopping scheduling, resuming it or maintenance does to the node and its pods,
        and a token to apply it; writes nothing.
      operationId: planNodeMaintenance
      parameters:
      - name: node
        in: path
        description: The node's name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenancePlan"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/notifications:
    get:
      tags:
      - cluster
      summary: >-
        The cluster's channels, in `observability`, and whether Zeabur's alert rules
        are installed.
      operationId: getClusterNotifications
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notifications"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/cluster/notifications/apply:
    post:
      tags:
      - cluster
      summary: Carries out the cluster's notifications plan by its token.
      operationId: applyClusterNotifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsApply"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsApplied"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
