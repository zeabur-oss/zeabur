  "/api/v1/projects/{project}/pods/{pod}/logs":
    get:
      tags:
      - pods
      summary: |-
        A snapshot of a container's log. A log the kubelet cannot give (the container has not
        started, has not restarted, or is gone) is a `log-unavailable` problem, never a log line.
      operationId: logs
      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: pod
        in: path
        required: true
        schema:
          type: string
      - name: container
        in: query
        description: The container; required when the pod has several.
        required: false
        schema:
          type: string
      - name: tailLines
        in: query
        description: Only the last lines (default 500).
        required: false
        schema:
          type: integer
          format: int64
      - name: sinceSeconds
        in: query
        description: Only lines newer than this many seconds.
        required: false
        schema:
          type: integer
          format: int64
      - name: previous
        in: query
        description: The previous instance of the container, after a restart.
        required: false
        schema:
          type: boolean
      - name: timestamps
        in: query
        description: Prefix each line with its timestamp.
        required: false
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogSnapshot"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: The pod does not exist, or the log asked for cannot be read (`log-unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
