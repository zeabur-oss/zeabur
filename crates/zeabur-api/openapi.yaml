      parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        "101":
          description: Switched to the terminal's WebSocket
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
