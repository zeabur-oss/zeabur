[package]
name = "zeabur-kube"
description = "zeabur: the only crate that talks to kube-apiserver, always as the requesting user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The in-memory cluster for tests (`memory`), also used by the tests of the crates above and by
# `zeabur-api`'s demo example; no shipped binary enables it.
memory = []

[dependencies]
zeabur-core.workspace = true
futures-util.workspace = true
http.workspace = true
# A pool that closes idle connections (see `client` in lib.rs); both already under kube.
hyper-util.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower = { workspace = true, features = ["retry"] }
# Already under kube's `ws` feature: the byte streams of `pods/exec`.
tokio.workspace = true

[dev-dependencies]
zeabur-kube = { workspace = true, features = ["memory"] }
zeabur-test-support = { workspace = true, features = ["sandbox"] }
