[install]
# Do not resolve package versions published less than seven days ago (the same delay as Cargo's
# `global-min-publish-age`). No `trustedDependencies`: no package runs install scripts.
minimumReleaseAge = 604800
exact = true

[test]
# `~icons/ph/<name>` imports, built as in vite.config.ts.
preload = ["./scripts/test-icons.ts"]
