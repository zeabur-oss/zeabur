[install]
# Do not resolve package versions published less than seven days ago (the same delay as Cargo's
# `global-min-publish-age`). No `trustedDependencies`: no package runs install scripts.
minimumReleaseAge = 604800
# Our own package, published from zeabur-oss/design-system's version tags.
minimumReleaseAgeExcludes = ["@zeabur-oss/design-system"]
exact = true

[test]
# `~icons/ph/<name>` imports, built as in vite.config.ts, and English loaded.
preload = ["./scripts/test-icons.ts", "./scripts/test-i18n.ts"]
