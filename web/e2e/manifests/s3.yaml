# A throwaway S3 store for the database backup test (e2e/l2/databases.spec.ts), applied by
# scripts/e2e-l2-browser.sh when CloudNativePG runs in the cluster. Data lives in an emptyDir.
apiVersion: v1
kind: Namespace
metadata: { name: s3-test }
---
apiVersion: v1
kind: Secret
metadata: { name: s3-config, namespace: s3-test }
stringData:
  s3.json: |
    {"identities": [{"name": "test", "credentials": [{"accessKey": "testkey", "secretKey": "testsecret123"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs, namespace: s3-test }
spec:
  replicas: 1
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata: { labels: { app: seaweedfs } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -volume.max=0
          ports: [{ containerPort: 8333 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/seaweedfs }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: config, secret: { secretName: s3-config } }
---
apiVersion: v1
kind: Service
metadata: { name: s3, namespace: s3-test }
spec:
  selector: { app: seaweedfs }
  ports: [{ port: 8333, targetPort: 8333 }]
