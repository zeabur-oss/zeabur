# The Files tab's project, applied by scripts/e2e-ui.sh: a service with a claim, a Secret, a
# ConfigMap and scratch space, and a distroless one (pause has no tar) with a claim.
apiVersion: v1
kind: Namespace
metadata:
  name: zeabur-e2e-files
  labels:
    zeabur.com/project: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: keeper-secret
  namespace: zeabur-e2e-files
stringData:
  token: zeabur-e2e-files-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-config
  namespace: zeabur-e2e-files
data:
  mode: plain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keeper-data
  namespace: zeabur-e2e-files
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  namespace: zeabur-e2e-files
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
    spec:
      containers:
        - name: keeper
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              echo zeabur-e2e-files > /data/hello.txt
              printf 'odd' > '/data/-odd name.txt'
              while true; do sleep 3600; done
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secret
              mountPath: /etc/keeper
            - name: config
              mountPath: /etc/keeper-config
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keeper-data
        - name: secret
          secret:
            secretName: keeper-secret
        - name: config
          configMap:
            name: keeper-config
        - name: scratch
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: distroless-data
  namespace: zeabur-e2e-files
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distroless
  namespace: zeabur-e2e-files
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: distroless
  template:
    metadata:
      labels:
        app: distroless
    spec:
      containers:
        - name: distroless
          image: registry.k8s.io/pause:3.10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: distroless-data
